<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="flw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">TC 的账本：状态机与四种存储</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">TC 不保存业务数据；它保存全局会话、分支会话和全局锁，并用状态机决定下一步提交还是回滚</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">橙色：正常路径</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">红色：超时/失败路径</text>
<rect x="34" y="78" width="500" height="348" rx="12" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="50" y="102" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">全局会话状态机（关键路径）</text>
<rect x="70" y="130" width="100" height="42" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="120.0" y="156" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">Begin(1)</text>
<rect x="250" y="130" width="126" height="42" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="313.0" y="156" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">AsyncCommitting(8)</text>
<rect x="430" y="130" width="86" height="42" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="473.0" y="156" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">Committed(9)</text>
<rect x="250" y="248" width="126" height="42" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.3"/>
<text x="313.0" y="274" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">Rollbacking(4)</text>
<rect x="250" y="316" width="168" height="42" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.3"/>
<text x="334.0" y="342" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">TimeoutRollbacking(6)</text>
<rect x="470" y="248" width="56" height="42" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.3"/>
<text x="498.0" y="274" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">Rollbacked</text>
<path d="M170 151 L246 151" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<path d="M376 151 L426 151" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<path d="M294 172 L294 244" fill="none" stroke="#E24B4A" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#flwR)"/>
<path d="M294 290 L294 312" fill="none" stroke="#E24B4A" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#flwR)"/>
<path d="M376 269 L466 269" fill="none" stroke="#E24B4A" stroke-width="1.6" marker-end="url(#flwR)"/>
<text x="180" y="140" font-size="10.5" fill="#4C7A1A" text-anchor="middle" font-weight="400">AT 全部可异步</text>
<text x="310" y="208" font-size="10.5" fill="#C0392B" text-anchor="start" font-weight="400">超时 / 业务失败</text>
<text x="300" y="306" font-size="10.5" fill="#C0392B" text-anchor="middle" font-weight="400">每 1 秒重试</text>
<text x="60" y="206" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">提交重试：Committing / CommitRetrying</text>
<text x="60" y="382" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">回滚重试：RollbackRetrying / TimeoutRollbackRetrying</text>
<text x="60" y="400" font-size="10.5" fill="#C0392B" text-anchor="start" font-weight="400">默认 maxCommit/rollbackRetryTimeout = -1（不设上限）</text>
<text x="566" y="102" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">四种账本</text>
<rect x="556" y="122" width="414" height="66" rx="8" fill="#fff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="570" y="142" font-size="12" fill="#C46A0A" text-anchor="start" font-weight="700">FILE</text>
<text x="628" y="142" font-size="11" fill="#1F1E1A" text-anchor="start" font-weight="600">sessionStore/&lt;port&gt;/root.data</text>
<text x="570" y="162" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">WAL + 内存；文件只做重放，不在读路径；单机可用，不能当高可用</text>
<rect x="556" y="196" width="414" height="66" rx="8" fill="#fff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="570" y="216" font-size="12" fill="#C46A0A" text-anchor="start" font-weight="700">DB</text>
<text x="628" y="216" font-size="11" fill="#1F1E1A" text-anchor="start" font-weight="600">global_table / branch_table / lock_table</text>
<text x="570" y="236" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">多 TC 共享；distributed_lock 表串行化超时与重试调度</text>
<rect x="556" y="270" width="414" height="66" rx="8" fill="#fff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="570" y="290" font-size="12" fill="#C46A0A" text-anchor="start" font-weight="700">REDIS</text>
<text x="628" y="290" font-size="11" fill="#1F1E1A" text-anchor="start" font-weight="600">SEATA_GLOBAL_* / SEATA_BEGIN_TRANSACTIONS</text>
<text x="570" y="310" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">会话、状态、超时索引分开存；适合已有稳定 redis 集群</text>
<rect x="556" y="344" width="414" height="66" rx="8" fill="#fff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="570" y="364" font-size="12" fill="#C46A0A" text-anchor="start" font-weight="700">RAFT</text>
<text x="628" y="364" font-size="11" fill="#1F1E1A" text-anchor="start" font-weight="600">log + raft_meta + snapshot</text>
<text x="570" y="384" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">leader 提交多数派后才改内存；follower 重放日志；默认 600s 快照</text>
<rect x="34" y="452" width="936" height="130" rx="10" fill="#fff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="50" y="476" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">raft 新 leader 上任：半路会话怎么处理</text>
<text x="50" y="502" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="400">· Begin（旧）：没有提交决议 → 改成 RollbackRetrying，保守回滚；Begin（新）保持 active。</text>
<text x="50" y="524" font-size="11.5" fill="#4C7A1A" text-anchor="start" font-weight="400">· Committing / AsyncCommitting / CommitRetrying：补一次 clean() 释放可能残留的全局锁。</text>
<text x="50" y="546" font-size="11.5" fill="#6B695F" text-anchor="start" font-weight="400">· Rollbacking / TimeoutRollbacking：方向已定，继续回滚；终态会话结束清理。</text>
<text x="50" y="568" font-size="11" fill="#C46A0A" text-anchor="start" font-weight="600">边界：切主期间，一笔正在提交的全局事务可能被回滚；TM 的 commit 会拿到 Rollbacking/Rollbacked。</text>
</svg>