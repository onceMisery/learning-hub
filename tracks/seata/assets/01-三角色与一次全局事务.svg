<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="flw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">一次全局事务：三个角色，一条 XID</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">TM 决定开始/结束，RM 管本地事务与镜像，TC 记会话与锁；实线是同步请求，虚线是异步或响应</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">橙色：请求 / 数据流</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">绿色：锁与持久化</text>
<line x1="150" y1="150" x2="150" y2="566" stroke="#D3D1C7" stroke-width="1.2" stroke-dasharray="5 5"/>
<line x1="500" y1="150" x2="500" y2="566" stroke="#D3D1C7" stroke-width="1.2" stroke-dasharray="5 5"/>
<line x1="850" y1="150" x2="850" y2="566" stroke="#D3D1C7" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="34" y="78" width="232" height="66" rx="10" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="50" y="102" font-size="14" fill="#1F1E1A" text-anchor="start" font-weight="600">订单服务（发起方）</text>
<text x="50" y="122" font-size="12" fill="#C46A0A" text-anchor="start" font-weight="600">TM + RM</text>
<text x="50" y="138" font-size="11" fill="#6B695F" text-anchor="start" font-weight="400">RootContext: XID</text>
<rect x="384" y="78" width="232" height="66" rx="10" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="400" y="102" font-size="14" fill="#1F1E1A" text-anchor="start" font-weight="600">TC（seata-server）</text>
<text x="400" y="122" font-size="11" fill="#6B695F" text-anchor="start" font-weight="400">GlobalSession / BranchSession</text>
<text x="400" y="138" font-size="11" fill="#6B695F" text-anchor="start" font-weight="400">全局锁 + 超时重试</text>
<rect x="734" y="78" width="232" height="66" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="750" y="102" font-size="14" fill="#1F1E1A" text-anchor="start" font-weight="600">库存服务（参与方）</text>
<text x="750" y="122" font-size="11" fill="#6B695F" text-anchor="start" font-weight="400">RM / DataSourceProxy</text>
<text x="750" y="138" font-size="11" fill="#6B695F" text-anchor="start" font-weight="400">本地库 undo_log</text>
<path d="M150 180 L500 180" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#flw)"/>
<text x="325" y="172" font-size="11" fill="#6B695F" text-anchor="middle" font-weight="400">① GlobalBegin（请求体里没有 XID）</text>
<path d="M500 205 L150 205" fill="none" stroke="#2F6FA8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#flwB)"/>
<text x="325" y="197" font-size="11" fill="#6B695F" text-anchor="middle" font-weight="400">② 返回 XID</text>
<rect x="40" y="230" width="240" height="44" rx="8" fill="#ffffff" stroke="#C46A0A" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="54" y="248" font-size="11" fill="#1F1E1A" text-anchor="start" font-weight="600">③ 订单库：SQL + 前后镜像</text>
<text x="54" y="266" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">undo 只入内存，不写库</text>
<path d="M150 300 L500 300" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#flw)"/>
<text x="325" y="292" font-size="11" fill="#6B695F" text-anchor="middle" font-weight="400">④ BranchRegister + 锁键（本地 commit 之前）</text>
<path d="M500 325 L150 325" fill="none" stroke="#2F6FA8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#flwB)"/>
<text x="325" y="317" font-size="11" fill="#6B695F" text-anchor="middle" font-weight="400">lock OK</text>
<rect x="40" y="350" width="240" height="44" rx="8" fill="#ffffff" stroke="#C46A0A" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="54" y="368" font-size="11" fill="#1F1E1A" text-anchor="start" font-weight="600">⑤ 写 undo_log → 本地 COMMIT</text>
<text x="54" y="386" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">数据此时已对别的会话可见</text>
<path d="M150 420 L500 420" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<text x="325" y="412" font-size="11" fill="#6B695F" text-anchor="middle" font-weight="400">⑥ PhaseOne_Done</text>
<path d="M150 458 L850 458" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#flw)"/>
<text x="500" y="450" font-size="11" fill="#6B695F" text-anchor="middle" font-weight="400">⑦ 业务 RPC（带 XID）；库存重复 ③–⑥</text>
<path d="M150 500 L500 500" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#flw)"/>
<text x="325" y="492" font-size="11" fill="#6B695F" text-anchor="middle" font-weight="400">⑧ GlobalCommit</text>
<path d="M500 525 L150 525" fill="none" stroke="#2F6FA8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#flwB)"/>
<text x="325" y="517" font-size="11" fill="#6B695F" text-anchor="middle" font-weight="400">Committed（会话已是 AsyncCommitting）</text>
<path d="M500 555 L850 555" fill="none" stroke="#639922" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#flwG)"/>
<text x="675" y="547" font-size="11" fill="#6B695F" text-anchor="middle" font-weight="400">⑨ 后台 BranchCommit → 删 undo_log</text>
<rect x="34" y="574" width="932" height="38" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="50" y="598" font-size="11" fill="#C46A0A" text-anchor="start" font-weight="600">TM 收到的 Committed 只代表这笔全局事务不会再回滚；分支二阶段和 undo_log 删除都还是异步的。</text>
</svg>