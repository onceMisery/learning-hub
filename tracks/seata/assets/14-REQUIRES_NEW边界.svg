<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="flw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">REQUIRES_NEW：只挂起 XID</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">外层事务的 XID 被解绑，新 Launcher 申请新的 XID；连接、本地事务和 undo 上下文都没有被挂起</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">橙色：外层</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">绿色：内层</text>
<text x="40" y="100" font-size="12" fill="#C46A0A" text-anchor="start" font-weight="600">外层线程</text>
<rect x="40" y="120" width="300" height="80" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="56" y="146" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">XID-A</text>
<text x="56" y="170" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">RootContext.bind(XID-A)</text>
<text x="56" y="188" font-size="10.5" fill="#C0392B" text-anchor="start" font-weight="400">本地连接 / undo 上下文仍在</text>
<rect x="400" y="120" width="190" height="80" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="416" y="146" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">suspend(false)</text>
<text x="416" y="170" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">只做 RootContext.unbind()</text>
<text x="416" y="188" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">返回 holder，里面只有 XID</text>
<rect x="660" y="120" width="300" height="80" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="676" y="146" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">新 Launcher：XID-B</text>
<text x="676" y="170" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">向 TC 发 GlobalBegin</text>
<text x="676" y="188" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">内层事务独立提交/回滚</text>
<path d="M340 160 L396 160" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#flw)"/>
<path d="M590 160 L656 160" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<text x="40" y="260" font-size="12" fill="#4C7A1A" text-anchor="start" font-weight="600">内层结束后</text>
<rect x="40" y="280" width="260" height="70" rx="9" fill="#fff" stroke="#639922" stroke-width="1.3"/>
<text x="56" y="304" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">resume(holder)</text>
<text x="56" y="328" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">RootContext.bind(XID-A)</text>
<rect x="340" y="280" width="620" height="70" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="356" y="304" font-size="11" fill="#C0392B" text-anchor="start" font-weight="600">注意：unbind() 只删除 TX_XID</text>
<text x="356" y="328" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">TX_BRANCH_TYPE 和 TX_LOCK 会留给内层；内层可能继承外层分支类型/全局锁标志</text>
<path d="M300 315 L336 315" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<rect x="40" y="390" width="920" height="150" rx="9" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="56" y="414" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">四个传播级别，记这一张表</text>
<text x="56" y="438" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">REQUIRED：有 XID 就加入，没有就新建（默认）。</text>
<text x="56" y="458" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">REQUIRES_NEW：挂起外层 XID，新建一个全局事务；本地连接不一定隔离。</text>
<text x="56" y="478" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">NOT_SUPPORTED：挂起外层，无事务执行。</text>
<text x="56" y="498" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">SUPPORTS：有就加入，没有就裸跑；MANDATORY 没 XID 抛异常；NEVER 有 XID 抛异常。</text>
<text x="56" y="522" font-size="10.5" fill="#C46A0A" text-anchor="start" font-weight="400">关键：suspend 只换 XID，不换连接；这和 Spring 的本地事务传播不是一回事。</text>
</svg>