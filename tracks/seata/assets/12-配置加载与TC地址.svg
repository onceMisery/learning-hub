<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="flw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">配置加载与 TC 地址发现</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">配置中心和注册中心是两套 SPI：一个给键值，一个给地址</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">橙色：配置</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">绿色：服务发现</text>
<text x="40" y="92" font-size="12" fill="#C46A0A" text-anchor="start" font-weight="600">配置：config.type 与 Spring 覆盖</text>
<rect x="40" y="110" width="150" height="46" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="115" y="130" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">registry.conf</text>
<text x="115" y="146" font-size="9" fill="#6B695F" text-anchor="middle" font-weight="400">config.type / registry.type</text>
<rect x="240" y="110" width="180" height="46" rx="9" fill="#fff" stroke="#C46A0A" stroke-width="1.3"/>
<text x="330" y="130" font-size="9.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">SpringBootConfigurationProvider</text>
<text x="330" y="146" font-size="9" fill="#6B695F" text-anchor="middle" font-weight="400">seata.* 前缀 + kebab</text>
<rect x="240" y="176" width="180" height="40" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="330" y="198" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">application.yml</text>
<rect x="470" y="110" width="120" height="46" rx="9" fill="#fff" stroke="#C46A0A" stroke-width="1.3"/>
<text x="530" y="130" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">config.type</text>
<text x="530" y="146" font-size="9" fill="#6B695F" text-anchor="middle" font-weight="400">file / nacos / zk</text>
<rect x="640" y="110" width="140" height="46" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="710" y="130" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">Configuration</text>
<text x="710" y="146" font-size="9" fill="#6B695F" text-anchor="middle" font-weight="400">ConfigurationCache</text>
<path d="M190 133 L236 133" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#flw)"/>
<path d="M420 133 L466 133" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#flw)"/>
<path d="M590 133 L636 133" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#flw)"/>
<path d="M330 176 L330 160" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#flw)"/>
<text x="40" y="300" font-size="12" fill="#4C7A1A" text-anchor="start" font-weight="600">发现：tx-service-group → vgroup → TC 地址</text>
<rect x="40" y="320" width="150" height="46" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="115" y="340" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">tx-service-group</text>
<text x="115" y="356" font-size="9" fill="#6B695F" text-anchor="middle" font-weight="400">逻辑组名</text>
<rect x="240" y="320" width="180" height="46" rx="9" fill="#fff" stroke="#639922" stroke-width="1.3"/>
<text x="330" y="340" font-size="10" fill="#1F1E1A" text-anchor="middle" font-weight="600">service.vgroupMapping</text>
<text x="330" y="356" font-size="9" fill="#6B695F" text-anchor="middle" font-weight="400">组名 → cluster</text>
<rect x="470" y="320" width="130" height="46" rx="9" fill="#fff" stroke="#639922" stroke-width="1.3"/>
<text x="535" y="340" font-size="10" fill="#1F1E1A" text-anchor="middle" font-weight="600">RegistryService</text>
<text x="535" y="356" font-size="9" fill="#6B695F" text-anchor="middle" font-weight="400">lookup(cluster)</text>
<rect x="650" y="320" width="140" height="46" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="720" y="340" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">TC 地址列表</text>
<text x="720" y="356" font-size="9" fill="#6B695F" text-anchor="middle" font-weight="400">leader / 多节点</text>
<rect x="830" y="320" width="130" height="46" rx="9" fill="#fff" stroke="#639922" stroke-width="1.3"/>
<text x="895" y="340" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">Netty 连接</text>
<text x="895" y="356" font-size="9" fill="#6B695F" text-anchor="middle" font-weight="400">每 10s 重连</text>
<path d="M190 343 L236 343" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<path d="M420 343 L466 343" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<path d="M600 343 L646 343" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<path d="M790 343 L826 343" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<rect x="40" y="430" width="920" height="120" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="56" y="454" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">最容易混的三点</text>
<text x="56" y="478" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">① file 注册中心不是注册中心：没有 register/subscribe，只读 grouplist。</text>
<text x="56" y="498" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">② namingserver 只服务 Seata TC；raft 模式按 LEADER/term 过滤，follower 不返回。</text>
<text x="56" y="518" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">③ config.type 与 registry.type 可以不同：配置用 Nacos、注册用 namingserver 是合法的。</text>
<text x="56" y="538" font-size="10.5" fill="#C46A0A" text-anchor="start" font-weight="400">边界：配置改了不一定马上生效（file 1s 轮询），注册地址改了要等客户端重连或重新 lookup。</text>
</svg>