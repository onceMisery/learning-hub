<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="flw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">TCC、Saga、XA：三种把回滚交给别人的方式</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">同一笔订单，三种责任划分：回滚交给业务方法、补偿链，还是数据库的 XA 协议</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">橙色：一阶段</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">绿色/红色：二阶段提交/回滚</text>
<rect x="40" y="84" width="280" height="430" rx="12" fill="#fff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="60" y="114" font-size="18" fill="#1F1E1A" text-anchor="start" font-weight="700">TCC</text>
<text x="60" y="136" font-size="11.5" fill="#C46A0A" text-anchor="start" font-weight="600">回滚交给业务方法</text>
<rect x="54" y="158" width="252" height="58" rx="7" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="66" y="178" font-size="11" fill="#C46A0A" text-anchor="start" font-weight="700">一阶段</text>
<text x="66" y="198" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">try：预留资源（冻结/预扣）</text>
<rect x="54" y="224" width="252" height="58" rx="7" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="66" y="244" font-size="11" fill="#639922" text-anchor="start" font-weight="700">二阶段提交</text>
<text x="66" y="264" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">confirm：把预留转正式</text>
<rect x="54" y="290" width="252" height="58" rx="7" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.3"/>
<text x="66" y="310" font-size="11" fill="#E24B4A" text-anchor="start" font-weight="700">二阶段回滚</text>
<text x="66" y="330" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">cancel：释放预留</text>
<rect x="54" y="356" width="252" height="58" rx="7" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="66" y="376" font-size="11" fill="#6B695F" text-anchor="start" font-weight="700">锁 / 可见性</text>
<text x="66" y="396" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">框架无全局锁；由 try 决定</text>
<rect x="54" y="422" width="252" height="58" rx="7" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="66" y="442" font-size="11" fill="#6B695F" text-anchor="start" font-weight="700">TC 的角色</text>
<text x="66" y="462" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">在 try 前注册分支；反射调用 confirm/cancel</text>
<rect x="360" y="84" width="280" height="430" rx="12" fill="#fff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="380" y="114" font-size="18" fill="#1F1E1A" text-anchor="start" font-weight="700">Saga</text>
<text x="380" y="136" font-size="11.5" fill="#C46A0A" text-anchor="start" font-weight="600">回滚交给补偿链</text>
<rect x="374" y="158" width="252" height="58" rx="7" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="386" y="178" font-size="11" fill="#C46A0A" text-anchor="start" font-weight="700">一阶段</text>
<text x="386" y="198" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">每个 state 是一个本地事务</text>
<rect x="374" y="224" width="252" height="58" rx="7" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="386" y="244" font-size="11" fill="#639922" text-anchor="start" font-weight="700">二阶段提交</text>
<text x="386" y="264" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">TC commit = engine.forward()</text>
<rect x="374" y="290" width="252" height="58" rx="7" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.3"/>
<text x="386" y="310" font-size="11" fill="#E24B4A" text-anchor="start" font-weight="700">二阶段回滚</text>
<text x="386" y="330" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">engine.compensate() 逆序补偿</text>
<rect x="374" y="356" width="252" height="58" rx="7" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="386" y="376" font-size="11" fill="#6B695F" text-anchor="start" font-weight="700">锁 / 可见性</text>
<text x="386" y="396" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">无全局锁；每个本地事务提交后可见</text>
<rect x="374" y="422" width="252" height="58" rx="7" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="386" y="442" font-size="11" fill="#6B695F" text-anchor="start" font-weight="700">TC 的角色</text>
<text x="386" y="462" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">只维护全局生命周期；默认一个虚拟分支</text>
<rect x="680" y="84" width="280" height="430" rx="12" fill="#fff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="700" y="114" font-size="18" fill="#1F1E1A" text-anchor="start" font-weight="700">XA</text>
<text x="700" y="136" font-size="11.5" fill="#C46A0A" text-anchor="start" font-weight="600">回滚交给数据库</text>
<rect x="694" y="158" width="252" height="58" rx="7" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="706" y="178" font-size="11" fill="#C46A0A" text-anchor="start" font-weight="700">一阶段</text>
<text x="706" y="198" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">XA START → XA END → PREPARE</text>
<rect x="694" y="224" width="252" height="58" rx="7" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="706" y="244" font-size="11" fill="#639922" text-anchor="start" font-weight="700">二阶段提交</text>
<text x="706" y="264" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">数据库 XA commit</text>
<rect x="694" y="290" width="252" height="58" rx="7" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.3"/>
<text x="706" y="310" font-size="11" fill="#E24B4A" text-anchor="start" font-weight="700">二阶段回滚</text>
<text x="706" y="330" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">数据库 XA rollback</text>
<rect x="694" y="356" width="252" height="58" rx="7" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="706" y="376" font-size="11" fill="#6B695F" text-anchor="start" font-weight="700">锁 / 可见性</text>
<text x="706" y="396" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">数据库 XA 行锁；prepare 后仍不可见</text>
<rect x="694" y="422" width="252" height="58" rx="7" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="706" y="442" font-size="11" fill="#6B695F" text-anchor="start" font-weight="700">TC 的角色</text>
<text x="706" y="462" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">驱动 branchCommit/rollback；无全局锁</text>
<rect x="40" y="534" width="920" height="56" rx="10" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="56" y="556" font-size="12" fill="#C46A0A" text-anchor="start" font-weight="700">AT 对照</text>
<text x="118" y="556" font-size="11.5" fill="#1F1E1A" text-anchor="start" font-weight="400">一阶段本地提交后数据即可见；二阶段提交删 undo log，回滚用 undo log 生成反向 SQL。</text>
<text x="118" y="576" font-size="11" fill="#6B695F" text-anchor="start" font-weight="400">TCC/Saga 的回滚是业务语义，XA 的回滚是数据库语义；不要把「调了 cancel」当成「数据库回滚了」。</text>
</svg>