<text x="120" y="144" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">AutoConfiguration</text>
<text x="120" y="162" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">.imports</text>
<rect x="240" y="120" width="180" height="54" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="330" y="144" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">SeataCoreAutoConfiguration</text>
<text x="330" y="162" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">属性 + Environment</text>
