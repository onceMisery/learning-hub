<text x="735" y="144" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">TM / RM 客户端</text>
<text x="735" y="162" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">Netty + 重连</text>
