<text x="775" y="324" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">DataSourceProxy</text>
<text x="775" y="342" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">Holder 里的真代理</text>
<path d="M430 327 L466 327" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<path d="M660 327 L696 327" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<path d="M545 174 L545 296" fill="none" stroke="#2F6FA8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#flw)"/>
<path d="M330 174 L330 296" fill="none" stroke="#2F6FA8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#flw)"/>
<rect x="40" y="440" width="900" height="100" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="56" y="464" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">两个容易误解的地方</text>
<text x="56" y="488" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">① 容器里的 DataSource 不是 DataSourceProxy，而是附加了 SeataProxy 的 AOP 代理；真代理在静态 holder 里。</text>
<text x="56" y="508" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">② application.yml 的优先级高于 registry.conf；但 config.type=nacos 后，vgroup-mapping 不再从 yml 读。</text>
<text x="56" y="528" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">③ 自调用、私有方法、final 方法绕过 AOP，注解不会生效。</text>
