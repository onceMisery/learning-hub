<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="flw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">SQL 解析、镜像与 undo 改写</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">一条 UPDATE 先被解析成 Recognizer，再由 Executor 生成镜像；回滚时才生成反向 SQL</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">橙色：解析 / 执行</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">绿色：undo</text>
<text x="40" y="94" font-size="12" fill="#C46A0A" text-anchor="start" font-weight="600">解析与执行</text>
<rect x="40" y="112" width="135" height="60" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="107" y="136" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">SQL</text>
<text x="107" y="154" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">UPDATE ...</text>
<path d="M175 142 L191 142" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#flw)"/>
<rect x="195" y="112" width="135" height="60" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="262" y="136" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">Druid</text>
<text x="262" y="154" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">parseStatements</text>
<path d="M330 142 L346 142" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#flw)"/>
<rect x="350" y="112" width="135" height="60" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="417" y="136" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">Recognizer</text>
<text x="417" y="154" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">UPDATE / JOIN</text>
<path d="M485 142 L501 142" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#flw)"/>
<rect x="505" y="112" width="135" height="60" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="572" y="136" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">Executor</text>
<text x="572" y="154" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">UpdateExecutor</text>
<path d="M640 142 L656 142" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#flw)"/>
<rect x="660" y="112" width="135" height="60" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="727" y="136" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">before/after</text>
<text x="727" y="154" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">TableRecords</text>
<path d="M795 142 L811 142" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#flw)"/>
<rect x="815" y="112" width="135" height="60" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="882" y="136" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">undo_log</text>
<text x="882" y="154" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">同一本地事务</text>
<text x="40" y="230" font-size="12" fill="#C0392B" text-anchor="start" font-weight="600">两条分支</text>
<rect x="40" y="250" width="380" height="46" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="56" y="270" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">识别器为 null：普通 SELECT / DDL → PlainExecutor</text>
<text x="56" y="288" font-size="9.5" fill="#6B695F" text-anchor="start" font-weight="400">不生成镜像、不注册分支；DDL 在全局事务里也管不了</text>
<rect x="450" y="250" width="420" height="46" rx="9" fill="#fff" stroke="#E24B4A" stroke-width="1.3"/>
<text x="466" y="270" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">解析异常：ParserException → NotSupportYetException → SQLException</text>
<text x="466" y="288" font-size="9.5" fill="#6B695F" text-anchor="start" font-weight="400">不是静默降级；报错会直接抛给业务</text>
<text x="40" y="360" font-size="12" fill="#4C7A1A" text-anchor="start" font-weight="600">回滚时的 undo 重写</text>
<rect x="40" y="380" width="180" height="54" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="130" y="404" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">undo_log 镜像</text>
<text x="130" y="422" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">before / after</text>
<rect x="260" y="380" width="180" height="54" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="350" y="404" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">UndoExecutorFactory</text>
<text x="350" y="422" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">按 SQLType 选</text>
<rect x="480" y="380" width="180" height="54" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="570" y="404" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">反向 SQL</text>
<text x="570" y="422" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">UPDATE / INSERT / DELETE</text>
<rect x="700" y="380" width="250" height="54" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="716" y="404" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="600">值全部用 ? 占位</text>
<text x="716" y="422" font-size="9.5" fill="#6B695F" text-anchor="start" font-weight="400">JSON / LOB / 数组按 JDBC 类型处理</text>
<path d="M220 407 L256 407" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<path d="M440 407 L476 407" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<rect x="40" y="470" width="920" height="80" rx="9" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="56" y="494" font-size="12" fill="#C46A0A" text-anchor="start" font-weight="600">边界</text>
<text x="100" y="494" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">无主键、更新主键、多语句（混 UPDATE/DELETE）、REPLACE、INSERT ... SELECT 都不支持或直接拒绝。</text>
<text x="100" y="514" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">默认 onlyCareUpdateColumns=true，只抓更新列 + 主键 + ON UPDATE 列；不是整行快照。</text>
<text x="100" y="534" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">Join UPDATE 只有 MySQL/MariaDB/PolarDBX 有执行器；ANTLR 解析器的 SELECT 会落 PlainExecutor。</text>
</svg>