<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="flw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">TCC fence 的四个状态</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">TRIED 表示预留成功；COMMITTED / ROLLBACKED 是终态；SUSPENDED 是 cancel 先到的墓碑</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">绿色：正常推进</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">红色：幂等 / 悬挂</text>
<rect x="60" y="150" width="150" height="54" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="135" y="174" font-size="12" fill="#1F1E1A" text-anchor="middle" font-weight="600">（无记录）</text>
<text x="135" y="194" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">try 之前</text>
<rect x="280" y="150" width="150" height="54" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="355" y="174" font-size="12" fill="#1F1E1A" text-anchor="middle" font-weight="600">TRIED</text>
<text x="355" y="194" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">预留成功</text>
<rect x="520" y="100" width="160" height="54" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="600" y="124" font-size="12" fill="#1F1E1A" text-anchor="middle" font-weight="600">COMMITTED</text>
<text x="600" y="144" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">confirm 成功</text>
<rect x="520" y="230" width="160" height="54" rx="9" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.3"/>
<text x="600" y="254" font-size="12" fill="#1F1E1A" text-anchor="middle" font-weight="600">ROLLBACKED</text>
<text x="600" y="274" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">cancel 成功</text>
<rect x="280" y="330" width="180" height="54" rx="9" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.3"/>
<text x="370" y="354" font-size="12" fill="#1F1E1A" text-anchor="middle" font-weight="600">SUSPENDED</text>
<text x="370" y="374" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">cancel 先到，空回滚</text>
<path d="M210 177 L276 177" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#flw)"/>
<path d="M430 177 L516 127" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<path d="M430 177 L516 257" fill="none" stroke="#E24B4A" stroke-width="1.6" marker-end="url(#flwR)"/>
<path d="M355 204 L355 326" fill="none" stroke="#E24B4A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#flwR)"/>
<path d="M460 357 L516 357" fill="none" stroke="#E24B4A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#flwR)"/>
<text x="243" y="168" font-size="10" fill="#C46A0A" text-anchor="middle" font-weight="600">try</text>
<text x="472" y="140" font-size="10" fill="#639922" text-anchor="middle" font-weight="600">confirm</text>
<text x="472" y="262" font-size="10" fill="#E24B4A" text-anchor="middle" font-weight="600">cancel</text>
<text x="365" y="300" font-size="10" fill="#E24B4A" text-anchor="start" font-weight="400">cancel 先到</text>
<text x="488" y="350" font-size="10" fill="#E24B4A" text-anchor="start" font-weight="400">try 撞唯一键</text>
<rect x="710" y="100" width="260" height="284" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="726" y="124" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">三个坑与 fence 的答案</text>
<text x="726" y="150" font-size="10.5" fill="#C46A0A" text-anchor="start" font-weight="600">try 重复</text>
<text x="726" y="167" font-size="10" fill="#6B695F" text-anchor="start" font-weight="400">TRIED 唯一键冲突</text>
<text x="726" y="194" font-size="10.5" fill="#C46A0A" text-anchor="start" font-weight="600">confirm 重复</text>
<text x="726" y="211" font-size="10" fill="#6B695F" text-anchor="start" font-weight="400">COMMITTED 直接成功</text>
<text x="726" y="238" font-size="10.5" fill="#C46A0A" text-anchor="start" font-weight="600">cancel 重复</text>
<text x="726" y="255" font-size="10" fill="#6B695F" text-anchor="start" font-weight="400">ROLLBACKED 直接成功</text>
<text x="726" y="282" font-size="10.5" fill="#C46A0A" text-anchor="start" font-weight="600">cancel 先到</text>
<text x="726" y="299" font-size="10" fill="#6B695F" text-anchor="start" font-weight="400">插 SUSPENDED，空回滚</text>
<text x="726" y="326" font-size="10.5" fill="#C46A0A" text-anchor="start" font-weight="600">try 后到</text>
<text x="726" y="343" font-size="10" fill="#6B695F" text-anchor="start" font-weight="400">撞 SUSPENDED，反悬挂</text>
<rect x="24" y="520" width="940" height="58" rx="9" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="40" y="544" font-size="12" fill="#C46A0A" text-anchor="start" font-weight="600">边界</text>
<text x="100" y="544" font-size="11" fill="#1F1E1A" text-anchor="start" font-weight="400">fence 默认关闭（useTCCFence=false）；开启后需要 tcc_fence_log 表和清理任务。</text>
<text x="100" y="564" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">它把幂等、空回滚、反悬挂收进一张表，但不改变 try/confirm/cancel 的业务语义。</text>
</svg>