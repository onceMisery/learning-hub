<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="flw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">会话与锁的生命周期</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">会话锁保护同一个 XID 的会话修改；全局行锁保护 resource/table/pk。两者释放时机不同</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">蓝色：会话状态</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">绿色/红色：提交/回滚</text>
<rect x="60" y="96" width="140" height="48" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="130" y="118" font-size="12" fill="#1F1E1A" text-anchor="middle" font-weight="600">Begin</text>
<text x="130" y="134" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">可接分支</text>
<rect x="280" y="96" width="170" height="48" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="365" y="118" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">AsyncCommitting</text>
<text x="365" y="134" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">clean 释放锁</text>
<rect x="530" y="96" width="130" height="48" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="595" y="118" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">Committed</text>
<text x="595" y="134" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">终态</text>
<rect x="280" y="190" width="150" height="48" rx="9" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.3"/>
<text x="355" y="212" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">Rollbacking</text>
<text x="355" y="228" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">逆序回滚</text>
<rect x="530" y="190" width="130" height="48" rx="9" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.3"/>
<text x="595" y="212" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">Rollbacked</text>
<text x="595" y="228" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">终态</text>
<path d="M200 120 L276 120" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<path d="M450 120 L526 120" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<path d="M130 144 L280 190" fill="none" stroke="#E24B4A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#flwR)"/>
<path d="M430 214 L526 214" fill="none" stroke="#E24B4A" stroke-width="1.6" marker-end="url(#flwR)"/>
<text x="60" y="320" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">锁的时间窗</text>
<line x1="70" y1="370" x2="930" y2="370" stroke="#D3D1C7" stroke-width="2"/>
<circle cx="120" cy="370" r="7" fill="#fff" stroke="#C46A0A" stroke-width="2"/>
<text x="120" y="398" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">Begin</text>
<circle cx="300" cy="370" r="7" fill="#fff" stroke="#C46A0A" stroke-width="2"/>
<text x="300" y="398" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">Register</text>
<circle cx="480" cy="370" r="7" fill="#fff" stroke="#C46A0A" stroke-width="2"/>
<text x="480" y="398" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">LocalCommit</text>
<circle cx="650" cy="370" r="7" fill="#fff" stroke="#C46A0A" stroke-width="2"/>
<text x="650" y="398" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">GlobalCommit</text>
<circle cx="820" cy="370" r="7" fill="#fff" stroke="#C46A0A" stroke-width="2"/>
<text x="820" y="398" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">Rollback</text>
<circle cx="920" cy="370" r="7" fill="#fff" stroke="#C46A0A" stroke-width="2"/>
<text x="920" y="398" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">End</text>
<rect x="120" y="420" width="800" height="24" rx="6" fill="#fff" stroke="#639922" stroke-width="1.3"/>
<text x="132" y="437" font-size="10.5" fill="#4C7A1A" text-anchor="start" font-weight="400">会话锁：lockAndExecute 期间持有；每次请求结束释放</text>
<rect x="300" y="456" width="350" height="24" rx="6" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="312" y="473" font-size="10.5" fill="#C46A0A" text-anchor="start" font-weight="400">AT 全局行锁：Register → GlobalCommit 受理时释放</text>
<rect x="820" y="492" width="100" height="24" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.3"/>
<text x="832" y="509" font-size="10" fill="#C0392B" text-anchor="start" font-weight="400">回滚失败：默认保留</text>
<rect x="24" y="540" width="940" height="54" rx="9" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="40" y="562" font-size="11.5" fill="#C46A0A" text-anchor="start" font-weight="600">两个锁不是一回事</text>
<text x="160" y="562" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">会话锁只在 TC 进程内串行化同一个 XID；全局行锁跨 TM/RM，拦的是不同 XID 改同一行。</text>
<text x="160" y="580" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">AT 提交在 commit 受理时提前放行锁；回滚失败默认不放锁，避免数据没回滚干净时被新事务覆盖。</text>
</svg>