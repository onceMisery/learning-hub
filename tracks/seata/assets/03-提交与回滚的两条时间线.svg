<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="flw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">提交与回滚的两条时间线</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">提交先给承诺、后做清理；回滚先改数据、后给结果。两者的「成功」不是同一个含义</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">橙色：提交路径</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">红色：回滚路径</text>
<text x="40" y="92" font-size="14" fill="#4C7A1A" text-anchor="start" font-weight="600">提交：TC 先返回，RM 后收尾</text>
<line x1="60" y1="150" x2="940" y2="150" stroke="#D3D1C7" stroke-width="2"/>
<circle cx="100" cy="150" r="10" fill="#EAF3DE" stroke="#639922" stroke-width="2"/>
<text x="100" y="178" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">TM commit</text>
<circle cx="260" cy="150" r="10" fill="#EAF3DE" stroke="#639922" stroke-width="2"/>
<text x="260" y="178" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">TC: AsyncCommitting</text>
<text x="260" y="194" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">返回 Committed</text>
<circle cx="430" cy="150" r="10" fill="#EAF3DE" stroke="#639922" stroke-width="2"/>
<text x="430" y="178" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">clean() 释放全局锁</text>
<circle cx="600" cy="150" r="10" fill="#EAF3DE" stroke="#639922" stroke-width="2"/>
<text x="600" y="178" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">后台 BranchCommit</text>
<circle cx="750" cy="150" r="10" fill="#EAF3DE" stroke="#639922" stroke-width="2"/>
<text x="750" y="178" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">RM 入队即回</text>
<text x="750" y="194" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">PhaseTwo_Committed</text>
<circle cx="890" cy="150" r="10" fill="#EAF3DE" stroke="#639922" stroke-width="2"/>
<text x="890" y="178" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">异步删 undo_log</text>
<text x="890" y="194" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">（1 秒/批）</text>
<rect x="250" y="216" width="650" height="22" rx="6" fill="#EAF3DE" stroke="#639922"/>
<text x="262" y="231" font-size="11" fill="#4C7A1A" text-anchor="start" font-weight="400">TM 已经拿到 Committed：这笔全局事务不会再回滚；后面的分支提交、undo 删除都还没发生</text>
<text x="40" y="276" font-size="14" fill="#C0392B" text-anchor="start" font-weight="600">回滚：TC 等数据改完才返回</text>
<line x1="60" y1="334" x2="940" y2="334" stroke="#D3D1C7" stroke-width="2"/>
<circle cx="100" cy="334" r="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="2"/>
<text x="100" y="362" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">异常 / 超时</text>
<circle cx="250" cy="334" r="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="2"/>
<text x="250" y="362" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">TC: Rollbacking</text>
<text x="250" y="378" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">close() 禁新分支</text>
<circle cx="410" cy="334" r="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="2"/>
<text x="410" y="362" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">逆序分支</text>
<text x="410" y="378" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">BranchRollback</text>
<circle cx="570" cy="334" r="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="2"/>
<text x="570" y="362" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">undo: SELECT</text>
<text x="570" y="378" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">... FOR UPDATE</text>
<circle cx="720" cy="334" r="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="2"/>
<text x="720" y="362" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">逆序执行反向 SQL</text>
<text x="720" y="378" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">三方对账</text>
<circle cx="880" cy="334" r="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="2"/>
<text x="880" y="362" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">删 undo_log / 墓碑</text>
<text x="880" y="378" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="400">释放锁</text>
<rect x="240" y="404" width="660" height="22" rx="6" fill="#FCEBEB" stroke="#E24B4A"/>
<text x="252" y="419" font-size="11" fill="#C0392B" text-anchor="start" font-weight="400">TM 一直等到回滚结果：可重试失败每秒重试；脏写/唯一键冲突直接判不可重试</text>
<rect x="40" y="452" width="920" height="130" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="56" y="476" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">不对称的根源</text>
<text x="56" y="500" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="400">提交只是状态变更：TC 把会话标成 AsyncCommitting，就可以对外承诺「不再回滚」；删 undo log 是可重试的清理。</text>
<text x="56" y="520" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="400">回滚要改数据：反向 SQL 可能撞锁、撞唯一键、遇到第三方脏写，必须等结果；失败还要重试。</text>
<text x="56" y="544" font-size="12" fill="#C46A0A" text-anchor="start" font-weight="600">所以：不要用「commit 返回」判断二阶段完成；也不要用「undo_log 还在」判断提交失败。</text>
<text x="56" y="566" font-size="11" fill="#6B695F" text-anchor="start" font-weight="400">边界：AT 提交的异步删除默认每秒一轮，批量 1000 条；队列容量与删除速度决定 undo_log 的清理延迟。</text>
</svg>