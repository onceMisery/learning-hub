<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="flw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">三个角色如何接力</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">TM 决定开始/结束，TC 记会话和锁，RM 动本地数据和 undo；三条泳道按相位对齐</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">橙色：请求</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">绿色：提交 / 持久化</text>
<rect x="24" y="100" width="130" height="86" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="38" y="128" font-size="12.5" fill="#1F1E1A" text-anchor="start" font-weight="600">TM（发起方）</text>
<text x="38" y="150" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">职责边界</text>
<rect x="24" y="240" width="130" height="86" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="38" y="268" font-size="12.5" fill="#1F1E1A" text-anchor="start" font-weight="600">TC（协调器）</text>
<text x="38" y="290" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">职责边界</text>
<rect x="24" y="380" width="130" height="86" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="38" y="408" font-size="12.5" fill="#1F1E1A" text-anchor="start" font-weight="600">RM（参与者）</text>
<text x="38" y="430" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">职责边界</text>
<text x="210" y="80" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">① Begin</text>
<line x1="210" y1="96" x2="210" y2="492" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 4"/>
<text x="330" y="80" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">② SQL+镜像</text>
<line x1="330" y1="96" x2="330" y2="492" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 4"/>
<text x="450" y="80" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">③ Register</text>
<line x1="450" y1="96" x2="450" y2="492" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 4"/>
<text x="570" y="80" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">④ LocalCommit</text>
<line x1="570" y1="96" x2="570" y2="492" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 4"/>
<text x="690" y="80" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">⑤ GlobalCommit</text>
<line x1="690" y1="96" x2="690" y2="492" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 4"/>
<text x="810" y="80" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">⑥ BranchCommit</text>
<line x1="810" y1="96" x2="810" y2="492" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 4"/>
<text x="920" y="80" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">⑦ End</text>
<line x1="920" y1="96" x2="920" y2="492" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="156" y="108" width="108" height="44" rx="9" fill="#fff" stroke="#C46A0A" stroke-width="1.3"/>
<text x="210" y="126" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">要 XID</text>
<text x="210" y="142" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">bind RootContext</text>
<rect x="636" y="108" width="108" height="44" rx="9" fill="#fff" stroke="#C46A0A" stroke-width="1.3"/>
<text x="690" y="126" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">发 GlobalCommit</text>
<text x="690" y="142" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">只发决议</text>
<rect x="756" y="108" width="108" height="44" rx="9" fill="#fff" stroke="#C46A0A" stroke-width="1.3"/>
<text x="810" y="126" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">收 Committed</text>
<text x="810" y="142" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">承诺不再回滚</text>
<rect x="156" y="248" width="108" height="44" rx="9" fill="#fff" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="210" y="266" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">建会话</text>
<text x="210" y="282" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">GlobalSession</text>
<rect x="396" y="248" width="108" height="44" rx="9" fill="#fff" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="450" y="266" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">抢全局锁</text>
<text x="450" y="282" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">branchRegister</text>
<rect x="636" y="248" width="108" height="44" rx="9" fill="#fff" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="690" y="266" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">AsyncCommitting</text>
<text x="690" y="282" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">clean 释放锁</text>
<rect x="756" y="248" width="108" height="44" rx="9" fill="#fff" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="810" y="266" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">发 BranchCommit</text>
<text x="810" y="282" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">后台逐分支</text>
<rect x="866" y="248" width="108" height="44" rx="9" fill="#fff" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="920" y="266" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">清分支</text>
<text x="920" y="282" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">endCommitted</text>
<rect x="276" y="388" width="108" height="44" rx="9" fill="#fff" stroke="#639922" stroke-width="1.3"/>
<text x="330" y="406" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">SQL + 镜像</text>
<text x="330" y="422" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">before / after</text>
<rect x="396" y="388" width="108" height="44" rx="9" fill="#fff" stroke="#639922" stroke-width="1.3"/>
<text x="450" y="406" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">注册分支</text>
<text x="450" y="422" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">lockKeys</text>
<rect x="516" y="388" width="108" height="44" rx="9" fill="#fff" stroke="#639922" stroke-width="1.3"/>
<text x="570" y="406" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">undo + 本地提交</text>
<text x="570" y="422" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">PhaseOne_Done</text>
<rect x="756" y="388" width="108" height="44" rx="9" fill="#fff" stroke="#639922" stroke-width="1.3"/>
<text x="810" y="406" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">删 undo</text>
<text x="810" y="422" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">AsyncWorker</text>
<path d="M506 292 L634 292" fill="none" stroke="#2F6FA8" stroke-width="1.6" marker-end="url(#flw)"/>
<path d="M746 292 L754 292" fill="none" stroke="#2F6FA8" stroke-width="1.6" marker-end="url(#flw)"/>
<path d="M866 292 L864 292" fill="none" stroke="#2F6FA8" stroke-width="1.6" marker-end="url(#flw)"/>
<path d="M386 432 L394 432" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flw)"/>
<path d="M506 432 L514 432" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flw)"/>
<path d="M626 432 L754 432" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flw)"/>
<path d="M210 152 L210 244" fill="none" stroke="#C46A0A" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#flw)"/>
<path d="M690 152 L690 244" fill="none" stroke="#C46A0A" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#flw)"/>
<path d="M450 292 L450 384" fill="none" stroke="#2F6FA8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#flw)"/>
<path d="M810 292 L810 384" fill="none" stroke="#2F6FA8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#flw)"/>
<rect x="24" y="520" width="940" height="58" rx="9" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="40" y="544" font-size="12" fill="#C46A0A" text-anchor="start" font-weight="600">一句话分工</text>
<text x="140" y="544" font-size="11" fill="#1F1E1A" text-anchor="start" font-weight="400">TM 只发 begin/commit/rollback；TC 只改会话和锁；RM 只做本地事务、undo 和二阶段动作。</text>
<text x="140" y="564" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">失败时：TC → Rollbacking，RM 逆序执行反向 SQL；TM 收到的是回滚结果，不是自己改数据。</text>
</svg>