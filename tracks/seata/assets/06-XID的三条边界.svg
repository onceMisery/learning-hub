<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="flw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">XID 的三条边界</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">XID 有，不等于分支有；分支有，不等于数据能回滚。断点通常发生在线程、代理和模式这三处</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">绿色：分支已注册</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">红色：XID 丢失 / 无分支</text>
<rect x="40" y="90" width="230" height="120" rx="10" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="56" y="114" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">订单服务（发起方）</text>
<text x="56" y="136" font-size="11" fill="#C46A0A" text-anchor="start" font-weight="400">RootContext.getXID() = x</text>
<text x="56" y="156" font-size="11" fill="#6B695F" text-anchor="start" font-weight="400">业务方法里发起下游调用</text>
<text x="56" y="176" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">线程：http-nio-8080-exec-1</text>
<text x="56" y="194" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">XID 存在 ThreadLocal 里</text>
<rect x="440" y="78" width="300" height="104" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="456" y="102" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">HTTP / Dubbo 下游</text>
<text x="456" y="124" font-size="11" fill="#4C7A1A" text-anchor="start" font-weight="400">过滤器写/读 TX_XID</text>
<text x="456" y="143" font-size="11" fill="#4C7A1A" text-anchor="start" font-weight="400">线程不变 + 代理生效</text>
<text x="456" y="161" font-size="10.5" fill="#4C7A1A" text-anchor="start" font-weight="400">写 SQL → 分支注册成功</text>
<text x="456" y="178" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">TC branch_table 有记录</text>
<rect x="440" y="206" width="300" height="96" rx="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.3"/>
<text x="456" y="230" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">线程池 / @Async / MQ</text>
<text x="456" y="252" font-size="11" fill="#C0392B" text-anchor="start" font-weight="400">新线程拿不到 ThreadLocal</text>
<text x="456" y="272" font-size="11" fill="#C0392B" text-anchor="start" font-weight="400">XID = null → 本地提交</text>
<text x="456" y="292" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">TC 不知道这条 SQL</text>
<rect x="440" y="326" width="300" height="104" rx="10" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="456" y="350" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">收到 XID，但没走代理</text>
<text x="456" y="372" font-size="11" fill="#C46A0A" text-anchor="start" font-weight="400">数据源未接入 / SQL 解析失败</text>
<text x="456" y="392" font-size="11" fill="#C46A0A" text-anchor="start" font-weight="400">没有 undo log、没有锁键</text>
<text x="456" y="412" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">register() 直接 return</text>
<path d="M270 130 L436 130" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<path d="M270 170 L436 250" fill="none" stroke="#E24B4A" stroke-width="1.6" marker-end="url(#flwR)"/>
<path d="M270 190 L436 370" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#flw)"/>
<text x="300" y="112" font-size="11" fill="#4C7A1A" text-anchor="middle" font-weight="700">① 线程边界</text>
<text x="300" y="238" font-size="11" fill="#C0392B" text-anchor="middle" font-weight="700">② 线程边界</text>
<text x="300" y="360" font-size="11" fill="#C46A0A" text-anchor="middle" font-weight="700">③ 代理 / 解析边界</text>
<rect x="40" y="462" width="920" height="128" rx="10" fill="#fff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="56" y="486" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">用两个问题定位：XID 在不在？分支在不在？</text>
<text x="56" y="514" font-size="11.5" fill="#4C7A1A" text-anchor="start" font-weight="400">XID 有 + 分支有：正常参与，回滚会调用 RM。</text>
<text x="56" y="536" font-size="11.5" fill="#C46A0A" text-anchor="start" font-weight="400">XID 有 + 分支无：线程/代理/解析/只读/模式边界出了问题，最常见。</text>
<text x="56" y="558" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="400">XID 无 + 分支有：几乎不可能；先怀疑手工 bind 到了错误的 XID。</text>
<text x="56" y="580" font-size="11.5" fill="#6B695F" text-anchor="start" font-weight="400">XID 无 + 分支无：下游完全没参与；检查传播过滤器与数据源代理。</text>
</svg>