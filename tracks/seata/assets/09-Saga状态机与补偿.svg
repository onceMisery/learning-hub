<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="flw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">Saga 的状态链与补偿链</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">正向是本地事务链，失败后从已完成状态栈逆序弹出补偿；补偿是业务语义，不是数据库回滚</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">绿色：正向</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">红色：补偿</text>
<rect x="100" y="130" width="160" height="56" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="180" y="154" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">CreateOrder</text>
<text x="180" y="174" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">本地事务</text>
<rect x="300" y="130" width="160" height="56" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="380" y="154" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">DeductStock</text>
<text x="380" y="174" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">本地事务</text>
<rect x="500" y="130" width="160" height="56" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="580" y="154" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">CreateDelivery</text>
<text x="580" y="174" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">本地事务</text>
<rect x="700" y="130" width="160" height="56" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="780" y="154" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">Succeed</text>
<text x="780" y="174" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">本地事务</text>
<path d="M260 158 L296 158" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<path d="M460 158 L496 158" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<path d="M660 158 L696 158" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#flwG)"/>
<rect x="100" y="340" width="160" height="56" rx="9" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.3"/>
<text x="180" y="364" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">CancelOrder</text>
<text x="180" y="384" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">补偿服务</text>
<rect x="300" y="340" width="160" height="56" rx="9" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.3"/>
<text x="380" y="364" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">RestoreStock</text>
<text x="380" y="384" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">补偿服务</text>
<rect x="500" y="340" width="160" height="56" rx="9" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.3"/>
<text x="580" y="364" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">CancelDelivery</text>
<text x="580" y="384" font-size="10" fill="#6B695F" text-anchor="middle" font-weight="400">补偿服务</text>
<path d="M260 368 L296 368" fill="none" stroke="#E24B4A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#flwR)"/>
<path d="M460 368 L496 368" fill="none" stroke="#E24B4A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#flwR)"/>
<path d="M180 186 L180 336" fill="none" stroke="#E24B4A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#flwR)"/>
<path d="M380 186 L380 336" fill="none" stroke="#E24B4A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#flwR)"/>
<path d="M580 186 L580 336" fill="none" stroke="#E24B4A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#flwR)"/>
<rect x="760" y="310" width="200" height="130" rx="10" fill="#fff" stroke="#E24B4A" stroke-width="1.3"/>
<text x="776" y="334" font-size="12" fill="#C0392B" text-anchor="start" font-weight="600">失败时</text>
<text x="776" y="356" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">已成功栈：</text>
<text x="776" y="374" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">CreateOrder、DeductStock</text>
<text x="776" y="396" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">逆序弹出：</text>
<text x="776" y="414" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">RestoreStock、CancelOrder</text>
<rect x="100" y="250" width="500" height="34" rx="9" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.3"/>
<text x="114" y="272" font-size="10.5" fill="#C0392B" text-anchor="start" font-weight="400">CreateDelivery 失败 → Catch.Next 指向 CompensationTrigger 才会补偿</text>
<rect x="24" y="510" width="940" height="66" rx="9" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="40" y="534" font-size="12" fill="#C46A0A" text-anchor="start" font-weight="600">TC 视角</text>
<text x="112" y="534" font-size="11" fill="#1F1E1A" text-anchor="start" font-weight="400">Saga 默认只有一个 branchId=-1 的虚拟分支；TC 的 commit 可能只是 engine.forward()。</text>
<text x="112" y="554" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">回滚时 TC 发 BranchRollback，RM 调 engine.compensate()；状态推进和补偿都在引擎本地完成。</text>
</svg>