<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="flw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="flwB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">XA 的两阶段与可见性</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">XA START 开始持锁，XA END/PREPARE 后数据仍不可见，XA COMMIT 后才可见</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">橙色：一阶段</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">绿色：二阶段</text>
<text x="40" y="100" font-size="12" fill="#C46A0A" text-anchor="start" font-weight="600">XA 分支</text>
<circle cx="100" cy="140" r="9" fill="#fff" stroke="#C46A0A" stroke-width="2"/>
<text x="100" y="168" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">XA START</text>
<circle cx="280" cy="140" r="9" fill="#fff" stroke="#C46A0A" stroke-width="2"/>
<text x="280" y="168" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">业务 SQL</text>
<circle cx="460" cy="140" r="9" fill="#fff" stroke="#C46A0A" stroke-width="2"/>
<text x="460" y="168" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">XA END</text>
<circle cx="600" cy="140" r="9" fill="#fff" stroke="#C46A0A" stroke-width="2"/>
<text x="600" y="168" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">PREPARE</text>
<circle cx="800" cy="140" r="9" fill="#fff" stroke="#639922" stroke-width="2"/>
<text x="800" y="168" font-size="10.5" fill="#6B695F" text-anchor="middle" font-weight="400">XA COMMIT</text>
<line x1="80" y1="140" x2="900" y2="140" stroke="#D3D1C7" stroke-width="2"/>
<rect x="100" y="200" width="700" height="24" rx="6" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="112" y="217" font-size="10.5" fill="#C46A0A" text-anchor="start" font-weight="400">数据库 XA 行锁：XA START → XA COMMIT/ROLLBACK</text>
<rect x="100" y="236" width="700" height="24" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.3"/>
<text x="112" y="253" font-size="10.5" fill="#C0392B" text-anchor="start" font-weight="400">数据不可见：PREPARE 之后仍未提交</text>
<rect x="800" y="200" width="100" height="60" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="850" y="224" font-size="12" fill="#4C7A1A" text-anchor="middle" font-weight="600">可见</text>
<text x="850" y="244" font-size="9.5" fill="#6B695F" text-anchor="middle" font-weight="400">commit 后</text>
<text x="40" y="320" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">和 AT 摆在一起</text>
<rect x="40" y="340" width="420" height="90" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="56" y="364" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">AT 一阶段</text>
<text x="56" y="388" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">本地 COMMIT → 数据已可见</text>
<text x="56" y="410" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">靠 undo log + TC 全局锁</text>
<rect x="480" y="340" width="480" height="90" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="496" y="364" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">XA 一阶段</text>
<text x="496" y="388" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">PREPARE → 数据仍不可见</text>
<text x="496" y="410" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">靠数据库 XA 行锁，锁持有到二阶段</text>
<rect x="40" y="460" width="920" height="90" rx="9" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="56" y="484" font-size="12" fill="#C46A0A" text-anchor="start" font-weight="600">失败与边界</text>
<text x="56" y="508" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="400">prepare 失败 → PhaseOne_PrepareFailed → 全局回滚；prepare 成功不上报 PhaseOne_Done。</text>
<text x="56" y="528" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">commit 失败会留下 prepared 分支；XAER_NOTA 是可重试的特殊状态。</text>
<text x="56" y="548" font-size="10.5" fill="#C46A0A" text-anchor="start" font-weight="400">连接池初始 autoCommit=false 时，ConnectionProxyXA.init() 直接抛异常。</text>
</svg>