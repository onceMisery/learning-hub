<!-- ============ 底部：gc_grace 不等式 ============ -->
<rect x="28" y="608" width="944" height="58" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="44" y="630" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">生死约定：max_hint_window（3h）&lt; repair 间隔 &lt; gc_grace（10 天 = 864000s，TableParams:446）——墓碑被清（CompactionController:249-261 修复状态不齐即不清）之前必须送达所有副本，否则僵尸复活。</text>
<text x="44" y="652" font-size="11" fill="#6B695F" text-anchor="start">Auto Repair（autorepair/ 包，FULL/INCREMENTAL/PREVIEW_REPAIRED 三类调度）让不等式自动成立；新节点 bootstrap 完即触发增量修复（与第 14 章联动）。preview（-prv）只走到第 ⑤ 步：先看会流多少，再决定动不动手。</text>
<text x="28" y="688" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">数据来源：utils/MerkleTree.java:205-239 · repair/Validator.java:171-220 · repair/RepairJob.java:385-437 · repair/LocalSyncTask.java:82-86（apache/cassandra master，7.0-SNAPSHOT）</text>
</svg>
