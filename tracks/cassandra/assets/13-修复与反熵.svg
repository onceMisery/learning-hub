<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">修复与反熵：Merkle 树、Hint 与读修复</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">node4 回归后的增量 repair：4 个 range 各建一棵 8 叶 Merkle 树 → R1~R3 根哈希一致 → R4 下钻 3 步锁定叶子 L8 → StreamPlan(REPAIR) 流式补 27 行</text>
<text x="976" y="26" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">橙色：repair 流程</text>
<text x="976" y="42" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">蓝色：建树与比对</text>
<text x="976" y="58" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">绿色：一致 / 补齐</text>
<text x="976" y="74" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">红色：差异 / 风险</text>

<!-- ============ 泳道一：为什么修 + 三层防线 ============ -->
<rect x="28" y="86" width="944" height="150" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.3"/>
<text x="44" y="108" font-size="13" fill="#C46A0A" text-anchor="start" font-weight="600">现场与三层防线：node4 卡死 14:00（phi=8.0@14:00:18~20）→ 16:00 回归，hint 重放 1,973 / 2,000 行，仍差 27 行</text>
<rect x="44" y="120" width="286" height="100" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.2"/>
<text x="58" y="140" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">第 1 层 hinted handoff（分钟级）</text>
<text x="58" y="158" font-size="10" fill="#3B3A34" text-anchor="start">写时垫付欠条；3h max_hint_window</text>
<text x="58" y="174" font-size="10" fill="#3B3A34" text-anchor="start">（yaml:80）；持有节点重启丢 27 行</text>
<text x="58" y="192" font-size="10" fill="#E24B4A" text-anchor="start" font-weight="600">尽力而为，不是保证</text>
<text x="58" y="210" font-size="10" fill="#6B695F" text-anchor="start">管「刚发生的」</text>
<rect x="342" y="120" width="286" height="100" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.2"/>
<text x="356" y="140" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">第 2 层 read repair（小时~天级）</text>
<text x="356" y="158" font-size="10" fill="#3B3A34" text-anchor="start">QUORUM 读 1 全量 + 其余 MD5 digest</text>
<text x="356" y="174" font-size="10" fill="#3B3A34" text-anchor="start">不一致 → BlockingReadRepair 补写</text>
<text x="356" y="192" font-size="10" fill="#6B695F" text-anchor="start">（表默认 BLOCKING，TableParams:460）</text>
<text x="356" y="210" font-size="10" fill="#6B695F" text-anchor="start">只救热数据；id=47 一致靠它</text>
<rect x="640" y="120" width="316" height="100" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="654" y="140" font-size="12" fill="#854F0B" text-anchor="start" font-weight="600">第 3 层 anti-entropy repair（兜底，本章）</text>
<text x="654" y="158" font-size="10" fill="#3B3A34" text-anchor="start">主动定期对账：覆盖全量数据、</text>
<text x="654" y="174" font-size="10" fill="#3B3A34" text-anchor="start">处理墓碑单边过期的删除分叉</text>
<text x="654" y="192" font-size="10" fill="#C46A0A" text-anchor="start" font-weight="600">nodetool repair / Auto Repair 调度</text>
<text x="654" y="210" font-size="10" fill="#6B695F" text-anchor="start">16:10 运维在 node2 上敲下 -inc</text>

<!-- ============ 泳道二：Merkle 树 ============ -->
