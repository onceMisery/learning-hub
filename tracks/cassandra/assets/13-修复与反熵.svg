<text x="44" y="268" font-size="13" fill="#2F6FA8" text-anchor="start" font-weight="600">R4 的 Merkle 树比对（utils/MerkleTree.java:205-239 difference）：根不等 → 取 midpoint 二分下钻，3 次比较锁定差异叶子</text>
