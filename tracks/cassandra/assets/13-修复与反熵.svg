<text x="252" y="310" font-size="16" fill="#E24B4A" text-anchor="middle" font-weight="700">≠</text>
<rect x="268" y="280" width="196" height="52" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
