<text x="552" y="316" font-size="10.5" fill="#2F6FA8" text-anchor="start" font-weight="600">差异 range = L8 对应子段（25 万行的 1/8）</text>
<text x="552" y="328" font-size="9.5" fill="#6B695F" text-anchor="start">R1/R2/R3 三棵树根哈希两两一致 → 0 个 SyncTask，一个字节不传</text>
<g>
<line x1="821" y1="374" x2="753" y2="374" stroke="#B4B2A9" stroke-width="1.1"/>
