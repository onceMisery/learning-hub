<circle cx="832" cy="374" r="11" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.6"/><text x="832" y="378" font-size="9.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">B✗</text>
<circle cx="662" cy="374" r="11" fill="#EAF3DE" stroke="#639922" stroke-width="1.4"/><text x="662" y="378" font-size="9.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">N56✓</text>
<circle cx="742" cy="374" r="11" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.6"/><text x="742" y="378" font-size="9.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">N78✗</text>
<circle cx="617" cy="410" r="11" fill="#EAF3DE" stroke="#639922" stroke-width="1.4"/><text x="617" y="414" font-size="9" fill="#1F1E1A" text-anchor="middle" font-weight="600">L7✓</text>
<circle cx="787" cy="410" r="11" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.6"/><text x="787" y="414" font-size="9" fill="#1F1E1A" text-anchor="middle" font-weight="600">L8✗</text>
<text x="812" y="414" font-size="9.5" fill="#E24B4A" text-anchor="start" font-weight="600">差异子段 → 27 行</text>
<text x="548" y="348" font-size="9.5" fill="#6B695F" text-anchor="start">下钻路径（B 的两个孩子在下方展开；A 的孩子省略）：</text>
<text x="548" y="432" font-size="9.5" fill="#6B695F" text-anchor="start">叶子=行哈希 XOR 上卷（Validator.add:171）</text>
</g>
<rect x="44" y="344" width="470" height="88" rx="8" fill="#ffffff" stroke="#2F6FA8" stroke-width="1.2"/>
<text x="58" y="364" font-size="11.5" fill="#1F1E1A" text-anchor="start" font-weight="600">树怎么来：一次「只读压缩」（ValidationManager:102-150）</text>
<text x="58" y="382" font-size="10" fill="#3B3A34" text-anchor="start">归并读 memtable+SSTable 但不写结果，只喂哈希（Validator.add:171）</text>
<text x="58" y="398" font-size="10" fill="#3B3A34" text-anchor="start">叶子数 = ceil(log2 分区数)；采样分叶（prepare:119）防「一格塞 90%」</text>
<text x="58" y="414" font-size="10" fill="#3B3A34" text-anchor="start">内存预算 repair_session_space = 堆 1/16 ÷ RF；深度封顶 20</text>
<text x="58" y="428" font-size="9.5" fill="#6B695F" text-anchor="start">树本身极小（8 叶 ≈ 300B），贵在建树的扫描，不传树</text>

<!-- ============ 泳道三：repair 七步 ============ -->
<rect x="28" y="452" width="944" height="146" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.3"/>
