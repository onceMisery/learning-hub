<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="500" y="32" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">基于 Trie 的存储格式：内存 Trie 与盘上 BTI 是同一棵树</text>
<text x="500" y="54" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">跟随 device_12 / device_47 / device_5 / device_51 / device_6：内存按字节步进，flush 印成盘上 trie，查找 device_47 逐字节导航</text>
<text x="976" y="26" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">绿色：盘上 / 落盘结构</text>
<text x="976" y="42" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">蓝色：索引部件</text>
<text x="976" y="58" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">琥珀：贯穿案例的键</text>
<text x="976" y="74" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">灰虚线框：共享 / 省略</text>

<!-- ============ 内存 Trie ============ -->
<text x="28" y="96" font-size="13" fill="#C46A0A" text-anchor="start" font-weight="600">内存端：TrieMemtable——按字节步进的前缀树（db/tries/InMemoryTrie.java:48）</text>
