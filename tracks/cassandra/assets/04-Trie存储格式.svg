<text x="296" y="133" font-size="9" fill="#1F1E1A" text-anchor="middle">1</text>
<circle cx="330" cy="129" r="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.4"/>
<text x="330" y="133" font-size="9" fill="#1F1E1A" text-anchor="middle">2</text>
<line x1="304" y1="129" x2="321" y2="129" stroke="#3B3A34" stroke-width="1.3"/>
<text x="345" y="127" font-size="9.5" fill="#6B695F" text-anchor="start">device_12</text>
<circle cx="296" cy="151" r="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.6"/>
<text x="296" y="155" font-size="9" fill="#1F1E1A" text-anchor="middle">4</text>
<circle cx="330" cy="151" r="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.6"/>
<text x="330" y="155" font-size="9" fill="#1F1E1A" text-anchor="middle">7</text>
