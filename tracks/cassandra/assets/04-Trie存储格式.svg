<text x="345" y="149" font-size="9.5" fill="#C46A0A" text-anchor="start" font-weight="600">device_47（贯穿案例）</text>
<circle cx="296" cy="173" r="8" fill="#ffffff" stroke="#3B3A34" stroke-width="1.3"/>
<text x="296" y="177" font-size="9" fill="#1F1E1A" text-anchor="middle">5</text>
<circle cx="336" cy="166" r="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.4"/>
<text x="336" y="170" font-size="8" fill="#1F1E1A" text-anchor="middle">完</text>
<line x1="304" y1="171" x2="327" y2="167" stroke="#3B3A34" stroke-width="1.3"/>
<text x="350" y="169" font-size="9.5" fill="#6B695F" text-anchor="start">device_5</text>
<circle cx="336" cy="186" r="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.4"/>
<text x="336" y="190" font-size="9" fill="#1F1E1A" text-anchor="middle">1</text>
<line x1="304" y1="176" x2="327" y2="184" stroke="#3B3A34" stroke-width="1.3"/>
<text x="350" y="190" font-size="9.5" fill="#6B695F" text-anchor="start">device_51</text>
<circle cx="296" cy="196" r="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.4"/>
<text x="296" y="200" font-size="9" fill="#1F1E1A" text-anchor="middle">6</text>
<text x="310" y="212" font-size="9.5" fill="#6B695F" text-anchor="start">device_6</text>
<text x="42" y="243" font-size="10" fill="#6B695F" text-anchor="start">叶子（绿）= 分区数据家当；查 device_47 走 9 步、每步一个字节；写 device_52 只补一个字节。</text>
<!-- 右侧读写面板 -->
<rect x="520" y="106" width="452" height="148" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="532" y="128" font-size="12.5" fill="#1F1E1A" text-anchor="start" font-weight="600">读与写怎么走（TrieMemtable.java:108-121、182）</text>
<text x="532" y="150" font-size="10.5" fill="#3B3A34" text-anchor="start">读 device_47：token 定位分片 → 字节步进 d-e-v-i-c-e-_-4-7</text>
<text x="532" y="168" font-size="10.5" fill="#3B3A34" text-anchor="start">写 device_52：走到 device_5 的分岔，沿途节点全部复用</text>
<text x="532" y="186" font-size="10.5" fill="#3B3A34" text-anchor="start">查不存在的 device_99：走到 device_9 断头，不碰任何账本</text>
<text x="532" y="208" font-size="10.5" fill="#6B695F" text-anchor="start">并发模型：分片单写、读随便进——一 shard 一写锁（:182）</text>
<text x="532" y="226" font-size="10.5" fill="#6B695F" text-anchor="start">判满换尺子：树近 2GB 上限先封账（InMemoryTrie.java:46-58）</text>
<text x="532" y="244" font-size="10.5" fill="#6B695F" text-anchor="start">分片数默认 = CPU 核数；热点砸一个分区时单写会排队</text>

<!-- ============ flush 印到盘上 ============ -->
<text x="28" y="284" font-size="13" fill="#639922" text-anchor="start" font-weight="600">flush：同一棵树印到盘上——BTI 主索引（CEP-25 · da=5.0，BtiFormat.java:290-295）</text>
<rect x="28" y="294" width="210" height="64" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="38" y="316" font-size="12.5" fill="#1F1E1A" text-anchor="start" font-weight="600">① TrieMemtable 满</text>
<text x="38" y="334" font-size="10" fill="#6B695F" text-anchor="start">树体量近阈值 → 封账</text>
<text x="38" y="350" font-size="10" fill="#6B695F" text-anchor="start">第 2 章的 flush 流程照旧</text>
<path d="M238 326 L268 326" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#triG)"/>
<rect x="272" y="294" width="250" height="64" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="282" y="316" font-size="12.5" fill="#1F1E1A" text-anchor="start" font-weight="600">② PartitionIndexBuilder 建树</text>
<text x="282" y="334" font-size="10" fill="#6B695F" text-anchor="start">有序键流增量写：只存最短区分前缀</text>
<text x="282" y="350" font-size="10" fill="#6B695F" text-anchor="start">自底向上装进 4096B 页（BtiFormat.md:913）</text>
<path d="M522 326 L552 326" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#triG)"/>
<rect x="556" y="294" width="230" height="64" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="566" y="316" font-size="12.5" fill="#1F1E1A" text-anchor="start" font-weight="600">③ Partitions.db + Rows.db</text>
<text x="566" y="334" font-size="10" fill="#6B695F" text-anchor="start">分区 trie + 分区内行 trie（16KB 块）</text>
<text x="566" y="350" font-size="10" fill="#6B695F" text-anchor="start">BtiFormat.java:75-76</text>
<path d="M786 326 L816 326" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#triG)"/>
<rect x="820" y="294" width="152" height="64" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="830" y="316" font-size="12.5" fill="#1F1E1A" text-anchor="start" font-weight="600">④ 打开极轻</text>
<text x="830" y="334" font-size="10" fill="#6B695F" text-anchor="start">只读文件尾 3 个 long</text>
<text x="830" y="350" font-size="10" fill="#6B695F" text-anchor="start">PartitionIndex.java:199-215</text>
<!-- 组件对照 -->
<rect x="28" y="372" width="460" height="82" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/>
<text x="40" y="392" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">big（nb-*）组件</text>
<text x="40" y="410" font-size="10" fill="#3B3A34" text-anchor="start">Data.db · Index.db（主索引）· Summary.db（堆内书签 1/128 抽样）</text>
<text x="40" y="426" font-size="10" fill="#3B3A34" text-anchor="start">· Filter.db（布隆）· Statistics.db · TOC.txt</text>
<text x="40" y="444" font-size="10" fill="#2F6FA8" text-anchor="start">点查：布隆 → Summary 定位 → Index.db 二分（BigTableReader.java:313）</text>
<rect x="508" y="372" width="464" height="82" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/>
<text x="520" y="392" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">bti（da-*）组件——数据同格式，索引换 trie</text>
<text x="520" y="410" font-size="10" fill="#3B3A34" text-anchor="start">Data.db · Partitions.db（分区 trie）· Rows.db（行 trie）</text>
<text x="520" y="426" font-size="10" fill="#3B3A34" text-anchor="start">· Filter.db · Statistics.db · TOC.txt ——没有 Summary.db（:111）</text>
<text x="520" y="444" font-size="10" fill="#2F6FA8" text-anchor="start">点查：布隆 → 逐字节导航 O(log n) 跳 → 叶页 → 数据页</text>

<!-- ============ big vs bti 对比 ============ -->
<text x="28" y="486" font-size="13" fill="#2F6FA8" text-anchor="start" font-weight="600">big vs bti：同一批 1000 万分区键的主索引（量级推演，非实测）</text>
<rect x="28" y="496" width="460" height="98" rx="8" fill="#FBFAF6" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="40" y="518" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">big：Index.db 数百 MB 级 + Summary 进堆</text>
<text x="40" y="538" font-size="10.5" fill="#6B695F" text-anchor="start">每键一条完整条目（约几十字节）；打开账本时装摘要进堆</text>
<text x="40" y="556" font-size="10.5" fill="#6B695F" text-anchor="start">（1/128 抽样，TableParams.java:450），受 index_summary_capacity</text>
<text x="40" y="574" font-size="10.5" fill="#6B695F" text-anchor="start">总预算约束（cassandra.yaml:1000）；重启要重新装载</text>
<rect x="508" y="496" width="464" height="98" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/>
<text x="520" y="518" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">bti：Partitions.db 数十 MB 级 + 打开不进堆</text>
<text x="520" y="538" font-size="10.5" fill="#6B695F" text-anchor="start">唯一前缀约 2n 个节点、每节点几字节；打开只读 3 个 long</text>
<text x="520" y="556" font-size="10.5" fill="#6B695F" text-anchor="start">（PartitionIndex.java:199-215）；非叶页常驻页缓存，</text>
<text x="520" y="574" font-size="10.5" fill="#6B695F" text-anchor="start">冷启动堆占用近零——BTI 的第一红利是「打开的堆账单」</text>
<text x="28" y="614" font-size="10.5" fill="#6B695F" text-anchor="start">出厂默认仍是 big：selected_format = BigFormat.NAME（Config.java:458）；bti 只影响新建账本，存量靠 nodetool upgradesstables 换血（StorageService.java:2787）。</text>

<!-- 底部总结 -->
<rect x="28" y="632" width="944" height="60" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.2"/>
<text x="44" y="652" font-size="11" fill="#1F1E1A" text-anchor="start" font-weight="600">一句话：字节序是通用语——内存里 TrieMemtable 按字节步进、前缀共享、分片单写；盘上 BTI 把主索引印成同一棵树，打开一本账只读 3 个 long。</text>
<text x="44" y="670" font-size="10.5" fill="#6B695F" text-anchor="start">默认仍是跳表 + big（MemtableParams.java:99、Config.java:458）：trie 是「按表选账本、按节点换格式」的选择题，不是全局开关。</text>
<text x="44" y="686" font-size="9" fill="#B4B2A9" text-anchor="start">数据来源：db/memtable/TrieMemtable.java:81-91 · io/sstable/format/bti/PartitionIndex.java:57-71、199-215 · io/sstable/format/bti/BtiFormat.java:290-295（apache/cassandra 7.0-SNAPSHOT，2026-08）</text>
</svg>
