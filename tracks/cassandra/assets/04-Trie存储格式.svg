<text x="230" y="155" font-size="9" fill="#1F1E1A" text-anchor="middle">e</text>
<text x="258" y="155" font-size="9" fill="#1F1E1A" text-anchor="middle">_</text>
<text x="165" y="129" font-size="9.5" fill="#6B695F" text-anchor="middle">共享前缀 device_：5 个键只存一遍</text>
<!-- 分支 -->
<line x1="266" y1="146" x2="288" y2="132" stroke="#3B3A34" stroke-width="1.3"/>
