<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="cA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="cG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="cR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">Cassandra 提交日志与内存表：先记账，再落内存</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">跟随 id=47：两笔写入进段 1 → flush 夹上书签 → id=48 落段 2 → 崩溃后按书签只回放段 2</text>
<text x="976" y="26" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">橙色：数据流 / 写入</text>
<text x="976" y="42" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">绿色：落盘 / 书签 / 回收</text>
<text x="976" y="58" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">红色：崩溃 / 跳过</text>
<text x="976" y="74" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">灰色虚线：已被书签覆盖</text>

<!-- ============ 第一条：写路径 ============ -->
<rect x="28" y="88" width="944" height="170" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.3"/>
<text x="44" y="110" font-size="13" fill="#C46A0A" text-anchor="start" font-weight="600">写路径：先记账，再落内存（①②，任一副本本地执行）</text>

<rect x="44" y="122" width="150" height="64" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="119" y="144" font-size="13" fill="#1F1E1A" text-anchor="middle" font-weight="600">① 一笔写入</text>
<text x="119" y="162" font-size="10.5" fill="#6B695F" text-anchor="middle">Keyspace.apply 内部</text>
<text x="119" y="178" font-size="10.5" fill="#6B695F" text-anchor="middle">Keyspace.java:437-438</text>

<path d="M194 154 L216 154" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#cA)"/>

<rect x="220" y="114" width="400" height="136" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="420" y="134" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">① CommitLog 段 1（默认 32MiB，只追加）</text>
<rect x="236" y="142" width="368" height="32" rx="5" fill="#ffffff" stroke="#639922" stroke-width="1"/>
<text x="420" y="163" font-size="10.5" fill="#3B3A34" text-anchor="middle">[pos 8192] id=47 阿福/31 · ts=1001 · CRC</text>
<rect x="236" y="180" width="368" height="32" rx="5" fill="#ffffff" stroke="#639922" stroke-width="1"/>
<text x="420" y="201" font-size="10.5" fill="#3B3A34" text-anchor="middle">[pos 9408] id=47 阿福2 · ts=1005 · CRC</text>
<text x="420" y="236" font-size="10.5" fill="#6B695F" text-anchor="middle">每笔 = 长度+CRC + 内容+CRC；写满滚动出段 2（段默认 32MiB，cassandra.yaml:691）</text>

<path d="M620 160 L636 160" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#cA)"/>

<rect x="640" y="122" width="230" height="104" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="755" y="144" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">② Memtable（users 表）</text>
<text x="755" y="164" font-size="10.5" fill="#3B3A34" text-anchor="middle">id=47：阿福/31（ts=1001）</text>
<text x="755" y="182" font-size="10.5" fill="#3B3A34" text-anchor="middle">id=47：阿福2（ts=1005）并存</text>
<text x="755" y="202" font-size="10.5" fill="#6B695F" text-anchor="middle">每表一本 · 默认跳表账本</text>
<text x="755" y="218" font-size="10.5" fill="#6B695F" text-anchor="middle">SkipListMemtable.java:68</text>

<text x="44" y="248" font-size="10.5" fill="#6B695F" text-anchor="start">③ sync 档位决定 fsync 时机：periodic（默认，commitlog_sync_period=10000ms，最坏丢 10s）｜batch（每笔等 fsync，0 丢失）｜group（窗口折中）</text>

<!-- ============ 第二条：flush ============ -->
<rect x="28" y="272" width="944" height="150" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.3"/>
<text x="44" y="292" font-size="13" fill="#639922" text-anchor="start" font-weight="600">flush 流水线：封账、写盘、夹书签、报账（④⑤）</text>

<rect x="44" y="304" width="180" height="76" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="134" y="326" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">④ Memtable 满</text>
<text x="134" y="344" font-size="10.5" fill="#6B695F" text-anchor="middle">switchMemtable 封账</text>
<text x="134" y="360" font-size="10.5" fill="#6B695F" text-anchor="middle">ColumnFamilyStore.java:1080</text>

<path d="M224 342 L240 342" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#cG)"/>

<rect x="244" y="304" width="260" height="76" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="374" y="326" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">⑤ flush → SSTable-00001</text>
<text x="374" y="344" font-size="10.5" fill="#6B695F" text-anchor="middle">书签：commitLogIntervals=[段1:0, 段1:9408]</text>
<text x="374" y="360" font-size="10.5" fill="#6B695F" text-anchor="middle">Flushing.java:248 → StatsMetadata.java:62</text>

<path d="M504 342 L520 342" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#cG)"/>

<rect x="524" y="304" width="230" height="76" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="639" y="326" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">PostFlush 报账</text>
<text x="639" y="344" font-size="10.5" fill="#6B695F" text-anchor="middle">discardCompletedSegments</text>
<text x="639" y="360" font-size="10.5" fill="#6B695F" text-anchor="middle">ColumnFamilyStore.java:1199-1204</text>

<path d="M754 342 L770 342" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#cG)"/>

<rect x="774" y="304" width="182" height="76" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="865" y="326" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">新写入落段 2</text>
<text x="865" y="344" font-size="10.5" fill="#6B695F" text-anchor="middle">id=48 大壮 · ts=2001</text>
<text x="865" y="360" font-size="10.5" fill="#6B695F" text-anchor="middle">段 1 从此可回收</text>

<text x="44" y="406" font-size="10.5" fill="#6B695F" text-anchor="start">书签是区间不是单点：每张表各记各的 [下界, 上界]（CommitLogPosition = 段 id + 段内偏移）；整段回收要等所有表都越过这段区间。</text>

<!-- ============ 第三条：崩溃恢复 ============ -->
<rect x="28" y="436" width="944" height="176" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.3"/>
<text x="44" y="456" font-size="13" fill="#E24B4A" text-anchor="start" font-weight="600">崩溃恢复：按书签跳过已落盘的（⑥⑦）</text>

<rect x="44" y="472" width="170" height="76" rx="8" fill="#FFF6E8" stroke="#E24B4A" stroke-width="1.3"/>
<text x="129" y="494" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">⑥ node2 掉电重启</text>
<text x="129" y="512" font-size="10.5" fill="#6B695F" text-anchor="middle">recoverSegmentsOnDisk</text>
<text x="129" y="528" font-size="10.5" fill="#6B695F" text-anchor="middle">CommitLog.java:183</text>

<path d="M214 510 L232 510" fill="none" stroke="#E24B4A" stroke-width="1.6" marker-end="url(#cR)"/>

<rect x="236" y="472" width="250" height="76" rx="8" fill="#FFF6E8" stroke="#E24B4A" stroke-width="1.3"/>
<text x="361" y="494" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">CommitLogReplayer.construct</text>
<text x="361" y="512" font-size="10.5" fill="#6B695F" text-anchor="middle">persistedIntervals 收各表书签（:338）</text>
<text x="361" y="528" font-size="10.5" fill="#6B695F" text-anchor="middle">firstNotCovered 定全局起点（:375）</text>

<path d="M486 510 L504 510" fill="none" stroke="#E24B4A" stroke-width="1.6" marker-end="url(#cR)"/>

<rect x="508" y="472" width="222" height="76" rx="8" fill="#ffffff" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="619" y="494" font-size="12.5" fill="#E24B4A" text-anchor="middle" font-weight="600">⑦ 段 1：id=47 两笔 → 跳过</text>
<text x="619" y="512" font-size="10.5" fill="#6B695F" text-anchor="middle">位置落在书签区间内（灰虚线）</text>
<text x="619" y="528" font-size="10.5" fill="#6B695F" text-anchor="middle">shouldReplay（CommitLogReplayer.java:313）</text>

<rect x="756" y="472" width="200" height="76" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="856" y="494" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">⑦ 段 2：id=48 → 回放</text>
<text x="856" y="512" font-size="10.5" fill="#6B695F" text-anchor="middle">不在任何书签区间</text>
<text x="856" y="528" font-size="10.5" fill="#6B695F" text-anchor="middle">replayedCount+1（:318）</text>

<path d="M361 548 L361 566 L856 566 L856 552" fill="none" stroke="#639922" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#cG)"/>
<text x="600" y="582" font-size="10.5" fill="#639922" text-anchor="middle" font-weight="600">id=48 回放进 Memtable（apply 时不再记 CommitLog，Replayer.java:325）</text>
<text x="44" y="600" font-size="10.5" fill="#6B695F" text-anchor="start">结果：id=47 从 SSTable-00001 读，id=48 从 Memtable 读；periodic 档真正可能丢的，只有最后 10s 里没被 fsync 的那几笔。</text>

<!-- ============ 底部总结 ============ -->
<rect x="28" y="626" width="944" height="64" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="44" y="650" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">一张图的一句话：写入先追加段文件、再进内存账（③决定等不等盘）；flush 把内存账写成 SSTable 并夹上书签（⑤）；崩溃后按书签逐笔过滤——已落盘的跳过，没落账的回放（⑦）。</text>
<text x="44" y="672" font-size="11" fill="#6B695F" text-anchor="start">数据来源：db/Keyspace.java:437-438（先记账再落内存）· db/memtable/Flushing.java:248（书签写入 SSTable 元数据）· db/commitlog/CommitLogReplayer.java:313（回放过滤）</text>
</svg>
