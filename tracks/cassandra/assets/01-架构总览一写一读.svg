<path d="M406 451 L442 451" fill="none" stroke="#2F6FA8" stroke-width="1.6" marker-end="url(#wB)"/>
<path d="M716 451 L752 451" fill="none" stroke="#2F6FA8" stroke-width="1.6" marker-end="url(#wB)"/>
<path d="M187 380 L187 398 L260 398 L260 414" fill="none" stroke="#2F6FA8" stroke-width="1.6" marker-end="url(#wB)"/>
<path d="M813 380 L813 398 L350 398 L350 414" fill="none" stroke="#2F6FA8" stroke-width="1.6" marker-end="url(#wB)"/>
<text x="305" y="394" font-size="10.5" fill="#2F6FA8" text-anchor="middle" font-weight="600">data（全量）与 digest（摘要）下行汇合</text>

<!-- ============ 注脚与总结 ============ -->
<text x="28" y="512" font-size="10.5" fill="#6B695F" text-anchor="start">一写一读在副本层汇合：写只推进到「CommitLog + Memtable」就返回，SSTable 由后台异步 flush 生成；读把各副本手里已有的版本按单元格时间戳拼出答案。</text>
<text x="28" y="532" font-size="10.5" fill="#6B695F" text-anchor="start">出厂默认（conf/cassandra.yaml）：num_tokens=16 · commitlog_sync=periodic / commitlog_sync_period=10000ms · commitlog_segment_size=32MiB</text>

<rect x="28" y="548" width="944" height="84" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="44" y="574" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">一张图的一句话：写（①–④）由协调者算 token 分单、三个副本各自先记日志再落内存，凑够 2 个确认就答复客户端；读（⑤–⑥）问两个副本、按时间戳现场拼出最新值。</text>
<text x="44" y="596" font-size="11" fill="#6B695F" text-anchor="start">协调者不存数据、副本不挑请求：node3 与 node1 这两个「协调者」角色每次请求都可以换人，这正是对等架构的日常。</text>
<text x="44" y="616" font-size="11" fill="#6B695F" text-anchor="start">数据来源：service/StorageProxy.java:978、:2176（写读入口）· db/Keyspace.java:437-438（先 CommitLog 后 memtable）· service/AbstractWriteResponseHandler.java:298（blockFor）</text>
</svg>
