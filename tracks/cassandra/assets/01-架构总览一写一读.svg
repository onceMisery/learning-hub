<rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">Cassandra 全景：一行数据的进来与出去（一写一读）</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">跟随 users 表 id=47 这一行：INSERT 走 ①–④，SELECT 走 ⑤–⑥；两路在副本层汇合，一致性由时间戳现场拼出来</text>
<text x="976" y="26" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">橙色：请求 / 数据流</text>
<text x="976" y="42" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">绿色：CommitLog / 确认</text>
<text x="976" y="58" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">蓝色：读路径 / 内存结构</text>
<text x="976" y="74" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">灰色虚线：异步 / 未被问到</text>

<!-- ============ 写流水线 ============ -->
<text x="28" y="92" font-size="13" fill="#C46A0A" text-anchor="start" font-weight="600">写流水线：一次 INSERT（任何节点都能当协调者，本轮是 node3）</text>
<rect x="28" y="104" width="128" height="62" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="92" y="126" font-size="13" fill="#1F1E1A" text-anchor="middle" font-weight="600">客户端</text>
<text x="92" y="144" font-size="10.5" fill="#6B695F" text-anchor="middle">驱动程序 / cqlsh</text>
<text x="92" y="160" font-size="10.5" fill="#6B695F" text-anchor="middle">发给任意节点</text>

<rect x="196" y="104" width="186" height="62" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="289" y="126" font-size="13" fill="#1F1E1A" text-anchor="middle" font-weight="600">① CQL 前端</text>
<text x="289" y="144" font-size="10.5" fill="#6B695F" text-anchor="middle">QueryProcessor 解析成 Mutation</text>
<text x="289" y="160" font-size="10.5" fill="#6B695F" text-anchor="middle">cql3/QueryProcessor.java:112</text>

<rect x="422" y="104" width="196" height="62" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="520" y="126" font-size="13" fill="#1F1E1A" text-anchor="middle" font-weight="600">② StorageProxy.mutate</text>
<text x="520" y="144" font-size="10.5" fill="#6B695F" text-anchor="middle">算 token → 选出副本（:1742-1744）</text>
<text x="520" y="160" font-size="10.5" fill="#6B695F" text-anchor="middle">service/StorageProxy.java:978</text>

<rect x="760" y="104" width="212" height="62" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="866" y="126" font-size="13" fill="#1F1E1A" text-anchor="middle" font-weight="600">④ 数确认，够数就返回</text>
<text x="866" y="144" font-size="10.5" fill="#6B695F" text-anchor="middle">blockFor() = QUORUM → 2</text>
<text x="866" y="160" font-size="10.5" fill="#6B695F" text-anchor="middle">AbstractWriteResponseHandler.java:298</text>

<path d="M156 135 L192 135" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#wA)"/>
<path d="M382 135 L418 135" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#wA)"/>
<path d="M460 166 L460 192 L187 192 L187 224" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#wA)"/>
<path d="M520 166 L520 224" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#wA)"/>
<path d="M580 166 L580 192 L813 192 L813 224" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#wA)"/>
<text x="520" y="186" font-size="10.5" fill="#C46A0A" text-anchor="middle" font-weight="600">Mutation 同时发给 3 个副本</text>
<path d="M866 200 L866 172" fill="none" stroke="#639922" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#wG)"/>
<text x="874" y="190" font-size="10.5" fill="#639922" text-anchor="start" font-weight="600">ack ×2</text>

<!-- ============ 副本层 ============ -->
<rect x="28" y="200" width="944" height="180" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.3"/>
<text x="44" y="220" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">副本层：id=47 的三个副本，各自跑一套独立的本地存储引擎（③ 每个副本先记日志、再落内存）</text>

<rect x="52" y="232" width="270" height="28" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="187" y="251" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">node2 · 副本 ①</text>
<rect x="52" y="264" width="270" height="28" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/>
<text x="187" y="283" font-size="11.5" fill="#1F1E1A" text-anchor="middle">③ CommitLog：追加一条 + CRC</text>
<rect x="52" y="296" width="270" height="28" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="187" y="315" font-size="11.5" fill="#1F1E1A" text-anchor="middle">Memtable：users 表的内存账本</text>
<rect x="52" y="328" width="270" height="28" rx="6" fill="#ffffff" stroke="#B4B2A9" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="187" y="347" font-size="11.5" fill="#6B695F" text-anchor="middle">SSTable：后台异步 flush 后才出现</text>

<rect x="365" y="232" width="270" height="28" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="500" y="251" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">node4 · 副本 ②</text>
<rect x="365" y="264" width="270" height="28" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/>
<text x="500" y="283" font-size="11.5" fill="#1F1E1A" text-anchor="middle">③ CommitLog：追加一条 + CRC</text>
<rect x="365" y="296" width="270" height="28" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="500" y="315" font-size="11.5" fill="#1F1E1A" text-anchor="middle">Memtable：users 表的内存账本</text>
<rect x="365" y="328" width="270" height="28" rx="6" fill="#ffffff" stroke="#B4B2A9" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="500" y="347" font-size="11.5" fill="#6B695F" text-anchor="middle">SSTable：后台异步 flush 后才出现</text>

<rect x="678" y="232" width="270" height="28" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="813" y="251" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">node5 · 副本 ③</text>
<rect x="678" y="264" width="270" height="28" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/>
<text x="813" y="283" font-size="11.5" fill="#1F1E1A" text-anchor="middle">③ CommitLog：追加一条 + CRC</text>
<rect x="678" y="296" width="270" height="28" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="813" y="315" font-size="11.5" fill="#1F1E1A" text-anchor="middle">Memtable：users 表的内存账本</text>
<rect x="678" y="328" width="270" height="28" rx="6" fill="#ffffff" stroke="#B4B2A9" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="813" y="347" font-size="11.5" fill="#6B695F" text-anchor="middle">SSTable：后台异步 flush 后才出现</text>

<text x="660" y="373" font-size="10" fill="#6B695F" text-anchor="start">写成功的门槛：node2 + node4 先点头即可（RF=3，QUORUM=2）</text>

<!-- ============ 读流水线 ============ -->
<text x="28" y="410" font-size="13" fill="#2F6FA8" text-anchor="start" font-weight="600">读流水线：一次 SELECT（协调者换成了 node1，副本名单照旧）</text>
<rect x="28" y="420" width="128" height="62" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="92" y="442" font-size="13" fill="#1F1E1A" text-anchor="middle" font-weight="600">客户端</text>
<text x="92" y="460" font-size="10.5" fill="#6B695F" text-anchor="middle">SELECT … WHERE id=47</text>
<text x="92" y="476" font-size="10.5" fill="#6B695F" text-anchor="middle">还是发给任意节点</text>

<rect x="196" y="420" width="210" height="62" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="301" y="442" font-size="13" fill="#1F1E1A" text-anchor="middle" font-weight="600">⑤ StorageProxy.read</text>
<text x="301" y="460" font-size="10.5" fill="#6B695F" text-anchor="middle">node2 要 data，node5 要 digest</text>
<text x="301" y="476" font-size="10.5" fill="#6B695F" text-anchor="middle">service/StorageProxy.java:2176</text>

<rect x="446" y="420" width="270" height="62" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="581" y="442" font-size="13" fill="#1F1E1A" text-anchor="middle" font-weight="600">⑥ DataResolver 按时间戳拼接</text>
<text x="581" y="460" font-size="10.5" fill="#6B695F" text-anchor="middle">name：阿福(1001) vs 阿福2(1005) → 阿福2</text>
<text x="581" y="476" font-size="10.5" fill="#6B695F" text-anchor="middle">service/reads/DataResolver.java:63</text>

<rect x="756" y="420" width="216" height="62" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="864" y="442" font-size="13" fill="#1F1E1A" text-anchor="middle" font-weight="600">返回（'阿福2', 31）</text>
<text x="864" y="460" font-size="10.5" fill="#6B695F" text-anchor="middle">发现 node2 落后了，顺手补一份</text>
<text x="864" y="476" font-size="10.5" fill="#6B695F" text-anchor="middle">read repair（第 13 章）</text>

