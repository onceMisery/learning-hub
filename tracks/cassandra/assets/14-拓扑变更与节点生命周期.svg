<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="tA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="tB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="tG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="tR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">拓扑变更与节点生命周期：入列与离场</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">node6 入列（CMS 三段式：分 token → 双归属窗口 streaming 150GB → JOIN）对照 node4 强摘（PrepareLeave(REMOVENODE) → 幸存者互拷补齐 180GB）</text>
<text x="976" y="26" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">橙色：入列流程</text>
<text x="976" y="42" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">蓝色：CMS 事务 / streaming</text>
<text x="976" y="58" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">绿色：数据补齐 / 完成</text>
<text x="976" y="74" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">红色：离场 / 死节点</text>

<!-- ============ 泳道一：四种动作 ============ -->
<rect x="28" y="86" width="944" height="106" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.3"/>
<text x="44" y="108" font-size="13" fill="#C46A0A" text-anchor="start" font-weight="600">四种动作一张表：「谁活着」决定走哪条路（service/StorageService.java:481 的 Mode 枚举记着状态机）</text>
<rect x="44" y="120" width="222" height="62" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.2"/>
<text x="58" y="140" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">bootstrap（自愿进）</text>
<text x="58" y="156" font-size="9.5" fill="#3B3A34" text-anchor="start">新节点启动即走；auto_bootstrap 默认开</text>
<text x="58" y="170" font-size="9.5" fill="#6B695F" text-anchor="start">环 5→6，node6 分 16 token</text>
<rect x="280" y="120" width="222" height="62" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.2"/>
<text x="294" y="140" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">decommission（自愿出）</text>
<text x="294" y="156" font-size="9.5" fill="#3B3A34" text-anchor="start">活节点亲手交数据再走（UNBOOTSTRAP）</text>
<text x="294" y="170" font-size="9.5" fill="#6B695F" text-anchor="start">GossipShutdown 收尾（第 5 章）</text>
<rect x="516" y="120" width="222" height="62" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.2"/>
<text x="530" y="140" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">removenode（强摘死者）</text>
<text x="530" y="156" font-size="9.5" fill="#3B3A34" text-anchor="start">活着会被拒（:136「Use decommission」）</text>
<text x="530" y="170" font-size="9.5" fill="#6B695F" text-anchor="start">幸存者互拷补 RF，环 5→4</text>
<rect x="752" y="120" width="204" height="62" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/>
<text x="766" y="140" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">replace（顶替死者）</text>
<text x="766" y="156" font-size="9.5" fill="#3B3A34" text-anchor="start">-Dcassandra.replace_address=…</text>
<text x="766" y="170" font-size="9.5" fill="#6B695F" text-anchor="start">继承 token，环形状不变</text>

<!-- ============ 泳道二：node6 入列时间线 ============ -->
<rect x="28" y="200" width="944" height="216" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.3"/>
<text x="44" y="222" font-size="13" fill="#C46A0A" text-anchor="start" font-weight="600">事件 A：node6 入列时间线（BootstrapAndJoin.java:204 executeNext 的三段式，每个事务一个 epoch）</text>
<line x1="60" y1="266" x2="940" y2="266" stroke="#3B3A34" stroke-width="1.4" marker-end="url(#tA)"/>
<circle cx="90" cy="266" r="6" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.6"/>
<text x="90" y="248" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">t0 10:00</text>
<text x="90" y="284" font-size="9" fill="#6B695F" text-anchor="middle">启动·找 seed(node1)</text>
<text x="90" y="297" font-size="9" fill="#6B695F" text-anchor="middle">Register 领 NodeId</text>
<circle cx="260" cy="266" r="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.6"/>
<text x="260" y="248" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">t1 10:01</text>
<text x="260" y="284" font-size="9" fill="#6B695F" text-anchor="middle">allocateTokens:270-291</text>
<text x="260" y="297" font-size="9" fill="#6B695F" text-anchor="middle">16 token·等 schema 齐</text>
<circle cx="470" cy="266" r="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.6"/>
<text x="470" y="248" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">t2 10:02</text>
<text x="470" y="284" font-size="9" fill="#6B695F" text-anchor="middle">START_JOIN→MID_JOIN</text>
<text x="470" y="297" font-size="9" fill="#6B695F" text-anchor="middle">16 份流并行拉 150GB</text>
<circle cx="710" cy="266" r="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.6"/>
<text x="710" y="248" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">t3 10:42</text>
<text x="710" y="284" font-size="9" fill="#6B695F" text-anchor="middle">MidJoin(E96) 进读表</text>
<text x="710" y="297" font-size="9" fill="#6B695F" text-anchor="middle">+Auto Repair 增量补账</text>
<circle cx="900" cy="266" r="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.6"/>
<text x="900" y="248" font-size="10.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">t4 10:43</text>
<text x="900" y="284" font-size="9" fill="#6B695F" text-anchor="middle">FinishJoin(E97)</text>
<text x="900" y="297" font-size="9" fill="#6B695F" text-anchor="middle">旧副本退写表→NORMAL</text>
<text x="60" y="234" font-size="9.5" fill="#6B695F" text-anchor="start">epoch：E94（5 节点稳态）→ StartJoin=E95 → MidJoin=E96 → FinishJoin=E97（教学示意）</text>
<rect x="44" y="308" width="432" height="96" rx="8" fill="#ffffff" stroke="#2F6FA8" stroke-width="1.2"/>
<text x="58" y="328" font-size="11.5" fill="#1F1E1A" text-anchor="start" font-weight="600">双归属窗口（PrepareJoin.java:52-85 类注释）</text>
<line x1="58" y1="336" x2="462" y2="336" stroke="#ECEAE2" stroke-width="1"/>
<text x="58" y="354" font-size="9.5" fill="#3B3A34" text-anchor="start">StartJoin 前：node6 不在任何表 —— 旧 owner 独占读写</text>
<text x="58" y="370" font-size="9.5" fill="#C46A0A" text-anchor="start" font-weight="600">StartJoin(E95)：node6 进写表 —— 双归属开始（收写不服务读）</text>
<text x="58" y="386" font-size="9.5" fill="#2F6FA8" text-anchor="start" font-weight="600">MidJoin(E96)：node6 进读表 —— streaming 已拉齐，可服务读</text>
<text x="58" y="400" font-size="9.5" fill="#639922" text-anchor="start" font-weight="600">FinishJoin(E97)：旧 owner 退写表 —— 窗口合拢，全程读写不停</text>
<rect x="492" y="308" width="464" height="96" rx="8" fill="#ffffff" stroke="#639922" stroke-width="1.2"/>
<text x="506" y="328" font-size="11.5" fill="#1F1E1A" text-anchor="start" font-weight="600">streaming 会话状态机（StreamSession.java:246-251）</text>
<rect x="506" y="340" width="76" height="24" rx="6" fill="#FBFAF6" stroke="#B4B2A9" stroke-width="1"/><text x="544" y="356" font-size="8.5" fill="#3B3A34" text-anchor="middle">INITIALIZED</text>
<path d="M582 352 L596 352" fill="none" stroke="#2F6FA8" stroke-width="1.4" marker-end="url(#tB)"/>
<rect x="600" y="340" width="64" height="24" rx="6" fill="#FBFAF6" stroke="#B4B2A9" stroke-width="1"/><text x="632" y="356" font-size="8.5" fill="#3B3A34" text-anchor="middle">PREPARING</text>
<path d="M664 352 L678 352" fill="none" stroke="#2F6FA8" stroke-width="1.4" marker-end="url(#tB)"/>
<rect x="682" y="340" width="66" height="24" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="715" y="356" font-size="8.5" fill="#2F6FA8" text-anchor="middle" font-weight="600">STREAMING</text>
<path d="M748 352 L762 352" fill="none" stroke="#2F6FA8" stroke-width="1.4" marker-end="url(#tB)"/>
<rect x="766" y="340" width="84" height="24" rx="6" fill="#FBFAF6" stroke="#B4B2A9" stroke-width="1"/><text x="808" y="356" font-size="8.5" fill="#3B3A34" text-anchor="middle">WAIT_COMPLETE</text>
<path d="M850 352 L864 352" fill="none" stroke="#639922" stroke-width="1.4" marker-end="url(#tG)"/>
<rect x="868" y="340" width="72" height="24" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/><text x="904" y="356" font-size="8.5" fill="#639922" text-anchor="middle" font-weight="600">COMPLETE</text>
<text x="506" y="384" font-size="9.5" fill="#3B3A34" text-anchor="start">StreamPlan(BOOTSTRAP)（BootStrapper.java:123）——子 range 为单位传，16 段并行</text>
<text x="506" y="398" font-size="9.5" fill="#6B695F" text-anchor="start">断点续传：已交割 range 记账在 system 表，重启跳过已到手段；repair/REPAIR、</text>
<text x="506" y="412" font-size="9.5" fill="#6B695F" text-anchor="start">decommission/DECOMMISSION、摘除/RESTORE_REPLICA_COUNT 共用此状态机</text>

<!-- ============ 泳道三：removenode 对照 ============ -->
<rect x="28" y="424" width="944" height="130" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.3"/>
<text x="44" y="446" font-size="13" fill="#E24B4A" text-anchor="start" font-weight="600">事件 B：node4 强摘 vs 体面退场（SingleNodeSequences.java:66 decommission / :127 removeNode）</text>
<rect x="44" y="458" width="452" height="86" rx="8" fill="#ffffff" stroke="#E24B4A" stroke-width="1.2"/>
<text x="58" y="478" font-size="11.5" fill="#1F1E1A" text-anchor="start" font-weight="600">removenode（node4 死透：主板烧毁，14:00 起 phi&gt;8）</text>
<text x="58" y="496" font-size="9.5" fill="#3B3A34" text-anchor="start">① 预检：不 in live 名单（活着请 decommission，:136）；不能摘自己（:131）</text>
<text x="58" y="512" font-size="9.5" fill="#3B3A34" text-anchor="start">② PrepareLeave(REMOVENODE)：placement 重算，node4 的段重新指派</text>
<text x="58" y="528" font-size="9.5" fill="#639922" text-anchor="start" font-weight="600">③ 幸存者互拷：接手者从其余 2 个活副本拉 45GB/台 ×4（RESTORE_REPLICA_COUNT）</text>
<text x="58" y="542" font-size="9.5" fill="#6B695F" text-anchor="start">④ 广播 LEFT（:156 unsafeBroadcastLeftStatus）——死节点全程 0 字节参与</text>
<rect x="512" y="458" width="444" height="86" rx="8" fill="#ffffff" stroke="#E24B4A" stroke-width="1.2"/>
<text x="526" y="478" font-size="11.5" fill="#1F1E1A" text-anchor="start" font-weight="600">decommission（对照组：node5 活着退场）</text>
<text x="526" y="496" font-size="9.5" fill="#3B3A34" text-anchor="start">① PrepareLeave(UNBOOTSTRAP)：标 LEAVING，重开交割账本（宁重传不漏传）</text>
<text x="526" y="512" font-size="9.5" fill="#3B3A34" text-anchor="start">② 反向 streaming：node5 亲手推数据（UnbootstrapStreams:211 DECOMMISSION）</text>
<text x="526" y="528" font-size="9.5" fill="#3B3A34" text-anchor="start">③ 已传段跳过（:195-203 幂等续传）；期间它照常服务读写</text>
<text x="526" y="542" font-size="9.5" fill="#6B695F" text-anchor="start">④ 交 hint（streamHints）→ 广播 LEFT → 关网（GossipShutdown，第 5 章）</text>

<!-- ============ 泳道四：数据量算术 ============ -->
<rect x="28" y="562" width="944" height="84" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="44" y="584" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">搬多少（demo 全集群 300GB、RF=3、num_tokens=16）：扩容摊薄全员、缩容集中抽取幸存者</text>
<text x="58" y="606" font-size="10.5" fill="#3B3A34" text-anchor="start" font-weight="600">扩容 5→6：每老机出 30GB（持有 180→150GB，各让 1/6）；node6 独进 150GB；16 段摊成 16 份流 ≈9.4GB/份</text>
<text x="58" y="624" font-size="10.5" fill="#3B3A34" text-anchor="start" font-weight="600">强摘 5→4：4 台各进 45GB（180→225GB），总量 ≈180GB 全部从幸存副本翻拷；期间 QUORUM 靠剩 2 副本撑（再挂一台即 Unavailable）</text>
<text x="58" y="642" font-size="10.5" fill="#6B695F" text-anchor="start">replace node4：环不变，仅新机器进 ≈180GB、其余 0 流量——盘还活着就优先 replace；搬完都要补一轮 repair（第 13 章）</text>
<text x="28" y="678" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">数据来源：tcm/sequences/BootstrapAndJoin.java:204-291 · tcm/transformations/PrepareJoin.java:52-85 · tcm/sequences/SingleNodeSequences.java:66-156 · streaming/StreamSession.java:246-251（apache/cassandra master，7.0-SNAPSHOT）</text>
</svg>
