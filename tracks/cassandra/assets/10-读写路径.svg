<text x="236" y="146" font-size="10" fill="#6B695F" text-anchor="start">sendToHintedReplicas:1827</text>
<text x="236" y="162" font-size="10" fill="#3B3A34" text-anchor="start">发全部 3 份；预序列化 :1853</text>
<path d="M390 139 L406 139" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#qA)"/>
<rect x="410" y="106" width="182" height="66" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="424" y="128" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">W3 副本本地落地</text>
<text x="424" y="146" font-size="10" fill="#6B695F" text-anchor="start">Keyspace.apply:437（第 2 章）</text>
<text x="424" y="162" font-size="10" fill="#639922" text-anchor="start" font-weight="600">先 CommitLog(:549) 后 Memtable(:579)</text>
<path d="M592 139 L608 139" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#qA)"/>
<rect x="612" y="106" width="158" height="66" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="626" y="128" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">W4 等确认</text>
<text x="626" y="146" font-size="10" fill="#6B695F" text-anchor="start">responseHandler.get():1006</text>
<text x="626" y="162" font-size="10" fill="#3B3A34" text-anchor="start">blockFor=2 倒数，归零放行</text>
<path d="M770 139 L786 139" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#qA)"/>
<rect x="790" y="106" width="164" height="66" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.2"/>
<text x="804" y="128" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">W5 失败善后</text>
<text x="804" y="146" font-size="10" fill="#6B695F" text-anchor="start">mutate:1009-1042</text>
<text x="804" y="162" font-size="10" fill="#3B3A34" text-anchor="start">CL=ANY 超时兜底写 hint</text>
<text x="44" y="192" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">「等 2 ≠ 只发 2」：无 transient 副本时写联系名单全量（ReplicaPlans.writeNormal :647-681）——第 3 份白赚，ack 迟到不等。</text>

<!-- ============ 集群泳道：两单叠加 ============ -->
<rect x="28" y="214" width="944" height="252" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.3"/>
<text x="44" y="236" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">同一行 id=47 的两条配送链（名单 {node2, node4, node5}；node4 于 14:00:00 卡死，第 5 章）</text>
<g>
<rect x="44" y="250" width="150" height="196" rx="10" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="119" y="274" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">node3（协调者）</text>
<text x="119" y="294" font-size="10" fill="#6B695F" text-anchor="middle">接 QUERY 帧（第 9 章）</text>
<text x="119" y="310" font-size="10" fill="#6B695F" text-anchor="middle">装箱（第 8 章）</text>
<text x="119" y="330" font-size="10.5" fill="#C46A0A" text-anchor="middle" font-weight="600">写：mutate :978</text>
<text x="119" y="348" font-size="10.5" fill="#2F6FA8" text-anchor="middle" font-weight="600">读：read :2176</text>
<text x="119" y="370" font-size="10" fill="#6B695F" text-anchor="middle">本地命中时</text>
<text x="119" y="386" font-size="10" fill="#6B695F" text-anchor="middle">performLocally:1996</text>
<text x="119" y="412" font-size="10" fill="#6B695F" text-anchor="middle">临时角色：</text>
<text x="119" y="428" font-size="10" fill="#6B695F" text-anchor="middle">对照 DBImpl 常驻单例</text>
</g>
<g>
<rect x="234" y="250" width="200" height="196" rx="10" fill="#ffffff" stroke="#639922" stroke-width="1.4"/>
<text x="334" y="274" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">node2（活）</text>
<text x="334" y="292" font-size="10" fill="#6B695F" text-anchor="middle">token +3.7×10^18｜snitch 评分第一</text>
<text x="334" y="318" font-size="10.5" fill="#C46A0A" text-anchor="middle" font-weight="600">写 ✓ 第 1 个 ack（CommitLog→Memtable）</text>
<text x="334" y="340" font-size="10.5" fill="#2F6FA8" text-anchor="middle" font-weight="600">读：data 请求 → 回完整行</text>
<text x="334" y="360" font-size="10" fill="#6B695F" text-anchor="middle">本地站 queryMemtableAndDisk:727</text>
<text x="334" y="376" font-size="10" fill="#6B695F" text-anchor="middle">（Memtable → SSTable 按 ts 归并）</text>
<text x="334" y="402" font-size="10.5" fill="#639922" text-anchor="middle" font-weight="600">W∩R：写确认 {node2,node4}</text>
<text x="334" y="420" font-size="10.5" fill="#639922" text-anchor="middle" font-weight="600">∩ 读 {node2,node5} = {node2} ≥ 1</text>
</g>
<g>
<rect x="474" y="250" width="200" height="196" rx="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.4"/>
<rect x="524" y="260" width="100" height="20" rx="5" fill="#E24B4A" opacity="0.9"/>
<text x="574" y="274" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="600">14:00 DOWN</text>
<text x="574" y="298" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">node4（卡死 40min）</text>
<text x="574" y="318" font-size="10.5" fill="#E24B4A" text-anchor="middle" font-weight="600">phi=8.0 @14:00:18~20 确认（第 5 章）</text>
<text x="574" y="344" font-size="10.5" fill="#C46A0A" text-anchor="middle" font-weight="600">写：expired(:1904) 不等它</text>
<text x="574" y="364" font-size="10.5" fill="#C46A0A" text-anchor="middle" font-weight="600">→ shouldHint ✓（40min &lt; 3h）</text>
<text x="574" y="384" font-size="10.5" fill="#C46A0A" text-anchor="middle" font-weight="600">→ hint 欠条垫付（不计 ack）</text>
<text x="574" y="406" font-size="10" fill="#6B695F" text-anchor="middle">回魂后 10s 一轮派发兑现（第 7 章）</text>
<text x="574" y="428" font-size="10.5" fill="#2F6FA8" text-anchor="middle" font-weight="600">读：候选池出局</text>
</g>
<g>
<rect x="714" y="250" width="240" height="196" rx="10" fill="#ffffff" stroke="#639922" stroke-width="1.4"/>
<text x="834" y="274" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">node5（活）</text>
<text x="834" y="292" font-size="10" fill="#6B695F" text-anchor="middle">token -22.1×10^18｜跨零点入选（第 6 章）</text>
<text x="834" y="318" font-size="10.5" fill="#C46A0A" text-anchor="middle" font-weight="600">写 ✓（第 3 份白赚，ack 迟到不等）</text>
<text x="834" y="344" font-size="10.5" fill="#2F6FA8" text-anchor="middle" font-weight="600">读：digest 请求 → 回 16B MD5 摘要</text>
<text x="834" y="366" font-size="10" fill="#6B695F" text-anchor="middle">node4 DOWN 后顶上第二票：</text>
<text x="834" y="382" font-size="10" fill="#6B695F" text-anchor="middle">活候选 2 个 = blockFor 2，刚好够</text>
<text x="834" y="406" font-size="10.5" fill="#639922" text-anchor="middle" font-weight="600">99p 推测想补发也无副本可补</text>
<text x="834" y="424" font-size="10" fill="#6B695F" text-anchor="middle">（getReadExecutor :216-222 退化 Never）</text>
</g>
