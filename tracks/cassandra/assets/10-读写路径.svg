<text x="58" y="128" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">W1 接单分装</text>
<text x="58" y="146" font-size="10" fill="#6B695F" text-anchor="start">mutate:978 → performWrite:1732</text>
<text x="58" y="162" font-size="10" fill="#3B3A34" text-anchor="start">算名单（:1744）+ 配处理器（:1752）</text>
<path d="M202 139 L218 139" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#qA)"/>
<rect x="222" y="106" width="168" height="66" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
