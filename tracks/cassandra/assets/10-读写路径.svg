<text x="614" y="550" font-size="10" fill="#6B695F" text-anchor="start">executeAsync:181-191</text>
<text x="614" y="566" font-size="10" fill="#3B3A34" text-anchor="start">1 data + 其余 digest（R−1 份）</text>
<path d="M770 543 L786 543" fill="none" stroke="#2F6FA8" stroke-width="1.6" marker-end="url(#qB)"/>
<rect x="790" y="510" width="164" height="66" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="804" y="532" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">R5 一致或修复</text>
<text x="804" y="550" font-size="10" fill="#6B695F" text-anchor="start">DigestResolver:105 对账</text>
<text x="804" y="566" font-size="10" fill="#639922" text-anchor="start" font-weight="600">不一致 → BLOCKING 修完才返回</text>
<text x="44" y="596" font-size="10.5" fill="#6B695F" text-anchor="start" font-weight="400">读修复：DataResolver:63 按 ts 拼版（1005 胜 1001）→ BlockingReadRepair:75-79 补写落后副本（默认 BLOCKING，TableParams:460）；等待闹钟 ReadCallback:218-219。</text>

<!-- ============ 超时与异常分支 ============ -->
<rect x="28" y="618" width="944" height="34" rx="8" fill="#ffffff" stroke="#D3D1C7" stroke-width="1.2"/>
<text x="44" y="640" font-size="10.5" fill="#3B3A34" text-anchor="start" font-weight="600">异常三态：Unavailable 事前拒（活副本&lt;blockFor，ReplicaPlans:143）｜WriteTimeout 事中等（yaml 10s / 代码默认 2s）｜ReadTimeout（5s）——写可安全重试：同 ts 重放无害（LWW）。</text>

<!-- ============ 底部总结 ============ -->
<rect x="28" y="660" width="944" height="36" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="44" y="676" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">一张图的一句话：本地站就是第 2~4 章那套引擎，外面包一层「发、等、拼」——写发 3 等 2、死副本欠条垫付；读凑 2 份对账、不一致修完才回。RocksDB 的 DBImpl 单例前没有这层物流。</text>
<text x="44" y="692" font-size="11" fill="#6B695F" text-anchor="start">数据来源：service/StorageProxy.java:978、1827、2176（两条流水线入口与分发）· db/Keyspace.java:437（先 CommitLog 后 Memtable）· locator/ReplicaPlans.java:891（contacts=blockFor）· conf/cassandra.yaml:1396（写超时 10s）</text>
</svg>
