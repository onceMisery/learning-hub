<rect x="0" y="0" width="1000" height="710" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">读写路径：Coordinator 的两条流水线</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">写单：UPDATE id=47（ts=1005，发 3 等 2）；读单：node4 DOWN 后的 SELECT id=47（1 data + 1 digest，QUORUM=2 刚好够）——keyspace demo，RF=3</text>
<text x="976" y="26" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">橙色：写路径 / ack</text>
<text x="976" y="42" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">蓝色：读路径 / 对账</text>
<text x="976" y="58" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">红色：DOWN / 异常</text>

<!-- ============ 写流水线五站 ============ -->
