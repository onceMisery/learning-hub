<!-- ============ 读流水线五站 ============ -->
<rect x="28" y="476" width="944" height="132" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.3"/>
<text x="44" y="498" font-size="13" fill="#2F6FA8" text-anchor="start" font-weight="600">读流水线（StorageProxy.read :2176 起）——只联系 blockFor 个活副本，1 data + 其余 digest</text>
<rect x="44" y="510" width="158" height="66" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="58" y="532" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">R1 接单</text>
<text x="58" y="550" font-size="10" fill="#6B695F" text-anchor="start">read:2176 → fetchRows:2652</text>
<text x="58" y="566" font-size="10" fill="#3B3A34" text-anchor="start">每条 ReadCommand 一执行器</text>
<path d="M202 543 L218 543" fill="none" stroke="#2F6FA8" stroke-width="1.6" marker-end="url(#qB)"/>
<rect x="222" y="510" width="168" height="66" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="236" y="532" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">R2 选执行器</text>
<text x="236" y="550" font-size="10" fill="#6B695F" text-anchor="start">getReadExecutor:196</text>
<text x="236" y="566" font-size="10" fill="#3B3A34" text-anchor="start">speculative_retry 默认 99p</text>
<path d="M390 543 L406 543" fill="none" stroke="#2F6FA8" stroke-width="1.6" marker-end="url(#qB)"/>
<rect x="410" y="510" width="170" height="66" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
