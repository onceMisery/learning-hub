<text x="424" y="550" font-size="10" fill="#6B695F" text-anchor="start">ReplicaPlans.forRead:891</text>
<text x="424" y="566" font-size="10" fill="#3B3A34" text-anchor="start">contacts = 前 blockFor 个活候选</text>
<path d="M580 543 L596 543" fill="none" stroke="#2F6FA8" stroke-width="1.6" marker-end="url(#qB)"/>
<rect x="600" y="510" width="170" height="66" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
