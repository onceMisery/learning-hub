<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="gA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="gG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="gB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="gR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">Cassandra Gossip 与故障检测：八卦网怎么知道谁挂了</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">跟随 node4 卡死：每秒一拍三轮八卦 → 间隔样本攒账 → phi 过线 8 → 四个节点各自判 DOWN</text>
<text x="976" y="26" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">橙色：gossip 消息流</text>
<text x="976" y="42" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">绿色：并账 / 状态趋同</text>
<text x="976" y="58" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">蓝色：phi 统计 / 判决</text>
<text x="976" y="74" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">红色：node4 停跳 / DOWN</text>

<!-- ============ 第一条：三轮握手 ============ -->
<rect x="28" y="88" width="944" height="182" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.3"/>
<text x="44" y="110" font-size="13" fill="#C46A0A" text-anchor="start" font-weight="600">一拍八卦 = 三条消息两个来回：SYN → ACK → ACK2（每 1000ms 一拍，Gossiper.java:157）</text>

<rect x="44" y="124" width="200" height="70" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="144" y="146" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">① SYN：摘要清单</text>
<text x="144" y="164" font-size="10.5" fill="#3B3A34" text-anchor="middle">每人一条 (endpoint, gen, ver)</text>
<text x="144" y="180" font-size="10.5" fill="#6B695F" text-anchor="middle">GossipDigestSyn.java:36-43</text>

<path d="M244 159 L264 159" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#gA)"/>

<rect x="268" y="124" width="210" height="70" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="373" y="146" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">② 对账：比版本号</text>
<text x="373" y="164" font-size="10.5" fill="#3B3A34" text-anchor="middle">examineGossiper 出两份差集</text>
<text x="373" y="180" font-size="10.5" fill="#6B695F" text-anchor="middle">Gossiper.java:1702</text>

<path d="M478 159 L498 159" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#gA)"/>

<rect x="502" y="124" width="210" height="70" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="607" y="146" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">③ ACK：差异 + 回礼</text>
<text x="607" y="164" font-size="10.5" fill="#3B3A34" text-anchor="middle">要什么 + 送我更新的</text>
<text x="607" y="180" font-size="10.5" fill="#6B695F" text-anchor="middle">GossipDigestAck.java:41-42</text>

<path d="M712 159 L732 159" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#gA)"/>

<rect x="736" y="124" width="220" height="70" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="846" y="146" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">④ ACK2：回礼的回礼</text>
<text x="846" y="164" font-size="10.5" fill="#3B3A34" text-anchor="middle">两人持有知识的并集</text>
<text x="846" y="180" font-size="10.5" fill="#6B695F" text-anchor="middle">AckVerbHandler.java:74-88</text>

<text x="44" y="216" font-size="10.5" fill="#3B3A34" text-anchor="start">举例：node1 发给 node3 的 SYN：{node1:gen=G1,ver=9307  node2:G1/4121  node3:G2/774  node4:G0/8900  node5:G1/5120} —— 只带版本号不带内容，稳定时每轮传输趋近于零</text>
<text x="44" y="236" font-size="10.5" fill="#3B3A34" text-anchor="start">收到 ACK 先喂故障检测器（AckVerbHandler.java:74，一次往来 = 一次心跳采样），再并账（:75）——第五栏的 phi 样本就是这么攒出来的</text>
<text x="44" y="256" font-size="10.5" fill="#6B695F" text-anchor="start">每拍只发 1 个随机节点（sendGossip，Gossiper.java:848-869）；顺手按概率探一个不可达节点（:888-895）、补一个 seed（:906）。</text>

<!-- ============ 第二条：名片两行字 ============ -->
<rect x="28" y="284" width="944" height="128" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.3"/>
<text x="44" y="306" font-size="13" fill="#639922" text-anchor="start" font-weight="600">一张名片两行字：generation 认「重启」，version 挡「乱序」（EndpointState）</text>

<rect x="44" y="320" width="430" height="76" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="259" y="342" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">心跳栏 HeartBeatState（HeartBeatState.java:36-37）</text>
<text x="259" y="362" font-size="10.5" fill="#3B3A34" text-anchor="middle">generation = 启动代次（取系统时钟，重启换新代）</text>
<text x="259" y="380" font-size="10.5" fill="#3B3A34" text-anchor="middle">version = 名片版本号，每拍 +1（updateHeartBeat :75-78）</text>

<rect x="526" y="320" width="430" height="76" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="741" y="342" font-size="12.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">状态栏 ApplicationState（ApplicationState.java:28）</text>
<text x="741" y="362" font-size="10.5" fill="#3B3A34" text-anchor="middle">LOAD 负载 / RPC_READY 就绪 / STATUS_WITH_PORT 生灭自报</text>
<text x="741" y="380" font-size="10.5" fill="#6B695F" text-anchor="middle">TOKENS/SCHEMA/DC/RACK 已划给 ClusterMetadata（CEP-21，:34-47）</text>

<path d="M474 358 L526 358" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#gG)"/>
<text x="500" y="350" font-size="10" fill="#6B695F" text-anchor="middle">合一张名片</text>

<text x="44" y="406" font-size="10.5" fill="#3B3A34" text-anchor="start">并账裁判：先 generation 后 version（applyStateLocally，Gossiper.java:1473）——代次不同整卡替换并清空 phi 样本（:1185-1194）；代次相同才逐项比 version，小的让大的。</text>

<!-- ============ 第三条：phi 时间线 ============ -->
<rect x="28" y="426" width="944" height="196" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.3"/>
<text x="44" y="448" font-size="13" fill="#E24B4A" text-anchor="start" font-weight="600">node4 卡死之后：phi 是统计分不是超时（FailureDetector.java:591-597，判决 :402）</text>

<line x1="80" y1="560" x2="920" y2="560" fill="none" stroke="#3B3A34" stroke-width="1.2"/>
<line x1="80" y1="560" x2="80" y2="472" fill="none" stroke="#3B3A34" stroke-width="1.2"/>
<text x="72" y="476" font-size="10.5" fill="#6B695F" text-anchor="start">phi</text>
<text x="916" y="576" font-size="10.5" fill="#6B695F" text-anchor="end">沉默时长（node4 心跳间隔均值 = 1.0s）</text>

<line x1="80" y1="494" x2="920" y2="494" fill="none" stroke="#2F6FA8" stroke-width="1" stroke-dasharray="6 4"/>
<text x="912" y="490" font-size="10.5" fill="#2F6FA8" text-anchor="end" font-weight="600">阈值 8（Config.java:250）</text>

<path d="M80 559 C 180 558, 300 550, 420 522 C 520 500, 600 494, 660 494 C 760 494, 850 480, 920 466" fill="none" stroke="#E24B4A" stroke-width="2"/>
<circle cx="80" cy="559" r="3.5" fill="#E24B4A"/>
<circle cx="240" cy="554" r="3.5" fill="#E24B4A"/>
<circle cx="420" cy="522" r="3.5" fill="#E24B4A"/>
<circle cx="660" cy="494" r="4.5" fill="#E24B4A"/>
<circle cx="920" cy="466" r="3.5" fill="#E24B4A"/>

<text x="240" y="540" font-size="10.5" fill="#3B3A34" text-anchor="middle">沉默 1s → phi≈0.43</text>
<text x="430" y="508" font-size="10.5" fill="#3B3A34" text-anchor="middle">沉默 10s → phi≈4.3 起疑</text>
<text x="668" y="482" font-size="10.5" fill="#E24B4A" text-anchor="middle" font-weight="600">沉默 18.4s → phi≈8.0 触线</text>
<text x="906" y="456" font-size="10.5" fill="#3B3A34" text-anchor="end">30s → phi≈13.0</text>

<text x="150" y="590" font-size="10.5" fill="#6B695F" text-anchor="middle">14:00:00 node4 停跳</text>
<text x="660" y="590" font-size="10.5" fill="#E24B4A" text-anchor="middle" font-weight="600">14:00:18 四节点各自判 DOWN</text>
<text x="912" y="590" font-size="10.5" fill="#6B695F" text-anchor="end">id=47 读写改走 node2/node5，QUORUM(2) 仍凑得齐</text>
<text x="44" y="612" font-size="10.5" fill="#3B3A34" text-anchor="start">phi = 0.434 × 沉默时长 / 间隔均值（PHI_FACTOR=1/ln10，FailureDetector.java:105）：心跳越飘越宽容——均值 5s 的节点要沉默约 92s 才判挂；样本库 1000 条（:79），冷启动兜底 2000ms（:116-124）。</text>

<!-- ============ 底部总结 ============ -->
<rect x="28" y="636" width="944" height="52" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="44" y="658" font-size="12" fill="#1F1E1A" text-anchor="start" font-weight="600">一张图的一句话：状态靠三轮八卦只传差异、全网 log N 轮趋同；生死靠各自统计——phi 过线 8 各自标 DOWN，结论天然趋同；计划内离场另走 GossipShutdown 即时标记（Gossiper.java:594-617）。</text>
<text x="44" y="678" font-size="11" fill="#6B695F" text-anchor="start">数据来源：gms/Gossiper.java:157（每拍 1000ms）· gms/FailureDetector.java:591-597、402（phi 公式与判决）· config/Config.java:250（阈值默认 8）</text>
</svg>
