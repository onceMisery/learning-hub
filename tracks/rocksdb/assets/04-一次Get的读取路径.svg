<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="getO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="getG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="getB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="getR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">一次 Get 的读取路径：从新到旧，一层一层问</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">内存里的账本先答，磁盘逐层裁剪；第一份可见的答案就是最终答案</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end">橙：查找 / 数据流</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end">蓝：磁盘结构 / 索引</text>
<text x="960" y="60" font-size="11" fill="#6B695F" text-anchor="end">绿：命中返回 / 免读</text>

<rect x="40" y="84" width="300" height="54" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="56" y="105" font-size="13" fill="#1F1E1A" font-weight="600">① 拿 SuperVersion</text>
<text x="56" y="124" font-size="11" fill="#6B695F">钉住 memtable + immutable + Version 这套视图</text>
<path d="M190 138 L190 158" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#getO)"/>

<rect x="40" y="160" width="300" height="54" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="56" y="181" font-size="13" fill="#1F1E1A" font-weight="600">② 定快照 seq，拼 LookupKey</text>
<text x="56" y="200" font-size="11" fill="#6B695F">user_key + 快照 seq + seek 类型，比一切版本都大一号</text>
<path d="M190 214 L190 234" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#getO)"/>

<rect x="40" y="236" width="300" height="64" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="56" y="257" font-size="13" fill="#1F1E1A" font-weight="600">③ 问 mutable memtable</text>
<text x="56" y="276" font-size="11" fill="#6B695F">内置布隆先行，不在就免查跳表</text>
<text x="56" y="293" font-size="11" fill="#639922" font-weight="600">命中即返回（MEMTABLE_HIT）</text>
<path d="M190 300 L190 320" fill="none" stroke="#E24B4A" stroke-width="1.6" marker-end="url(#getR)"/>
<text x="202" y="316" font-size="10.5" fill="#E24B4A">未命中</text>

<rect x="40" y="322" width="300" height="64" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="56" y="343" font-size="13" fill="#1F1E1A" font-weight="600">④ 问 immutable 队列</text>
<text x="56" y="362" font-size="11" fill="#6B695F">push_front 排列，新的在前</text>
<text x="56" y="379" font-size="11" fill="#6B695F">从新到旧逐个问，仍然命中即停</text>
<path d="M342 354 C 390 354 400 160 428 148" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#getO)"/>
<text x="384" y="238" font-size="10.5" fill="#C46A0A">未命中 → 问磁盘</text>

<rect x="430" y="84" width="540" height="470" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="446" y="108" font-size="13" fill="#1F1E1A" font-weight="600">磁盘侧：Version::Get，逐层问过去</text>

<rect x="446" y="126" width="508" height="56" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="462" y="147" font-size="13" fill="#1F1E1A" font-weight="600">L0：文件间可能重叠 → 逐个问</text>
<text x="462" y="167" font-size="11" fill="#6B695F">积压到默认 4 个（level0_file_num_compaction_trigger）触发压实</text>
<path d="M700 182 L700 202" fill="none" stroke="#2F6FA8" stroke-width="1.6" marker-end="url(#getB)"/>
<text x="712" y="198" font-size="10.5" fill="#6B695F">层与层：新 → 旧</text>

<rect x="446" y="206" width="508" height="56" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="462" y="227" font-size="13" fill="#1F1E1A" font-weight="600">L1+：层内有序不重叠 → 二分定位候选文件</text>
<text x="462" y="247" font-size="11" fill="#6B695F">先比文件 smallest/largest 键范围，FileIndexer 再收窄下一层区间</text>
<path d="M700 262 L700 282" fill="none" stroke="#2F6FA8" stroke-width="1.6" marker-end="url(#getB)"/>

<rect x="446" y="286" width="508" height="110" rx="8" fill="#ffffff" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="462" y="306" font-size="12" fill="#1F1E1A" font-weight="600">选中一个文件后的四段漏斗</text>
<rect x="458" y="318" width="110" height="52" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
<text x="513" y="339" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">布隆</text>
<text x="513" y="357" font-size="10" fill="#639922" text-anchor="middle">不在 → 整文件免读</text>
<path d="M568 344 L582 344" fill="none" stroke="#2F6FA8" stroke-width="1.4" marker-end="url(#getB)"/>
<rect x="584" y="318" width="110" height="52" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1"/>
<text x="639" y="339" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">index</text>
<text x="639" y="357" font-size="10" fill="#6B695F" text-anchor="middle">Seek 定位数据块</text>
<path d="M694 344 L708 344" fill="none" stroke="#2F6FA8" stroke-width="1.4" marker-end="url(#getB)"/>
<rect x="710" y="318" width="110" height="52" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1"/>
<text x="765" y="339" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">块</text>
<text x="765" y="357" font-size="10" fill="#6B695F" text-anchor="middle">块缓存优先</text>
<path d="M820 344 L834 344" fill="none" stroke="#C46A0A" stroke-width="1.4" marker-end="url(#getO)"/>
<rect x="836" y="318" width="110" height="52" rx="6" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1"/>
<text x="891" y="339" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">行</text>
<text x="891" y="357" font-size="10" fill="#6B695F" text-anchor="middle">块内查找比对</text>

<rect x="446" y="410" width="508" height="56" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="462" y="431" font-size="13" fill="#1F1E1A" font-weight="600">GetContext::SaveValue 最终裁决</text>
<text x="462" y="451" font-size="11" fill="#6B695F">键相等？快照可见？→ 值返回 / 墓碑判删并停 / Merge 攒操作数继续翻</text>
<path d="M430 500 C 398 500 362 474 344 448" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#getG)"/>
<text x="382" y="490" font-size="10.5" fill="#639922">命中 → 返回</text>

<line x1="446" y1="484" x2="954" y2="484" stroke="#D3D1C7" stroke-width="1"/>
<text x="446" y="506" font-size="11" fill="#C46A0A" font-weight="600">命中即停的底气：seq 全局单调 + 层间新旧不变式（上游永远比下游新）。</text>
<text x="446" y="526" font-size="11" fill="#6B695F">命中层统计 GET_HIT_L0 / GET_HIT_L1 / GET_HIT_L2_AND_UP——层越深，这次读越贵。</text>

<rect x="40" y="410" width="300" height="56" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="56" y="431" font-size="13" fill="#1F1E1A" font-weight="600">⑤ 返回：值 / NotFound / Deleted</text>
<text x="56" y="451" font-size="11" fill="#6B695F">从不翻旧账：第一份可见答案即答案</text>

<rect x="40" y="578" width="920" height="56" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="56" y="600" font-size="11.5" fill="#1F1E1A" font-weight="600">读放大账单：L0 有 4 个文件 + L1~L3 各 1 个候选 ≈ 至少 7 次布隆判断；全 miss 的冷点查最坏 7×（索引 + 块）次访问。</text>
<text x="56" y="620" font-size="11.5" fill="#6B695F">墓碑只有压实才清：删掉 8000 万行后旧层文件仍在原地——删完数据点查反而变慢，读路径找到的「债主」在压实那一侧。</text>
</svg>
