<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="sstB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="sstO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="sstG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="690" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">SST 文件布局：数据块在前，目录在后，footer 固定 53 字节</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">一次 flush 写出的 000005.sst——单遍写决定了目录只能放尾部，读取从最后 53 字节开始倒着进</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end">蓝：块（数据 / 元数据）</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end">绿：目录 / 校验</text>
<text x="960" y="60" font-size="11" fill="#6B695F" text-anchor="end">橙：BlockHandle 指向</text>

<rect x="40" y="84" width="280" height="540" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="56" y="106" font-size="13" fill="#1F1E1A" font-weight="600">000005.sst 字节地图（低 → 高）</text>

<rect x="60" y="122" width="240" height="46" rx="6" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="76" y="141" font-size="12" fill="#1F1E1A" font-weight="600">data block 0</text>
<text x="76" y="159" font-size="10.5" fill="#6B695F">键值对，每块尾部 5 字节 trailer</text>
<rect x="60" y="174" width="240" height="46" rx="6" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="76" y="193" font-size="12" fill="#1F1E1A" font-weight="600">data block 1 … N</text>
<text x="76" y="211" font-size="10.5" fill="#6B695F">默认凑满 4 KB 才切一块</text>
<rect x="60" y="226" width="240" height="42" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="76" y="244" font-size="12" fill="#1F1E1A" font-weight="600">meta: filter block（布隆）</text>
<text x="76" y="260" font-size="10.5" fill="#6B695F">挡点查：键不在 → 整文件免翻</text>
<rect x="60" y="274" width="240" height="42" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="76" y="292" font-size="12" fill="#1F1E1A" font-weight="600">meta: index block</text>
<text x="76" y="308" font-size="10.5" fill="#6B695F">分隔键 → 数据块 BlockHandle</text>
<rect x="60" y="322" width="240" height="42" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="76" y="340" font-size="12" fill="#1F1E1A" font-weight="600">meta: properties block</text>
<text x="76" y="356" font-size="10.5" fill="#6B695F">rocksdb.properties：统计与身份</text>
<rect x="60" y="370" width="240" height="42" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="76" y="388" font-size="12" fill="#1F1E1A" font-weight="600">metaindex block</text>
<text x="76" y="404" font-size="10.5" fill="#6B695F">块名 → BlockHandle 的小字典</text>
<rect x="60" y="418" width="240" height="58" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.6"/>
<text x="76" y="438" font-size="12" fill="#1F1E1A" font-weight="600">footer：固定 53 字节</text>
<text x="76" y="455" font-size="10.5" fill="#639922" font-weight="600">53 = 1 + 40 + 12</text>
<text x="76" y="470" font-size="10.5" fill="#6B695F">唯一有固定位置的东西</text>
<text x="56" y="500" font-size="10.5" fill="#6B695F">写入顺序 = Finish() 的落盘顺序：</text>
<text x="56" y="517" font-size="10.5" fill="#6B695F">filter → index → 字典 → 范围删除</text>
<text x="56" y="534" font-size="10.5" fill="#6B695F">→ properties → metaindex → footer</text>
<text x="56" y="556" font-size="10.5" fill="#C46A0A" font-weight="600">读的顺序完全相反：footer 先进屋。</text>
<text x="56" y="573" font-size="10.5" fill="#6B695F">偏移从 0 起算：数据块区间 [0, tail_start_offset)</text>

<rect x="360" y="84" width="600" height="330" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="376" y="106" font-size="13" fill="#1F1E1A" font-weight="600">footer 的 53 字节逐字段拆解（format_version ≥ 6）</text>

<rect x="376" y="120" width="568" height="34" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
<text x="388" y="141" font-size="11" fill="#1F1E1A" font-weight="600">Part 1（1 字节）</text>
<text x="520" y="141" font-size="11" fill="#6B695F">checksum 类型：0=无 1=CRC32C 2=xxHash 3=xxHash64 4=XXH3（默认）</text>

<text x="376" y="174" font-size="11" fill="#6B695F" font-weight="600">Part 2（40 字节）</text>
<rect x="376" y="180" width="96" height="30" rx="4" fill="#ffffff" stroke="#D3D1C7" stroke-width="1"/>
<text x="424" y="199" font-size="10.5" fill="#1F1E1A" text-anchor="middle">扩展魔数 4B</text>
<rect x="474" y="180" width="96" height="30" rx="4" fill="#ffffff" stroke="#D3D1C7" stroke-width="1"/>
<text x="522" y="199" font-size="10.5" fill="#1F1E1A" text-anchor="middle">footer 校验 4B</text>
<rect x="572" y="180" width="96" height="30" rx="4" fill="#ffffff" stroke="#D3D1C7" stroke-width="1"/>
<text x="620" y="199" font-size="10.5" fill="#1F1E1A" text-anchor="middle">上下文校验 4B</text>
<rect x="670" y="180" width="96" height="30" rx="4" fill="#ffffff" stroke="#D3D1C7" stroke-width="1"/>
<text x="718" y="199" font-size="10.5" fill="#1F1E1A" text-anchor="middle">metaindex 大小 4B</text>
<rect x="768" y="180" width="80" height="30" rx="4" fill="#ffffff" stroke="#D3D1C7" stroke-width="1"/>
<text x="808" y="199" font-size="10.5" fill="#1F1E1A" text-anchor="middle">保留 16B</text>
<rect x="850" y="180" width="94" height="30" rx="4" fill="#ffffff" stroke="#D3D1C7" stroke-width="1"/>
<text x="897" y="199" font-size="10.5" fill="#1F1E1A" text-anchor="middle">特性位 8B</text>
<text x="376" y="228" font-size="10.5" fill="#6B695F">扩展魔数固定 3E 00 7A 00，用来挡「format_version 字节坏了还继续解析」；</text>
<text x="376" y="245" font-size="10.5" fill="#6B695F">footer 自身也过一遍校验和（把校验字段清零算，偏移 5）；metaindex 大小 4 字节</text>
<text x="376" y="262" font-size="10.5" fill="#6B695F">在 format_version ≥ 8 里高 16 位挪给「metaindex 与 footer 之间的间隙」。</text>

<text x="376" y="292" font-size="11" fill="#6B695F" font-weight="600">Part 3（12 字节）</text>
<rect x="376" y="298" width="130" height="30" rx="4" fill="#ffffff" stroke="#D3D1C7" stroke-width="1"/>
<text x="441" y="317" font-size="10.5" fill="#1F1E1A" text-anchor="middle">format_version 4B</text>
<rect x="508" y="298" width="200" height="30" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
<text x="608" y="317" font-size="10.5" fill="#1F1E1A" text-anchor="middle">magic 8B：0x88e241b785f4cff7</text>
<text x="376" y="346" font-size="10.5" fill="#6B695F">解析：读最后 53 字节 → 从最末 8 字节找 magic 验明正身 → 回头读 format_version →</text>
<text x="376" y="363" font-size="10.5" fill="#6B695F">校 footer 自身 → 从 Part 2 拿到 metaindex 块的位置（Part 2 尾部 40 字节对齐，</text>
<text x="376" y="380" font-size="10.5" fill="#6B695F">format_version ≥ 6 时 index 的 BlockHandle 挪进了 metaindex，footer 里不再放）。</text>

<rect x="360" y="432" width="600" height="192" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="376" y="454" font-size="13" fill="#1F1E1A" font-weight="600">BlockHandle：varint64 的 offset + size，一条指针俩数</text>
<rect x="376" y="468" width="568" height="56" rx="6" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="392" y="489" font-size="11.5" fill="#1F1E1A" font-weight="600">举例：数据块在 offset=1000、size=4096</text>
<text x="392" y="510" font-size="11" fill="#6B695F">1000 → E8 07（2 字节）　4096 → 80 20（2 字节）　整条 BlockHandle 只要 4 字节，上限 20</text>
<text x="376" y="546" font-size="10.5" fill="#6B695F">footer 只肯带 metaindex 一个句柄，其余都由 metaindex 转手；</text>
<text x="376" y="563" font-size="10.5" fill="#6B695F">index block 再把「分隔键 → 数据块 BlockHandle」一一列出来。</text>
<path d="M304 440 C 332 440 336 480 372 490" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#sstO)"/>
<text x="308" y="468" font-size="10.5" fill="#C46A0A">读尾先得它</text>
<path d="M304 391 L 372 384" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#sstO)"/>
<text x="308" y="375" font-size="10.5" fill="#C46A0A">按名取句柄</text>
<text x="376" y="400" font-size="10.5" fill="#2F6FA8" font-weight="600">index 里的每个 BlockHandle 都指向一个 data block（橙）</text>

<rect x="40" y="632" width="920" height="40" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="56" y="649" font-size="11.5" fill="#1F1E1A" font-weight="600">为什么目录必须在尾巴：SST 是单遍写的不可变文件，最后一块写完之前没人知道各块的确切偏移和大小。</text>
<text x="56" y="666" font-size="11.5" fill="#6B695F">同一个文件只在 footer 写完后才算「建成」——崩在半路的部分永远读不出来，只能整文件作废。</text>
</svg>
