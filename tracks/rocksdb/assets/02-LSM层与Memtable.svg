<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="lsmO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="lsmG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="lsmB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">LSM 分层全景：mutable → immutable → flush 落盘</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">随机写先攒进内存账本，写满换页；磁盘侧是一摞从新到旧、只读不改的层</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end">橙：写入路径</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end">蓝：内存结构 / 压实</text>
<text x="960" y="60" font-size="11" fill="#6B695F" text-anchor="end">绿：flush / 落盘</text>

<rect x="40" y="84" width="330" height="54" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="54" y="106" font-size="13" fill="#1F1E1A" font-weight="600">① 写入请求（WriteBatch）</text>
<text x="54" y="126" font-size="11" fill="#6B695F">分配单调递增的 seq，按到达顺序排队</text>
<path d="M205 138 L205 166" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#lsmO)"/>

<rect x="40" y="170" width="330" height="96" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="54" y="192" font-size="13" fill="#1F1E1A" font-weight="600">② Mutable Memtable（可变有序账本）</text>
<text x="54" y="212" font-size="11" fill="#6B695F">跳表：最高 12 层 / 每 4 个节点晋升 1 层，写只追加</text>
<text x="54" y="230" font-size="11" fill="#6B695F">Arena：整块供应内存，默认块大小 4 KB 起步</text>
<text x="54" y="250" font-size="11" fill="#C46A0A" font-weight="600">write_buffer_size 默认 64 MB</text>
<path d="M205 266 L205 294" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#lsmO)"/>
<text x="217" y="286" font-size="11" fill="#6B695F">每次插入顺手判满</text>

<rect x="40" y="298" width="330" height="64" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="54" y="320" font-size="13" fill="#1F1E1A" font-weight="600">③ ShouldFlushNow 三档判满</text>
<text x="54" y="340" font-size="11" fill="#6B695F">还放得下一个块？明显超了 0.6×块？最后一块用了 3/4？</text>
<path d="M205 362 L205 390" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#lsmO)"/>
<text x="217" y="382" font-size="11" fill="#6B695F">mutable 转 immutable，新本子上岗</text>

<rect x="40" y="394" width="330" height="88" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="54" y="416" font-size="13" fill="#1F1E1A" font-weight="600">④ Immutable 队列（只读不改）</text>
<rect x="54" y="428" width="150" height="22" rx="5" fill="#ffffff" stroke="#2F6FA8" stroke-width="1"/>
<text x="129" y="443" font-size="11" fill="#1F1E1A" text-anchor="middle">新 immutable</text>
<rect x="54" y="454" width="150" height="22" rx="5" fill="#ffffff" stroke="#2F6FA8" stroke-width="1"/>
<text x="129" y="469" font-size="11" fill="#1F1E1A" text-anchor="middle">更旧的 immutable</text>
<text x="216" y="443" font-size="11" fill="#6B695F">push_front：新的排队头</text>
<text x="216" y="461" font-size="11" fill="#6B695F">读时从新到旧逐个问</text>
<text x="216" y="479" font-size="11" fill="#6B695F">immutable 积压上限 2 个（max_write_buffer_number）</text>
<path d="M205 482 L205 508" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#lsmG)"/>

<rect x="40" y="512" width="330" height="42" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="205" y="538" font-size="13" fill="#1F1E1A" text-anchor="middle" font-weight="600">flush：整册写成 L0 SST（大块顺序写）</text>

<rect x="430" y="84" width="540" height="470" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="446" y="110" font-size="13" fill="#1F1E1A" font-weight="600">磁盘侧：一摞只读的 SST（L0 → Ln）</text>

<rect x="460" y="130" width="490" height="64" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="476" y="152" font-size="13" fill="#1F1E1A" font-weight="600">L0：flush 的直接产出</text>
<text x="476" y="172" font-size="11" fill="#6B695F">文件之间可能互相重叠，读要逐个问；默认攒 4 个触发一次压实</text>
<path d="M705 194 L705 222" fill="none" stroke="#2F6FA8" stroke-width="1.6" marker-end="url(#lsmB)"/>
<text x="717" y="214" font-size="11" fill="#6B695F">压实：多文件合一</text>

<rect x="460" y="226" width="490" height="64" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="476" y="248" font-size="13" fill="#1F1E1A" font-weight="600">L1：层内按键范围切分、互不重叠</text>
<text x="476" y="268" font-size="11" fill="#6B695F">压实把同一个 key 的多个版本合并成一条， tombstone 在这里才真正清掉</text>
<path d="M705 290 L705 318" fill="none" stroke="#2F6FA8" stroke-width="1.6" marker-end="url(#lsmB)"/>

<rect x="460" y="322" width="490" height="64" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="476" y="344" font-size="13" fill="#1F1E1A" font-weight="600">L2：容量约为上一层的 10 倍</text>
<text x="476" y="364" font-size="11" fill="#6B695F">数据越往下越冷、越旧；一次压实读写的数据量也越大</text>
<path d="M705 386 L705 414" fill="none" stroke="#2F6FA8" stroke-width="1.6" marker-end="url(#lsmB)"/>

<rect x="460" y="418" width="490" height="56" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="476" y="440" font-size="13" fill="#1F1E1A" font-weight="600">L3 / L4 …：最大最冷</text>
<text x="476" y="460" font-size="11" fill="#6B695F">点查到这里还没命中，就要按层二分找文件——读放大主要来自这里</text>

<line x1="476" y1="492" x2="934" y2="492" stroke="#D3D1C7" stroke-width="1"/>
<text x="476" y="514" font-size="11" fill="#C46A0A" font-weight="600">读永远从新到旧：mutable → immutable → L0 → L1 → …</text>
<text x="476" y="534" font-size="11" fill="#6B695F">内部键示例：device_47 + 01 07 00 00 00 00 00 00（seq=7 的 Put）</text>

<path d="M372 533 C 428 533 442 210 456 168" fill="none" stroke="#639922" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#lsmG)"/>

<rect x="40" y="578" width="920" height="40" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="56" y="603" font-size="11.5" fill="#1F1E1A">排序规则：内部键 = user_key + (seq&lt;&lt;8 | type)，user_key 升序、seq 降序——同一个键，新版本永远排在旧版本前面。</text>
</svg>
