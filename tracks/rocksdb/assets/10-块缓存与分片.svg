<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="b10a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="b10b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="b10r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="b10g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">块缓存：128 位键 → hash 分片 → 每片三池 LRU</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">键 = SST 唯一 ID + 块偏移；分片数按 512KB/片估算、上限 64；引用计数护住使用中的块，驱逐只扫 LRU 链</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">橙色：请求 / 数据流</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">蓝色：结构 / 组件</text>
<text x="960" y="60" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">红色：驱逐 / 失败</text>

<rect x="30" y="86" width="280" height="76" rx="10" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="46" y="110" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">① 读路径 Get：定位一个块</text>
<text x="46" y="130" font-size="11" fill="#1F1E1A" text-anchor="start">索引给出 BlockHandle（偏移+大小）</text>
<text x="46" y="148" font-size="11" fill="#1F1E1A" text-anchor="start">一次读一个块（默认 4KB）</text>
<rect x="350" y="86" width="300" height="76" rx="10" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="366" y="110" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">② 拼缓存键（128 位）</text>
<text x="366" y="130" font-size="11" fill="#1F1E1A" text-anchor="start">前 64 位：SST 唯一 ID 派生（基键）</text>
<text x="366" y="148" font-size="11" fill="#1F1E1A" text-anchor="start">后 64 位：基键 ^ (偏移 &gt;&gt; 2)</text>
<rect x="690" y="86" width="280" height="76" rx="10" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="706" y="110" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">③ 选分片</text>
<text x="706" y="130" font-size="11" fill="#1F1E1A" text-anchor="start">hash(键) 低 6 位 → 64 片之一</text>
<text x="706" y="148" font-size="11" fill="#1F1E1A" text-anchor="start">每片一套哈希表 + LRU + 一把锁</text>
<path d="M312 124 L348 124" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#b10a)"/>
<path d="M652 124 L688 124" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#b10a)"/>

<rect x="30" y="196" width="940" height="310" rx="10" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="500" y="220" font-size="13" fill="#1F1E1A" text-anchor="middle" font-weight="600">ShardedCache：2⁶ = 64 个分片（默认按 512KB/片估算分片数，总容量均分到每片）</text>
<rect x="48" y="234" width="92" height="38" rx="6" fill="#ffffff" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="94" y="258" font-size="11" fill="#1F1E1A" text-anchor="middle">片 0</text>
<rect x="148" y="234" width="92" height="38" rx="6" fill="#ffffff" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="194" y="258" font-size="11" fill="#1F1E1A" text-anchor="middle">片 1</text>
<rect x="248" y="234" width="92" height="38" rx="6" fill="#ffffff" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="294" y="258" font-size="11" fill="#1F1E1A" text-anchor="middle">片 2</text>
<rect x="348" y="234" width="92" height="38" rx="6" fill="#ffffff" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="394" y="258" font-size="11" fill="#1F1E1A" text-anchor="middle">片 3</text>
<rect x="448" y="234" width="92" height="38" rx="6" fill="#ffffff" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="494" y="258" font-size="11" fill="#1F1E1A" text-anchor="middle">片 4</text>
<rect x="548" y="234" width="92" height="38" rx="6" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.4"/>
<text x="594" y="258" font-size="11" fill="#C46A0A" text-anchor="middle" font-weight="600">片 5</text>
<rect x="648" y="234" width="92" height="38" rx="6" fill="#ffffff" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="694" y="258" font-size="11" fill="#1F1E1A" text-anchor="middle">片 6</text>
<rect x="748" y="234" width="92" height="38" rx="6" fill="#ffffff" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="794" y="258" font-size="11" fill="#1F1E1A" text-anchor="middle">片 7</text>
<text x="860" y="258" font-size="12" fill="#6B695F" text-anchor="start">…… 共 64 片</text>
<text x="500" y="292" font-size="11" fill="#6B695F" text-anchor="middle">例：8GB 缓存 → 64 片 × 128MB；键哈希低 6 位相同的块挤在同一片、共用一把锁</text>

<rect x="48" y="308" width="892" height="186" rx="8" fill="#ffffff" stroke="#2F6FA8" stroke-width="1.2"/>
<text x="64" y="330" font-size="12" fill="#2F6FA8" text-anchor="start" font-weight="600">片 5 内部：哈希表 + 一条三段 LRU 链</text>
<rect x="64" y="344" width="140" height="64" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/>
<text x="134" y="370" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">哈希表</text>
<text x="134" y="388" font-size="10.5" fill="#6B695F" text-anchor="middle">128 位键 → 条目</text>
<text x="230" y="358" font-size="10.5" fill="#6B695F" text-anchor="start">链头（最新）</text>
<rect x="230" y="364" width="290" height="52" rx="6" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.2"/>
<text x="375" y="384" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">高优先池（默认容量的 50%）</text>
<text x="375" y="402" font-size="10.5" fill="#6B695F" text-anchor="middle">index / filter 块 + 命中过的块</text>
<rect x="524" y="364" width="160" height="52" rx="6" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="604" y="384" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">低优先池</text>
<text x="604" y="402" font-size="10.5" fill="#6B695F" text-anchor="middle">默认比例 0，空</text>
<rect x="688" y="364" width="220" height="52" rx="6" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.2"/>
<text x="798" y="384" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">底池（链尾）</text>
<text x="798" y="402" font-size="10.5" fill="#6B695F" text-anchor="middle">没命中过的 data block</text>
<text x="908" y="358" font-size="10.5" fill="#6B695F" text-anchor="end">链尾（最旧）</text>
<rect x="230" y="428" width="420" height="48" rx="6" fill="#ffffff" stroke="#C46A0A" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="440" y="448" font-size="11" fill="#C46A0A" text-anchor="middle" font-weight="600">正在被 Get 使用的块：refs ≥ 1，已移出链</text>
<text x="440" y="466" font-size="10.5" fill="#6B695F" text-anchor="middle">CachableEntry 持有句柄，Release 时才回链或释放</text>
<rect x="688" y="428" width="220" height="48" rx="6" fill="#ffffff" stroke="#E24B4A" stroke-width="1.3"/>
<text x="798" y="448" font-size="11" fill="#E24B4A" text-anchor="middle" font-weight="600">空间不足：从链尾驱逐</text>
<text x="798" y="466" font-size="10.5" fill="#6B695F" text-anchor="middle">只驱逐 refs = 0 的可驱逐块</text>
<path d="M798 416 L798 426" fill="none" stroke="#E24B4A" stroke-width="1.6" marker-end="url(#b10r)"/>
<path d="M206 376 L228 376" fill="none" stroke="#2F6FA8" stroke-width="1.4" marker-end="url(#b10b)"/>
<text x="64" y="478" font-size="10.5" fill="#6B695F" text-anchor="start">Lookup 命中：refs+1 并移出链；插入时从链头进（命中过的进高优先池，溢出逐级下沉）</text>

<rect x="30" y="524" width="560" height="52" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="46" y="545" font-size="11" fill="#1F1E1A" text-anchor="start" font-weight="600">miss：读盘 → 解析 → Insert（charge = 块实际内存，优先级 LOW/HIGH/BOTTOM）</text>
<text x="46" y="563" font-size="10.5" fill="#6B695F" text-anchor="start">strict_capacity_limit = true 且全是被引用块时，插入报 MemoryLimit，上层读盘兜底</text>
<rect x="610" y="524" width="360" height="52" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"/>
<text x="626" y="545" font-size="11" fill="#1F1E1A" text-anchor="start" font-weight="600">Release 后块回链尾等待复用；SST 不可变</text>
<text x="626" y="563" font-size="10.5" fill="#6B695F" text-anchor="start">键永不失效、条目永不回写——没有脏页协议</text>

<rect x="30" y="592" width="940" height="40" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="46" y="617" font-size="11" fill="#1F1E1A" text-anchor="start" font-weight="600">11.13 现状：默认块缓存已是 HyperClockCache（无锁 Clock，默认 32MB，AutoHCC 变体）；NewClockCache 已退化为返回 LRUCache；LRU 三池语义保留。</text>
</svg>
