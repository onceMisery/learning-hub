<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, sans-serif">
<defs>
<marker id="d12a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="d12b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
<text x="500" y="34" font-size="20" fill="#1F1E1A" text-anchor="middle" font-weight="600">内存三本账：Arena 批发、WBM 限写、Cache 记总账</text>
<text x="500" y="56" font-size="12" fill="#6B695F" text-anchor="middle" font-weight="400">写入吃 memtable（WBM 看住），读缓存吃 capacity（占位条目记账），所有字节都从 Arena/Allocator 批发</text>
<text x="960" y="28" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">橙色：写入 / 停顿</text>
<text x="960" y="44" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">蓝色：结构 / 组件</text>
<text x="960" y="60" font-size="11" fill="#6B695F" text-anchor="end" font-weight="400">红色：超限 / 驱逐</text>

<rect x="30" y="84" width="450" height="250" rx="10" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.3"/>
<text x="46" y="108" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">账本 1：memtable → WriteBufferManager（写侧）</text>
<rect x="46" y="122" width="320" height="22" rx="4" fill="#ffffff" stroke="#D3D1C7" stroke-width="1.2"/>
<rect x="46" y="122" width="280" height="22" fill="#F5C9B8"/>
<rect x="326" y="122" width="40" height="22" fill="#E24B4A"/>
<line x1="326" y1="114" x2="326" y2="152" stroke="#E24B4A" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="330" y="112" font-size="10" fill="#E24B4A" text-anchor="middle">软限 7/8</text>
<text x="380" y="138" font-size="10.5" fill="#1F1E1A" text-anchor="start">预算 128MB</text>
<text x="46" y="162" font-size="10.5" fill="#E24B4A" text-anchor="start" font-weight="600">已用 130MB：软限早已越过，硬限已触发</text>
<text x="46" y="184" font-size="11" fill="#1F1E1A" text-anchor="start">① 软限：mutable &gt; 7/8×128=112MB → 触发 flush 排队</text>
<text x="46" y="204" font-size="11" fill="#1F1E1A" text-anchor="start">② 硬限：total ≥ 128MB → 写线程 stall（allow_stall）</text>
<text x="46" y="224" font-size="11" fill="#1F1E1A" text-anchor="start">③ flush 落盘 → FreeMem → 唤醒整条写队列</text>
<text x="46" y="250" font-size="10.5" fill="#6B695F" text-anchor="start">三层关系：write_buffer_size 限单个 memtable（默认 64MB）</text>
<text x="46" y="268" font-size="10.5" fill="#6B695F" text-anchor="start">db_write_buffer_size 限全库（默认 0 = 关）；共享 WBM 可让</text>
<text x="46" y="284" font-size="10.5" fill="#6B695F" text-anchor="start">多个 DB 合并记账</text>
<text x="46" y="308" font-size="10.5" fill="#C46A0A" text-anchor="start" font-weight="600">WBM 还能把这笔账记到 block cache：kWriteBuffer 占位条目 →</text>
<text x="46" y="324" font-size="10.5" fill="#C46A0A" text-anchor="start" font-weight="600">memtable 超预算会挤掉 data block（见右账本）</text>

<rect x="510" y="84" width="460" height="250" rx="10" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="526" y="108" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">账本 2：block cache capacity 当通用内存预算（读侧）</text>
<rect x="526" y="122" width="340" height="22" rx="4" fill="#ffffff" stroke="#D3D1C7" stroke-width="1.2"/>
<rect x="526" y="122" width="294" height="22" fill="#B8D0E8"/>
<rect x="820" y="122" width="19" height="22" fill="#639922"/>
<rect x="839" y="122" width="27" height="22" fill="#E24B4A" stroke="#E24B4A" stroke-width="1"/>
<text x="526" y="162" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="600">capacity 512MB = data block 470MB + 预留 30MB，新 table reader 还要 25MB（红）</text>
<text x="526" y="184" font-size="11" fill="#1F1E1A" text-anchor="start">CacheReservationManager：内存用量换算成 256KB/格占位条目</text>
<text x="526" y="204" font-size="11" fill="#1F1E1A" text-anchor="start">25MB → 插 100 格 → 每格挤掉 LRU 里 256KB 的 data block</text>
<text x="526" y="224" font-size="11" fill="#1F1E1A" text-anchor="start">delayed_decrease：用量降回 3/4 以下才释放，免反复插拔</text>
<text x="526" y="250" font-size="10.5" fill="#6B695F" text-anchor="start">谁在记账：WBM（kWriteBuffer）、table reader、filter 构造、</text>
<text x="526" y="268" font-size="10.5" fill="#6B695F" text-anchor="start">压缩字典、blob cache……全挂在 CacheEntryRole 的枚举上</text>
<text x="526" y="292" font-size="10.5" fill="#2F6FA8" text-anchor="start" font-weight="600">strict_capacity_limit=true：占位插不进 → 打开 SST 直接</text>
<text x="526" y="308" font-size="10.5" fill="#2F6FA8" text-anchor="start" font-weight="600">报 MemoryLimit——index/filter 超支时被拒的是自己</text>
<text x="526" y="326" font-size="10.5" fill="#6B695F" text-anchor="start">不开 strict：挤自己的缓存腾地方，总量承诺仍然兑现</text>

<rect x="30" y="350" width="940" height="128" rx="10" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.3"/>
<text x="46" y="374" font-size="13" fill="#1F1E1A" text-anchor="start" font-weight="600">账本 3：Arena——memtable 的每个字节都从这里批发</text>
<rect x="46" y="388" width="130" height="52" rx="8" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.2"/>
<text x="111" y="410" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">写入 KV</text>
<text x="111" y="428" font-size="10" fill="#6B695F" text-anchor="middle">键 + 值 + 8B 序号</text>
<path d="M180 414 L216 414" fill="none" stroke="#C46A0A" stroke-width="1.5" marker-end="url(#d12a)"/>
<rect x="220" y="388" width="190" height="52" rx="8" fill="#ffffff" stroke="#2F6FA8" stroke-width="1.2"/>
<text x="315" y="410" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">ConcurrentArena</text>
<text x="315" y="428" font-size="10" fill="#6B695F" text-anchor="middle">每核一份小配额，先试免锁</text>
<path d="M414 414 L450 414" fill="none" stroke="#2F6FA8" stroke-width="1.5" marker-end="url(#d12b)"/>
<rect x="454" y="388" width="270" height="52" rx="8" fill="#ffffff" stroke="#2F6FA8" stroke-width="1.2"/>
<text x="589" y="406" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">Arena 批发块</text>
<text x="589" y="422" font-size="10" fill="#6B695F" text-anchor="middle">内联 2KB 起步 → 不够就批一整块：</text>
<text x="589" y="436" font-size="10" fill="#6B695F" text-anchor="middle">min(write_buffer_size/8, 1MB) 对齐 4KB</text>
<path d="M728 414 L764 414" fill="none" stroke="#2F6FA8" stroke-width="1.5" marker-end="url(#d12b)"/>
<rect x="768" y="388" width="188" height="52" rx="8" fill="#ffffff" stroke="#2F6FA8" stroke-width="1.2"/>
<text x="862" y="410" font-size="11" fill="#1F1E1A" text-anchor="middle" font-weight="600">超大请求单走 malloc</text>
<text x="862" y="428" font-size="10" fill="#6B695F" text-anchor="middle">&gt; 块/4 时不进块，按</text>
<text x="862" y="440" font-size="10" fill="#6B695F" text-anchor="middle">malloc_usable_size 报账</text>
<text x="46" y="466" font-size="10.5" fill="#1F1E1A" text-anchor="start" font-weight="600">举例：写 100 条 200B ≈ 22KB → 实际批发 1MB（64MB 配置），报给 WBM 的也是 1MB——记账记批发量，不是已用量</text>

<rect x="30" y="494" width="940" height="82" rx="10" fill="#ffffff" stroke="#E24B4A" stroke-width="1.3"/>
<text x="46" y="518" font-size="13" fill="#E24B4A" text-anchor="start" font-weight="600">OOM 防线：四道闸门</text>
<text x="46" y="542" font-size="11" fill="#1F1E1A" text-anchor="start">① write_buffer_size：单个 memtable 的天花板（默认 64MB，可调）</text>
<text x="290" y="542" font-size="11" fill="#1F1E1A" text-anchor="start">② db_write_buffer_size / 共享 WBM：全库 memtable 总额</text>
<text x="46" y="564" font-size="11" fill="#1F1E1A" text-anchor="start">③ block cache capacity + reservation：读侧与记账户共用一个口径</text>
<text x="560" y="564" font-size="11" fill="#1F1E1A" text-anchor="start">④ MemoryAllocator：jemalloc nodump 防 core dump 带走缓存 / memkind KMEM</text>

<rect x="30" y="592" width="940" height="36" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.3"/>
<text x="46" y="615" font-size="11" fill="#1F1E1A" text-anchor="start" font-weight="600">信条：不记账的内存终会 OOM——memtable、块缓存、索引、过滤器、WAL 全部纳入同一套 capacity 口径，超支当场可见、当场处理。</text>
</svg>
