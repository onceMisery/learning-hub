<text x="468" y="540" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.4" font-weight="400" fill="#475569" text-anchor="start">分块消息额外带 chunkId，多个 entry 拼回一条消息</text>
<rect x="30" y="596" width="820" height="52" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="46" y="618" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.4" font-weight="500" fill="#92400E" text-anchor="start">存储按 entry 计费、按 entry 复制；消费语义按 message 计。</text>
<text x="46" y="636" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.4" font-weight="400" fill="#92400E" text-anchor="start">批得越大，吞吐越好，单条延迟越高；分块越多，大消息越能过，失败重传的代价也越大。</text></svg>