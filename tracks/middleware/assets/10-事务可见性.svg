<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660" role="img" aria-label="Pulsar 事务的提交与可见性"><title>Pulsar 事务的提交与可见性</title><defs><marker id="arw-64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arw-059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arw-94A3B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="arw-94A3B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs><rect x="0" y="0" width="880" height="660" fill="#FFFFFF"/><text x="40" y="38" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start">事务做的事：让一批消息同时可见</text>
<text x="40" y="60" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">提交前谁也读不到，提交后一起读到；回滚的消息永远不出现</text>
<rect x="30" y="84" width="270" height="300" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="6 5"/>
<text x="44" y="108" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="start">事务协调者（TC）</text>
<rect x="44" y="124" width="242" height="64" rx="10" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="56" y="146" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#4C1D95" text-anchor="start">newTxn</text>
<text x="56" y="162.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#6D28D9" text-anchor="start">TxnID = TC id + 递增序号</text>
<rect x="44" y="202" width="242" height="64" rx="10" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="56" y="224" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#4C1D95" text-anchor="start">addPublishPartition</text>
<text x="56" y="240.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#6D28D9" text-anchor="start">登记这次事务会写哪些 topic</text>
<rect x="44" y="280" width="242" height="64" rx="10" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="56" y="302" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#4C1D95" text-anchor="start">endTxn(commit/abort)</text>
<text x="56" y="318.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#6D28D9" text-anchor="start">通知每个 topic 的 transaction buffer</text>
<text x="44" y="366" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.4" font-weight="400" fill="#475569" text-anchor="start">TC 自己也是一条 ledger，重启后先 replay</text>
<text x="330" y="108" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">Topic A 的 ledger</text>
<rect x="330" y="128" width="56" height="58" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="358.0" y="150" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="600" fill="#78350F" text-anchor="middle">m1</text>
<text x="358.0" y="166.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="9.6" font-weight="400" fill="#92400E" text-anchor="middle">t1</text>
<rect x="392" y="128" width="56" height="58" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="420.0" y="150" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="600" fill="#78350F" text-anchor="middle">m2</text>
<text x="420.0" y="166.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="9.6" font-weight="400" fill="#92400E" text-anchor="middle">t1</text>
<rect x="454" y="128" width="56" height="58" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
<text x="482.0" y="150" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="600" fill="#0F172A" text-anchor="middle">m3</text>
<rect x="516" y="128" width="56" height="58" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="544.0" y="150" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="600" fill="#78350F" text-anchor="middle">m4</text>
<text x="544.0" y="166.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="9.6" font-weight="400" fill="#92400E" text-anchor="middle">t2</text>
<rect x="578" y="128" width="56" height="58" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.5"/>
<text x="606.0" y="150" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="600" fill="#064E3B" text-anchor="middle">COMMIT</text>
<text x="606.0" y="166.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="9.6" font-weight="400" fill="#047857" text-anchor="middle">t1</text>
<rect x="640" y="128" width="56" height="58" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
<text x="668.0" y="150" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="600" fill="#0F172A" text-anchor="middle">m5</text>
<rect x="702" y="128" width="56" height="58" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="730.0" y="150" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="600" fill="#7F1D1D" text-anchor="middle">ABORT</text>
<text x="730.0" y="166.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="9.6" font-weight="400" fill="#B91C1C" text-anchor="middle">t2</text>
<rect x="764" y="128" width="56" height="58" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
<text x="792.0" y="150" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="600" fill="#0F172A" text-anchor="middle">m6</text>
<text x="330" y="208" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">写入顺序 →</text>
<path d="M392,246 L640,246" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-64748B)"/>
<text x="516" y="238" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="middle">提交前的 maxReadPosition</text>
<path d="M392,282 L702,282" fill="none" stroke="#059669" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-059669)"/>
<text x="547" y="274" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#059669" text-anchor="middle">提交后的 maxReadPosition</text>
<text x="330" y="316" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#475569" text-anchor="start">consumer 只能读到 ≤ maxReadPosition 的 entry</text>
<rect x="330" y="344" width="520" height="150" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="6 5"/>
<text x="344" y="368" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="700" fill="#059669" text-anchor="start">消费侧：ack 也要等提交</text>
<rect x="344" y="380" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="356" y="402" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#0F172A" text-anchor="start">consumer ack(t1)</text>
<text x="356" y="418.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#475569" text-anchor="start">先写 pending ack</text>
<rect x="514" y="380" width="150" height="52" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="526" y="402" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#78350F" text-anchor="start">pending ack store</text>
<text x="526" y="418.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#92400E" text-anchor="start">独立 ledger</text>
<rect x="684" y="380" width="152" height="52" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.5"/>
<text x="696" y="402" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#064E3B" text-anchor="start">cursor.markDelete</text>
<text x="696" y="418.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#047857" text-anchor="start">提交后才真正推进</text>
<path d="M494,406 L510,406" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-94A3B8)"/>
<path d="M664,406 L680,406" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-94A3B8)"/>
<text x="344" y="456" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.4" font-weight="400" fill="#475569" text-anchor="start">回滚时清掉 pending ack，消息重新可见</text>
<text x="344" y="476" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.4" font-weight="400" fill="#475569" text-anchor="start">提交是两阶段：先写 marker，再让 TC 通知所有分区</text>
<rect x="30" y="520" width="380" height="106" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="42" y="542" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">边界一：读已提交</text>
<text x="42" y="558.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#475569" text-anchor="start">未提交消息对普通 consumer 不可见</text>
<text x="42" y="575.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#475569" text-anchor="start">不提供跨 topic 的快照读</text>
<rect x="430" y="520" width="420" height="106" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="442" y="542" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">边界二：事务会超时</text>
<text x="442" y="558.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#475569" text-anchor="start">TC 用 timeout tracker 扫超时事务</text>
<text x="442" y="575.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#475569" text-anchor="start">超时后 abort，消息作废；lowWaterMark 控制清理进度</text></svg>