<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" role="img" aria-label="四道背压闸门"><title>四道背压闸门</title><defs><marker id="arw-2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arw-D97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arw-7C3AED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="arw-059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs><rect x="0" y="0" width="880" height="620" fill="#FFFFFF"/><text x="40" y="38" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start">背压是四道闸门，不是一句「限流」</text>
<text x="40" y="60" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">每一层都得能说清楚：满了以后谁等、谁失败、谁重试</text>
<rect x="30" y="250" width="820" height="58" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
<text x="440" y="284" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">消息流</text>
<text x="44" y="240" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#2563EB" text-anchor="start">生产者</text>
<text x="836" y="240" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#059669" text-anchor="end">消费者</text>
<rect x="142" y="228" width="16" height="102" rx="4" fill="#2563EB"/>
<rect x="54" y="96" width="192" height="96" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="150.0" y="118" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.6" font-weight="600" fill="#1E3A8A" text-anchor="middle">① 客户端队列</text>
<text x="150.0" y="134.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="9.8" font-weight="400" fill="#1D4ED8" text-anchor="middle">maxPendingMessages</text>
<text x="150.0" y="151.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="9.8" font-weight="400" fill="#1D4ED8" text-anchor="middle">满了：阻塞发送或超时失败</text>
<path d="M150,192 L150,224" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-2563EB)"/>
<rect x="342" y="228" width="16" height="102" rx="4" fill="#D97706"/>
<rect x="254" y="96" width="192" height="96" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="350.0" y="118" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.6" font-weight="600" fill="#78350F" text-anchor="middle">② Broker 限速</text>
<text x="350.0" y="134.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="9.8" font-weight="400" fill="#92400E" text-anchor="middle">publishRateLimiter 令牌桶</text>
<text x="350.0" y="151.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="9.8" font-weight="400" fill="#92400E" text-anchor="middle">超限：throttle 这条连接</text>
<path d="M350,192 L350,224" fill="none" stroke="#D97706" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-D97706)"/>
<rect x="542" y="228" width="16" height="102" rx="4" fill="#7C3AED"/>
<rect x="454" y="96" width="192" height="96" rx="10" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="550.0" y="118" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.6" font-weight="600" fill="#4C1D95" text-anchor="middle">③ 账本交接批次</text>
<text x="550.0" y="134.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="9.8" font-weight="400" fill="#6D28D9" text-anchor="middle">1024 条 / 5MB</text>
<text x="550.0" y="151.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="9.8" font-weight="400" fill="#6D28D9" text-anchor="middle">满了：先排队，不无限吃内存</text>
<path d="M550,192 L550,224" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-7C3AED)"/>
<rect x="742" y="228" width="16" height="102" rx="4" fill="#059669"/>
<rect x="654" y="96" width="192" height="96" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.5"/>
<text x="750.0" y="118" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.6" font-weight="600" fill="#064E3B" text-anchor="middle">④ 分发许可</text>
<text x="750.0" y="134.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="9.8" font-weight="400" fill="#047857" text-anchor="middle">permits + maxReadBatch</text>
<text x="750.0" y="151.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="9.8" font-weight="400" fill="#047857" text-anchor="middle">没许可：停止从 bookie 读</text>
<path d="M750,192 L750,224" fill="none" stroke="#059669" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-059669)"/>
<rect x="30" y="356" width="400" height="92" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="42" y="378" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">生产侧的三个问题</text>
<text x="42" y="394.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#475569" text-anchor="start">客户端队列满 → 应用线程被阻塞</text>
<text x="42" y="411.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#475569" text-anchor="start">Broker 限速 → 连接被暂停，不是丢消息</text>
<text x="42" y="427.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#475569" text-anchor="start">账本批次满 → 写请求排队，延迟上升</text>
<rect x="450" y="356" width="400" height="92" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="462" y="378" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">消费侧的三个问题</text>
<text x="462" y="394.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#475569" text-anchor="start">permits 是信用，不是速率</text>
<text x="462" y="411.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#475569" text-anchor="start">receiverQueue 满 → 不再发 Flow</text>
<text x="462" y="427.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#475569" text-anchor="start">分发线程忙 → 读请求降速或重排</text>
<rect x="30" y="470" width="820" height="120" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="46" y="494" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start">一条经验：背压要能传导，也要能失败。</text>
<text x="46" y="518" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.2" font-weight="400" fill="#92400E" text-anchor="start">只堵不失败，内存会替你失败；只失败不重试，消息就丢了。</text>
<text x="46" y="540" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.2" font-weight="400" fill="#92400E" text-anchor="start">超时时间、队列上限、重试次数，三个数要一起调，单独调一个通常只是把问题挪到下一层。</text>
<text x="46" y="566" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.2" font-weight="400" fill="#92400E" text-anchor="start">监控看四个指标：发送队列长度、publish throttle 次数、账本 pending 写入、消费端 permits 余量。</text></svg>