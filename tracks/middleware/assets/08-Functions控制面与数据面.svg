<text x="46" y="557" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.4" font-weight="400" fill="#92400E" text-anchor="start">代价是 assignment 只是一份最终状态，worker 重启后要重放 topic 才能知道自己该跑什么。</text></svg>