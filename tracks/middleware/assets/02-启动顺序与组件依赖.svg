<rect x="160" y="340" width="470" height="70" rx="10" fill="#CFFAFE" stroke="#0891B2" stroke-width="1.5"/>
<text x="172" y="362" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#164E63" text-anchor="start">NamespaceService</text>
<text x="172" y="378.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.6" font-weight="400" fill="#0E7490" text-anchor="start">加载 bundle，刷新自己的归属信息</text>
<text x="172" y="395.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.6" font-weight="400" fill="#0E7490" text-anchor="start">没有归属，topic 就不该在这台机器上打开</text>
<text x="646" y="370" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#64748B" text-anchor="start">PulsarService.java:1034</text>
<circle cx="120" cy="454" r="13" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
<text x="120" y="459" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="700" fill="#064E3B" text-anchor="middle">5</text>
<rect x="160" y="424" width="470" height="70" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.5"/>
<text x="172" y="446" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#064E3B" text-anchor="start">LoadManager + Leader 选举</text>
<text x="172" y="462.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.6" font-weight="400" fill="#047857" text-anchor="start">写 broker 注册节点，集群才看得见你</text>
<text x="172" y="479.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.6" font-weight="400" fill="#047857" text-anchor="start">只有 leader 才做负载决策</text>
<text x="646" y="454" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#64748B" text-anchor="start">PulsarService.java:1041</text>
<circle cx="120" cy="538" r="13" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="120" y="543" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">6</text>
<rect x="160" y="508" width="470" height="70" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
<text x="172" y="530" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">事务 / Schema / Functions</text>
<text x="172" y="546.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.6" font-weight="400" fill="#475569" text-anchor="start">事务协调器、事务 buffer 客户端</text>
<text x="172" y="563.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.6" font-weight="400" fill="#475569" text-anchor="start">最后才启动 Functions Worker</text>
<text x="646" y="538" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#64748B" text-anchor="start">PulsarService.java:1052</text>
<rect x="30" y="596" width="820" height="30" rx="7" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="440" y="616" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.8" font-weight="500" fill="#92400E" text-anchor="middle">顺序反了会怎样：没有账本客户端就开不了 topic；没有归属就接不了流量；没注册就不会被 lookup 选中</text></svg>