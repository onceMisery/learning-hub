<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-label="函数实例的执行循环与 ack 时机"><title>函数实例的执行循环与 ack 时机</title><defs><marker id="arw-94A3B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="arw-94A3B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="arw-94A3B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="arw-94A3B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="arw-94A3B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="arw-2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect x="0" y="0" width="880" height="640" fill="#FFFFFF"/><text x="40" y="38" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start">函数实例就是一个带 ack 的循环</text>
<text x="40" y="60" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">循环本身很简单，难的是「什么时候算处理完」</text>
<rect x="60" y="88" width="330" height="58" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="72" y="110" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#1E3A8A" text-anchor="start">readInput()</text>
<text x="72" y="126.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.4" font-weight="400" fill="#1D4ED8" text-anchor="start">从 consumer 或 Source 读一条</text>
<rect x="60" y="168" width="330" height="58" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.5"/>
<text x="72" y="190" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#064E3B" text-anchor="start">handleMessage()</text>
<text x="72" y="206.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.4" font-weight="400" fill="#047857" text-anchor="start">process(message, context)</text>
<text x="72" y="223.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.4" font-weight="400" fill="#047857" text-anchor="start">同步返回，或返回 Future</text>
<rect x="60" y="270" width="330" height="58" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.5"/>
<text x="72" y="292" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#064E3B" text-anchor="start">handleResult()</text>
<text x="72" y="308.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.4" font-weight="400" fill="#047857" text-anchor="start">序列化结果、决定发往哪个 topic</text>
<rect x="60" y="350" width="330" height="58" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="72" y="372" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#1E3A8A" text-anchor="start">发送输出</text>
<text x="72" y="388.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.4" font-weight="400" fill="#1D4ED8" text-anchor="start">producer.sendAsync / Sink.write</text>
<rect x="60" y="430" width="330" height="58" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="72" y="452" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#78350F" text-anchor="start">ack</text>
<text x="72" y="468.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.4" font-weight="400" fill="#92400E" text-anchor="start">按处理语义决定此刻是否确认</text>
<rect x="60" y="510" width="330" height="58" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
<text x="72" y="532" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">下一条</text>
<text x="72" y="548.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.4" font-weight="400" fill="#475569" text-anchor="start">循环回到 readInput</text>
<path d="M225,146 L225,164" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-94A3B8)"/>
<path d="M225,226 L225,244" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-94A3B8)"/>
<path d="M225,328 L225,346" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-94A3B8)"/>
<path d="M225,408 L225,426" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-94A3B8)"/>
<path d="M225,488 L225,506" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-94A3B8)"/>
<path d="M60,539 L36,539 L36,117 L56,117" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arw-2563EB)"/>
<text x="44" y="330" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.4" font-weight="600" fill="#2563EB" text-anchor="middle">循环</text>
<rect x="430" y="88" width="420" height="478" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="6 5"/>
<text x="446" y="112" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="start">ack 发生在什么时候</text>
<rect x="446" y="132" width="388" height="76" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="458" y="154" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.6" font-weight="600" fill="#7F1D1D" text-anchor="start">ATMOST_ONCE</text>
<text x="458" y="170.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#B91C1C" text-anchor="start">读出来先 ack，再处理</text>
<text x="458" y="187.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#B91C1C" text-anchor="start">进程崩了这条就没了</text>
<rect x="446" y="218" width="388" height="76" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.5"/>
<text x="458" y="240" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.6" font-weight="600" fill="#064E3B" text-anchor="start">ATLEAST_ONCE</text>
<text x="458" y="256.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#047857" text-anchor="start">处理成功后 ack</text>
<text x="458" y="273.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#047857" text-anchor="start">失败会重投，消费端要幂等</text>
<rect x="446" y="304" width="388" height="76" rx="10" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="458" y="326" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.6" font-weight="600" fill="#4C1D95" text-anchor="start">EFFECTIVELY_ONCE</text>
<text x="458" y="342.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#6D28D9" text-anchor="start">输出与 ack 放进同一个事务</text>
<text x="458" y="359.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#6D28D9" text-anchor="start">代价最高，跨外部系统仍要幂等</text>
<rect x="446" y="390" width="388" height="76" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="458" y="412" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.6" font-weight="600" fill="#78350F" text-anchor="start">MANUAL</text>
<text x="458" y="428.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#92400E" text-anchor="start">业务自己调 context.ack()</text>
<text x="458" y="445.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#92400E" text-anchor="start">灵活，也最容易忘记</text>
<text x="446" y="492" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.8" font-weight="600" fill="#DC2626" text-anchor="start">失败超过 maxMessageRetries → dead letter topic</text>
<text x="446" y="512" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.8" font-weight="400" fill="#475569" text-anchor="start">retainOrdering=true 时，失败会阻塞后面的消息</text>
<text x="446" y="532" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.8" font-weight="400" fill="#475569" text-anchor="start">batch source 还要考虑整批的 checkpoint，不是单条 ack</text></svg>