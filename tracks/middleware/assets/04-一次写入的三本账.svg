<text x="52" y="645.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.8" font-weight="400" fill="#92400E" text-anchor="start">每条消息都写，只追加</text>
