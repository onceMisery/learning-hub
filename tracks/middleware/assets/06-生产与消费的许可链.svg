<text x="330" y="142.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#1D4ED8" text-anchor="start">publishMessage</text>
<text x="330" y="159.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#1D4ED8" text-anchor="start">限速令牌桶</text>
