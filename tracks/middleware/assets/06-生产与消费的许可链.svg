<text x="30" y="282" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="700" fill="#059669" text-anchor="start">消费链路</text>
<rect x="26" y="294" width="128" height="82" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="38" y="316" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#78350F" text-anchor="start">Bookie / 缓存</text>
<text x="38" y="332.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#92400E" text-anchor="start">cursor 读取</text>
<path d="M154,335 L172,335" fill="none" stroke="#059669" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-059669)"/>
