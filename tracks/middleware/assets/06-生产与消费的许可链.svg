<text x="184" y="142.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#1D4ED8" text-anchor="start">pendingMessages</text>
<text x="184" y="159.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#1D4ED8" text-anchor="start">Semaphore 限流</text>
