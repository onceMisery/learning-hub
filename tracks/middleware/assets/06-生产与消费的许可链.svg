<text x="184" y="316" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#064E3B" text-anchor="start">Dispatcher</text>
<text x="184" y="332.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#047857" text-anchor="start">totalAvailablePermits</text>
<text x="184" y="349.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#047857" text-anchor="start">maxReadBatch=500</text>
<path d="M300,335 L318,335" fill="none" stroke="#059669" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-059669)"/>
<rect x="318" y="294" width="128" height="82" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.5"/>
<text x="330" y="316" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#064E3B" text-anchor="start">Consumer</text>
<text x="330" y="332.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#047857" text-anchor="start">receiverQueue=1000</text>
<text x="330" y="349.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#047857" text-anchor="start">本地缓冲</text>
<path d="M446,335 L464,335" fill="none" stroke="#059669" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-059669)"/>
<rect x="464" y="294" width="128" height="82" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.5"/>
<text x="476" y="316" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#064E3B" text-anchor="start">应用线程</text>
<text x="476" y="332.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#047857" text-anchor="start">receive()</text>
<path d="M700,400 L700,424 L238,424 L238,380" fill="none" stroke="#059669" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arw-059669)"/>
<text x="520" y="444" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.8" font-weight="600" fill="#059669" text-anchor="middle">CommandFlow：消费掉一半，就把许可还回来</text>
<rect x="30" y="482" width="390" height="76" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="42" y="504" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">谁慢谁承担</text>
<text x="42" y="520.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#475569" text-anchor="start">客户端慢 → 本地队列堆满 → 阻塞发送</text>
<text x="42" y="537.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#475569" text-anchor="start">Broker 慢 → permits 不增加 → 停止读取</text>
<rect x="442" y="482" width="408" height="76" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="454" y="504" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#7F1D1D" text-anchor="start">不要做的事</text>
<text x="454" y="520.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#B91C1C" text-anchor="start">给生产队列设一个巨大的上限，只是把 OOM 推迟</text>
<text x="454" y="537.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#B91C1C" text-anchor="start">消费端不限 permits，等于让 broker 替你扛内存</text></svg>