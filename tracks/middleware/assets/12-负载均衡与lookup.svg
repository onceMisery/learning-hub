<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-label="负载均衡与 Broker 查找"><title>负载均衡与 Broker 查找</title><defs><marker id="arw-94A3B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="arw-94A3B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="arw-94A3B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="arw-94A3B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="arw-059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arw-D97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect x="0" y="0" width="880" height="640" fill="#FFFFFF"/><text x="40" y="38" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start">谁拥有这个 bundle</text>
<text x="40" y="60" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">负载均衡决定归属，lookup 只是把归属告诉客户端</text>
<rect x="30" y="84" width="400" height="330" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="6 5"/>
<text x="44" y="108" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="700" fill="#059669" text-anchor="start">负载均衡（leader 才有决策权）</text>
<rect x="44" y="122" width="170" height="54" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="56" y="144" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#0F172A" text-anchor="start">Broker A / B / C</text>
<text x="56" y="160.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#475569" text-anchor="start">周期上报 LoadReport</text>
<rect x="238" y="122" width="176" height="54" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.5"/>
<text x="250" y="144" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#064E3B" text-anchor="start">Leader</text>
<text x="250" y="160.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#047857" text-anchor="start">汇总成 LoadData</text>
<path d="M214,149 L234,149" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-94A3B8)"/>
<rect x="44" y="196" width="370" height="54" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="56" y="218" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#0F172A" text-anchor="start">选一个 broker</text>
<text x="56" y="234.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#475569" text-anchor="start">LeastLongTermMessageRate / LeastResourceUsageWithWeight</text>
<path d="M140,176 L140,192" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-94A3B8)"/>
<rect x="44" y="270" width="370" height="54" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="56" y="292" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#0F172A" text-anchor="start">preallocateBundle</text>
<text x="56" y="308.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#475569" text-anchor="start">先记账，再让新 broker 抢归属锁</text>
<path d="M140,250 L140,266" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-94A3B8)"/>
<rect x="44" y="344" width="370" height="50" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="56" y="366" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#78350F" text-anchor="start">shedding：Threshold / Overload / Uniform</text>
<text x="44" y="408" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#475569" text-anchor="start">bundle 是最小归属单位，不是 topic</text>
<rect x="460" y="84" width="390" height="330" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="6 5"/>
<text x="474" y="108" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="700" fill="#2563EB" text-anchor="start">客户端查找（lookup）</text>
<rect x="474" y="122" width="362" height="50" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="486" y="144" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#1E3A8A" text-anchor="start">client → 任意 broker</text>
<text x="486" y="160.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#1D4ED8" text-anchor="start">CommandLookupTopic</text>
<rect x="474" y="190" width="362" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="486" y="212" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#0F172A" text-anchor="start">NamespaceService</text>
<text x="486" y="228.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#475569" text-anchor="start">先算 bundle，再 getOwnerAsync</text>
<path d="M655,172 L655,186" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-94A3B8)"/>
<rect x="474" y="258" width="170" height="62" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.5"/>
<text x="486" y="280" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#064E3B" text-anchor="start">已有 owner</text>
<text x="486" y="296.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#047857" text-anchor="start">返回 Connect 或 Redirect</text>
<rect x="666" y="258" width="170" height="62" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="678" y="280" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#78350F" text-anchor="start">没有 owner</text>
<text x="678" y="296.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.2" font-weight="400" fill="#92400E" text-anchor="start">searchForCandidateBroker 抢锁</text>
<path d="M600,240 L560,254" fill="none" stroke="#059669" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-059669)"/>
<path d="M710,240 L750,254" fill="none" stroke="#D97706" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-D97706)"/>
<text x="474" y="344" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#475569" text-anchor="start">客户端只认地址，不认负载；选谁由 broker 侧决定</text>
<text x="474" y="364" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.6" font-weight="400" fill="#475569" text-anchor="start">归属变更时，旧 owner 会被 fencing</text>
<rect x="30" y="440" width="820" height="86" rx="10" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="42" y="462" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#4C1D95" text-anchor="start">元数据里的三个关键位置</text>
<text x="42" y="478.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.4" font-weight="400" fill="#6D28D9" text-anchor="start">/namespace/&lt;tenant&gt;/&lt;ns&gt;/&lt;range&gt;：bundle 归属锁（临时节点，会话断开就释放）</text>
<text x="42" y="495.0" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.4" font-weight="400" fill="#6D28D9" text-anchor="start">/loadbalance/leader：负载均衡 leader</text>
<text x="42" y="511.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.4" font-weight="400" fill="#6D28D9" text-anchor="start">/loadbalance/brokers/&lt;broker-id&gt;：注册与负载上报（新实现走 TableView）</text>
<rect x="30" y="552" width="820" height="52" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="46" y="574" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.4" font-weight="500" fill="#92400E" text-anchor="start">bundle 数量是个权衡：太少，扩缩容不匀；太多，元数据与锁竞争变重。</text>
<text x="46" y="592" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.4" font-weight="400" fill="#92400E" text-anchor="start">Pulsar 默认按 2 的幂切分，扩 bundle 只能往上加，不能自动合并。</text></svg>