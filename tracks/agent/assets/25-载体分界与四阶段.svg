<svg xmlns="http://www.w3.org/2000/svg" width="860" height="600" viewBox="0 0 860 600" role="img" aria-label="四种载体的分界与后训练四阶段的选择判据"><title>载体分界与四阶段</title><defs><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs><rect x="0" y="0" width="860" height="600" fill="#FFFFFF"/><rect x="120" y="20" width="620" height="38" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="44" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">判据只有一条：这条能力能不能被外部符号充分表达</text><rect x="40" y="72" width="380" height="252" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="6 4"/><text x="58" y="96" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#1E3A8A" text-anchor="start">答案一 · 能说清 → 别动参数</text><rect x="58" y="110" width="344" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="72" y="128" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">经验知识库</text><text x="72" y="145" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">事实、例外、来源 · 更新快、可追溯</text><rect x="58" y="158" width="344" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="72" y="176" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">Prompt 与 Skill</text><text x="72" y="193" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">能用自然语言说清的判断原则 · 易膨胀与冲突</text><rect x="58" y="206" width="344" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="72" y="224" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">程序与 Harness</text><text x="72" y="241" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">可确定解析的硬约束 · 可测试，但维护贵</text><text x="58" y="272" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#7F1D1D" text-anchor="start">「不许做」类永远落在这里——训练挡不住越权</text><text x="58" y="296" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">三者不互斥：医疗影像＝参数识病灶 + 知识库供指南 + 代码算指标</text><rect x="440" y="72" width="380" height="252" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6" stroke-dasharray="6 4"/><text x="458" y="96" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#78350F" text-anchor="start">答案二 · 说不清但做得出 → 参数层</text><rect x="458" y="110" width="344" height="52" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="472" y="130" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#78350F" text-anchor="start">改的是分布，不是知识</text><text x="472" y="150" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">语感、风格、何时停手、逐字复制的稳定性</text><text x="458" y="184" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">代价：更新慢 · 回归贵 · 审计难（没有 diff 可看）</text><text x="458" y="206" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">风险一：噪声被忠实写进参数（SFT 是 mass-covering）</text><text x="458" y="226" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">风险二：脏轨迹里的注入被固化，并跨会话生效</text><text x="458" y="246" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">风险三：领域涨、通用跌——保留集与事实评估不可省</text><text x="458" y="278" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#78350F" text-anchor="start">SFT 与预训练只差两点：数据是输入-输出对；loss 只算回答 token</text><text x="458" y="300" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">所以 SFT 固化协议、不承载事实；动态事实走 RAG</text><text x="40" y="352" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#064E3B" text-anchor="start">四阶段各治一种病：底座 / 协议 / 策略</text><rect x="40" y="366" width="180" height="66" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="54" y="388" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">Mid-training</text><text x="54" y="406" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">合理采样下 pass@k 仍近 0</text><text x="54" y="422" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">→ 补知识与基础能力</text><rect x="232" y="366" width="180" height="66" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="246" y="388" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#78350F" text-anchor="start">SFT</text><text x="246" y="406" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">结果对但输出不可解析</text><text x="246" y="422" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">→ 先稳定格式与协议</text><rect x="424" y="366" width="180" height="66" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="438" y="388" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#064E3B" text-anchor="start">RL</text><text x="438" y="406" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">非零成功 + 可靠奖励 + 组内有差异</text><text x="438" y="422" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">→ 才轮到它重分配概率</text><rect x="616" y="366" width="204" height="66" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="630" y="388" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">只有示范、没有可评分环境</text><text x="630" y="406" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">→ SFT / 拒绝采样 / 离线偏好（DPO）</text><text x="630" y="422" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">在线 RL 无从谈起</text><path d="M130,432 L130,452 L246,452 L246,436" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-success)"/><path d="M322,432 L322,452 L438,452 L438,436" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-decision)"/><text x="40" y="474" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">pass@k = 1 − (1 − p)^k · 把采样量继续放大只能以约 1/p 的速度等待偶然成功，效率迅速失去实际意义</text><rect x="40" y="488" width="780" height="88" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="56" y="512" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">决策顺序（一步比一步贵，不许跳）</text><text x="56" y="534" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">① 先排除不改权重的方案 → ② 在目标留出集上测能力支持（pass@1 / pass@k / 部分进展率 / 格式解析率 + 人工审计失败原因）</text><text x="56" y="554" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">③ SFT 立协议 → ④ 有探索空间才上 RL · 核心原则：投入大规模资源前，先用小规模实验验证关键假设——快速失败比大规模失败更可接受</text></svg>
