<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" role="img" aria-label="记忆的五道边界：写入、作用域、召回、使用、撤回，以及错误传染的三个入口和四类测试" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif"><title>记忆的五道边界</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect x="0" y="0" width="860" height="640" fill="#FFFFFF"/><rect x="40" y="20" width="780" height="38" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="44" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">记忆的五道边界：写入、作用域、召回、使用、撤回</text><text x="40" y="76" font-size="11.5" fill="#475569" text-anchor="start">记忆不是聊天记录，是带作用域、条件、证据、有效期的主张；五道门缺一不可。</text><rect x="40" y="90" width="180" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="130" y="115" font-size="10.5" fill="#0F172A" text-anchor="middle">用户输入 / 明确确认</text><rect x="240" y="90" width="180" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="330" y="115" font-size="10.5" fill="#0F172A" text-anchor="middle">工具结果 / 外部回执</text><rect x="440" y="90" width="180" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="530" y="115" font-size="10.5" fill="#0F172A" text-anchor="middle">子 Agent 回传的结论</text><rect x="640" y="90" width="180" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="730" y="115" font-size="10.5" fill="#0F172A" text-anchor="middle">文档 / 知识库 / 复盘</text><path d="M430,130 L430,140" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="442" y="146" font-size="9.8" fill="#64748B" text-anchor="start">候选</text><rect x="40" y="154" width="144" height="196" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><rect x="40" y="154" width="144" height="32" rx="10" fill="#EDE9FE"/><text x="112" y="176" font-size="11.5" font-weight="700" fill="#5B21B6" text-anchor="middle">① 写入</text><text x="56" y="208" font-size="10" fill="#4C1D95" text-anchor="start">只收验证过的事实</text><text x="56" y="228" font-size="10" fill="#4C1D95" text-anchor="start">与复盘过的经验</text><text x="56" y="248" font-size="10" fill="#4C1D95" text-anchor="start">模型推断进草稿层</text><text x="56" y="268" font-size="10" fill="#4C1D95" text-anchor="start">高风险经验需人审</text><text x="56" y="298" font-size="9.6" fill="#6D28D9" text-anchor="start">一次事故不能直接</text><text x="56" y="314" font-size="9.6" fill="#6D28D9" text-anchor="start">升级成全局规则</text><text x="56" y="336" font-size="9.6" fill="#7F1D1D" text-anchor="start">✕ 写入过宽</text><rect x="200" y="154" width="144" height="196" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><rect x="200" y="154" width="144" height="32" rx="10" fill="#BAE6FD"/><text x="272" y="176" font-size="11.5" font-weight="700" fill="#075985" text-anchor="middle">② 作用域</text><text x="216" y="208" font-size="10" fill="#075985" text-anchor="start">租户 / 项目 / 厂商</text><text x="216" y="228" font-size="10" fill="#075985" text-anchor="start">型号 / 固件 / 工具版本</text><text x="216" y="248" font-size="10" fill="#075985" text-anchor="start">默认私有，不自动共享</text><text x="216" y="268" font-size="10" fill="#075985" text-anchor="start">跨域必须显式提升</text><text x="216" y="298" font-size="9.6" fill="#0369A1" text-anchor="start">命名空间硬隔离</text><text x="216" y="314" font-size="9.6" fill="#0369A1" text-anchor="start">子 Agent 只拿切片</text><text x="216" y="336" font-size="9.6" fill="#7F1D1D" text-anchor="start">✕ 跨厂商扩散</text><rect x="360" y="154" width="144" height="196" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><rect x="360" y="154" width="144" height="32" rx="10" fill="#FDE68A"/><text x="432" y="176" font-size="11.5" font-weight="700" fill="#78350F" text-anchor="middle">③ 召回</text><text x="376" y="208" font-size="10" fill="#78350F" text-anchor="start">先硬过滤，再算相似</text><text x="376" y="228" font-size="10" fill="#78350F" text-anchor="start">条件 / 时效 / 冲突</text><text x="376" y="248" font-size="10" fill="#78350F" text-anchor="start">过期、隔离不参与</text><text x="376" y="268" font-size="10" fill="#78350F" text-anchor="start">允许「这次不召回」</text><text x="376" y="298" font-size="9.6" fill="#92400E" text-anchor="start">相似 ≠ 相关 ≠ 该用</text><text x="376" y="314" font-size="9.6" fill="#92400E" text-anchor="start">当前证据优先于记忆</text><text x="376" y="336" font-size="9.6" fill="#7F1D1D" text-anchor="start">✕ 只看相似度</text><rect x="520" y="154" width="144" height="196" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><rect x="520" y="154" width="144" height="32" rx="10" fill="#A7F3D0"/><text x="592" y="176" font-size="11.5" font-weight="700" fill="#065F46" text-anchor="middle">④ 使用</text><text x="536" y="208" font-size="10" fill="#065F46" text-anchor="start">是参考，不是命令</text><text x="536" y="228" font-size="10" fill="#065F46" text-anchor="start">带来源、置信度、条件</text><text x="536" y="248" font-size="10" fill="#065F46" text-anchor="start">高风险动作再验证</text><text x="536" y="268" font-size="10" fill="#065F46" text-anchor="start">记忆不能授予权限</text><text x="536" y="298" font-size="9.6" fill="#047857" text-anchor="start">冲突时显式呈现</text><text x="536" y="314" font-size="9.6" fill="#047857" text-anchor="start">不可逆动作三证齐全</text><text x="536" y="336" font-size="9.6" fill="#7F1D1D" text-anchor="start">✕ 当成硬命令</text><rect x="680" y="154" width="140" height="196" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/><rect x="680" y="154" width="140" height="32" rx="10" fill="#E2E8F0"/><text x="750" y="176" font-size="11.5" font-weight="700" fill="#1E293B" text-anchor="middle">⑤ 撤回</text><text x="694" y="208" font-size="10" fill="#1E293B" text-anchor="start">supersede / tombstone</text><text x="694" y="228" font-size="10" fill="#1E293B" text-anchor="start">quarantine 隔离</text><text x="694" y="248" font-size="10" fill="#1E293B" text-anchor="start">审计影响过哪些任务</text><text x="694" y="268" font-size="10" fill="#1E293B" text-anchor="start">kill switch 立即停用</text><text x="694" y="298" font-size="9.6" fill="#475569" text-anchor="start">TTL / 失效条件</text><text x="694" y="314" font-size="9.6" fill="#475569" text-anchor="start">政策升级批量复核</text><text x="694" y="336" font-size="9.6" fill="#7F1D1D" text-anchor="start">✕ 只进不出</text><path d="M184,252 L198,252" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M344,252 L358,252" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M504,252 L518,252" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M664,252 L678,252" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M40,252 L28,252 L28,378 L40,378" stroke="#94A3B8" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="40" y="374" font-size="12" font-weight="700" fill="#7F1D1D" text-anchor="start">错误传染的三个入口，正好对应三道门</text><rect x="40" y="386" width="248" height="78" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/><text x="54" y="408" font-size="11.5" font-weight="700" fill="#7F1D1D" text-anchor="start">入口一：写入过宽</text><text x="54" y="428" font-size="10" fill="#7F1D1D" text-anchor="start">一次 A 厂商事故，被写成「所有芯片都这样」</text><text x="54" y="448" font-size="10" font-weight="600" fill="#991B1B" text-anchor="start">→ 第 ① 道门要收窄</text><rect x="306" y="386" width="248" height="78" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/><text x="320" y="408" font-size="11.5" font-weight="700" fill="#7F1D1D" text-anchor="start">入口二：召回只看相似</text><text x="320" y="428" font-size="10" fill="#7F1D1D" text-anchor="start">「芯片配置」四个字像，就跨厂商命中</text><text x="320" y="448" font-size="10" font-weight="600" fill="#991B1B" text-anchor="start">→ 第 ③ 道门要硬过滤</text><rect x="572" y="386" width="248" height="78" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/><text x="586" y="408" font-size="11.5" font-weight="700" fill="#7F1D1D" text-anchor="start">入口三：使用当命令</text><text x="586" y="428" font-size="10" fill="#7F1D1D" text-anchor="start">「必须这样做」让模型跳过条件复核</text><text x="586" y="448" font-size="10" font-weight="600" fill="#991B1B" text-anchor="start">→ 第 ④ 道门要再验证</text><text x="40" y="492" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">上线前跑四类测试</text><rect x="40" y="502" width="184" height="48" rx="8" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/><text x="132" y="522" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">跨厂商</text><text x="132" y="540" font-size="9.6" fill="#047857" text-anchor="middle">A 的经验不在 B 上召回</text><rect x="238" y="502" width="184" height="48" rx="8" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/><text x="330" y="522" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">跨版本</text><text x="330" y="540" font-size="9.6" fill="#047857" text-anchor="middle">固件升级后旧经验失效</text><rect x="436" y="502" width="184" height="48" rx="8" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/><text x="528" y="522" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">跨租户</text><text x="528" y="540" font-size="9.6" fill="#047857" text-anchor="middle">A 租户记忆不进 B 租户</text><rect x="634" y="502" width="186" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/><text x="727" y="522" font-size="11" font-weight="600" fill="#78350F" text-anchor="middle">投毒 / 撤回</text><text x="727" y="540" font-size="9.6" fill="#92400E" text-anchor="middle">假记忆能被隔离、能立刻停用</text><rect x="40" y="566" width="780" height="54" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="54" y="586" font-size="10.5" font-weight="600" fill="#0F172A" text-anchor="start">四条指标：同类错误复发率 · 跨任务污染率 · 记忆导致的事故率 · 错误记忆撤回时长。</text><text x="54" y="606" font-size="10.5" fill="#7F1D1D" text-anchor="start">最重要的边界放代码：记忆说「别动生产」，权限和沙箱必须真的拦住；记忆是提示，不是权限。</text></svg>
