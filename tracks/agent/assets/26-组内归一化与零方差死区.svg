<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" role="img" aria-label="一组16条rollout如何变成一次更新，以及全零全一死区、时间账与数值失配放大链"><title>组内归一化与零方差死区</title><defs><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect x="0" y="0" width="860" height="620" fill="#FFFFFF"/><rect x="120" y="20" width="620" height="38" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="44" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">GRPO 的一步：一组采样 → 一个均值 → 一次归一化 → 一次更新</text><text x="40" y="80" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">同一个 prompt · 16 条并行 rollout（SWE-bench 量级示例）</text><rect x="40" y="92" width="480" height="150" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.2"/><g><rect x="60" y="110" width="26" height="100" rx="3" fill="#DCFCE7" stroke="#059669" stroke-width="1.2"/><rect x="92" y="132" width="26" height="78" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/><rect x="124" y="150" width="26" height="60" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/><rect x="156" y="118" width="26" height="92" rx="3" fill="#DCFCE7" stroke="#059669" stroke-width="1.2"/><rect x="188" y="156" width="26" height="54" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/><rect x="220" y="140" width="26" height="70" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/><rect x="252" y="160" width="26" height="50" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/><rect x="284" y="126" width="26" height="84" rx="3" fill="#DCFCE7" stroke="#059669" stroke-width="1.2"/><rect x="316" y="152" width="26" height="58" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/><rect x="348" y="144" width="26" height="66" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/><rect x="380" y="162" width="26" height="48" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/><rect x="412" y="114" width="26" height="96" rx="3" fill="#DCFCE7" stroke="#059669" stroke-width="1.2"/><rect x="444" y="158" width="26" height="52" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/><line x1="56" y1="210" x2="480" y2="210" stroke="#3B3A34" stroke-width="1"/></g><text x="60" y="232" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">4 条通过 → 正优势（以后多做）</text><text x="270" y="232" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">12 条失败 → 负优势（少做）</text><path d="M520,170 L544,170" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/><rect x="546" y="128" width="274" height="118" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="560" y="150" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">组均值 = 4/16 · 减去它再归一化</text><text x="560" y="172" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">advantage = normalize(reward within group)</text><text x="560" y="194" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">组内有差异 → 有梯度 → 这一步真的在移动策略</text><text x="560" y="214" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">PPO 多一个 critic：优势 = 折扣回报 − V(s)</text><text x="560" y="234" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">on-policy 要求 μ = π，比率 ρ = 1</text><text x="40" y="272" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#7F1D1D" text-anchor="start">死区：全 0 或全 1 时组内方差为 0，优势直接消失（这一步不产生梯度）</text><rect x="40" y="284" width="250" height="70" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="54" y="306" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#7F1D1D" text-anchor="start">全 0：任务不可达</text><text x="54" y="326" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">pass@k 近零 → 先补 Mid-training / SFT，</text><text x="54" y="344" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">或构造可达课程与部分奖励</text><rect x="306" y="284" width="250" height="70" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="320" y="306" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#7F1D1D" text-anchor="start">全 1：验证器没区分度</text><text x="320" y="326" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">任务太易或断言过松 → 先修评估，</text><text x="320" y="344" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">别加 step（只会烧采样预算）</text><rect x="572" y="284" width="248" height="70" rx="10" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.4"/><text x="586" y="306" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#854F0B" text-anchor="start">工程用法（几乎免费）</text><text x="586" y="326" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#854F0B" text-anchor="start">怀疑「训不动」时，先看组内奖励</text><text x="586" y="344" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#854F0B" text-anchor="start">有没有差异，再看方差，最后才加预算</text><rect x="40" y="370" width="390" height="128" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="56" y="394" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">时间账：墙钟由最慢那条 rollout 决定</text><rect x="56" y="404" width="230" height="14" rx="4" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1"/><text x="292" y="415" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#854F0B" text-anchor="start">rollout ≈ 2,000 s（16 条并行）</text><rect x="56" y="424" width="80" height="14" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="1"/><text x="142" y="435" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#3F6212" text-anchor="start">梯度与优化器 ≈ 600 s</text><text x="56" y="458" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">一个 step ≈ 2,600 s（43 分钟）· 100 steps ≈ 72 小时</text><text x="56" y="478" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">SFT 转 RL 常需 10–100 倍训练时间 · 瓶颈可能在 CPU 验证 worker</text><rect x="450" y="370" width="370" height="128" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="5 4"/><text x="466" y="394" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#7F1D1D" text-anchor="start">数值失配：infra 层面的误差会被长序列放大</text><text x="466" y="416" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">logprob 微差 → 概率比指数化 → 长前缀累积 → clip /</text><text x="466" y="434" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">优势加权改变 → 梯度方向与有效样本数改变</text><text x="466" y="456" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#7F1D1D" text-anchor="start">4,000 token × 同向 1e-3 → 轨迹级比率 e⁴ ≈ 54.6</text><text x="466" y="478" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">改 batch size 会破坏 batch invariance，把 on-policy 变成隐式 off-policy</text><path d="M230,498 L230,516 L430,516 L430,498" fill="none" stroke="#DC2626" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-danger)"/><rect x="40" y="522" width="780" height="86" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.4"/><text x="56" y="546" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#3F6212" text-anchor="start">四件可执行动作（按性价比排）：① 更新前先比 sampler 与 trainer 的 token logprob，并监控均值/分位/最大值/近似 KL/裁剪比例</text><text x="56" y="566" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#3F6212" text-anchor="start">② 同步 LoRA、tokenizer、chat template、revision、位置编码　③ 存下生成时的 behavior logprob</text><text x="56" y="586" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#3F6212" text-anchor="start">④ 对齐精度内核；做不到就显式 off-policy 修正并限制 staleness</text></svg>
