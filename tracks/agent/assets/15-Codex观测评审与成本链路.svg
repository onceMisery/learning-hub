<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" role="img" aria-label="Codex 观测三出口、评审双闸与成本反馈链路"><title>Codex：观测 · 成本 · 评审 · 反馈</title><defs><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrow-decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect x="0" y="0" width="900" height="820" fill="#FFFFFF"/><text x="150" y="20" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">观测：三层出口</text><text x="450" y="20" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">成本：口径与结算</text><text x="750" y="20" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">评审：双闸与降权</text><rect x="30" y="34" width="240" height="88" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="150" y="58" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">codex-otel crate</text><text x="150" y="80" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">metrics / logs / traces 分别开关</text><text x="150" y="98" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">turn span · W3C traceparent 跨进程</text><rect x="30" y="144" width="240" height="88" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="150" y="168" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#78350F" text-anchor="middle">同一事件写两份</text><text x="150" y="190" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="middle">log_only：prompt/参数/输出预览</text><text x="150" y="208" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="middle">trace_safe：只留长度·行数·计数</text><rect x="30" y="254" width="240" height="88" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.6"/><text x="150" y="278" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#064E3B" text-anchor="middle">rollout = 可重放证据束</text><text x="150" y="300" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="middle">"payloads are evidence,</text><text x="150" y="318" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="middle">not proof the model saw them"</text><rect x="300" y="34" width="300" height="120" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="450" y="58" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">TokenUsageRecord</text><text x="450" y="80" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">身份四级：session/root-turn/turn/response</text><text x="450" y="98" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">口径三级：单响应 / turn 累计 / thread 累计</text><text x="450" y="116" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">按 model 分账在 TurnTokenUsage</text><text x="450" y="140" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">cached_input 与 cache_write_input 分维</text><rect x="300" y="176" width="300" height="88" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="450" y="200" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">金额化外置于后端</text><text x="450" y="222" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">客户端无价格表 · /turn-costs 结算</text><text x="450" y="240" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">pending→priced · µUSD 打点 · Bedrock 排除</text><rect x="300" y="286" width="300" height="76" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="450" y="310" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#78350F" text-anchor="middle">预算是状态机不是重试</text><text x="450" y="332" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="middle">goal：BudgetLimited / UsageLimited / Blocked</text><text x="450" y="350" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="middle">rollout 预算按采样/前缀加权 token</text><rect x="620" y="34" width="250" height="120" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="745" y="58" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">闸一：ReviewTask（用户）</text><text x="745" y="80" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">rubric 作子会话 base_instructions</text><text x="745" y="98" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">8 条判据 + P0-P3 + 结构化输出</text><text x="745" y="116" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">approval=Never · 禁网 · 禁协作 · 可换模型</text><text x="745" y="140" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">评审"结果"：生成-评审分离</text><rect x="620" y="176" width="250" height="150" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="745" y="200" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#7F1D1D" text-anchor="middle">闸二：Guardian（审批）</text><text x="745" y="222" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">{risk, authorization, outcome} · 默认不接管</text><text x="745" y="240" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">评审器降权：只读白名单 · intersect · 无网络</text><text x="745" y="258" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">私有 transcript 不落 app-server</text><text x="745" y="276" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">3 试 · 90s 超时 · 连续 deny → 熔断交人</text><text x="745" y="294" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#7F1D1D" text-anchor="middle">评审器也是攻击面 → 单独收敛</text><rect x="620" y="348" width="250" height="76" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="745" y="372" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">"谁批的"是独立字段</text><text x="745" y="394" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">ToolDecisionSource：Reviewer/Config/User</text><text x="745" y="412" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">SecurityRiskScore 落盘但不进模型上下文</text><rect x="30" y="464" width="410" height="150" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4"/><text x="50" y="490" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#1E3A8A" text-anchor="start">反馈：带证据的上报，不是评分控件</text><text x="50" y="514" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">bad/good/bug/safety_check 分类 + 日志 + rollout 附件 + doctor 报告</text><text x="50" y="534" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">prompt_hash 对齐"当时哪版提示词" · TurnResolvedConfigFact 对齐配置</text><text x="50" y="554" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">失败样本：只采 deny/timeout · 64 条环形 · 超限丢 instructions 并标注</text><text x="50" y="574" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">隐式标注：accepted_lines · TurnProfile · steer 拒绝原因 · resolution 改写</text><text x="50" y="598" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#1E3A8A" text-anchor="start">观测/测试/评估三件事分开：快照管回归，事件管归因，评审管在线裁决</text><rect x="460" y="464" width="410" height="150" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 4"/><text x="480" y="490" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#7F1D1D" text-anchor="start">自进化的否证：学知识，不学提示词</text><text x="480" y="514" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">无自动改 Prompt/调参/评估回滚闭环；模板是编译期常量，改文件即过快照测试</text><text x="480" y="534" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">记忆蒸馏流水线：离线 · 租约 · git baseline · NO-OP 门（"会更好吗"否则返空）</text><text x="480" y="554" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">效果信号只到"被不被用"（usage_count/citations），无"用了是否更好"的度量</text><text x="480" y="574" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">自产内容（记忆/技能）默认不在信任链——这是敢让它自动沉淀的前提</text><text x="480" y="598" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#7F1D1D" text-anchor="start">先建回归，再谈进化</text><rect x="30" y="650" width="840" height="130" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="50" y="678" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="start">测试与回归的做法（core/tests/suite · 187 文件）</text><text x="50" y="702" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">行为测试＝注入脚本化 SSE 序列（父模型→Guardian deny→收尾），生成器+评审器+审批路由整条链路进确定性脚本</text><text x="50" y="724" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">上下文回归＝请求快照（context_snapshot + insta 306 文件）＝ prompt 的黄金集；观测面自身有契约测试（mock OTLP collector）</text><text x="50" y="746" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start">没有 pass@k 质量基准 → 用在线评审（单次）+ 分析事件（聚合）替代——"没有评估集时最好的两处信号"</text><path d="M150,122 L150,140" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><path d="M150,232 L150,250" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-success)"/><path d="M270,78 L296,78" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow-primary)"/><path d="M600,240 L616,240" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-danger)"/><path d="M745,154 L745,172" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><path d="M745,326 L745,344" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><path d="M450,362 L450,420 Q450,440 430,440 L250,440 Q235,440 235,452 L235,464" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arrow-primary)"/><path d="M745,424 L745,444 Q745,456 733,456 L657,456 Q645,456 645,466" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arrow-danger)"/></svg>
