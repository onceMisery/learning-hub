<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" role="img" aria-label="文件编辑五种接口与选型判据"><title>文件编辑五种接口：可预测性优先于表达力</title><defs><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect x="0" y="0" width="860" height="620" fill="#FFFFFF"/><rect x="120" y="24" width="620" height="40" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="49" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">编辑是 Coding Agent 最高频的失败源：五种接口的失效方式</text><text x="62" y="94" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="start">方案</text><text x="300" y="94" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="start">做法</text><text x="580" y="94" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="start">失效方式</text><line x1="40" y1="102" x2="820" y2="102" stroke="#E2E8F0" stroke-width="1.4"/><rect x="40" y="112" width="780" height="70" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="62" y="140" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">① 差异描述 + Apply</text><text x="62" y="160" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">小模型合并</text><text x="300" y="140" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">大模型说「在哪改什么」，</text><text x="300" y="160" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">小模型合成完整文件</text><text x="580" y="140" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">相似片段合并错位</text><text x="580" y="160" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">Cursor 已弃用</text><rect x="40" y="192" width="780" height="70" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="62" y="220" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#78350F" text-anchor="start">② old → new string</text><text x="62" y="240" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">当前主流收敛处</text><text x="300" y="220" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="start">给出被替换原文与替换后文本；</text><text x="300" y="240" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="start">存在且唯一才成功</text><text x="580" y="220" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">删大段要全文输出</text><text x="580" y="240" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">错一个字符即失败（另见 3.4 传参透明）</text><rect x="40" y="272" width="780" height="70" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="62" y="300" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">③ 行号定位</text><text x="62" y="320" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">大段删除最省</text><text x="300" y="300" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">只给首尾两个行号；</text><text x="300" y="320" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">读文件时每行带真实行号前缀</text><text x="580" y="300" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">一次思考里多处编辑，</text><text x="580" y="320" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">必须统一按初始行号，否则行号自漂</text><rect x="40" y="352" width="780" height="70" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="62" y="380" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#7F1D1D" text-anchor="start">④ 类 Vim 动作序列</text><text x="62" y="400" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">最差的一档</text><text x="300" y="380" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">让模型像人一样 hjkl / 逐步动作</text><text x="300" y="400" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">小模型错误率明显上升</text><text x="580" y="380" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">改后行号无法预先算准</text><text x="580" y="400" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">根因：Vim 为人「持续看状态」设计，</text><text x="580" y="416" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">模型是长思考 + 批量操作</text><rect x="40" y="432" width="780" height="66" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="62" y="460" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#064E3B" text-anchor="start">⑤ 首尾匹配</text><text x="62" y="480" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">兼得可靠与效率</text><text x="300" y="460" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="start">只给待删段的头几行与尾几行，</text><text x="300" y="480" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="start">唯一即定位</text><text x="580" y="460" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="start">删除段本身不唯一时退化</text><rect x="40" y="516" width="780" height="84" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="62" y="542" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">选型判据只有一条：可预测性优先于表达力。</text><text x="62" y="566" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">配套三件：写完由工具层自动跑 lint 并把结构化错误塞回 tool result（「第 10 行：未定义变量 result」）·</text><text x="62" y="586" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">大文件按行号区间读 · 长输出保头保尾切中间并落临时文件引导 read_file（阈值示例 200 行 / 10,000 字符）</text></svg>
