<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" role="img" aria-label="23 个高频问题重排成七段：骨架、执行账、记忆、工具、上下文、上线、终局" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif"><title>23 个高频问题的七段地图</title><rect x="0" y="0" width="860" height="640" fill="#FFFFFF"/><rect x="40" y="20" width="780" height="38" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="44" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">23 个问题重排成七段：从骨架到上线，越往下越接近生产</text><text x="40" y="78" font-size="11.5" fill="#475569" text-anchor="start">面试官不是考背诵，是看你能不能把机制、代价、边界和验证方式串成一条线。</text><rect x="40" y="90" width="100" height="66" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.4"/><text x="90" y="116" font-size="13" font-weight="700" fill="#075985" text-anchor="middle">骨架</text><text x="90" y="138" font-size="10.5" fill="#075985" text-anchor="middle">Q1 · Q4 · Q5 · Q6</text><rect x="150" y="90" width="92" height="66" rx="10" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.2"/><text x="196" y="116" font-size="11" font-weight="600" fill="#075985" text-anchor="middle">Agent 是什么</text><text x="196" y="137" font-size="10.5" fill="#475569" text-anchor="middle">靠什么管住</text><rect x="252" y="90" width="568" height="66" rx="10" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2"/><text x="266" y="114" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">Harness 五要素 · 模块 vs 编排 · LangGraph vs 自研 Loop</text><text x="266" y="136" font-size="10.5" fill="#475569" text-anchor="start">先回答：模型之外的边界怎么立、怎么验、怎么退；Claude Code / OpenClaw 只是两种 Harness 形态。</text><rect x="40" y="164" width="100" height="66" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.4"/><text x="90" y="190" font-size="13" font-weight="700" fill="#155E75" text-anchor="middle">执行账</text><text x="90" y="212" font-size="10.5" fill="#155E75" text-anchor="middle">Q2 · Q3 · Q18</text><rect x="150" y="164" width="92" height="66" rx="10" fill="#FFFFFF" stroke="#67E8F9" stroke-width="1.2"/><text x="196" y="190" font-size="11" font-weight="600" fill="#155E75" text-anchor="middle">一次请求</text><text x="196" y="211" font-size="10.5" fill="#475569" text-anchor="middle">怎么跑完</text><rect x="252" y="164" width="568" height="66" rx="10" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.2"/><text x="266" y="188" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">TTFT 时间线 · 每成功任务成本 · 主从执行与失败恢复</text><text x="266" y="210" font-size="10.5" fill="#475569" text-anchor="start">再回答：首 token 为什么慢、钱花在哪、失败了到底该重试还是交人。</text><rect x="40" y="238" width="100" height="66" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/><text x="90" y="264" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">记忆</text><text x="90" y="286" font-size="10.5" fill="#5B21B6" text-anchor="middle">Q7 · Q8 · Q9 · Q12</text><rect x="150" y="238" width="92" height="66" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.2"/><text x="196" y="264" font-size="11" font-weight="600" fill="#5B21B6" text-anchor="middle">经验怎么用</text><text x="196" y="285" font-size="10.5" fill="#475569" text-anchor="middle">才不害人</text><rect x="252" y="238" width="568" height="66" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.2"/><text x="266" y="262" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">经验记忆设计 · 召回有效性 · 边界与撤回 · 工具结果关联</text><text x="266" y="284" font-size="10.5" fill="#475569" text-anchor="start">高发追问：怎么记得住，又不被一次错误经验传染到所有任务。</text><rect x="40" y="312" width="100" height="66" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="90" y="338" font-size="13" font-weight="700" fill="#78350F" text-anchor="middle">工具</text><text x="90" y="355" font-size="10.5" fill="#78350F" text-anchor="middle">Q10 · Q11</text><text x="90" y="370" font-size="10.5" fill="#78350F" text-anchor="middle">Q13 · Q14</text><rect x="150" y="312" width="92" height="66" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.2"/><text x="196" y="338" font-size="11" font-weight="600" fill="#78350F" text-anchor="middle">能力怎么接</text><text x="196" y="359" font-size="10.5" fill="#475569" text-anchor="middle">怎么不出事</text><rect x="252" y="312" width="568" height="66" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/><text x="266" y="336" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">七部分契约 · 大结果治理 · 并发冲突 · 错误分类</text><text x="266" y="358" font-size="10.5" fill="#475569" text-anchor="start">高发追问：工具怎么加载、权限挂哪、结果太大怎么办、并发改配置怎么收。</text><rect x="40" y="386" width="100" height="66" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/><text x="90" y="412" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">上下文</text><text x="90" y="434" font-size="10.5" fill="#065F46" text-anchor="middle">Q15 · Q16 · Q17</text><rect x="150" y="386" width="92" height="66" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/><text x="196" y="412" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">窗口怎么不爆</text><text x="196" y="433" font-size="10.5" fill="#475569" text-anchor="middle">责任怎么分</text><rect x="252" y="386" width="568" height="66" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/><text x="266" y="410" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">长对话压缩 · C 端 Prompt 与审核 · 多 Agent 隔离</text><text x="266" y="432" font-size="10.5" fill="#475569" text-anchor="start">高发追问：窗口爆了怎么压、敏感内容能不能只靠审核、子 Agent 为什么省上下文。</text><rect x="40" y="460" width="100" height="66" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="90" y="486" font-size="13" font-weight="700" fill="#7F1D1D" text-anchor="middle">上线</text><text x="90" y="508" font-size="10.5" fill="#7F1D1D" text-anchor="middle">Q19 · Q20 · Q21</text><rect x="150" y="460" width="92" height="66" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2"/><text x="196" y="486" font-size="11" font-weight="600" fill="#7F1D1D" text-anchor="middle">出事怎么查</text><text x="196" y="507" font-size="10.5" fill="#475569" text-anchor="middle">好坏怎么量</text><rect x="252" y="460" width="568" height="66" rx="10" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.2"/><text x="266" y="484" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">认知故障排查 · 自动排障 Agent · 评估与 Pass^k</text><text x="266" y="506" font-size="10.5" fill="#475569" text-anchor="start">上线后：怎么从「日志全绿但做错了」里定位，怎么评，怎么把排障做成 Agent。</text><rect x="40" y="534" width="100" height="66" rx="10" fill="#E2E8F0" stroke="#475569" stroke-width="1.4"/><text x="90" y="560" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">终局</text><text x="90" y="582" font-size="10.5" fill="#1E293B" text-anchor="middle">Q22 · Q23</text><rect x="150" y="534" width="92" height="66" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="196" y="560" font-size="11" font-weight="600" fill="#1E293B" text-anchor="middle">往哪走</text><text x="196" y="581" font-size="10.5" fill="#475569" text-anchor="middle">何时动权重</text><rect x="252" y="534" width="568" height="66" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/><text x="266" y="558" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">未来三迁移 · 什么时候微调</text><text x="266" y="580" font-size="10.5" fill="#475569" text-anchor="start">收尾：模型会商品化，差异在 Harness、领域数据、评估闭环与信任。</text><rect x="40" y="612" width="780" height="20" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" stroke-dasharray="5 4"/><text x="430" y="626" font-size="10.5" fill="#475569" text-anchor="middle">读法：Q1~Q6 立骨架，Q7~Q14 是记忆与工具的高发追问区，Q15~Q21 面向生产，Q22~Q23 收在判断力。</text></svg>
