<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660" role="img" aria-label="线上服务自动排障 Agent 的结构：信号接入、证据层、假设引擎、逐项验证、处置审批、复盘写回，以及护栏与效果指标" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif"><title>线上服务自动排障 Agent 结构</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect x="0" y="0" width="880" height="660" fill="#FFFFFF"/><rect x="40" y="20" width="800" height="38" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="440" y="44" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">线上排障 Agent：证据驱动，不是让模型猜根因</text><text x="40" y="76" font-size="11.5" fill="#475569" text-anchor="start">每个假设都要有验证动作；默认只读，高风险处置必须审批，先做准再做自动。</text><rect x="40" y="90" width="106" height="48" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/><text x="93" y="110" font-size="10.5" font-weight="600" fill="#075985" text-anchor="middle">指标</text><text x="93" y="127" font-size="9.2" fill="#075985" text-anchor="middle">QPS · 错误率 · P99</text><rect x="156" y="90" width="106" height="48" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/><text x="209" y="110" font-size="10.5" font-weight="600" fill="#075985" text-anchor="middle">日志</text><text x="209" y="127" font-size="9.2" fill="#075985" text-anchor="middle">错误 · 异常 · 关键词</text><rect x="272" y="90" width="106" height="48" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/><text x="325" y="110" font-size="10.5" font-weight="600" fill="#075985" text-anchor="middle">Trace</text><text x="325" y="127" font-size="9.2" fill="#075985" text-anchor="middle">链路 · span · 耗时</text><rect x="388" y="90" width="106" height="48" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/><text x="441" y="110" font-size="10.5" font-weight="600" fill="#075985" text-anchor="middle">事件</text><text x="441" y="127" font-size="9.2" fill="#075985" text-anchor="middle">告警 · 重启 · OOM</text><rect x="504" y="90" width="106" height="48" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/><text x="557" y="110" font-size="10.5" font-weight="600" fill="#075985" text-anchor="middle">发布</text><text x="557" y="127" font-size="9.2" fill="#075985" text-anchor="middle">版本 · 时间 · diff</text><rect x="620" y="90" width="106" height="48" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/><text x="673" y="110" font-size="10.5" font-weight="600" fill="#075985" text-anchor="middle">配置</text><text x="673" y="127" font-size="9.2" fill="#075985" text-anchor="middle">变更 · 开关 · 证书</text><rect x="736" y="90" width="104" height="48" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/><text x="788" y="110" font-size="10.5" font-weight="600" fill="#075985" text-anchor="middle">拓扑</text><text x="788" y="127" font-size="9.2" fill="#075985" text-anchor="middle">服务 · 依赖 · 实例</text><path d="M440,138 L440,154" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="40" y="160" width="800" height="48" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/><text x="54" y="181" font-size="11.5" font-weight="700" fill="#5B21B6" text-anchor="start">证据层</text><text x="120" y="181" font-size="10.5" fill="#4C1D95" text-anchor="start">时间对齐 · 服务拓扑 · 变更关联 · 基线对比 · 影响面</text><text x="54" y="200" font-size="9.8" fill="#6D28D9" text-anchor="start">先把「10:03 开始 5xx」和「10:01 发布」对齐，再谈根因；单条指标不是证据链。</text><path d="M440,208 L440,224" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="40" y="230" width="390" height="88" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="54" y="252" font-size="11.5" font-weight="700" fill="#78350F" text-anchor="start">假设引擎</text><text x="54" y="274" font-size="10.3" fill="#78350F" text-anchor="start">规则（磁盘/证书/依赖）+ 异常检测 + LLM</text><text x="54" y="294" font-size="10.3" fill="#78350F" text-anchor="start">先列候选根因，按先验排序，不急着下结论</text><text x="54" y="311" font-size="9.8" fill="#92400E" text-anchor="start">每个假设必须带一个可执行的验证动作</text><rect x="450" y="230" width="390" height="88" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/><text x="464" y="252" font-size="11.5" font-weight="700" fill="#065F46" text-anchor="start">逐项验证</text><text x="464" y="274" font-size="10.3" fill="#065F46" text-anchor="start">查指标 / 日志 / trace / 发布 / 配置 / canary</text><text x="464" y="294" font-size="10.3" fill="#065F46" text-anchor="start">输出：支持 / 不支持 / 不确定，不输出故事</text><text x="464" y="311" font-size="9.8" fill="#047857" text-anchor="start">支持才保留，不支持就排除，避免确认偏误</text><path d="M430,274 L448,274" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M440,318 L440,334" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="40" y="338" width="145" height="68" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="112" y="361" font-size="11" font-weight="700" fill="#78350F" text-anchor="middle">处置建议</text><text x="112" y="380" font-size="9.6" fill="#92400E" text-anchor="middle">回滚 / 扩容 / 重启</text><text x="112" y="396" font-size="9.6" fill="#92400E" text-anchor="middle">附证据和影响面</text><rect x="201" y="338" width="145" height="68" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="273" y="361" font-size="11" font-weight="700" fill="#7F1D1D" text-anchor="middle">审批门</text><text x="273" y="380" font-size="9.6" fill="#991B1B" text-anchor="middle">动作/对象/版本/时效</text><text x="273" y="396" font-size="9.6" fill="#991B1B" text-anchor="middle">高风险必须人批</text><rect x="362" y="338" width="145" height="68" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/><text x="434" y="361" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">执行</text><text x="434" y="380" font-size="9.6" fill="#475569" text-anchor="middle">限定爆炸半径</text><text x="434" y="396" font-size="9.6" fill="#475569" text-anchor="middle">可取消 / 可回滚</text><rect x="523" y="338" width="145" height="68" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/><text x="595" y="361" font-size="11" font-weight="700" fill="#065F46" text-anchor="middle">验证恢复</text><text x="595" y="380" font-size="9.6" fill="#047857" text-anchor="middle">指标 / 错误率 / 延迟</text><text x="595" y="396" font-size="9.6" fill="#047857" text-anchor="middle">没恢复就回滚</text><rect x="684" y="338" width="156" height="68" rx="10" fill="#E2E8F0" stroke="#475569" stroke-width="1.4"/><text x="762" y="361" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">复盘写回</text><text x="762" y="380" font-size="9.6" fill="#334155" text-anchor="middle">案例 / Runbook / 记忆</text><text x="762" y="396" font-size="9.6" fill="#334155" text-anchor="middle">带服务与版本作用域</text><path d="M185,372 L199,372" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M346,372 L360,372" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M507,372 L521,372" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M668,372 L682,372" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="40" y="444" width="800" height="58" rx="10" fill="#FFF1F2" stroke="#DC2626" stroke-width="1.4"/><text x="54" y="466" font-size="11.5" font-weight="700" fill="#7F1D1D" text-anchor="start">护栏</text><text x="96" y="466" font-size="10.3" fill="#991B1B" text-anchor="start">默认只读 · 审批绑定动作/对象/版本 · 爆炸半径 · 超时/限流 · 全量审计 · kill switch</text><text x="54" y="488" font-size="10" fill="#991B1B" text-anchor="start">不要让 LLM 直接写生产；危险命令走白名单；只读诊断命令也要沙箱和超时。</text><rect x="40" y="516" width="800" height="70" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/><text x="54" y="538" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="start">效果指标</text><text x="54" y="560" font-size="10.3" fill="#334155" text-anchor="start">MTTD · MTTA · MTTR · Top-1/Top-3 定位准确率 · 证据完整率 · 误报率</text><text x="54" y="578" font-size="10.3" fill="#334155" text-anchor="start">人工接管率 · 自动处置成功率 · 回滚成功率 · 二次事故率 · 每次事件成本</text><text x="40" y="616" font-size="10.5" font-weight="600" fill="#0F172A" text-anchor="start">落地顺序：L1 只读副驾（证据包 + 假设）→ L2 审批后处置 → L3 低风险已知 Runbook 自动处置。</text><text x="40" y="636" font-size="10.5" fill="#475569" text-anchor="start">最终效果不是「AI 全自动修生产」，而是更快定位、更全证据、更安全的处置，以及可复用的复盘。</text></svg>
