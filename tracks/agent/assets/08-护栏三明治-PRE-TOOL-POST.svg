<svg xmlns="http://www.w3.org/2000/svg" width="860" height="760" viewBox="0 0 860 760" role="img" aria-label="护栏三明治：行动前准入、行动中约束、行动后校验"><title>护栏三明治：PRE → TOOL → POST</title><defs><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect x="0" y="0" width="860" height="760" fill="#FFFFFF"/><rect x="230" y="24" width="400" height="48" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="53.6" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">高风险行动请求（模型只是提议者）</text><rect x="60" y="104" width="740" height="196" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6" stroke-dasharray="6 4"/><text x="86" y="128" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#78350F" text-anchor="start">PRE 行动前准入 · 钩子链（便宜且确定的先跑）</text><rect x="84" y="144" width="128" height="44" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="148" y="163" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#78350F" text-anchor="middle">schema 校验</text><text x="148" y="180" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">缺字段先拦</text><rect x="232" y="144" width="128" height="44" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="296" y="163" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#78350F" text-anchor="middle">身份/租户权限</text><text x="296" y="180" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">对象归属校验</text><rect x="380" y="144" width="128" height="44" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="444" y="163" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#78350F" text-anchor="middle">金额·频率·预算</text><text x="444" y="180" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">黑名单/账户态</text><rect x="528" y="144" width="128" height="44" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="592" y="163" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#78350F" text-anchor="middle">对象版本新鲜度</text><text x="592" y="180" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">fresh read 重读</text><rect x="676" y="144" width="100" height="44" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="726" y="163" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#78350F" text-anchor="middle">幂等键</text><text x="726" y="180" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">审批票据</text><path d="M212,166 L228,166" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-decision)"/><path d="M360,166 L376,166" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-decision)"/><path d="M508,166 L524,166" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-decision)"/><path d="M656,166 L672,166" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-decision)"/><text x="86" y="216" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#475569" text-anchor="start">钩子自身崩溃默认拒绝（fail closed）· 新策略先跑影子模式换命中率/误杀率 · 审批通过≠现在仍可执行</text><text x="86" y="240" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#475569" text-anchor="start">参数规范化要同时留「请求参数」与「有效参数」（深拷贝），否则事故后证据链断裂</text><rect x="84" y="256" width="230" height="34" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="199" y="278" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#7F1D1D" text-anchor="middle">任一钩子拒绝 → blocked_pre</text><path d="M330,273 L368,273" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-danger)"/><text x="374" y="278" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#7F1D1D" text-anchor="start">工具未运行 · 外部副作用 0 次</text><path d="M430,72 L430,100" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-neutral)"/><rect x="60" y="330" width="740" height="170" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="6 4"/><text x="86" y="354" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#1E3A8A" text-anchor="start">TOOL 行动中约束 · 受控执行器是唯一入口</text><rect x="84" y="370" width="220" height="48" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="194" y="390" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">引用监视器三条件</text><text x="194" y="408" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">必检 · 不可绕过 · 小而可验证</text><rect x="330" y="370" width="300" height="48" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="480" y="390" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">执行状态至少五态</text><text x="480" y="408" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">NOT_STARTED→…→FAILED / UNKNOWN</text><rect x="652" y="370" width="124" height="48" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="714" y="390" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#7F1D1D" text-anchor="middle">UNKNOWN</text><text x="714" y="408" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="middle">禁止立即重试</text><path d="M714,418 L714,444 Q714,454 704,454 L560,454" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-danger)"/><rect x="330" y="436" width="230" height="36" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="445" y="459" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#78350F" text-anchor="middle">用同一幂等键查外部真实结果再定</text><text x="86" y="486" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#475569" text-anchor="start">"调用报错" ≠ "外部操作失败"：银行已入账但返回超时、邮件已接收但确认前断连</text><path d="M430,300 L430,326" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#059669" stroke-width="1.7" marker-end="url(#arrow-success)"/><rect x="60" y="530" width="740" height="150" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 4"/><text x="86" y="554" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#064E3B" text-anchor="start">POST 行动后校验 · 管住发布，不假装撤销</text><rect x="84" y="570" width="230" height="48" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="199" y="590" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#064E3B" text-anchor="middle">结果过闸才可发布</text><text x="199" y="608" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="middle">原始输出与可发布输出分开留存</text><rect x="330" y="570" width="230" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="445" y="590" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#78350F" text-anchor="middle">blocked_post</text><text x="445" y="608" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">只拦发布 · 外部影响可能已发生</text><rect x="576" y="570" width="200" height="48" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="676" y="590" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#7F1D1D" text-anchor="middle">compensated ≠ 已标记</text><text x="676" y="608" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="middle">要外部系统确认恢复</text><text x="86" y="648" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#475569" text-anchor="start">补偿是持久状态机：发现 → 建任务 → 调用补偿 → 确认恢复；带重试预算、死信队列与人工核实</text><path d="M430,500 L430,526" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-neutral)"/><rect x="60" y="704" width="740" height="40" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="430" y="729" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">三种绕过要常备：组合绕行（看信息流）· 契约漂移（同一份版本化契约生成守卫）· 补偿幻觉（四步四态）</text></svg>
