<svg xmlns="http://www.w3.org/2000/svg" width="860" height="740" viewBox="0 0 860 740" role="img" aria-label="Context Window = f(Context) 五段流水线与分层货架"><title>f 流水线与分层货架</title><defs><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrow-decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs><rect x="0" y="0" width="860" height="740" fill="#FFFFFF"/><rect x="40" y="30" width="200" height="120" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="140" y="56" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">Context（仓库）</text><text x="140" y="80" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">用户交付物 · Agent 产物</text><text x="140" y="98" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">内部数据 · 外部数据</text><text x="140" y="122" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#64748B" text-anchor="middle">可无限增长</text><rect x="290" y="30" width="120" height="120" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><text x="350" y="56" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#1E3A8A" text-anchor="middle">Retrieve</text><text x="350" y="80" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">可能相关</text><text x="350" y="100" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">向量 / ES / DB</text><rect x="440" y="30" width="120" height="120" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><text x="500" y="56" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#1E3A8A" text-anchor="middle">Select</text><text x="500" y="80" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">真正相关</text><text x="500" y="100" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">规则/检索/模型</text><rect x="590" y="30" width="120" height="120" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><text x="650" y="56" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#78350F" text-anchor="middle">Compress</text><text x="650" y="80" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">按余量定档</text><text x="650" y="100" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">禁区不压</text><rect x="290" y="180" width="120" height="60" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><text x="350" y="206" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#1E3A8A" text-anchor="middle">Order</text><text x="350" y="226" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">重要性×稳定性</text><rect x="440" y="180" width="120" height="60" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><text x="500" y="206" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#1E3A8A" text-anchor="middle">Inject</text><text x="500" y="226" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">首尾三明治装配</text><rect x="620" y="180" width="200" height="60" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.6"/><text x="720" y="206" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#064E3B" text-anchor="middle">Context Window（台面）</text><text x="720" y="226" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="middle">模型唯一的世界 · 台面有尺寸</text><path d="M240,90 L286,90" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-neutral)"/><path d="M410,90 L436,90" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-neutral)"/><path d="M560,90 L586,90" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-neutral)"/><path d="M650,150 L650,166 Q650,176 638,176 L512,176 Q500,176 500,184" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7"/><path d="M560,210 L616,210" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#059669" stroke-width="1.7" marker-end="url(#arrow-success)"/><path d="M410,210 L436,210" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-neutral)"/><text x="290" y="278" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#475569" text-anchor="start">三个输入：有什么（Retrieve/Select）· 正在做什么（TaskState）· 还能放多少（TokenBudget）</text><rect x="40" y="310" width="780" height="230" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="60" y="336" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#334155" text-anchor="start">分层货架（预算优先级 ≠ 物理摆放顺序）</text><rect x="64" y="352" width="176" height="164" rx="9" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="152" y="376" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#7F1D1D" text-anchor="middle">L0 系统宪法 ~8%</text><text x="152" y="400" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="middle">永久常驻 · 永不压缩</text><text x="152" y="420" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="middle">只能被执行</text><text x="152" y="440" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="middle">不能被覆盖</text><rect x="256" y="352" width="176" height="164" rx="9" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="344" y="376" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#78350F" text-anchor="middle">L1 状态与计划 ~15%</text><text x="344" y="400" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">任务期内常驻 · 不压</text><text x="344" y="424" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">Goal / 硬约束 / Plan</text><text x="344" y="448" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">关键事实</text><rect x="448" y="352" width="176" height="164" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="536" y="376" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">L2 RAG 与记忆 ~35%</text><text x="536" y="400" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">按需注入 · 可压缩</text><text x="536" y="424" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">目录+摘要进窗</text><text x="536" y="448" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">原文挂 handle</text><rect x="640" y="352" width="156" height="164" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="718" y="376" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">L3 历史与日志 ~42%</text><text x="718" y="400" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">轮转 · 优先压缩</text><text x="718" y="424" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">从最老处开始压</text><text x="718" y="448" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">is_error 有保护位</text><rect x="40" y="566" width="780" height="66" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 4"/><text x="60" y="592" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#78350F" text-anchor="start">覆盖纪律：内层可临时影响外层的"使用"，不能自动改写外层的"事实"</text><text x="60" y="616" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#78350F" text-anchor="start">项目层可覆盖通用默认 · 用户层只影响表达不改写项目红线 · 草稿层只提候选，不污染长期记忆</text><rect x="40" y="656" width="780" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="430" y="680" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">分诊判据：会不会影响下一步决策 · 丢了会不会出事 · 还能不能找回来</text><text x="430" y="700" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">每次分诊落一条 TriageDecision 留痕：selected / compressed / deferred / dropped + reason + budget</text></svg>
