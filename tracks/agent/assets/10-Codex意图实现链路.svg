<svg xmlns="http://www.w3.org/2000/svg" width="830" height="840" viewBox="0 0 830 840" role="img" aria-label="Codex 的意图实现链路：代码判定、槽位解析、按意图装载"><title>Codex 意图实现链路</title><defs><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect x="0" y="0" width="830" height="840" fill="#FFFFFF"/><rect x="265" y="24" width="300" height="48" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="415" y="53.6" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">用户输入</text><rect x="265" y="104" width="300" height="52" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="415" y="127" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="15" font-weight="600" fill="#78350F" text-anchor="middle">是否显式意图？（零模型调用）</text><text x="415" y="147" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#78350F" text-anchor="middle">TUI 斜杠命令 · CLI 参数 · 程序化调用</text><rect x="265" y="188" width="300" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="415" y="212" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14.5" font-weight="600" fill="#0F172A" text-anchor="middle">代码规则判定</text><text x="415" y="232" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#475569" text-anchor="middle">build_review_request：--uncommitted →</text><text x="415" y="247" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#475569" text-anchor="middle">--base → --commit → 自定义指令</text><rect x="265" y="286" width="300" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="415" y="310" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14.5" font-weight="600" fill="#0F172A" text-anchor="middle">槽位解析 ReviewTarget</text><text x="415" y="330" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#475569" text-anchor="middle">BaseBranch{branch} → git 工具算 merge base</text><text x="415" y="345" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#475569" text-anchor="middle">槽位值可来自工具结果，不只来自用户</text><rect x="265" y="384" width="300" height="48" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="415" y="413.6" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="15" font-weight="600" fill="#78350F" text-anchor="middle">判断：参数能拼出合法目标？</text><rect x="265" y="466" width="300" height="110" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.6"/><text x="415" y="490" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14.5" font-weight="600" fill="#064E3B" text-anchor="middle">按意图装载运行时</text><text x="415" y="512" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#064E3B" text-anchor="middle">换模型 review_model · 裁工具 WebSearch 关</text><text x="415" y="532" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#064E3B" text-anchor="middle">装 Spec rubric.md · 起 ReviewTask 子流程</text><text x="415" y="552" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#064E3B" text-anchor="middle">发 EnteredReviewMode 事件让 UI 切模式</text><rect x="611" y="384" width="190" height="64" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="706" y="408" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#7F1D1D" text-anchor="middle">拒识：bail!</text><text x="706" y="430" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="middle">不硬归一个最像的</text><rect x="265" y="620" width="300" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="415" y="644" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14.5" font-weight="600" fill="#0F172A" text-anchor="middle">默认路径 RegularTask</text><text x="415" y="664" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#475569" text-anchor="middle">不做任何分类，把判断权完整交给模型</text><rect x="265" y="722" width="300" height="48" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="415" y="751.6" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">进入主循环（TAO）</text><path d="M415,72 L415,100" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-neutral)"/><path d="M415,156 L415,184" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#D97706" stroke-width="1.7" marker-end="url(#arrow-decision)"/><rect x="421" y="162" width="34" height="16" rx="3" fill="#FFFFFF" stroke="none"/><text x="425" y="174" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">是</text><path d="M415,252 L415,282" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-neutral)"/><path d="M415,350 L415,380" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-neutral)"/><path d="M415,432 L415,462" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#059669" stroke-width="1.7" marker-end="url(#arrow-success)"/><rect x="421" y="440" width="34" height="16" rx="3" fill="#FFFFFF" stroke="none"/><text x="425" y="452" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">是</text><path d="M565,408 L607,408" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#DC2626" stroke-width="1.7" marker-end="url(#arrow-danger)"/><rect x="565" y="386" width="42" height="16" rx="3" fill="#FFFFFF" stroke="none"/><text x="569" y="398" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">否</text><path d="M340,130 L200,130 Q190,130 190,140 L190,636 Q190,652 205,652 L261,652" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-neutral)"/><rect x="196" y="108" width="34" height="16" rx="3" fill="#FFFFFF" stroke="none"/><text x="200" y="120" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">否</text><path d="M415,576 L415,616" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-neutral)"/><path d="M415,684 L415,718" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-neutral)"/><rect x="40" y="200" width="150" height="150" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="115" y="224" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">意图枚举封闭</text><text x="115" y="248" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">TaskKind ∈</text><text x="115" y="266" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">Regular / Review /</text><text x="115" y="284" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">Compact</text><text x="115" y="310" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#64748B" text-anchor="middle">集合小且封闭，</text><text x="115" y="328" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#64748B" text-anchor="middle">所以不需要分类器</text><rect x="640" y="200" width="160" height="120" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="720" y="224" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">正交性由代码保证</text><text x="720" y="248" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">clap 参数声明</text><text x="720" y="266" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">conflicts_with_all，</text><text x="720" y="284" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">冲突在解析层就失败，</text><text x="720" y="302" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">不劳模型区分</text><rect x="40" y="788" width="750" height="40" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="415" y="813" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">能确定的意图用代码判定，确定不了的才交给模型——显式意图链路全程零模型调用</text></svg>
