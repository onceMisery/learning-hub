" text-anchor="middle">flush 屏障</text><text x="750" y="348" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="middle">终态事件发出前先落盘再通知</text><rect x="640" y="392" width="220" height="60" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="750" y="414" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">resume = 重放重建</text><text x="750" y="434" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">RolloutReconstruction：历史+基线+窗口</text><rect x="640" y="482" width="220" height="56" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="750" y="504" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#7F1D1D" text-anchor="middle">子代理扇出硬封顶</text><text x="750" y="524" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="middle">agent_max_threads=6 · max_depth=1</text><path d="M300,130 L340,130" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow-neutral)"/><path d="M300,240 Q620,180 636,232" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow-neutral)"/><path d="M750,276 L750,302" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow-success)"/><path d="M750,362 L750,388" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow-neutral)"/><path d="M170,56 L170,10 L750,10 L750,200" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow-neutral)"/><rect x="60" y="640" width="780" height="116" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="80" y="666" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="start">读图要点</text><text x="80" y="690" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#475569" text-anchor="start">· 收束靠 token 水位线与可被钩子否决的停止判定，全仓没有 max_steps 计数器；唯一的数量级熔断在子代理扇出</text><text x="80" y="712" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#475569" text-anchor="start">· 没有计划对象参与调度：工具名未知降级为一条回话，护栏是"审批→沙箱→尝试→升级"四段式且批准可回写规则</text><text x="80" y="734" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#475569" text-anchor="start">· 恢复粒度是"轮"：事件溯源重建执行现场，但没有步骤级检查点重跑与业务幂等账本——编码类 Agent 的合理取舍</text></svg>
