<svg xmlns="http://www.w3.org/2000/svg" width="860" height="700" viewBox="0 0 860 700" role="img" aria-label="Computer Use 与机器人的观察动作闭环对照，含频率阶梯、坐标缩放与动作分块"><title>观察—动作闭环对照：屏幕与物理世界</title><defs><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrow-decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect x="0" y="0" width="860" height="700" fill="#FFFFFF"/><rect x="140" y="20" width="580" height="38" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="44" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">看懂界面 ≠ 完成任务：闭环要能处理加载、状态变化与不可逆后果</text><text x="40" y="82" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A" text-anchor="start">Computer Use 的四步闭环（一次只出一个动作）</text><rect x="40" y="92" width="150" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="115" y="112" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#0F172A" text-anchor="middle">截图</text><text x="115" y="128" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">screenshot / cursor_position</text><rect x="210" y="92" width="150" height="44" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="285" y="112" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">思考 + 一个动作</text><text x="285" y="128" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#78350F" text-anchor="middle">多模态模型出参</text><rect x="380" y="92" width="150" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="455" y="112" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#0F172A" text-anchor="middle">执行层执行</text><text x="455" y="128" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">click / type / scroll / wait</text><rect x="550" y="92" width="140" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="620" y="112" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#0F172A" text-anchor="middle">等界面响应</text><text x="620" y="128" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">动画与加载</text><rect x="710" y="92" width="110" height="44" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="765" y="112" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#064E3B" text-anchor="middle">再截图</text><text x="765" y="128" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#064E3B" text-anchor="middle">闭环</text><path d="M190,114 L208,114" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/><path d="M360,114 L378,114" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/><path d="M530,114 L548,114" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/><path d="M690,114 L708,114" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/><path d="M765,136 Q765,158 700,158 L180,158 Q115,158 115,140" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-decision)"/><text x="430" y="176" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#78350F" text-anchor="middle">回流：新画面决定下一步；跳过「等响应」就变成按旧图点新界面</text><text x="40" y="212" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">视觉定位三条路（判据：结构化可得就优先 DOM / 无障碍树）</text><rect x="40" y="222" width="250" height="86" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="56" y="244" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">选择题 · Set-of-Mark</text><text x="56" y="264" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">SAM / SEEM 分割候选区叠编号，</text><text x="56" y="280" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">模型报编号、系统换算中心坐标</text><text x="56" y="298" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">不依赖 DOM，桌面与游戏可用；有漏检误检</text><rect x="305" y="222" width="250" height="86" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="321" y="244" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#064E3B" text-anchor="start">选择题 · 结构化元素索引</text><text x="321" y="264" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">CDP 取 DOM 与无障碍信息 → 检测可交互</text><text x="321" y="280" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">元素 → 标 ID 并画框 → 同时生成文本列表</text><text x="321" y="298" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">不省 token，但定位稳定、无分割误差</text><rect x="570" y="222" width="250" height="86" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="586" y="244" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#78350F" text-anchor="start">纯坐标预测</text><text x="586" y="264" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">SeeClick / Claude computer use：直接出 (x, y)</text><text x="586" y="280" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">省 token，但依赖训练分辨率</text><text x="586" y="298" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#7F1D1D" text-anchor="start">缩放必须按宽高比选目标，见下方算式</text><rect x="40" y="322" width="380" height="130" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="56" y="346" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#7F1D1D" text-anchor="start">坐标缩放：双向 + 按宽高比选目标</text><text x="56" y="370" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">真屏 2560×1440（16:9）→ 缩放到 1366×768</text><text x="56" y="392" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">模型给 (683, 384) → 反映射 (683×2560/1366, 384×1440/768)</text><text x="56" y="412" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#7F1D1D" text-anchor="start">≈ (1280, 720)</text><text x="56" y="436" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">把 16:9 硬拉进 4:3 会横向压扁，坐标系统性偏移——日志里看不出来</text><rect x="440" y="322" width="380" height="130" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="456" y="346" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">「屏幕是静止的」这个隐含假设要拆</text><text x="456" y="370" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">观察接口三件：关键帧截图（小模型判显著变化，</text><text x="456" y="388" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">变化频繁时每秒 1 次已有效果）· 音量门控转写 ·</text><text x="456" y="406" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">把截图写成一句持久文字（多模态历史压缩）</text><text x="456" y="430" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#7F1D1D" text-anchor="start">世界模型：只用于比较候选与检查状态差异，不代替验收</text><text x="40" y="482" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#064E3B" text-anchor="start">机器人：同一闭环推到毫秒级——分层频率与双时钟</text><rect x="40" y="492" width="520" height="120" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="56" y="514" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#0F172A" text-anchor="start">任务目标 分钟级 → 长程规划 秒—分钟 → 基本技能 pick / place 约 1—3 秒</text><text x="56" y="536" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#0F172A" text-anchor="start">VLA 技能策略 约 1—10 Hz 推理 ｜ 底层控制与安全 约 50—1000 Hz（限速、急停）</text><text x="56" y="560" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#7F1D1D" text-anchor="start">模型不得直接输出任意关节角：只选有边界的技能，由标定过、限速、带超时的执行器落地</text><text x="56" y="584" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">每完成一个技能必须重新观察并检查后置条件；失败只重试当前步，目标变了只重规划受影响的后续</text><rect x="580" y="492" width="240" height="120" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="596" y="514" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#78350F" text-anchor="start">动作分块不是免费的</text><rect x="596" y="524" width="208" height="14" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/><text x="602" y="546" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#78350F" text-anchor="start">长块：更平滑，但新画面更少</text><rect x="596" y="558" width="80" height="14" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/><rect x="684" y="558" width="80" height="14" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/><text x="772" y="570" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#78350F" text-anchor="start">短块</text><text x="596" y="592" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#7F1D1D" text-anchor="start">途中杯子被碰动，仍在执行旧画面的动作</text><rect x="40" y="628" width="780" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="56" y="652" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">读法：上下两组是同一个循环——持续感知 → 判状态与时机 → 选动作 → 输出进环境 → 观察反馈；差别只在时间尺度与不可逆性。</text><text x="56" y="672" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">OSWorld-Human：达到人类准确率，步数与等待仍显著多于人类——所以验收要同时测成功率、步数与墙钟时间。</text></svg>
