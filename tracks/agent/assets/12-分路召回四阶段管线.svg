<svg xmlns="http://www.w3.org/2000/svg" width="860" height="780" viewBox="0 0 860 780" role="img" aria-label="分路召回：写入四分类与读取四阶段管线"><title>分路召回：分类存、分路召</title><defs><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrow-decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect x="0" y="0" width="860" height="780" fill="#FFFFFF"/><rect x="330" y="22" width="200" height="40" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="47.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14.5" font-weight="600" fill="#0F172A" text-anchor="middle">新信息写入</text><rect x="300" y="86" width="260" height="52" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="430" y="108" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#78350F" text-anchor="middle">MemoryClassifier（写入侧）</text><text x="430" y="128" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">轻量模型 · temperature=0 · 不用正则</text><path d="M430,62 L430,82" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-neutral)"/><rect x="40" y="170" width="185" height="96" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="132" y="192" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#7F1D1D" text-anchor="middle">CONSTRAINT 约束</text><text x="132" y="212" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">否定句为主 · 与任务正交</text><text x="132" y="232" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">force_recall=true</text><text x="132" y="250" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">+ trigger_conditions</text><rect x="245" y="170" width="185" height="96" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="337" y="192" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">FACT 事实</text><text x="337" y="212" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">当前状态 · 会被覆写</text><text x="337" y="232" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">稳定 entity_id</text><text x="337" y="250" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">做 upsert</text><rect x="450" y="170" width="185" height="96" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="542" y="192" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">PREFERENCE 偏好</text><text x="542" y="212" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">软性指导</text><text x="542" y="232" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">不设 TTL</text><text x="542" y="250" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">冲突时让位于约束</text><rect x="655" y="170" width="185" height="96" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="747" y="192" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">EPISODIC 情节</text><text x="747" y="212" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">历史事件 · 只追加</text><text x="747" y="232" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">带 ttl_days</text><text x="747" y="250" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">过期自然衰减</text><path d="M380,138 L132,166" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-danger)"/><path d="M413,138 L337,166" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><path d="M447,138 L542,166" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><path d="M480,138 L747,166" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><rect x="40" y="306" width="120" height="44" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="100" y="333.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">当前查询</text><rect x="210" y="296" width="150" height="64" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="285" y="318" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#7F1D1D" text-anchor="middle">S1 规则硬召回</text><text x="285" y="336" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#7F1D1D" text-anchor="middle">不算余弦 · 不卡阈值</text><text x="285" y="352" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#7F1D1D" text-anchor="middle">触发条件匹配即在场</text><rect x="380" y="296" width="150" height="64" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="455" y="318" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#78350F" text-anchor="middle">S2 精确召回</text><text x="455" y="336" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#78350F" text-anchor="middle">BM25 / 关键词</text><text x="455" y="352" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#78350F" text-anchor="middle">API 名 · 表名 · 错误码</text><rect x="550" y="296" width="150" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="625" y="318" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">S3 语义召回</text><text x="625" y="336" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">向量 + 重排</text><text x="625" y="352" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">偏好 / 情节归概率域</text><rect x="720" y="296" width="120" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="780" y="318" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">S4 实体图谱</text><text x="780" y="336" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">状态类</text><text x="780" y="352" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">返回最新值</text><path d="M160,328 L206,328" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-neutral)"/><text x="470" y="396" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">四通道并行发起 ↓ · 合并严格串行</text><rect x="210" y="416" width="630" height="150" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 4"/><text x="234" y="440" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#064E3B" text-anchor="start">串行合并：按优先级逐阶段填 Token 预算（示例 4000）</text><rect x="234" y="454" width="250" height="34" rx="7" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.3"/><text x="359" y="476" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#7F1D1D" text-anchor="middle">① 约束先抢窗口（帽：≤40% 预算）</text><rect x="234" y="494" width="250" height="34" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="359" y="516" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#78350F" text-anchor="middle">② 精确命中 · 事实状态</text><rect x="234" y="534" width="250" height="34" rx="7" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.3"/><text x="359" y="556" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="middle">③ 偏好 · 情节 · 背景细节</text><text x="510" y="470" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="start">单条放不下 → 跳过，留给后面更小的条目</text><text x="510" y="494" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="start">约束带触发条件：写前端不占数据库约束预算</text><text x="510" y="518" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="start">"宁可多占点" ≠ "独占全部"</text><text x="510" y="550" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">硬召回只保证被看见；遵守还要靠工具校验 + 人审</text><rect x="330" y="600" width="200" height="44" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.6"/><text x="430" y="627.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14.5" font-weight="600" fill="#064E3B" text-anchor="middle">注入 Context Window</text><path d="M525,566 L525,586 Q525,594 515,594 L470,594 L470,596" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#059669" stroke-width="1.7" marker-end="url(#arrow-success)"/><rect x="40" y="676" width="7