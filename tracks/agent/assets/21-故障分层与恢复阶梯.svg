<svg xmlns="http://www.w3.org/2000/svg" width="860" height="600" viewBox="0 0 860 600" role="img" aria-label="故障四层与恢复三级阶梯，以及打断死亡螺旋的三道闸"><title>故障分层与恢复阶梯</title><defs><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs><rect x="0" y="0" width="860" height="600" fill="#FFFFFF"/><rect x="140" y="20" width="580" height="38" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="44" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">先分类再计数：四层故障 × 三级恢复，每条路径独立熔断</text><text x="40" y="84" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#7F1D1D" text-anchor="start">故障四层（处置完全不同）</text><rect x="40" y="94" width="240" height="58" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="54" y="116" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">API 层</text><text x="54" y="136" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">429 · 过载 · 响应截断</text><rect x="40" y="160" width="240" height="58" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="54" y="182" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">工具层</text><text x="54" y="202" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">幻觉调用 · 参数畸形 · 同错重试</text><rect x="40" y="226" width="240" height="58" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="54" y="248" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">上下文层</text><text x="54" y="268" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">溢出 · 压缩失败 · 缺配对 tool result</text><rect x="40" y="292" width="240" height="58" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="54" y="314" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#7F1D1D" text-anchor="start">控制流层</text><text x="54" y="334" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">死循环 · 死亡螺旋</text><text x="40" y="372" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">计数对象：按「工具名 + 参数指纹」查无进展重复，</text><text x="40" y="388" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">不是计失败次数；超时用 idle watchdog，</text><text x="40" y="404" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">SDK 的连接超时管不到流式中途。</text><text x="300" y="84" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#78350F" text-anchor="start">恢复三级（降级不是免费的）</text><rect x="300" y="94" width="230" height="84" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="314" y="116" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#064E3B" text-anchor="start">① 静默重试</text><text x="314" y="136" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">指数退避 + 抖动 + 尊重服务端等待提示</text><text x="314" y="154" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">前台才重试；后台辅助调用直接放弃，</text><text x="314" y="170" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">否则一次故障放大成十倍流量</text><rect x="300" y="186" width="230" height="84" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="314" y="208" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#78350F" text-anchor="start">② 降级接续</text><text x="314" y="228" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">触顶：先提升上限重发，再追加元指令续写</text><text x="314" y="246" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">换备用模型：必须剥掉旧厂商私有格式块</text><text x="314" y="262" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">书中实测 6 组：中立格式 6/6 · 剥离 4/6 · 直传 3/6</text><rect x="300" y="278" width="230" height="58" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="314" y="300" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">③ 暴露给用户</text><text x="314" y="320" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">前两级用尽才轮到它；工具报错以 tool result 喂回</text><path d="M415,178 L415,182" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-decision)"/><path d="M415,270 L415,274" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><text x="300" y="360" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">思考 = 可读文字 + 厂商签发凭证：文字带得走，</text><text x="300" y="376" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" text-anchor="start" font-size="11" fill="#475569">凭证带不走 → 轨迹存中立格式，标识符按目标厂商重生成</text><text x="550" y="84" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#7F1D1D" text-anchor="start">死亡螺旋与三道闸</text><rect x="550" y="94" width="270" height="150" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="6 4"/><text x="564" y="116" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#7F1D1D" text-anchor="start">环：恢复机制自己制造故障</text><rect x="570" y="128" width="110" height="30" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/><text x="625" y="147" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">上下文溢出</text><rect x="700" y="128" width="110" height="30" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/><text x="755" y="147" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">停止钩子调模型</text><rect x="700" y="188" width="110" height="34" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/><text x="755" y="203" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">生成 commit</text><text x="755" y="217" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">message</text><rect x="570" y="188" width="110" height="34" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/><text x="625" y="203" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">再撑爆窗口</text><text x="625" y="217" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">再触发钩子</text><path d="M680,143 L698,143" fill="none" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arrow-danger)"/><path d="M755,158 L755,186" fill="none" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arrow-danger)"/><path d="M700,205 L682,205" fill="none" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arrow-danger)"/><path d="M625,188 L625,160" fill="none" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arrow-danger)"/><rect x="550" y="254" width="270" height="96" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="564" y="276" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#064E3B" text-anchor="start">三道闸（第一条最常被漏）</text><text x="564" y="296" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">① 错误路径上禁用一切会再调模型的副作用</text><text x="564" y="316" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">② 递归深度计数器</text><text x="564" y="336" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">③ 全局最大轮数 / 预算 / 人工升级</text><rect x="40" y="420" width="780" height="90" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="56" y="444" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#78350F" text-anchor="start">每条恢复路径都要有上限——阈值来自生产分布，不是拍脑袋</text><text x="56" y="466" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="start">压缩熔断取「连续 3 次」：曾有一个会话在这条路径上连续失败三千余次；逾千个会话出现过 50 次以上连续失败。</text><text x="56" y="486" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="start">仅这类无效重试每天全球约 25 万次 API 调用——3 次正是「多数故障此前已恢复」与「继续重试基本无望」之间的经验拐点。</text><rect x="40" y="524" width="780" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="56" y="548" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">读法：一条故障从左侧「哪一层」进来，沿中列阶梯往上走，走到哪一级就停在哪一级；右侧的环说明为什么三级之外还要有上限。</text><text x="56" y="568" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">三条恢复路径共用一个计数器，等于让一条路径的噪声熔断另一条。</text></svg>
