<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" role="img" aria-label="事件消费的三种策略与安全点：取消式、队列式、并行式"><title>事件三策略与安全点</title><defs><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrow-decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs><rect x="0" y="0" width="860" height="620" fill="#FFFFFF"/><rect x="150" y="20" width="560" height="38" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="44" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">骨架就是一个事件循环：难点是循环与流式生成之间的关系</text><text x="40" y="82" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A" text-anchor="start">一条执行流：只有这些位置能切进去（安全点 ▲）</text><rect x="40" y="94" width="150" height="42" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="115" y="112" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#0F172A" text-anchor="middle">推理段（流式）</text><text x="115" y="128" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">不可分割，不能中途插话</text><rect x="210" y="94" width="140" height="42" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="280" y="112" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">工具 A 执行中</text><text x="280" y="128" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#78350F" text-anchor="middle">已发出外部请求</text><rect x="370" y="94" width="130" height="42" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.6"/><text x="435" y="112" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#064E3B" text-anchor="middle">tool.result 返回</text><text x="435" y="128" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#064E3B" text-anchor="middle">▲ 天然安全点</text><rect x="520" y="94" width="130" height="42" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="585" y="112" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#0F172A" text-anchor="middle">推理段结束</text><text x="585" y="128" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#064E3B" text-anchor="middle">▲ 消息边界</text><rect x="670" y="94" width="150" height="42" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="745" y="112" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#0F172A" text-anchor="middle">下一轮采样</text><text x="745" y="128" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">带上队列与占位符</text><path d="M190,115 L208,115" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/><path d="M350,115 L368,115" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/><path d="M500,115 L518,115" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/><path d="M650,115 L668,115" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/><text x="280" y="158" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">▲ 这里不能取消：结果未落账会留下悬挂副作用</text><path d="M280,150 L280,140" fill="none" stroke="#DC2626" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-danger)"/><text x="40" y="196" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">事件四字段：source / channel / content / context（priority、customer_tier、related_orders 决定走哪条策略，并省掉一轮现场取证）</text><text x="40" y="216" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">事件名分两档写死：紧急 user.interrupt · supervisor.instruction · agent.interrupt ｜ 常规 user.input · agent.input · tool.result · timer.trigger</text><rect x="40" y="232" width="250" height="196" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="56" y="256" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#7F1D1D" text-anchor="start">① 取消式 · 紧急事件</text><text x="56" y="280" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">1 停流式生成与同步工具</text><text x="56" y="302" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">2 清空待处理队列</text><text x="56" y="324" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">3 队列 + 紧急事件一起追加轨迹</text><text x="56" y="346" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">4 重新调用模型</text><text x="56" y="376" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#7F1D1D" text-anchor="start">清队 ≠ 丢弃：旧事件要作为事实留在轨迹里</text><rect x="305" y="232" width="250" height="196" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="321" y="256" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#78350F" text-anchor="start">② 队列式 · 常规事件</text><text x="321" y="280" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="start">入队，不打断当前推理</text><text x="321" y="302" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="start">任一 tool.result 返回时</text><text x="321" y="324" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="start">一次性批量追加</text><text x="321" y="352" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">逐条注入 = 每处理一条就重规划一次，</text><text x="321" y="372" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#7F1D1D" text-anchor="start">成本与漂移都翻倍</text><rect x="570" y="232" width="250" height="196" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.6"/><text x="586" y="256" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#064E3B" text-anchor="start">③ 并行式 · 独立轻查询</text><text x="586" y="280" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="start">另起推理会话立即返回</text><text x="586" y="302" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="start">结果回写主轨迹</text><text x="586" y="324" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="start">显式标「与主任务并行执行」</text><text x="586" y="352" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">不写这个标记，模型会把旁路结论</text><text x="586" y="372" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#7F1D1D" text-anchor="start">当成主任务的中间步骤</text><path d="M165,428 L165,452" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-success)"/><path d="M430,428 L430,452" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-decision)"/><rect x="40" y="456" width="780" height="144" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="56" y="482" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">没有原生异步时：五条兼容规则维持轨迹合法性</text><text x="56" y="506" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">① 已完成消息与工具调用及时记录，reasoning 按厂商续接协议保留，不自拼不可见思考 ② 工具完成才记 tool result ③ 被打断的未完成工具生成占位符</text><text x="56" y="526" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">④ 不能假定半截输出或隐藏推理可作为合法前缀任意回灌 ⑤ 非打断事件入队、批量注入</text><text x="56" y="546" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">工具接口层要把「发起」与「完成」解耦：initiate_phone_call 先回任务 ID，进展用事件通知</text><text x="56" y="568" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#7F1D1D" text-anchor="start">两个坏味道：占位符写成「已启动」→ 模型据此编造结果；只回最后一条事件 → 要靠状态栏 [未处理事件 2/4] 兜。</text><text x="56" y="590" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">原生异步带来两个能力（异步工具调用 + 回合中途引导）与三条验收：结果归属清楚 · 改计划 ≠ 停止执行 ≠ 撤销已发生动作 · 多条更新同时遵守。</text></svg>
