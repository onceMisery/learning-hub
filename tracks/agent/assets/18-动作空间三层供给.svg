<svg xmlns="http://www.w3.org/2000/svg" width="860" height="800" viewBox="0 0 860 800" role="img" aria-label="动作空间三层供给：接口层、形态层、代码层与各层失控点"><title>动作空间三层供给：接口 → 形态 → 代码</title><defs><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrow-decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect x="0" y="0" width="860" height="800" fill="#FFFFFF"/><text x="430" y="30" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#64748B" text-anchor="middle">口径：图中百分比与 token 数取自《深入理解 AI Agent》第四、五章，已区分「书中 A/B 实测」与「论文报告」</text><rect x="150" y="42" width="560" height="40" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="67" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">引入一条能力要过三道门：怎么进来 · 长什么样 · 不够时怎么办</text><rect x="40" y="100" width="780" height="164" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="6 4"/><text x="62" y="124" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#1E3A8A" text-anchor="start">① 接口层 · MCP：能力怎么进来（省的是胶水，扩的是信任边界）</text><rect x="62" y="140" width="170" height="46" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="147" y="160" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">三原语</text><text x="147" y="177" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">tools / resources / prompts</text><rect x="252" y="140" width="160" height="46" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="332" y="160" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">两种传输</text><text x="332" y="177" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">本地 stdio · 远程 HTTP</text><rect x="432" y="140" width="150" height="46" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="507" y="160" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#78350F" text-anchor="middle">tools/list</text><text x="507" y="177" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="middle">协议返回的是全量</text><rect x="602" y="140" width="196" height="46" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="700" y="160" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#064E3B" text-anchor="middle">披露策略归宿主</text><text x="700" y="177" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="middle">全量 / 索引 / 延迟+检索</text><path d="M582,163 L598,163" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><path d="M412,163 L428,163" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><path d="M222,163 L248,163" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><text x="62" y="212" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">成本落点：5 个 server 的 schema ≈ 数万 token，200K 窗口未对话先占近三成 · 改索引化披露后总量 −46.9%（书中 A/B）</text><text x="62" y="234" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">三类风险：description 投毒（延迟加载时更隐蔽）· 同名遮蔽 tool shadowing · 供应链劫持更新</text><text x="62" y="254" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">只有「延迟+检索」把「看见」与「能调」拆开：搜索是补说明书，不是开权限（详见执行核心篇 7.3）</text><rect x="40" y="284" width="780" height="176" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6" stroke-dasharray="6 4"/><text x="62" y="308" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#78350F" text-anchor="start">② 形态层 · 专用 / 通用 / Skill：模型怎么用它（形态与披露数量是两个独立决策）</text><rect x="62" y="324" width="230" height="52" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="177" y="344" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">通用：解释器 + 沙盒</text><text x="177" y="362" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="middle">买组合自由 · 出错面同时放大</text><rect x="312" y="324" width="230" height="52" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="427" y="344" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#78350F" text-anchor="middle">专用：高风险必封</text><text x="427" y="362" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="middle">支付 删除 发信 部署 · 数百 token/个</text><rect x="562" y="324" width="236" height="52" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="680" y="344" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#064E3B" text-anchor="middle">Skill：流程知识</text><text x="680" y="362" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="middle">目录项几十 token · 命中才展开正文</text><text x="62" y="400" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">四个决策维度：安全与权限 · 参数复杂度 · 变更频率 · 模型能力（同一决定换模型可能结论相反）</text><text x="62" y="422" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">描述与示例：写「何时用」不写「能做什么」· 参数给具体例子 · 1~5 个真实调用示例（基准约 72%→90%）</text><text x="62" y="444" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">传参透明：静默把中文弯引号改成直引号 → old_string 永不匹配，模型看不见被改过的世界就无法自我诊断</text><text x="62" y="460" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">代码编排的红利：中间变量留在执行环境、只回传汇总，token 可降约两个数量级</text><rect x="40" y="480" width="780" height="176" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 4"/><text x="62" y="504" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#064E3B" text-anchor="start">③ 代码层 · Coding Agent：动作空间能长多大（通用 Agent = Coding Agent + 文件系统）</text><rect x="62" y="520" width="92" height="34" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="108" y="541" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="middle">代码解释器</text><rect x="166" y="520" width="92" height="34" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="212" y="541" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="middle">Bash</text><rect x="270" y="520" width="92" height="34" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="316" y="541" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="middle">读文件</text><rect x="374" y="520" width="92" height="34" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="420" y="541" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="middle">写文件</text><rect x="478" y="520" width="92" height="34" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="524" y="541" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">编辑</text><rect x="582" y="520" width="92" height="34" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="628" y="541" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="middle">Glob</text><rect x="686" y="520" width="92" height="34" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="732" y="541" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="middle">Grep</text><text x="62" y="576" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">为什么不是六件：读写单独存在，是为了降低改错文件的概率；Codex 的反向赌注是 shell + 语法受约束的 apply_patch</text><text x="62" y="598" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">文档化四件套 CLAUDE.md / AGENTS.md / .cursorrules / SOUL.md：内容之外，价值在「位置」——最经济的稳定前缀</text><text x="62" y="620" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">四象限里最危险的一格：目标模糊 × 可自动验证 = 高效跑偏，反馈越灵敏跑得越远</text><text x="62" y="642" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">自造工具：运行内插件重启即失效，不能被自动提升为正式能力，仍要走 worktree + Spec + PR</text><rect x="40" y="676" width="780" height="108" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 4"/><text x="62" y="700" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#7F1D1D" text-anchor="start">每层的失控点：三层各治一种病，谁都替代不了谁</text><rect x="62" y="714" width="230" height="52" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="177" y="734" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#7F1D1D" text-anchor="middle">接口层失控 = 信任边界</text><text x="177" y="752" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">症状：一条命令接入即扩面</text><rect x="312" y="714" width="230" height="52" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="427" y="734" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#7F1D1D" text-anchor="middle">形态层失控 = 候选集</text><text x="427" y="752" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">症状：选错、看不见、烧窗口</text><rect x="562" y="714" width="236" height="52" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="680" y="734" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#7F1D1D" text-anchor="middle">代码层失控 = 边界</text><text x="680" y="752" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">症状：结果对但过程错、不可回滚</text></svg>
