<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" role="img" aria-label="观察与动作的两条扩展轴：模态与时机，以及四类任务的时间尺度"><title>模态与时机：两条扩展轴</title><defs><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect x="0" y="0" width="860" height="560" fill="#FFFFFF"/><rect x="130" y="20" width="600" height="38" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="44" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">回合制是接口约定，不是环境的性质：两轴各扩一边</text><text x="40" y="86" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#1E3A8A" text-anchor="start">轴一 · 模态：用什么看，用什么说</text><rect x="40" y="96" width="360" height="76" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="56" y="120" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">观察的形式</text><text x="56" y="142" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">读文本 → 听声音 → 看屏幕 → 感力矩</text><text x="56" y="162" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#64748B" text-anchor="start">每加一种，都要重新回答「怎么把它压进上下文」</text><rect x="40" y="182" width="360" height="76" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="56" y="206" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">输出的形式</text><text x="56" y="228" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">吐 token → 发声 → 点击 → 驱动关节</text><text x="56" y="248" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#64748B" text-anchor="start">越往右，动作越不可逆，越需要边界与后置检查</text><text x="420" y="86" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#78350F" text-anchor="start">轴二 · 时机：谁在什么时候叫它</text><rect x="420" y="96" width="400" height="76" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="436" y="120" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#78350F" text-anchor="start">观察：主动取 vs 世界推</text><text x="436" y="142" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="start">Hooks / Cron / Heartbeat 全是「我们定时醒」；</text><text x="436" y="162" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">外部事件源（邮件、回调）不接通道就只能等下一个周期</text><rect x="420" y="182" width="400" height="76" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="436" y="206" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#78350F" text-anchor="start">动作：回合内完成 vs 跨回合</text><text x="436" y="228" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="start">跨回合意味着三件事必须设计：可打断、可抢占、可恢复</text><text x="436" y="248" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#7F1D1D" text-anchor="start">用了 asyncio ≠ 模型具备原生异步能力（推理仍按轮次串行）</text><text x="40" y="296" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#064E3B" text-anchor="start">四类任务的时间尺度：从毫秒铺到天，套不成一套机制</text><line x1="70" y1="330" x2="790" y2="330" stroke="#94A3B8" stroke-width="1.6"/><path d="M790,330 L808,330" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/><text x="795" y="322" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#64748B" text-anchor="end">快</text><text x="70" y="322" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#64748B" text-anchor="start">慢</text><rect x="70" y="348" width="250" height="44" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="86" y="368" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#064E3B" text-anchor="start">异步事件与外部触发</text><text x="86" y="386" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">秒 — 天 · 世界自己找上门</text><rect x="330" y="348" width="230" height="44" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="346" y="368" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#78350F" text-anchor="start">语音交互</text><text x="346" y="386" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">10 毫秒 — 1 秒 · 话轮与抢答</text><rect x="570" y="348" width="150" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="586" y="368" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">Computer Use</text><text x="586" y="386" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">亚秒 — 秒</text><rect x="730" y="348" width="80" height="44" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="740" y="368" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#7F1D1D" text-anchor="start">机器人</text><text x="740" y="386" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#7F1D1D" text-anchor="start">毫秒</text><path d="M320,370 L330,370" fill="none" stroke="#D97706" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-decision)"/><path d="M560,370 L570,370" fill="none" stroke="#D97706" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-decision)"/><path d="M720,370 L730,370" fill="none" stroke="#D97706" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-decision)"/><text x="70" y="418" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">条带位置按各自量级区间排布（毫秒 → 天）；越往右，「等一次模型」这件事越不可接受，快慢分离与提前推测执行就越靠近必需项</text><rect x="40" y="436" width="780" height="104" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="56" y="462" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">四件事共用的骨架：持续感知 → 判状态与时机 → 选回复或动作 → 输出进入环境 → 观察反馈 → 继续 / 修正 / 重试 / 停止 / 重规划</text><text x="56" y="488" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">可复用的原语只有五个：唤醒（谁叫我）· 安全点（在哪儿能切进去）· 取消（怎么停得住且不留下悬挂副作用）</text><text x="56" y="510" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">· 抢占（紧急事件凭什么插队）· 快慢分离（前台反应与后台思考解耦）</text><text x="56" y="530" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#7F1D1D" text-anchor="start">判据：先看这件事的真实节奏是多少毫秒，再决定用哪一层机制——顺序反了就会写出一堆轮询加「感觉像主动」的话术。</text></svg>
