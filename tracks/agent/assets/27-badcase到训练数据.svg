<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" role="img" aria-label="从bad case到训练数据的共同骨架：归因链、三种监督目标、双集门禁与三个案例结果"><title>bad case 到训练数据的骨架</title><defs><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect x="0" y="0" width="860" height="640" fill="#FFFFFF"/><rect x="110" y="20" width="640" height="38" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="44" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">先归因，再决定训不训：只有首个分歧落在输出侧，才是后训练候选</text><text x="40" y="80" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A" text-anchor="start">七层归因链（逐层比 byte / code-point / token 的精确匹配与首次分歧位置）</text><rect x="40" y="90" width="104" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="92" y="106" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#0F172A" text-anchor="middle">文件原始字节</text><text x="92" y="121" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10" fill="#64748B" text-anchor="middle">磁盘真值</text><rect x="152" y="90" width="104" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="204" y="106" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#0F172A" text-anchor="middle">工具返回</text><text x="204" y="121" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10" fill="#64748B" text-anchor="middle">截断与转义</text><rect x="264" y="90" width="104" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="316" y="106" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#0F172A" text-anchor="middle">Harness 序列化</text><text x="316" y="121" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10" fill="#64748B" text-anchor="middle">包装方式</text><rect x="376" y="90" width="104" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="428" y="106" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#0F172A" text-anchor="middle">模型上下文</text><text x="428" y="121" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10" fill="#64748B" text-anchor="middle">它看到什么</text><rect x="488" y="90" width="104" height="40" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="540" y="106" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" font-weight="600" fill="#78350F" text-anchor="middle">token 输出</text><text x="540" y="121" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10" fill="#78350F" text-anchor="middle">首个分歧常在此</text><rect x="600" y="90" width="104" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="652" y="106" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#0F172A" text-anchor="middle">解码字符串</text><text x="652" y="121" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10" fill="#64748B" text-anchor="middle">round-trip</text><rect x="712" y="90" width="108" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="766" y="106" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#0F172A" text-anchor="middle">JSON 解析 / 匹配</text><text x="766" y="121" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10" fill="#64748B" text-anchor="middle">工具侧</text><path d="M144,110 L150,110 M256,110 L262,110 M368,110 L374,110 M480,110 L486,110 M592,110 L598,110 M704,110 L710,110" stroke="#64748B" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/><path d="M540,130 L540,152" stroke="#059669" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-success)"/><text x="556" y="150" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#064E3B" text-anchor="start">落在输出侧 → 转训练数据</text><path d="M204,130 L204,152" stroke="#DC2626" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-danger)"/><text x="56" y="168" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#7F1D1D" text-anchor="start">差在别处 → 修 tokenizer / Harness / 协议，跳过这步就是把别人的 bug 写进参数</text><text x="40" y="196" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#78350F" text-anchor="start">手上有什么 → 变成什么监督</text><rect x="40" y="206" width="380" height="86" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="54" y="228" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#78350F" text-anchor="start">轨迹前缀回归（冻结上下文与工具结果）</text><text x="54" y="248" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">→ DPO 偏好对 · 决策边界 SFT · 蒸馏的教师状态</text><text x="54" y="266" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">答案写成「可接受动作集合 + 禁止动作」，不是唯一解</text><text x="54" y="283" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#854F0B" text-anchor="start">例：rejected = 过早宣称完成；chosen = 先跑测试逐条核对再结论</text><rect x="440" y="206" width="380" height="86" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="454" y="228" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">端到端成败 / 失败归因 / Rubric 金标</text><text x="454" y="248" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">→ RLVR 采样池 · PRM 负标签与 RLVP 惩罚规则</text><text x="454" y="266" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">→ 向量奖励的各维 · GRM 的训练与校准</text><text x="454" y="283" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#7F1D1D" text-anchor="start">隐藏测试必须模型改不了、写不了，否则学会「口头声称已验证」</text><rect x="40" y="306" width="780" height="72" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="6 4"/><text x="56" y="330" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#7F1D1D" text-anchor="start">双集门禁：边界集与保留集缺一不可</text><text x="56" y="350" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">边界集（任务未完成，是否继续验证）必须改善 · 保留集（任务确实完成，能否正常收尾）不可退化 · 还要抽查通用能力</text><text x="56" y="368" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#7F1D1D" text-anchor="start">只盯前一个指标，会训出「永远不敢收尾」的过度矫正模型：每个任务无限验证，延迟与成本崩溃</text><text x="40" y="404" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#064E3B" text-anchor="start">三个单卡跑通的案例（书中台账：RTX PRO 6000，✅ 有证据留存）</text><rect x="40" y="414" width="250" height="146" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.4"/><text x="54" y="436" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#3F6212" text-anchor="start">8-17 过早结束 · DPO</text><text x="54" y="456" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#3F6212" text-anchor="start">24 条 bad case（含删失败测试</text><text x="54" y="472" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#3F6212" text-anchor="start">这类 hacking 变体）</text><text x="54" y="492" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#3F6212" text-anchor="start">boundary 12 + retention 8</text><text x="54" y="512" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#064E3B" text-anchor="start">未完成任务选对 25.0% → 91.7%</text><text x="54" y="532" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">保留集 100% 不变（8/8）</text><rect x="306" y="414" width="250" height="146" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.4"/><text x="320" y="436" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#3F6212" text-anchor="start">8-18 中文弯引号 · SFT</text><text x="320" y="456" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#3F6212" text-anchor="start">SKILL.md 同时当标签生成器、</text><text x="320" y="472" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#3F6212" text-anchor="start">质量门禁与回归规范</text><text x="320" y="492" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#3F6212" text-anchor="start">16 作用域 × 10 体裁 × 9 语言</text><text x="320" y="512" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#064E3B" text-anchor="start">exact 96.9% / 97.7% · 保护区 100%</text><text x="320" y="532" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">但 JSON 仍 68.8%，要专门轨道</text><rect x="572" y="414" width="248" height="146" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.4"/><text x="586" y="436" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#3F6212" text-anchor="start">8-19 old_string 精确复制</text><text x="586" y="456" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#3F6212" text-anchor="start">未见随机串 · 相似串选择 ·</text><text x="586" y="472" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#3F6212" text-anchor="start">抄进工具 JSON 参数</text><text x="586" y="492" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#3F6212" text-anchor="start">平均首分歧字节 54.0 / 54.2</text><text x="586" y="512" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#064E3B" text-anchor="start">byte-exact 37.5% → 78.9%</text><text x="586" y="532" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">边界 80.1% 含 tokenizer 上限</text><rect x="40" y="574" width="780" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="56" y="598" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">读法：三条案例共用同一副骨架——归因链定位首差 → 把教训写成可评分的目标 → 边界集与保留集双门禁 → 带通用能力抽查发布。</text><text x="56" y="616" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">口径提醒：8-11、8-13、8-14、8-16 依赖外部仓库且本地未跑，那些数字只能写成「论文/他人报告」，不能写成「实测」。</text></svg>
