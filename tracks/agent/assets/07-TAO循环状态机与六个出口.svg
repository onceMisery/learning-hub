<svg xmlns="http://www.w3.org/2000/svg" width="860" height="780" viewBox="0 0 860 780" role="img" aria-label="TAO 循环状态机与六个出口"><title>TAO 循环状态机与六个出口</title><defs><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrow-decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect x="0" y="0" width="860" height="780" fill="#FFFFFF"/><rect x="270" y="28" width="320" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="56.1" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">读取当前状态</text><text x="430" y="77.1" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Goal · Action · Observation · Fact · Control</text><rect x="270" y="144" width="320" height="64" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="430" y="172.1" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="16" font-weight="600" fill="#78350F" text-anchor="middle">Think：四类判断</text><text x="430" y="193.1" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" fill="#78350F" text-anchor="middle">目标 · 状态（缺啥补啥）· 路径 · 停止</text><rect x="270" y="260" width="320" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="288.1" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">Action：业务上完整的一步</text><text x="430" y="309.1" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">工具 · 多接口聚合 · 子 Agent · 用户交互</text><rect x="270" y="376" width="320" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="404.1" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">Observation：解读返回值</text><text x="430" y="425.1" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">存"解释结果"，原始返回留在 ActionState</text><rect x="270" y="492" width="320" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="520.1" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">更新状态</text><text x="430" y="541.1" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">新事实入库 · 槽位进度 · 假设与证据比对</text><path d="M430,92 L430,140" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-neutral)"/><path d="M430,208 L430,256" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-neutral)"/><path d="M430,324 L430,372" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-neutral)"/><path d="M430,440 L430,488" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-neutral)"/><path d="M270,524 L200,524 Q190,524 190,514 L190,66 Q190,56 200,56 L266,56" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#2563EB" stroke-width="1.7" marker-end="url(#arrow-primary)"/><rect x="196" y="288" width="66" height="18" rx="4" fill="#FFFFFF" stroke="none"/><text x="200" y="301.5" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" fill="#2563EB" text-anchor="start">回下一轮</text><path d="M430,556 L430,596" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#DC2626" stroke-width="1.7" marker-end="url(#arrow-danger)"/><rect x="330" y="600" width="200" height="52" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="430" y="622.1" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="15" font-weight="600" fill="#7F1D1D" text-anchor="middle">治理层闸门</text><text x="430" y="641.1" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#7F1D1D" text-anchor="middle">预算耗尽 / 死循环指纹 → 强制断</text><rect x="630" y="120" width="210" height="40" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.5"/><text x="735" y="145" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#064E3B" text-anchor="middle">Continue 继续推进</text><rect x="630" y="170" width="210" height="40" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.5"/><text x="735" y="195" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#064E3B" text-anchor="middle">Finish 标准已满足</text><rect x="630" y="220" width="210" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="735" y="245" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="middle">Clarify 缺关键信息</text><rect x="630" y="270" width="210" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="735" y="295" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="middle">Retry 偶发失败先重试</text><rect x="630" y="320" width="210" height="40" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="735" y="345" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#78350F" text-anchor="middle">Replan 回溯后修正</text><rect x="630" y="370" width="210" height="40" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="735" y="395" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#7F1D1D" text-anchor="middle">Interrupt 兜底终止</text><path d="M590,176 L610,176 Q620,176 620,160 L620,140 L626,140" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-success)"/><path d="M620,140 L620,190 L626,190" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-success)"/><path d="M620,140 L620,240 L626,240" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><path d="M620,140 L620,290 L626,290" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><path d="M620,140 L620,340 L626,340" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-decision)"/><path d="M620,140 L620,390 L626,390" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-danger)"/><rect x="30" y="140" width="190" height="220" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="125" y="164" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">每轮 Think 重检四问</text><text x="46" y="190" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" fill="#475569" text-anchor="start">① 动作还推进目标吗</text><text x="46" y="214" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" fill="#475569" text-anchor="start">② 与目标还差什么</text><text x="46" y="238" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" fill="#475569" text-anchor="start">③ 成功标准满足了吗</text><text x="46" y="262" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" fill="#475569" text-anchor="start">④ 现在可以停了吗</text><text x="46" y="296" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#64748B" text-anchor="start">目标锚点必须持续在场，</text><text x="46" y="316" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#64748B" text-anchor="start">防止局部合理、整体跑偏</text><path d="M220,250 L266,190" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#D97706" stroke-width="1.4" marker-end="url(#arrow-decision)"/><rect x="270" y="690" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="565" y="713" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">TAO = 以大模型为变迁引擎的状态机</text><text x="565" y="733" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">工程重心不在三段 Prompt，而在状态维护、出口枚举与外层治理</text></svg>
