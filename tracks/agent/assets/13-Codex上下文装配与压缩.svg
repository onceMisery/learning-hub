/text><text x="455" y="192" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">硬顶＝窗口×有效%（兜底模型默认 95%）</text><text x="455" y="210" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">图片按 7373B≈1844 token 稳定计费</text><rect x="330" y="240" width="250" height="76" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="455" y="264" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="middle">提醒分级（每窗口一次）</text><text x="455" y="284" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">TokenBudgetReminder → 归零注入 fallback</text><text x="455" y="302" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">&lt;context_window&gt; 把窗口身份回写给模型</text><rect x="620" y="34" width="250" height="60" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 4"/><text x="745" y="56" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12.5" font-weight="600" fill="#78350F" text-anchor="middle">四阶段触发 CompactionPhase</text><text x="745" y="78" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">PreTurn · MidTurn · Standalone · PostTurn</text><rect x="620" y="114" width="250" height="106" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="745" y="138" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="middle">实现 A 本地自述摘要</text><text x="745" y="158" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">handoff summary 由模型自己写</text><text x="745" y="176" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">留：真实用户消息≤20K + summary</text><text x="745" y="194" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">弃：assistant/reasoning/工具/注入片段</text><text x="745" y="212" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">"Another model…" 人格接续</text><rect x="620" y="240" width="250" height="52" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="745" y="261" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">实现 B 服务端 compaction</text><text x="745" y="281" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">加密项入库 · 先重写工具输出适配窗口</text><rect x="620" y="312" width="250" height="52" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="745" y="333" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">实现 C token-budget 换窗</text><text x="745" y="353" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">不摘要直接换新 · 模型可主动申请开新窗</text><rect x="620" y="384" width="250" height="64" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.6"/><text x="745" y="408" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#064E3B" text-anchor="middle">CompactedItem 留痕</text><text x="745" y="428" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="middle">replacement_history 全文 + model_hash</text><text x="745" y="443" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#064E3B" text-anchor="middle">损失不修复，但变成可审计事实</text><rect x="40" y="480" width="390" height="120" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 4"/><text x="60" y="506" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#7F1D1D" text-anchor="start">RetainedContext：不进窗口的宿主事实</text><text x="60" y="530" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#475569" text-anchor="start">· 原始用户指令 + request_user_input 问答（never inferred permission）</text><text x="60" y="552" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#475569" text-anchor="start">· 双上限 8 条 / 64KB · 与压缩检查点共用一把持久化锁</text><text x="60" y="576" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#7F1D1D" text-anchor="start">可压缩的只能是参考材料，不能是承诺</text><rect x="470" y="480" width="400" height="120" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4"/><text x="490" y="506" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#1E3A8A" text-anchor="start">截断与缓存：一次截断，终身生效</text><text x="490" y="530" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#475569" text-anchor="start">· 工具输出入栈即截（默认 10K bytes）· 保头保尾切中间 · 数组按元素分预算</text><text x="490" y="552" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#475569" text-anchor="start">· 超窗重试只删最旧项 · 合成 ID 固定命名空间 · 前缀全等才走增量请求</text><text x="490" y="576" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#1E3A8A" text-anchor="start">裁剪处必留自述：truncated 提示 / 行数 / omitted N bytes / 图片缩放</text><rect x="40" y="636" width="830" height="60" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="455" y="660" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#334155" text-anchor="middle">主流程：装配三段式产出 input → 水位判定 → 到线按能力选 A/B/C 压缩 → Compacted 落盘 → 下一轮按 replacement_history 重建</text><text x="455" y="682" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#334155" text-anchor="middle">它没做的：通用 P0-P3 分诊框架 · 用户画像 · 多精度预压缩——编码域的取舍，不是通用答案</text><path d="M165,110 L165,126" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow-neutral)"/><path d="M165,206 L165,222" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow-neutral)"/><path d="M290,270 L306,270 Q316,270 316,260 L316,82 Q316,72 326,72" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow-primary)"/><path d="M580,175 L616,175" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#D97706" stroke-width="1.7" marker-end="url(#arrow-decision)"/><rect x="576" y="152" width="48" height="16" rx="3" fill="#FFFFFF" stroke="none"/><text x="580" y="164" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#78350F" text-anchor="start">到线触发</text><path d="M745,94 L745,110" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><path d="M745,220 L745,236" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><path d="M745,292 L745,308" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><path d="M745,364 L745,380" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-success)"/><path d="M455,316 L455,444 Q455,456 443,456 L260,456 Q248,456 248,468 L248,474" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-danger)"/><text x="462" y="404" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#7F1D1D" text-anchor="start">压缩不可达区</text></svg>
