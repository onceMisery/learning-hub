<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-label="一次主从 Agent 请求的完整链路：入口、分诊、上下文、规划、委派、子执行、回收、验收、收尾，以及失败分类与硬预算" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif"><title>一次主从 Agent 请求的完整链路</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect x="0" y="0" width="900" height="660" fill="#FFFFFF"/><rect x="40" y="20" width="820" height="38" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="450" y="44" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">主 Agent 管目标和验收，子 Agent 管隔离执行；两条线在验收处汇合</text><text x="40" y="78" font-size="11.5" fill="#475569" text-anchor="start">子 Agent 交回的是结论、证据和工件引用，不是完整经历；局部完成不等于整体完成。</text><rect x="40" y="92" width="148" height="58" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.4"/><text x="114" y="115" font-size="12" font-weight="700" fill="#075985" text-anchor="middle">入口</text><text x="114" y="135" font-size="10" fill="#075985" text-anchor="middle">鉴权 · 租户 · 审核 · 去重</text><rect x="206" y="92" width="148" height="58" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.4"/><text x="280" y="115" font-size="12" font-weight="700" fill="#155E75" text-anchor="middle">分诊</text><text x="280" y="135" font-size="10" fill="#155E75" text-anchor="middle">意图 · 风险 · 复杂度</text><rect x="372" y="92" width="148" height="58" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/><text x="446" y="115" font-size="12" font-weight="700" fill="#5B21B6" text-anchor="middle">上下文装配</text><text x="446" y="135" font-size="10" fill="#5B21B6" text-anchor="middle">目标 · 约束 · 记忆 · 工具</text><rect x="538" y="92" width="148" height="58" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="612" y="115" font-size="12" font-weight="700" fill="#78350F" text-anchor="middle">规划</text><text x="612" y="135" font-size="10" fill="#78350F" text-anchor="middle">单步 / 计划 / 并行</text><rect x="704" y="92" width="148" height="58" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="778" y="115" font-size="12" font-weight="700" fill="#7F1D1D" text-anchor="middle">委派</text><text x="778" y="135" font-size="10" fill="#7F1D1D" text-anchor="middle">责任面 · 交付物 · 预算</text><path d="M188,121 L204,121" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M354,121 L370,121" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M520,121 L536,121" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M686,121 L702,121" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M778,150 L778,164 L612,164 L612,178" stroke="#DC2626" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="700" y="160" font-size="10" fill="#7F1D1D" text-anchor="start">任务包下发</text><rect x="40" y="180" width="300" height="86" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.6"/><text x="54" y="204" font-size="12" font-weight="700" fill="#075985" text-anchor="start">主 Agent</text><text x="54" y="226" font-size="10.5" fill="#334155" text-anchor="start">目标锚点 · 全局约束 · 预算 · 事件监控</text><text x="54" y="246" font-size="10.5" fill="#334155" text-anchor="start">只收工件和证据，不灌子 Agent 的原始轨迹</text><text x="54" y="260" font-size="10" fill="#64748B" text-anchor="start">最终对「整体完成」负责</text><rect x="370" y="180" width="150" height="86" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.4"/><text x="445" y="204" font-size="11.5" font-weight="700" fill="#065F46" text-anchor="middle">子 Agent A</text><text x="445" y="224" font-size="10" fill="#065F46" text-anchor="middle">独立窗口</text><text x="445" y="241" font-size="10" fill="#065F46" text-anchor="middle">工具子集 + 预算</text><text x="445" y="258" font-size="10" fill="#64748B" text-anchor="middle">只交卡片，不交经历</text><rect x="540" y="180" width="150" height="86" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.4"/><text x="615" y="204" font-size="11.5" font-weight="700" fill="#065F46" text-anchor="middle">子 Agent B</text><text x="615" y="224" font-size="10" fill="#065F46" text-anchor="middle">独立窗口</text><text x="615" y="241" font-size="10" fill="#065F46" text-anchor="middle">工具子集 + 预算</text><text x="615" y="258" font-size="10" fill="#64748B" text-anchor="middle">只交卡片，不交经历</text><rect x="710" y="180" width="150" height="86" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.4"/><text x="785" y="204" font-size="11.5" font-weight="700" fill="#065F46" text-anchor="middle">子 Agent C</text><text x="785" y="224" font-size="10" fill="#065F46" text-anchor="middle">独立窗口</text><text x="785" y="241" font-size="10" fill="#065F46" text-anchor="middle">工具子集 + 预算</text><text x="785" y="258" font-size="10" fill="#64748B" text-anchor="middle">只交卡片，不交经历</text><path d="M340,222 L368,222" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M520,222 L538,222" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M690,222 L708,222" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="40" y="300" width="120" height="64" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/><text x="100" y="324" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">回收</text><text x="100" y="344" font-size="9.8" fill="#475569" text-anchor="middle">结论 + 证据 + 工件</text><rect x="172" y="300" width="120" height="64" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/><text x="232" y="324" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">工件闸</text><text x="232" y="344" font-size="9.8" fill="#475569" text-anchor="middle">字段 · 来源 · 版本</text><rect x="304" y="300" width="120" height="64" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="364" y="324" font-size="11.5" font-weight="700" fill="#78350F" text-anchor="middle">组合闸</text><text x="364" y="344" font-size="9.8" fill="#78350F" text-anchor="middle">覆盖 · 重复 · 全局约束</text><rect x="436" y="300" width="120" height="64" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/><text x="496" y="324" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">汇总</text><text x="496" y="344" font-size="9.8" fill="#475569" text-anchor="middle">合并 · 冲突裁决</text><rect x="568" y="300" width="120" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/><text x="628" y="324" font-size="11.5" font-weight="700" fill="#065F46" text-anchor="middle">终验</text><text x="628" y="344" font-size="9.8" fill="#065F46" text-anchor="middle">终态 · 回执 · 测试</text><rect x="700" y="300" width="120" height="64" rx="10" fill="#E2E8F0" stroke="#475569" stroke-width="1.4"/><text x="760" y="324" font-size="11.5" font-weight="700" fill="#1E293B" text-anchor="middle">收尾</text><text x="760" y="344" font-size="9.8" fill="#1E293B" text-anchor="middle">trace · 成本 · 记忆门禁</text><path d="M160,332 L170,332" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M292,332 L302,332" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M424,332 L434,332" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M556,332 L566,332" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M688,332 L698,332" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M445,266 L445,282 L100,282 L100,298" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#ag)"/><path d="M615,266 L615,282 L232,282 L232,298" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#ag)"/><path d="M785,266 L785,282 L364,282 L364,298" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#ag)"/><path d="M190,266 L190,282 L628,282 L628,298" stroke="#0284C7" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="40" y="394" width="820" height="104" rx="10" fill="#FFF1F2" stroke="#DC2626" stroke-width="1.4"/><text x="54" y="416" font-size="12" font-weight="700" fill="#7F1D1D" text-anchor="start">失败先分类，再决定动作；每条恢复路径独立计数</text><rect x="54" y="426" width="104" height="58" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2"/><text x="106" y="446" font-size="10.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">瞬时</text><text x="106" y="466" font-size="9.8" fill="#475569" text-anchor="middle">退避重试</text><rect x="168" y="426" width="104" height="58" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2"/><text x="220" y="446" font-size="10.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">契约/格式</text><text x="220" y="466" font-size="9.8" fill="#475569" text-anchor="middle">修参再试</text><rect x="282" y="426" width="104" height="58" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2"/><text x="334" y="446" font-size="10.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">权限</text><text x="334" y="466" font-size="9.8" fill="#475569" text-anchor="middle">不重试，交人</text><rect x="396" y="426" width="104" height="58" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2"/><text x="448" y="446" font-size="10.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">计划错</text><text x="448" y="466" font-size="9.8" fill="#475569" text-anchor="middle">局部重规划</text><rect x="510" y="426" width="104" height="58" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2"/><text x="562" y="446" font-size="10.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">验收失败</text><text x="562" y="466" font-size="9.8" fill="#475569" text-anchor="middle">返工/重派</text><rect x="624" y="426" width="104" height="58" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2"/><text x="676" y="446" font-size="10.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">预算耗尽</text><text x="676" y="466" font-size="9.8" fill="#475569" text-anchor="middle">降级/交人</text><rect x="738" y="426" width="108" height="58" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/><text x="792" y="446" font-size="10.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">副作用未知</text><text x="792" y="466" font-size="9.8" fill="#7F1D1D" text-anchor="middle">先查状态</text><rect x="40" y="514" width="820" height="64" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/><text x="54" y="536" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="start">硬预算：任何一条到顶就停，不允许无限迭代</text><text x="54" y="560" font-size="10.5" fill="#334155" text-anchor="start">轮数 · 工具调用 · token · 墙钟 · 金额 · 子 Agent 数/深度 · 重复动作指纹 · 无进展窗口 · 全局总预算</text><rect x="40" y="594" width="820" height="48" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="54" y="614" font-size="10.5" fill="#475569" text-anchor="start">控制后仍失败：降级 → 补偿/回滚 → 交人（带交接包）→ 止血 → 复盘；复盘过的失败才允许写进长期记忆。</text><text x="54" y="632" font-size="10.5" font-weight="600" fill="#0F172A" text-anchor="start">子 Agent 说「完成了」只是履约声明，不能凭声明通过验收。</text></svg>
