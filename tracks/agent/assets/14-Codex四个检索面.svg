<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" aria-label="Codex 的四个检索面：零向量、词法加 agentic"><title>Codex 四个检索面</title><defs><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrow-decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs><rect x="0" y="0" width="900" height="800" fill="#FFFFFF"/><text x="450" y="24" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">四个检索面（全仓零 embedding / 零 rerank / 零 FTS）</text><rect x="30" y="44" width="410" height="180" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="235" y="68" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">① web_search：一个工具两种协议</text><rect x="50" y="82" width="180" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.3"/><text x="140" y="104" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">托管 hosted</text><text x="140" y="122" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">服务端执行 · 只回</text><text x="140" y="136" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">WebSearchCall 行为摘要</text><rect x="244" y="82" width="180" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.3"/><text x="334" y="104" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">独立 web.run</text><text x="334" y="122" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">recent_input→检索 API</text><text x="334" y="136" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">正文入历史 · 结构化走旁路</text><text x="235" y="170" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">WebSearchMode：Cached / Indexed / Live / Disabled</text><text x="235" y="194" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">retriever 在谁手里＝拿到证据还是日志</text><text x="235" y="214" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">hosted_spec.rs:14 · ext/web-search/src/tool.rs:46</text><rect x="460" y="44" width="410" height="180" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="665" y="68" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">② 代码检索：零索引 agentic search</text><rect x="480" y="82" width="150" height="52" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.3"/><text x="555" y="104" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">exec_command</text><text x="555" y="122" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">{ cmd: "rg ..." }</text><rect x="648" y="82" width="200" height="52" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.3"/><text x="748" y="104" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">预算双闸</text><text x="748" y="122" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">max_output_tokens 10K · 1MiB 环形缓冲</text><path d="M630,108 L644,108" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow-neutral)"/><text x="665" y="160" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">HeadTailBuffer 保头保尾丢中段 · 一句 prompt 规矩"优先 rg"</text><text x="665" y="184" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">ranking 外包给模型多轮：grep → read → 再 grep</text><text x="665" y="206" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">文件系统就是索引；交互式查询分解，静态索引服务不了</text><rect x="30" y="250" width="410" height="270" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><text x="235" y="274" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">③ tool_search：RAG 用在工具目录上</text><rect x="50" y="290" width="370" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.3"/><text x="235" y="307" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#0F172A" text-anchor="middle">corpus＝Deferred 工具 · search_text＝名称+描述+Schema 递归展平</text><text x="235" y="323" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">ToolSearchEntry · tools/src/tool_search.rs:111</text><rect x="50" y="342" width="176" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.3"/><text x="138" y="359" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#0F172A" text-anchor="middle">index＝BM25 + 缓存</text><text x="138" y="375" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">ptr_eq/按值失效</text><rect x="244" y="342" width="176" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.3"/><text x="332" y="359" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#0F172A" text-anchor="middle">query+limit(8)</text><text x="332" y="375" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">空参→RespondToModel</text><path d="M235,330 L235,338 M138,338 L138,342 M332,338 L332,342" fill="none"  stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="1.2"/><rect x="50" y="396" width="370" height="44" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.3"/><text x="235" y="414" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#064E3B" text-anchor="middle">ToolSearchOutput：schema + defer_loading=true</text><text x="235" y="432" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#064E3B" text-anchor="middle">router 放行"已命中"的 Deferred → 模型下一轮直接调用</text><text x="235" y="466" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">检索产物不是文本证据，而是可执行能力</text><text x="235" y="488" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">retrieve → act 闭环，没有"生成前拼接"这一步</text><text x="235" y="508" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">ToolExposure：Direct 热知识 / Deferred 冷知识 / Hidden 只 dispatch</text><rect x="460" y="250" width="410" height="270" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><text x="665" y="274" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#78350F" text-anchor="middle">④ 渐进披露：目录 + 定位符，正文按需</text><rect x="480" y="290" width="370" height="44" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="665" y="307" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="middle">AGENTS.md：git 根→cwd 逐级拼接 · 零打分路径枚举</text><text x="665" y="325" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#78350F" text-anchor="middle">32 KiB 预算顺序扣截断 · 变化时发"此前指令作废"通知</text><rect x="480" y="346" width="370" height="44" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="665" y="363" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="middle">Skills：目录行＝name+截断描述+定位符（10K token 预算）</text><text x="665" y="381" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#78350F" text-anchor="middle">skills.read 分页游标 · 选文件要窄，读入选文件要全</text><rect x="480" y="398" width="370" height="40" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="665" y="415" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="middle">MCP resources：list → read 两级契约</text><text x="665" y="431" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="10.5" fill="#78350F" text-anchor="middle">"uri 必须来自上一步 list 的返回"</text><text x="665" y="464" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#78350F" text-anchor="middle">每层目录都有独立字节闸门；预算＝截断而非重排</text><text x="665" y="486" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">skill 排序器（BM25/n-gram/RRF）只在影子模式跑埋点——</text><text x="665" y="506" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">先证明排序器优于模型自选，再改变模型可见目录</text><rect x="30" y="546" width="840" height="110" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="50" y="572" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="start">⑤ 历史检索（第五个面，给人也给模型）</text><text x="50" y="596" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">内容搜索：rg -l --fixed-strings 扫 sessions/*.jsonl → 与 SQLite 分页取交集 → snippet 前48/后96 字符（给人眼辨认，不给模型拼证据）</text><text x="50" y="618" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">元数据搜索：instr() 子串，不是 FTS 更不是向量 · 模型侧 list_threads / read_thread 同样两级分页 · 记忆候选＝纯时效窗口</text><text x="50" y="642" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start">rollout JSONL 是唯一事实源，DB 只是可重建的加速视图</text><rect x="30" y="680" width="840" height="96" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="50" y="706" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">否证与结论</text><text x="50" y="730" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">grep embedding/cosine/hnsw/faiss/rerank/similarity → 代码零命中；Cargo.lock 无向量库；30 个 migration 无 FTS 虚拟表</text><text x="50" y="754" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start">embedding 的两个职责被显式外包：ranking → 模型多轮决策（agentic）；候选缩减 → 元数据结构（namespace / exposure / cursor / 定位符）</text></svg>
