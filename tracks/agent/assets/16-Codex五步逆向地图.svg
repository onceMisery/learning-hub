eight="150" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="225" y="140" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Detect 的答案：三层循环</text><text x="225" y="164" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">submission_loop（任务级 · handlers.rs:411）</text><text x="225" y="184" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">→ RegularTask::run（轮次级 · regular.rs:104）</text><text x="225" y="204" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">→ run_turn 采样循环（步级 · turn.rs:163/423）</text><text x="225" y="228" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">判据：同时触碰 消息 · 模型调用 · 工具分发</text><text x="225" y="250" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#64748B" text-anchor="middle">工具执行流水线并行：in_flight FuturesOrdered</text><rect x="440" y="116" width="410" height="150" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="645" y="140" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Classify：七脉落点</text><text x="458" y="164" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">感知＝WorldState diff · 记忆＝rollout · 治理＝RetainedContext</text><text x="458" y="184" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">推理＝token 水位线代替步数预算 · 行动＝Orchestrator 四段</text><text x="458" y="204" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">反思＝ReviewTask + Guardian · 协作＝graph-store 边表+邮件板</text><text x="458" y="224" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">治理＝AskForApproval × SandboxPolicy × execpolicy 三源合流</text><text x="458" y="250" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#64748B" text-anchor="start">别看名字看职责：索引模块的主脉可能是感知</text><rect x="30" y="290" width="390" height="120" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="225" y="314" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Filter：丢掉了什么</text><text x="225" y="338" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">CLI 解析 · TUI 渲染 · 平台兼容层 · 埋点适配</text><text x="225" y="358" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">约七成——与"决策/上下文/状态/行动/权限"无关</text><text x="225" y="384" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">读的对象从源码 → 控制面</text><rect x="440" y="290" width="410" height="120" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="645" y="314" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Map：工程性格（热力图）</text><text x="645" y="338" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">重：感知（零向量 agentic）· 行动治理（沙箱审批）</text><text x="645" y="358" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">轻：记忆工程（无画像/无多精度）· 协作 V1（6 线程 1 层）</text><text x="645" y="384" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#64748B" text-anchor="middle">编码域开发者工具型 · 咬住的不变量：git + 事件日志</text><rect x="30" y="434" width="820" height="150" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="6 4"/><text x="440" y="458" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#1E3A8A" text-anchor="middle">Verify：结论 → 证据三层（源码 &gt; 测试 &gt; 文档）</text><text x="50" y="484" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">"无步数熔断" → grep max_steps 零命中；TurnState.tool_calls 只做埋点（state/turn.rs:99）</text><text x="50" y="506" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">"治理是运行时机制" → orchestrator.rs 文件头注释 · sandboxing/ 平台实现 · execpolicy Decision 三态</text><text x="50" y="528" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">"扇出硬封顶" → config/mod.rs:251/261 默认 6 线程/1 层 + AgentLimitReached 抛出点 · registry.rs reserve_spawn_slot</text><text x="50" y="550" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">"评审器被降权" → guardian settings 只读白名单 + intersect_with_read_only · 测试 suite 里 guardian_* 直接暴露边界</text><rect x="30" y="608" width="820" height="140" rx="12" fill="#DCFCE7" stroke="#059669" stroke-width="1.6"/><text x="440" y="634" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13.5" font-weight="600" fill="#064E3B" text-anchor="middle">四问评价（比"支持多少工具"更能暴露质量）</text><text x="440" y="660" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#064E3B" text-anchor="middle">可重建性：事件溯源 + Compacted 全文入盘 → 强</text><text x="440" y="682" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#064E3B" text-anchor="middle">执行一致性：受控执行器唯一入口 + 双钩子 → 强 · 副作用消除：批准可回写 execpolicy 规则 → 中</text><text x="440" y="704" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" fill="#064E3B" text-anchor="middle">治理完备性：沙箱/审批/Guardian/网络策略俱全 → 强 · 空白：步骤级检查点重跑、业务幂等账本（编码域可接受）</text><text x="440" y="734" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#064E3B" text-anchor="middle">从"我读过这个项目" → "我能比较这些项目"</text></svg>
