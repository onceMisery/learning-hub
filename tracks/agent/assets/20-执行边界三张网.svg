<svg xmlns="http://www.w3.org/2000/svg" width="860" height="580" viewBox="0 0 860 580" role="img" aria-label="执行边界三张网：防护四层、沙盒强度阶梯、致命四要素对应的四道边界"><title>执行边界的三张网</title><defs><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect x="0" y="0" width="860" height="580" fill="#FFFFFF"/><rect x="130" y="20" width="600" height="38" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6"/><text x="430" y="44" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">同一个动作请求，要连过三张网：防护顺序 · 隔离强度 · 边界归属</text><text x="40" y="86" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#1E3A8A" text-anchor="start">网一 · 防护四层（顺序不能反）</text><rect x="40" y="98" width="250" height="72" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="58" y="122" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">1 输入验证</text><text x="58" y="142" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">路径遍历 ../etc/passwd、</text><text x="58" y="158" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">分号与管道注入，先快速失败</text><rect x="40" y="180" width="250" height="72" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="58" y="204" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#78350F" text-anchor="start">2 权限控制</text><text x="58" y="224" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">工作目录白名单在上，黑名单只是地板；</text><text x="58" y="240" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">命令校验必须做语义解析</text><rect x="40" y="262" width="250" height="72" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="58" y="286" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">3 事前审批 + 事后验证</text><text x="58" y="306" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">异源同能力互审；拒绝理由写进轨迹；</text><text x="58" y="322" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">事后优先做模态切换（渲染成图 / 沙盒实跑）</text><rect x="40" y="344" width="250" height="72" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="58" y="368" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#064E3B" text-anchor="start">4 Sidecar 旁路</text><text x="58" y="388" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">与流式输出并行、只看结构化字段、</text><text x="58" y="404" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">数百毫秒决断，配拒绝熔断转人工</text><path d="M165,416 L165,434" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-up)"/><text x="40" y="456" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">审批管「批不批」，旁路管「来得及批吗」</text><text x="320" y="86" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#064E3B" text-anchor="start">网二 · 隔离强度四级</text><rect x="320" y="344" width="140" height="72" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="332" y="368" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#7F1D1D" text-anchor="start">venv（不是沙盒）</text><text x="332" y="388" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">只隔离包，不约束</text><text x="332" y="404" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">文件 / 网络 / 进程</text><rect x="320" y="262" width="140" height="72" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="332" y="286" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">① 进程级</text><text x="332" y="306" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">ulimit / seccomp</text><text x="332" y="322" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">与宿主同命</text><rect x="320" y="180" width="140" height="72" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="332" y="204" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#78350F" text-anchor="start">② 容器</text><text x="332" y="224" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">共享内核，</text><text x="332" y="240" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">存在逃逸面</text><rect x="460" y="98" width="140" height="72" rx="10" fill="#DCFCE7" stroke="#059669" stroke-width="1.4"/><text x="472" y="122" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#064E3B" text-anchor="start">③ microVM / VM</text><text x="472" y="142" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">独立内核</text><text x="472" y="158" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#064E3B" text-anchor="start">Firecracker 一类</text><path d="M390,344 L390,336" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><path d="M390,262 L390,254" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><path d="M420,216 L460,160" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-neutral)"/><text x="320" y="436" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">四级都要配：CPU / 内存 / 磁盘配额 + 超时</text><text x="320" y="452" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">超时须返回结构化错误，静默杀进程＝假成功</text><text x="320" y="468" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">默认断网 + 白名单代理 · 源码只读 · 密钥不挂入</text><text x="620" y="86" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#7F1D1D" text-anchor="start">网三 · 致命四要素 → 四道边界</text><rect x="620" y="98" width="200" height="80" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="634" y="120" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">数据边界</text><text x="634" y="140" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">私有数据的读取范围</text><text x="634" y="160" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">失守：整棵目录树进上下文</text><rect x="620" y="188" width="200" height="80" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="634" y="210" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">输入信任边界</text><text x="634" y="230" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">不受信内容与指令隔离</text><text x="634" y="250" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">失守：网页正文被当意图</text><rect x="620" y="278" width="200" height="80" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="634" y="300" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">输出影响边界</text><text x="634" y="320" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#475569" text-anchor="start">对外通信、写入、删除</text><text x="634" y="340" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">失守：确认邮件发给攻击者</text><rect x="620" y="368" width="200" height="80" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="634" y="390" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" font-weight="600" fill="#78350F" text-anchor="start">跨会话边界（第四维）</text><text x="634" y="410" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#78350F" text-anchor="start">持久记忆＝放大器，非必要条件</text><text x="634" y="430" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" fill="#7F1D1D" text-anchor="start">失守：注入被总结成经验</text><path d="M720,448 L720,468" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-danger)"/><text x="620" y="486" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11" font-weight="600" fill="#7F1D1D" text-anchor="start">三要素同时具备＝注入可造成真实损害</text><rect x="40" y="502" width="780" height="60" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="56" y="526" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">读法：三张网不是替代关系——黑名单挡不住的，靠语义解析；语义解析漏掉的，靠隔离强度；隔离里逃出来的，靠边界归属收口。</text><text x="56" y="548" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',ui-sans-serif,sans-serif" font-size="11.5" fill="#475569" text-anchor="start">结论一句：输入过滤挡不住注入，目标要改成「即使被注入，也执行不出危险动作」。</text></svg>
