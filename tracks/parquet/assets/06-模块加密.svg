<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-label="给每个抽屉单独上锁"><title>给每个抽屉单独上锁</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="0" y="0" width="920" height="640" fill="#FFFFFF"/><text x="30" y="34" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1F1E1A" text-anchor="start">给每个抽屉单独上锁</text><text x="30" y="54" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#6B695F" text-anchor="start">总目录、列元数据、页、页头、索引、布隆过滤器各自加密；封条 把它们钉在位置上</text><rect x="30" y="82" width="430" height="452" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.1"/><text x="44" y="104" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="600" fill="#1F1E1A" text-anchor="start">加密总目录模式（加密标记）</text><rect x="44" y="116" width="400" height="24" rx="4" fill="#FFFFFF" stroke="#1F1E1A" stroke-width="1"/><text x="52" y="132.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10" font-weight="400" fill="#1F1E1A" text-anchor="start">加密标记</text><rect x="44" y="144" width="400" height="52" rx="4" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1"/><text x="52" y="174.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10" font-weight="400" fill="#1F1E1A" text-anchor="start">第 1 摞</text><rect x="44" y="200" width="400" height="24" rx="4" fill="#FFFDF7" stroke="#EF9F27" stroke-width="1"/><text x="52" y="216.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10" font-weight="400" fill="#1F1E1A" text-anchor="start">  页（列钥匙）</text><rect x="44" y="228" width="400" height="24" rx="4" fill="#FFFDF7" stroke="#EF9F27" stroke-width="1"/><text x="52" y="244.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10" font-weight="400" fill="#1F1E1A" text-anchor="start">  页标签（列钥匙）</text><rect x="44" y="256" width="400" height="24" rx="4" fill="#FFFDF7" stroke="#EF9F27" stroke-width="1"/><text x="52" y="272.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10" font-weight="400" fill="#1F1E1A" text-anchor="start">  索引 / 排除卡（列钥匙）</text><rect x="44" y="284" width="400" height="52" rx="4" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1"/><text x="52" y="314.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10" font-weight="400" fill="#1F1E1A" text-anchor="start">第 2 摞</text><rect x="44" y="340" width="400" height="40" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="52" y="364.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10" font-weight="400" fill="#1F1E1A" text-anchor="start">加密说明</text><rect x="44" y="384" width="400" height="46" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="52" y="411.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10" font-weight="400" fill="#1F1E1A" text-anchor="start">加密后的总目录</text><rect x="44" y="434" width="400" height="26" rx="4" fill="#F5F4EF" stroke="#D3D1C7" stroke-width="1"/><text x="52" y="451.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10" font-weight="400" fill="#1F1E1A" text-anchor="start">len + 加密标记</text><text x="44" y="512" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">加密标记 让老读取器尽早失败，而不是读到一半才错</text><rect x="490" y="82" width="400" height="180" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.1"/><text x="504" y="104" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="600" fill="#1F1E1A" text-anchor="start">两种密钥，按列授权</text><rect x="504" y="118" width="180" height="52" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="514" y="137" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.6" font-weight="600" fill="#1E3A8A" text-anchor="start">总目录钥匙</text><text x="514" y="154" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">加密 总目录 / 同钥列</text><rect x="700" y="118" width="176" height="52" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1"/><text x="710" y="137" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.6" font-weight="600" fill="#4C7A1A" text-anchor="start">列钥匙</text><text x="710" y="154" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">只解这一列的页/索引</text><text x="504" y="192" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">钥匙线索存“怎么取钥匙”，不规定密钥管理服务</text><text x="504" y="210" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#8A2A2A" text-anchor="start">同一密钥下 全认证的随机数 绝不能重复</text><text x="504" y="228" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">全认证模式：所有模块都认证；只加密模式：页体只加密、不认证</text><rect x="490" y="282" width="400" height="252" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.1"/><text x="504" y="304" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="600" fill="#1F1E1A" text-anchor="start">封条 = 文件身份 + 模块身份</text><text x="504" y="326" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">文件身份：文件身份（如 employees_2026-10-01.part0）</text><text x="504" y="344" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">模块身份：文件唯一 ID + 模块类型 + 行组/列/页序号</text><text x="504" y="362" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="600" fill="#C46A0A" text-anchor="start">模块类型</text><text x="570" y="362" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">0 总目录 / 1 colmeta / 2 data page / 3 dict page</text><text x="504" y="390" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="600" fill="#C46A0A" text-anchor="start"></text><text x="570" y="390" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">4 data hdr / 5 dict hdr / 6 colidx / 7 offidx</text><text x="504" y="418" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="600" fill="#C46A0A" text-anchor="start"></text><text x="570" y="418" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">8 bloom hdr / 9 bloom bitset</text><text x="504" y="456" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#8A2A2A" text-anchor="start">掉包行组 0 的页到行组 1：行组序号变 → 认证校验失败</text><text x="504" y="474" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#8A2A2A" text-anchor="start">换整个文件：文件身份 / 文件 ID 变 → 校验失败</text><text x="504" y="492" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#8A2A2A" text-anchor="start">只加密模式：页体只加密、不认证，被改可能不报错</text><rect x="30" y="548" width="860" height="54" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="44" y="570" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="400" fill="#1E3A8A" text-anchor="start">明文总目录（标记 + 签名）：老读取器还能读非敏感列；敏感列统计被剥离到 单独加密的列说明。</text><text x="44" y="588" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="400" fill="#1E3A8A" text-anchor="start">它不隐藏 表结构 / 行数 / 列名；要隐藏这些，必须用加密 总目录。</text></svg>