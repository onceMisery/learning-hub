<svg xmlns="http://www.w3.org/2000/svg" width="920" height="650" viewBox="0 0 920 650" role="img" aria-label="嵌套像一栋楼：每个值都带着楼层号"><title>嵌套像一栋楼：每个值都带着楼层号</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="0" y="0" width="920" height="650" fill="#FFFFFF"/><text x="30" y="34" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1F1E1A" text-anchor="start">嵌套像一栋楼：每个值都带着楼层号</text><text x="30" y="54" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#6B695F" text-anchor="start">层数 说“停在哪层”，重复层号 说“在哪层重复”</text><rect x="30" y="82" width="300" height="250" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.2"/><text x="44" y="104" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="600" fill="#1F1E1A" text-anchor="start">表结构：订单 → 商品 → SKU / 标签</text><rect x="44" y="118" width="272" height="32" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.9"/><text x="52" y="132" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="600" fill="#1F1E1A" text-anchor="start">订单（可空）</text><text x="52" y="145" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="start">最多 1 层</text><rect x="62" y="158" width="254" height="32" rx="5" fill="#FFF6E8" stroke="#EF9F27" stroke-width="0.9"/><text x="70" y="172" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="600" fill="#1F1E1A" text-anchor="start">商品（可重复）</text><text x="70" y="185" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="start">最多 2 层 / 重复 1 层</text><rect x="80" y="198" width="236" height="32" rx="5" fill="#EAF3DE" stroke="#639922" stroke-width="0.9"/><text x="88" y="212" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="600" fill="#1F1E1A" text-anchor="start">SKU（可空，整数）</text><text x="88" y="225" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="start">最多 3 层</text><rect x="80" y="238" width="236" height="32" rx="5" fill="#FFF6E8" stroke="#EF9F27" stroke-width="0.9"/><text x="88" y="252" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="600" fill="#1F1E1A" text-anchor="start">标签（可重复）</text><text x="88" y="265" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="start">最多 3 层 / 重复 2 层</text><rect x="98" y="278" width="218" height="32" rx="5" fill="#EAF3DE" stroke="#639922" stroke-width="0.9"/><text x="106" y="292" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="600" fill="#1F1E1A" text-anchor="start">标签值（可空，字符串）</text><text x="106" y="305" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="start">最多 4 层</text><text x="44" y="322" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">SKU 最多 3 层；标签最多 4 层；最多重复 2 层</text><rect x="350" y="82" width="245" height="250" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.2"/><text x="364" y="104" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="600" fill="#1F1E1A" text-anchor="start">4 行订单</text><rect x="364" y="118" width="216" height="38" rx="5" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.9"/><text x="374" y="133" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="600" fill="#1F1E1A" text-anchor="start">行 1</text><text x="374" y="148" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">订单为空</text><rect x="364" y="166" width="216" height="38" rx="5" fill="#FFF6E8" stroke="#EF9F27" stroke-width="0.9"/><text x="374" y="181" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="600" fill="#1F1E1A" text-anchor="start">行 2</text><text x="374" y="196" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">订单在，商品列表为空</text><rect x="364" y="214" width="216" height="38" rx="5" fill="#EAF3DE" stroke="#639922" stroke-width="0.9"/><text x="374" y="229" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="600" fill="#1F1E1A" text-anchor="start">行 3</text><text x="374" y="244" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">一项：SKU 为空，标签为空</text><rect x="364" y="262" width="216" height="38" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.9"/><text x="374" y="277" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="600" fill="#1F1E1A" text-anchor="start">行 4</text><text x="374" y="292" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">两项：100[标签 x,y,z] / 200[空]</text><rect x="615" y="82" width="275" height="250" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.2"/><text x="629" y="104" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="600" fill="#1F1E1A" text-anchor="start">值流（只看标签列）</text><rect x="629" y="118" width="42" height="23" rx="4" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/><text x="650" y="134" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="600" fill="#1F1E1A" text-anchor="middle">—</text><text x="683" y="134" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">层数=0</text><text x="741" y="134" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">重复层号=0</text><text x="801" y="134" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">新行</text><rect x="629" y="148" width="42" height="23" rx="4" fill="#FFF6E8" stroke="#EF9F27" stroke-width="0.8"/><text x="650" y="164" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="600" fill="#1F1E1A" text-anchor="middle">—</text><text x="683" y="164" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">层数=1</text><text x="741" y="164" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">重复层号=0</text><text x="801" y="164" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">订单在，商品空</text><rect x="629" y="178" width="42" height="23" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="650" y="194" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="600" fill="#1F1E1A" text-anchor="middle">—</text><text x="683" y="194" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">层数=2</text><text x="741" y="194" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">重复层号=0</text><text x="801" y="194" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">商品在，标签空</text><rect x="629" y="208" width="42" height="23" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.8"/><text x="650" y="224" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="600" fill="#1F1E1A" text-anchor="middle">x</text><text x="683" y="224" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">层数=4</text><text x="741" y="224" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">重复层号=0</text><text x="801" y="224" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">第一个标签</text><rect x="629" y="238" width="42" height="23" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.8"/><text x="650" y="254" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="600" fill="#1F1E1A" text-anchor="middle">y</text><text x="683" y="254" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">层数=4</text><text x="741" y="254" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">重复层号=2</text><text x="801" y="254" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">同一商品的下一个标签</text><rect x="629" y="268" width="42" height="23" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.8"/><text x="650" y="284" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="600" fill="#1F1E1A" text-anchor="middle">z</text><text x="683" y="284" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">层数=4</text><text x="741" y="284" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">重复层号=2</text><text x="801" y="284" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">同一商品的再下一个</text><rect x="629" y="298" width="42" height="23" rx="4" fill="#FFF6E8" stroke="#EF9F27" stroke-width="0.8"/><text x="650" y="314" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="600" fill="#1F1E1A" text-anchor="middle">—</text><text x="683" y="314" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">层数=2</text><text x="741" y="314" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">重复层号=1</text><text x="801" y="314" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">下一个商品，标签空</text><text x="30" y="366" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1F1E1A" text-anchor="start">把流拼回树：重复层号 决定回到哪一层，层数 决定在哪一层补 null</text><rect x="30" y="380" width="96" height="32" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.9"/><text x="78" y="401" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="600" fill="#1F1E1A" text-anchor="middle">x  重复层号=0</text><text x="142" y="401" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="400" fill="#6B695F" text-anchor="start">开新行 → 开订单 → 开商品 → 放标签</text><rect x="30" y="424" width="96" height="32" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.9"/><text x="78" y="445" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="600" fill="#1F1E1A" text-anchor="middle">y  重复层号=2</text><text x="142" y="445" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="400" fill="#6B695F" text-anchor="start">回到标签层，不关商品</text><rect x="30" y="468" width="96" height="32" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.9"/><text x="78" y="489" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="600" fill="#1F1E1A" text-anchor="middle">z  重复层号=2</text><text x="142" y="489" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="400" fill="#6B695F" text-anchor="start">回到标签层，继续同一商品</text><rect x="30" y="512" width="96" height="32" rx="5" fill="#FFF6E8" stroke="#EF9F27" stroke-width="0.9"/><text x="78" y="533" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="600" fill="#1F1E1A" text-anchor="middle">—  重复层号=1 / 层数=2</text><text x="142" y="533" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="400" fill="#6B695F" text-anchor="start">关标签层，回到商品层；商品存在、标签为空</text><rect x="520" y="380" width="370" height="168" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.2"/><text x="534" y="402" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="600" fill="#1F1E1A" text-anchor="start">三条容易记错的线</text><text x="534" y="420" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.6" font-weight="600" fill="#C46A0A" text-anchor="start">层数 不是“第几个值”</text><text x="534" y="436" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">是路径上已经存在的可空/可重复层数</text><text x="534" y="462" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.6" font-weight="600" fill="#C46A0A" text-anchor="start">重复层号 不是“重复次数”</text><text x="534" y="478" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">是“从哪一层开始重复”，0 才是新行</text><text x="534" y="504" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.6" font-weight="600" fill="#C46A0A" text-anchor="start">NULL 不占值空间</text><text x="534" y="520" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">1000 个 null 只剩一段 层数 流的 重复压缩</text><rect x="30" y="598" width="860" height="34" rx="8" fill="#FFF6E8" stroke="#F2D9A7" stroke-width="1"/><text x="44" y="620" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#854F0B" text-anchor="start">口径：README.md:166-182、LogicalTypes.md:848-1099；示例为简化 schema，真实 LIST 会多一层 list/element 包装。</text></svg>