<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-label="下推是一条漏斗：每一层只回答“一定不命中”"><title>下推是一条漏斗：每一层只回答“一定不命中”</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="0" y="0" width="920" height="620" fill="#FFFFFF"/><text x="30" y="34" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1F1E1A" text-anchor="start">下推是一条漏斗：每一层只回答“一定不命中”</text><text x="30" y="54" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#6B695F" text-anchor="start">统计 → 布隆过滤器 → 页索引 → 解码；任何一层说不在，后面的 I/O 就省了</text><rect x="30" y="82" width="350" height="92" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/><text x="44" y="104" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="600" fill="#1E3A8A" text-anchor="start">查询</text><text x="44" y="124" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="400" fill="#1F1E1A" text-anchor="start">WHERE event_type = 'signup'</text><text x="44" y="142" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="400" fill="#1F1E1A" text-anchor="start">  AND event_ts &gt;= '2026-10-01'</text><text x="44" y="160" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="400" fill="#1F1E1A" text-anchor="start">  AND event_ts &lt;  '2026-10-02'</text><text x="30" y="210" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1F1E1A" text-anchor="start">裁剪漏斗</text><rect x="30" y="228" width="470" height="46" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="44" y="247" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="600" fill="#1F1E1A" text-anchor="start">文件清单</text><text x="44" y="263" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">4 个文件</text><text x="300" y="256" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.2" font-weight="600" fill="#1F1E1A" text-anchor="start">留下 1 个</text><line x1="265" y1="276" x2="265" y2="286" stroke="#C46A0A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="30" y="286" width="470" height="46" rx="6" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1"/><text x="44" y="305" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="600" fill="#1F1E1A" text-anchor="start">行组统计</text><text x="44" y="321" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">8 个行组</text><text x="300" y="314" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.2" font-weight="600" fill="#1F1E1A" text-anchor="start">留下 3 个</text><line x1="265" y1="334" x2="265" y2="344" stroke="#C46A0A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="30" y="344" width="470" height="46" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1"/><text x="44" y="363" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="600" fill="#1F1E1A" text-anchor="start">布隆 / 页索引</text><text x="44" y="379" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">每行组 20 页</text><text x="300" y="372" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.2" font-weight="600" fill="#1F1E1A" text-anchor="start">留下 5 页</text><line x1="265" y1="392" x2="265" y2="402" stroke="#C46A0A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="30" y="402" width="470" height="46" rx="6" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1"/><text x="44" y="421" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="600" fill="#1F1E1A" text-anchor="start">解码</text><text x="44" y="437" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">5 页 × 2 列</text><text x="300" y="430" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.2" font-weight="600" fill="#1F1E1A" text-anchor="start">100 行</text><rect x="530" y="82" width="360" height="224" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.1"/><text x="544" y="104" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#1F1E1A" text-anchor="start">每页值域卡：每页一行 最小/最大</text><text x="544" y="126" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="600" fill="#6B695F" text-anchor="start">页</text><text x="630" y="126" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="600" fill="#6B695F" text-anchor="start">最小事件时间</text><text x="716" y="126" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="600" fill="#6B695F" text-anchor="start">最大事件时间</text><text x="802" y="126" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="600" fill="#6B695F" text-anchor="start">判定</text><rect x="538" y="136" width="344" height="23" rx="4" fill="#FCEBEB" stroke="none" stroke-width="0"/><text x="544" y="152" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#1F1E1A" text-anchor="start">0</text><text x="580" y="152" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">09-28</text><text x="666" y="152" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">09-30</text><text x="752" y="152" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="600" fill="#8A2A2A" text-anchor="start">跳过</text><rect x="538" y="165" width="344" height="23" rx="4" fill="#EAF3DE" stroke="none" stroke-width="0"/><text x="544" y="181" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#1F1E1A" text-anchor="start">1</text><text x="580" y="181" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">09-30</text><text x="666" y="181" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">10-01</text><text x="752" y="181" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="600" fill="#4C7A1A" text-anchor="start">候选</text><rect x="538" y="194" width="344" height="23" rx="4" fill="#EAF3DE" stroke="none" stroke-width="0"/><text x="544" y="210" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#1F1E1A" text-anchor="start">2</text><text x="580" y="210" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">10-01</text><text x="666" y="210" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">10-02</text><text x="752" y="210" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="600" fill="#4C7A1A" text-anchor="start">候选</text><rect x="538" y="223" width="344" height="23" rx="4" fill="#FCEBEB" stroke="none" stroke-width="0"/><text x="544" y="239" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#1F1E1A" text-anchor="start">3</text><text x="580" y="239" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">10-02</text><text x="666" y="239" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">10-03</text><text x="752" y="239" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="600" fill="#8A2A2A" text-anchor="start">跳过</text><rect x="538" y="252" width="344" height="23" rx="4" fill="#FCEBEB" stroke="none" stroke-width="0"/><text x="544" y="268" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#1F1E1A" text-anchor="start">4</text><t