<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-label="坏在哪一层，损失就停在哪一层"><title>坏在哪一层，损失就停在哪一层</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="0" y="0" width="920" height="640" fill="#FFFFFF"/><text x="30" y="34" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1F1E1A" text-anchor="start">坏在哪一层，损失就停在哪一层</text><text x="30" y="54" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#6B695F" text-anchor="start">总目录 是单点；页头坏了会丢剩余页；页体坏了只丢一页；小行组更抗坏</text><rect x="30" y="82" width="390" height="430" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.1"/><text x="44" y="104" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="600" fill="#1F1E1A" text-anchor="start">四个损坏边界</text><rect x="44" y="118" width="360" height="58" rx="7" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.1"/><text x="56" y="141" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.2" font-weight="600" fill="#8A2A2A" text-anchor="start">总目录</text><text x="56" y="160" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="400" fill="#6B695F" text-anchor="start">整个文件丢失</text><text x="300" y="152" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="600" fill="#8A2A2A" text-anchor="middle">×</text><rect x="44" y="192" width="360" height="58" rx="7" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/><text x="56" y="215" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.2" font-weight="600" fill="#C46A0A" text-anchor="start">列说明卡</text><text x="56" y="234" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="400" fill="#6B695F" text-anchor="start">该列块丢失</text><text x="300" y="226" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="600" fill="#C46A0A" text-anchor="middle">×</text><rect x="44" y="266" width="360" height="58" rx="7" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/><text x="56" y="289" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.2" font-weight="600" fill="#C46A0A" text-anchor="start">页标签</text><text x="56" y="308" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="400" fill="#6B695F" text-anchor="start">该列块剩余页丢失</text><text x="300" y="300" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="600" fill="#C46A0A" text-anchor="middle">×</text><rect x="44" y="340" width="360" height="58" rx="7" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="56" y="363" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.2" font-weight="600" fill="#4C7A1A" text-anchor="start">page body</text><text x="56" y="382" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="400" fill="#6B695F" text-anchor="start">该页丢失</text><text x="300" y="374" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="600" fill="#4C7A1A" text-anchor="middle">×</text><text x="44" y="440" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">越靠上，目录越根；越靠下，损失越局部。</text><text x="44" y="458" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">总目录没有通用 CRC；加密 总目录有 全认证，明文总目录 有签名。</text><text x="44" y="476" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">页级 CRC32 只覆盖页体，不覆盖页头，不防整体替换。</text><rect x="440" y="82" width="450" height="204" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.1"/><text x="454" y="104" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="600" fill="#1F1E1A" text-anchor="start">配置是三个尺寸的拉扯</text><text x="454" y="126" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">行组：128–256 MB 交互 / 512 MB–1 GB 批处理</text><text x="454" y="146" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">页：8 KB 细粒度 / 1 MB 低开销</text><text x="454" y="166" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">布隆：10–17 bit/值 ≈ 1%–0.1% 假阳性</text><text x="454" y="194" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">裁剪粒度</text><rect x="550" y="184" width="280" height="12" rx="6" fill="#F5F4EF" stroke="#D3D1C7" stroke-width="0.7"/><rect x="550" y="184" width="201.6" height="12" rx="6" fill="#EF9F27" stroke="#EF9F27" stroke-width="0"/><text x="840" y="194" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="start">72%</text><text x="454" y="222" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">元数据开销</text><rect x="550" y="212" width="280" height="12" rx="6" fill="#F5F4EF" stroke="#D3D1C7" stroke-width="0.7"/><rect x="550" y="212" width="106.4" height="12" rx="6" fill="#2563EB" stroke="#2563EB" stroke-width="0"/><text x="840" y="222" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="start">38%</text><text x="454" y="250" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">单任务内存</text><rect x="550" y="240" width="280" height="12" rx="6" fill="#F5F4EF" stroke="#D3D1C7" stroke-width="0.7"/><rect x="550" y="240" width="154.0" height="12" rx="6" fill="#639922" stroke="#639922" stroke-width="0"/><text x="840" y="250" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="start">55%</text><text x="454" y="272" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">调大行组：裁剪变粗、元数据变少、内存变高</text><rect x="440" y="302" width="450" height="210" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.1"/><text x="454" y="324" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="600" fill="#1F1E1A" text-anchor="start">读端 RSS 上涨：先分四类内存</text><rect x="454" y="340" width="100" height="28" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="0.9"/><text x="504" y="358" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="600" fill="#1F1E1A" text-anchor="middle">堆内</text><text x="566" y="358" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">对象/数组；看堆转储</text><rect x="454" y="378" width="100" height="28" rx="4" fill="#FFF6E8" stroke="#EF9F27" stroke-width="0.9"/><text x="504" y="396" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="600" fill="#1F1E1A" text-anchor="middle">堆外</text><text x="566" y="396" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">DirectBuffer/Arrow；看 allocator</text><rect x="454" y="416" width="100" height="28" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.9"/><text x="504" y="434" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="600" fill="#1F1E1A" text-anchor="middle">mmap</text><text x="566" y="434" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">页缓存；可回收，不是泄露</text><rect x="454" y="454" width="100" height="28" rx="4" fill="#F3E8FF" stroke="#7C3AED" stroke-width="0.9"/><text x="504" y="472" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="600" fill="#1F1E1A" text-anchor="middle">分配器</text><text x="566" y="472" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">free 后 RSS 不降；malloc arena</text><text x="454" y="500" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">先看“读一个行组”的峰值，不要只盯进程总 RSS。</text><rect x="30" y="536" width="860" height="66" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/><text x="44" y="558" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="400" fill="#8A2A2A" text-anchor="start">工程底线：临时文件 + 原子 rename；不要原地覆盖；保留清单/备份。</text><text x="44" y="576" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="400" fill="#8A2A2A" text-anchor="start">规范建议的小行组更抗坏，但元数据会变多；抗坏只是行组大小的一维，不是全部。</text><text x="44" y="594" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="400" fill="#8A2A2A" text-anchor="start">CRC 发现比特腐烂；防篡改用 全认证 + 封条；防文件替换还要校验文件身份。</text></svg>