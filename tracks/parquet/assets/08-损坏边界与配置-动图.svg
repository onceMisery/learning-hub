<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="坏在哪一层，损失就停在哪一层"><title>坏在哪一层，损失就停在哪一层</title><desc>红色点依次落到 总目录、列元数据、页头、页体；越靠下损失越局部</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="0" y="0" width="920" height="520" fill="#FFFFFF"/><text x="30" y="34" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1F1E1A" text-anchor="start">坏在哪一层，损失就停在哪一层</text><text x="30" y="54" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#6B695F" text-anchor="start">红色点依次落到 总目录、列元数据、页头、页体；越靠下损失越局部</text><style>.prog{transform-box:fill-box;transform-origin:left center;animation:prog 6.8s linear infinite}@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tok{animation:tok 6.8s ease-in-out infinite}
@keyframes tok{
0%,8%{transform:translate(230px,170px)}
18%,26%{transform:translate(230px,230px)}
36%,44%{transform:translate(230px,290px)}
54%,62%{transform:translate(230px,350px)}
72%,100%{transform:translate(660px,390px)}}
.hit{animation:hit 6.8s ease-in-out infinite}
@keyframes hit{0%,20%{opacity:.35}30%,55%{opacity:1}65%,100%{opacity:.55}}
.bar{transform-box:fill-box;transform-origin:left center;animation:bar 6.8s ease-in-out infinite}
@keyframes bar{0%,40%{transform:scaleX(.4)}60%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){.tok,.hit,.bar{animation:none} .tok{transform:translate(660px,390px)} .hit{opacity:1} .bar{transform:scaleX(1)}}
</style><line x1="30" y1="76" x2="890" y2="76" stroke="#D3D1C7" stroke-width="2"/><rect class="prog" x="30" y="74" width="860" height="4" rx="2" fill="#EF9F27"/><text x="30" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="start">0s</text><text x="890" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="end">6.8s</text><text x="460.0" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="middle">自动循环 · 减少动态效果时定格</text><rect x="30" y="110" width="360" height="380" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1"/><text x="44" y="132" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="600" fill="#1F1E1A" text-anchor="start">四个损坏边界，四种损失半径</text><g class="hit"><rect x="44" y="150" width="310" height="46" rx="5" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/><text x="56" y="169" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="600" fill="#1F1E1A" text-anchor="start">总目录</text><text x="56" y="185" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">整个文件丢失</text></g><g class="hit"><rect x="64" y="210" width="270" height="46" rx="5" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1"/><text x="76" y="229" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="600" fill="#1F1E1A" text-anchor="start">列说明卡</text><text x="76" y="245" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">该列块丢失</text></g><g class="hit"><rect x="84" y="270" width="230" height="46" rx="5" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1"/><text x="96" y="289" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="600" fill="#1F1E1A" text-anchor="start">页标签</text><text x="96" y="305" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">剩余页丢失</text></g><g class="hit"><rect x="104" y="330" width="190" height="46" rx="5" fill="#EAF3DE" stroke="#639922" stroke-width="1"/><text x="116" y="349" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="600" fill="#1F1E1A" text-anchor="start">页内容</text><text x="116" y="365" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">该页丢失</text></g><text x="44" y="404" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">越靠上越致命；总目录没有通用 校验</text><text x="44" y="422" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">页 校验 只覆盖页体；加密后的总目录 有 全认证</text><rect x="420" y="110" width="470" height="180" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1"/><text x="434" y="132" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="600" fill="#1F1E1A" text-anchor="start">配置的拉扯</text><text x="434" y="154" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">行组：128–256 MB 交互 / 512 MB–1 GB 批处理</text><text x="434" y="176" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">页：8 KB 细粒度 / 1 MB 低开销</text><text x="434" y="198" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">布隆：10–17 bit/值 ≈ 1%–0.1% 假阳性</text><rect x="434" y="216" width="420" height="10" rx="5" fill="#F5F4EF" stroke="#D3D1C7" stroke-width="0.6"/><rect class="bar" x="434" y="216" width="300" height="10" rx="5" fill="#EF9F27"/><text x="434" y="248" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">调大行组：裁剪变粗、元数据变少、内存变高</text><rect x="420" y="310" width="470" height="180" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1"/><text x="434" y="332" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="600" fill="#1F1E1A" text-anchor="start">读端 进程占用内存 上涨：先分四类内存</text><text x="434" y="356" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">堆内：对象/数组 → 堆转储</text><text x="434" y="378" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">堆外：堆外缓冲区 → 内存分配器</text><text x="434" y="400" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">内存映射文件：页缓存 → 可回收</text><text x="434" y="422" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">分配器：free 后 进程占用内存 不降</text><text x="434" y="452" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#8A2A2A" text-anchor="start">先看“读一个行组”的峰值，不要只盯总 进程占用内存</text><g class="tok" style="transform:translate(230px,170px)"><circle cx="0" cy="0" r="7" fill="#E24B4A" stroke="#8A2A2A" stroke-width="1.4"/></g><text x="30" y="506" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="start">动图自动循环；系统开启“减少动态效果”时定格在末帧。</text></svg>