<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-label="总目录像一棵树：从总目录走到页标签"><title>总目录像一棵树：从总目录走到页标签</title><desc>绿色点是 reader：先还原表结构，再按列块偏移跳到页</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="0" y="0" width="920" height="500" fill="#FFFFFF"/><text x="30" y="34" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1F1E1A" text-anchor="start">总目录像一棵树：从总目录走到页标签</text><text x="30" y="54" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#6B695F" text-anchor="start">绿色点是 reader：先还原表结构，再按列块偏移跳到页</text><style>.prog{transform-box:fill-box;transform-origin:left center;animation:prog 6.8s linear infinite}@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tok{animation:tok 6.8s ease-in-out infinite}
@keyframes tok{
0%,8%{transform:translate(330px,150px)}
16%,24%{transform:translate(330px,210px)}
32%,40%{transform:translate(330px,270px)}
48%,56%{transform:translate(330px,330px)}
64%,72%{transform:translate(330px,390px)}
82%,92%{transform:translate(640px,250px)}
96%,100%{transform:translate(640px,360px)}}
.pulse{animation:pulse 6.8s ease-in-out infinite}
@keyframes pulse{0%,55%{opacity:.35}65%,88%{opacity:1}95%,100%{opacity:.6}}
@media (prefers-reduced-motion: reduce){ .tok,.pulse{animation:none} .tok{transform:translate(640px,360px) !important} .prog{animation:none;transform:scaleX(1)} }
</style><line x1="30" y1="76" x2="890" y2="76" stroke="#D3D1C7" stroke-width="2"/><rect class="prog" x="30" y="74" width="860" height="4" rx="2" fill="#EF9F27"/><text x="30" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="start">0s</text><text x="890" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="end">6.8s</text><text x="460.0" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="middle">自动循环 · 减少动态效果时定格</text><rect x="30" y="110" width="450" height="360" rx="12" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.1"/><text x="44" y="132" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="600" fill="#1F1E1A" text-anchor="start">总目录里的树：按字段 id 找，按偏移跳</text><rect x="50" y="140" width="300" height="44" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="62" y="159" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="600" fill="#1F1E1A" text-anchor="start">总目录</text><text x="62" y="175" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">版本 / 表结构 / 行组</text><rect x="70" y="200" width="280" height="44" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="82" y="219" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="600" fill="#1F1E1A" text-anchor="start">表结构标签</text><text x="82" y="235" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">深度优先拍平；孩子数</text><rect x="90" y="260" width="260" height="44" rx="5" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1"/><text x="102" y="279" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="600" fill="#1F1E1A" text-anchor="start">一摞数据</text><text x="102" y="295" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">每列位置 / 行数 / 序号</text><rect x="110" y="320" width="240" height="44" rx="5" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1"/><text x="122" y="339" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="600" fill="#1F1E1A" text-anchor="start">一列的一叠</text><text x="122" y="355" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">说明卡 / 索引位置</text><rect x="130" y="380" width="220" height="44" rx="5" fill="#EAF3DE" stroke="#639922" stroke-width="1"/><text x="142" y="399" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="600" fill="#1F1E1A" text-anchor="start">列说明卡</text><text x="142" y="415" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">压缩 / 页 / 小抄</text><line x1="350" y1="168" x2="350" y2="196" stroke="#C46A0A" stroke-width="1.2" marker-end="url(#a)"/><line x1="350" y1="228" x2="350" y2="256" stroke="#C46A0A" stroke-width="1.2" marker-end="url(#a)"/><line x1="350" y1="288" x2="350" y2="316" stroke="#C46A0A" stroke-width="1.2" marker-end="url(#a)"/><line x1="350" y1="348" x2="350" y2="376" stroke="#C46A0A" stroke-width="1.2" marker-end="url(#a)"/><text x="44" y="466" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">页标签不在总目录：每页开头各有一份</text><rect x="510" y="110" width="380" height="360" rx="12" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.1"/><text x="524" y="132" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="600" fill="#1F1E1A" text-anchor="start">磁盘上的位置</text><rect x="524" y="150" width="60" height="32" rx="4" fill="#FFFFFF" stroke="#1F1E1A" stroke-width="1"/><text x="554" y="171" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.5" font-weight="400" fill="#1F1E1A" text-anchor="middle">标记</text><rect x="590" y="150" width="90" height="32" rx="4" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1"/><text x="635" y="171" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#1F1E1A" text-anchor="middle">第 1 摞</text><rect x="686" y="150" width="90" height="32" rx="4" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1"/><text x="731" y="171" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#1F1E1A" text-anchor="middle">第 2 摞</text><rect x="782" y="150" width="94" height="32" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="829" y="171" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#1F1E1A" text-anchor="middle">总目录</text><text x="524" y="208" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">这一列的说明卡 在 总目录</text><text x="524" y="226" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">它给 数据页起点 / 字典页起点</text><line x1="510" y1="314" x2="640" y2="250" stroke="#C46A0A" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="524" y="250" width="340" height="90" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1"/><text x="536" y="272" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="600" fill="#1F1E1A" text-anchor="start">定位列块</text><text x="536" y="290" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">start = 最小(字典页, 数据页)</text><text x="536" y="308" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">end = start + 这一叠总长度</text><text x="536" y="326" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">含页头；file_offset 已废弃</text><rect x="524" y="360" width="340" height="60" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/><text x="536" y="382" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#8A2A2A" text-anchor="start">未知 LogicalType → 按物理类型读</text><text x="536" y="400" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#8A2A2A" text-anchor="start">未知 Encoding → 明确报错</text><g class="tok" style="transform:translate(330px,150px)"><circle cx="0" cy="0" r="7" fill="#639922" stroke="#4C7A1A" stroke-width="1.4"/></g><text x="30" y="486" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="start">动图自动循环；系统开启“减少动态效果”时定格在末帧。</text></svg>