<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-label="嵌套像一栋楼：每个值都带着楼层号"><title>嵌套像一栋楼：每个值都带着楼层号</title><desc>绿色点沿标签列下行：x→y→z 在同一商品内重复；最后的空标签回到商品层</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="0" y="0" width="920" height="560" fill="#FFFFFF"/><text x="30" y="34" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1F1E1A" text-anchor="start">嵌套像一栋楼：每个值都带着楼层号</text><text x="30" y="54" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#6B695F" text-anchor="start">绿色点沿标签列下行：x→y→z 在同一商品内重复；最后的空标签回到商品层</text><style>.prog{transform-box:fill-box;transform-origin:left center;animation:prog 6.8s linear infinite}@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tok{animation:tok 6.8s ease-in-out infinite}
@keyframes tok{
0%,5%{transform:translate(830px,166px)}
11%,16%{transform:translate(830px,196px)}
22%,27%{transform:translate(830px,226px)}
33%,38%{transform:translate(830px,256px)}
44%,49%{transform:translate(830px,286px)}
55%,60%{transform:translate(830px,316px)}
66%,71%{transform:translate(830px,346px)}
78%,86%{transform:translate(250px,494px)}
96%,100%{transform:translate(760px,494px)}}
.rowhl{animation:rowhl 6.8s steps(1,end) infinite}
@keyframes rowhl{
0%,10%{transform:translate(0,0);opacity:.22}
10%,21%{transform:translate(0,30px);opacity:.22}
21%,32%{transform:translate(0,60px);opacity:.22}
32%,43%{transform:translate(0,90px);opacity:.22}
43%,54%{transform:translate(0,120px);opacity:.22}
54%,65%{transform:translate(0,150px);opacity:.22}
65%,76%{transform:translate(0,180px);opacity:.22}
76%,100%{opacity:0}}
.stack{animation:stack 6.8s ease-in-out infinite}
@keyframes stack{0%,76%{opacity:.45}84%,94%{opacity:1}98%,100%{opacity:.7}}
@media (prefers-reduced-motion: reduce){.tok,.rowhl,.stack{animation:none} .tok{transform:translate(760px,494px)} .rowhl{opacity:0} .stack{opacity:1}}
</style><line x1="30" y1="76" x2="890" y2="76" stroke="#D3D1C7" stroke-width="2"/><rect class="prog" x="30" y="74" width="860" height="4" rx="2" fill="#EF9F27"/><text x="30" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="start">0s</text><text x="890" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="end">6.8s</text><text x="460.0" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="middle">自动循环 · 减少动态效果时定格</text><rect x="30" y="110" width="270" height="280" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.1"/><text x="44" y="132" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.6" font-weight="600" fill="#1F1E1A" text-anchor="start">表结构：订单 → 商品 → SKU / 标签</text><rect x="42" y="148" width="246" height="32" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.9"/><text x="52" y="162" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="600" fill="#1F1E1A" text-anchor="start">订单（可空）</text><text x="52" y="175" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.2" font-weight="400" fill="#6B695F" text-anchor="start">层数 1</text><rect x="56" y="192" width="232" height="32" rx="4" fill="#FFF6E8" stroke="#EF9F27" stroke-width="0.9"/><text x="66" y="206" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="600" fill="#1F1E1A" text-anchor="start">商品（可重复）</text><text x="66" y="219" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.2" font-weight="400" fill="#6B695F" text-anchor="start">层数 2 / 重复层号 1</text><rect x="70" y="236" width="218" height="32" rx="4" fill="#EAF3DE"