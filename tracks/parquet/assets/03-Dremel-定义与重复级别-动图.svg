" fill="#6B695F" text-anchor="start">第一个标签</text><rect x="344" y="284" width="40" height="22" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="0.7"/><text x="364" y="299" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="600" fill="#1F1E1A" text-anchor="middle">y</text><text x="420" y="299" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9" font-weight="400" fill="#1F1E1A" text-anchor="start">4</text><text x="470" y="299" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9" font-weight="400" fill="#1F1E1A" text-anchor="start">2</text><text x="530" y="299" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">同一商品的下一个</text><rect x="344" y="314" width="40" height="22" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="0.7"/><text x="364" y="329" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="600" fill="#1F1E1A" text-anchor="middle">z</text><text x="420" y="329" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9" font-weight="400" fill="#1F1E1A" text-anchor="start">4</text><text x="470" y="329" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9" font-weight="400" fill="#1F1E1A" text-anchor="start">2</text><text x="530" y="329" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">同一商品的再下一个</text><rect x="344" y="344" width="40" height="22" rx="3" fill="#FFF6E8" stroke="#EF9F27" stroke-width="0.7"/><text x="364" y="359" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="600" fill="#1F1E1A" text-anchor="middle">—</text><text x="420" y="359" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9" font-weight="400" fill="#1F1E1A" text-anchor="start">2</text><text x="470" y="359" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9" font-weight="400" fill="#1F1E1A" text-anchor="start">1</text><text x="530" y="359" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">下一个商品，标签空</text><text x="344" y="392" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">层数 是累计层数；重复层号 是“从哪层重复”，0 才是新行。</text><rect x="30" y="410" width="860" height="100" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.1"/><text x="44" y="432" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="600" fill="#1F1E1A" text-anchor="start">把线性流拼回树：重复层号 关闭下层容器，层数 补 NULL</text><g class="stack"><rect x="44" y="446" width="220" height="48" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="56" y="466" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="600" fill="#1F1E1A" text-anchor="start">订单</text><text x="56" y="482" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">重复层号=0 新行</text><rect x="278" y="446" width="220" height="48" rx="5" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1"/><text x="290" y="466" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="600" fill="#1F1E1A" text-anchor="start">商品</text><text x="290" y="482" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">重复层号=1 下一项</text><rect x="512" y="446" width="180" height="48" rx="5" fill="#EAF3DE" stroke="#639922" stroke-width="1"/><text x="524" y="466" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="600" fill="#1F1E1A" text-anchor="start">标签</text><text x="524" y="482" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">重复层号=2 下一个标签</text><line x1="264" y1="470" x2="274" y2="470" stroke="#C46A0A" stroke-width="1.2" stroke-dasharray="3 2"/><line x1="498" y1="470" x2="508" y2="470" stroke="#639922" stroke-width="1.2" stroke-dasharray="3 2"/></g><g class="tok" style="transform:translate(830px,166px)"><circle cx="0" cy="0" r="7" fill="#639922" stroke="#4C7A1A" stroke-width="1.4"/></g><text x="30" y="546" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="start">动图自动循环；系统开启“减少动态效果”时定格在末帧。</text></svg>