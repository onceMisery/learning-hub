<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="同一条查询：行存读整行，列存读列 + 目录"><title>同一条查询：行存读整行，列存读列 + 目录</title><desc>作家写文件、读者从尾部找目录；橙色是写指针，绿色是读指针</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="0" y="0" width="920" height="520" fill="#FFFFFF"/><text x="30" y="34" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1F1E1A" text-anchor="start">同一条查询：行存读整行，列存读列 + 目录</text><text x="30" y="54" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#6B695F" text-anchor="start">作家写文件、读者从尾部找目录；橙色是写指针，绿色是读指针</text><style>
text{font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif}
.prog{transform-box:fill-box;transform-origin:left center;animation:prog 6.8s linear infinite}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.wtok{animation:wtok 6.8s ease-in-out infinite}
@keyframes wtok{
0%,6%{transform:translate(60px,138px)}
10%,24%{transform:translate(190px,138px)}
28%,42%{transform:translate(410px,138px)}
46%,58%{transform:translate(610px,138px)}
62%,100%{transform:translate(760px,138px)}}
.rtok{animation:rtok 6.8s ease-in-out infinite}
@keyframes rtok{
0%,42%{transform:translate(850px,210px)}
48%,56%{transform:translate(610px,210px)}
62%,72%{transform:translate(190px,210px)}
78%,88%{transform:translate(190px,360px)}
94%,100%{transform:translate(780px,360px)}}
.fade{animation:fade 6.8s ease-in-out infinite}
@keyframes fade{0%,10%{opacity:.35}20%,38%{opacity:1}50%,100%{opacity:.35}}
.fade2{animation:fade2 6.8s ease-in-out infinite}
@keyframes fade2{0%,35%{opacity:.3}45%,60%{opacity:1}70%,100%{opacity:.55}}
.page{animation:page 6.8s ease-in-out infinite}
@keyframes page{0%,55%{opacity:.35}65%,78%{opacity:1}88%,100%{opacity:.55}}
.read{animation:read 6.8s ease-in-out infinite}
@keyframes read{0%,72%{opacity:.25}80%,90%{opacity:1}96%,100%{opacity:.7}}
@media (prefers-reduced-motion: reduce){
.prog,.wtok,.rtok,.fade,.fade2,.page,.read{animation:none}
.prog{transform:scaleX(1)} .wtok{transform:translate(760px,138px)!important} .rtok{transform:translate(780px,360px)!important}
.fade,.fade2,.page,.read{opacity:1}
}
