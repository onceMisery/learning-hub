<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="编码改形状，压缩收体积"><title>编码改形状，压缩收体积</title><desc>橙色点沿列级流水线走：字典、重复压缩、差值、压缩；页头不压缩</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="0" y="0" width="920" height="520" fill="#FFFFFF"/><text x="30" y="34" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1F1E1A" text-anchor="start">编码改形状，压缩收体积</text><text x="30" y="54" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#6B695F" text-anchor="start">橙色点沿列级流水线走：字典、重复压缩、差值、压缩；页头不压缩</text><style>.prog{transform-box:fill-box;transform-origin:left center;animation:prog 6.8s linear infinite}@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tok{animation:tok 6.8s ease-in-out infinite}
@keyframes tok{
0%,8%{transform:translate(170px,150px)}
14%,24%{transform:translate(320px,150px)}
30%,40%{transform:translate(470px,150px)}
46%,56%{transform:translate(620px,150px)}
62%,70%{transform:translate(770px,150px)}
78%,100%{transform:translate(770px,185px)}}
.alp{animation:pulse 6.8s ease-in-out infinite}
@keyframes pulse{0%,55%{opacity:.45}65%,85%{opacity:1}95%,100%{opacity:.6}}
.chips{animation:chips 6.8s ease-in-out infinite}
@keyframes chips{0%,35%{opacity:1}45%,100%{opacity:.25}}
.重复段{transform-box:fill-box;transform-origin:left center;animation:重复段 6.8s ease-in-out infinite}
@keyframes 重复段{0%,45%{transform:scaleX(0);opacity:.3}55%,100%{transform:scaleX(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.tok,.alp,.chips,.重复段{animation:none} .tok{transform:translate(770px,185px)} .alp{opacity:1} .chips{opacity:.25} .重复段{transform:scaleX(1);opacity:1}}
</style><line x1="30" y1="76" x2="890" y2="76" stroke="#D3D1C7" stroke-width="2"/><rect class="prog" x="30" y="74" width="860" height="4" rx="2" fill="#EF9F27"/><text x="30" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="start">0s</text><text x="890" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="end">6.8s</text><text x="460.0" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="middle">自动循环 · 减少动态效果时定格</text><rect x="30" y="120" width="130" height="60" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="95" y="145" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="600" fill="#1F1E1A" text-anchor="middle">原始值</text><text x="95" y="163" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="middle">整数 / 字符串 / 浮点</text><line x1="162" y1="150" x2="176" y2="150" stroke="#C46A0A" stroke-width="1.3" marker-end="url(#a)"/><rect x="180" y="120" width="130" height="60" rx="6" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1"/><text x="245" y="145" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="600" fill="#1F1E1A" text-anchor="middle">字典</text><text x="245" y="163" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="middle">去重 + 下标</text><line x1="312" y1="150" x2="326" y2="150" stroke="#C46A0A" stroke-width="1.3" marker-end="url(#a)"/><rect x="330" y="120" width="130" height="60" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1"/><text x="395" y="145" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="600" fill="#1F1E1A" text-anchor="middle">重复压缩</text><text x="395" y="163" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="middle">连续 → 重复段</text><line x1="462" y1="150" x2="476" y2="150" stroke="#C46A0A" stroke-width="1.3" marker-end="url(#a)"/><rect x="480" y="120" width="130" height="60" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="545" y="145" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="600" fill="#1F1E1A" text-anchor="middle">差值</text><text x="545" y="163" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="middle">相邻差 / 前缀</text><line x1="612" y1="150" x2="626" y2="150" stroke="#C46A0A" stroke-width="1.3" marker-end="url(#a)"/><rect x="630" y="120" width="130" height="60" rx="6" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1"/><text x="695" y="145" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="600" fill="#1F1E1A" text-anchor="middle">压缩</text><text x="695" y="163" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="middle">Snappy / ZSTD</text><line x1="762" y1="150" x2="776" y2="150" stroke="#C46A0A" stroke-width="1.3" marker-end="url(#a)"/><rect x="780" y="120" width="130" height="60" rx="6" fill="#FBFAF6" stroke="#1F1E1A" stroke-width="1"/><text x="845" y="145" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="600" fill="#1F1E1A" text-anchor="middle">磁盘页</text><text x="845" y="163" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="middle">页标签 + 页内容</text><rect x="30" y="210" width="420" height="130" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1"/><text x="44" y="232" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="600" fill="#1F1E1A" text-anchor="start">低基数：字典下标 + 重复压缩</text><text x="44" y="252" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">["signup","login","logout","purchase"]</text><rect x="44" y="264" width="88" height="28" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="88" y="282" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#1F1E1A" text-anchor="middle">signup</text><rect x="142" y="264" width="88" height="28" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="186" y="282" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#1F1E1A" text-anchor="middle">login</text><rect x="240" y="264" width="88" height="28" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="284" y="282" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#1F1E1A" text-anchor="middle">logout</text><rect x="338" y="264" width="88" height="28" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="382" y="282" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#1F1E1A" text-anchor="middle">purchase</text><g class="chips"><text x="44" y="314" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="start">数据页：1,1,0,2,0,3 …（位宽=2）</text></g><rect x="470" y="210" width="420" height="130" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1"/><text x="484" y="232" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="600" fill="#1F1E1A" text-anchor="start">小数浮点：小数型浮点 → 整数 + 例外</text><g class="alp"><text x="484" y="252" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#C46A0A" text-anchor="start">编码：把小数放大成整数</text><text x="484" y="270" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#4C7A1A" text-anchor="start">解码：再按同样比例缩小</text><text x="484" y="288" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">1500.0, NaN, 2500.0, 333.5  (e=4, f=3)</text><text x="484" y="306" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">→ [15000,15000,25000,3335]，NaN 单独放</text></g><rect x="30" y="356" width="860" height="100" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1"/><text x="44" y="378" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="600" fill="#1F1E1A" text-anchor="start">重复压缩：8 个连续的 1 变成一段 重复段</text><g class="chips"><rect x="44" y="392" width="28" height="22" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="58" y="407" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="600" fill="#1F1E1A" text-anchor="middle">1</text><rect x="84" y="392" width="28" height="22" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="98" y="407" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="600" fill="#1F1E1A" text-anchor="middle">1</text><rect x="124" y="392" width="28" height="22" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="138" y="407" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="600" fill="#1F1E1A" text-anchor="middle">1</text><rect x="164" y="392" width="28" height="22" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="178" y="407" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="600" fill="#1F1E1A" text-anchor="middle">1</text><rect x="204" y="392" width="28" height="22" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="218" y="407" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="600" fill="#1F1E1A" text-anchor="middle">1</text><rect x="244" y="392" width="28" height="22" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="258" y="407" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="600" fill="#1F1E1A" text-anchor="middle">1</text><rect x="284" y="392" width="28" height="22" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="298" y="407" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="600" fill="#1F1E1A" text-anchor="middle">1</text><rect x="324" y="392" width="28" height="22" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="338" y="407" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="600" fill="#1F1E1A" text-anchor="middle">1</text></g><rect x="420" y="392" width="230" height="22" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="430" y="407" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="600" fill="#4C7A1A" text-anchor="start">重复段_len=8, value=1</text><rect class="重复段" x="420" y="392" width="230" height="22" rx="3" fill="#FFFFFF" opacity="0.6"/><text x="680" y="407" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">头：重复段_len &lt;&lt; 1；bit-packed 头最低位 1</text><g class="tok" style="transform:translate(170px,150px)"><circle cx="0" cy="0" r="7" fill="#EF9F27" stroke="#C46A0A" stroke-width="1.4"/></g><text x="30" y="506" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="start">动图自动循环；系统开启“减少动态效果”时定格在末帧。</text></svg>