<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="字典 + 值 + 热字段列"><title>字典 + 值 + 热字段列</title><desc>绿色点从 JSON 走到 字段字典/值，再进入 热字段列</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="0" y="0" width="920" height="520" fill="#FFFFFF"/><text x="30" y="34" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1F1E1A" text-anchor="start">字典 + 值 + 热字段列</text><text x="30" y="54" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#6B695F" text-anchor="start">绿色点从 JSON 走到 字段字典/值，再进入 热字段列</text><style>.prog{transform-box:fill-box;transform-origin:left center;animation:prog 6.8s linear infinite}@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tok{animation:tok 6.8s ease-in-out infinite}
@keyframes tok{
0%,8%{transform:translate(180px,250px)}
16%,24%{transform:translate(380px,250px)}
32%,40%{transform:translate(560px,250px)}
48%,56%{transform:translate(760px,250px)}
64%,72%{transform:translate(760px,330px)}
80%,100%{transform:translate(760px,420px)}}
.hot{animation:pulse 6.8s ease-in-out infinite}
@keyframes pulse{0%,40%{opacity:.35}52%,78%{opacity:1}88%,100%{opacity:.6}}
@media (prefers-reduced-motion: reduce){.tok,.hot{animation:none} .tok{transform:translate(760px,420px)} .hot{opacity:1}}
</style><line x1="30" y1="76" x2="890" y2="76" stroke="#D3D1C7" stroke-width="2"/><rect class="prog" x="30" y="74" width="860" height="4" rx="2" fill="#EF9F27"/><text x="30" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="start">0s</text><text x="890" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="end">6.8s</text><text x="460.0" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="middle">自动循环 · 减少动态效果时定格</text><rect x="30" y="110" width="250" height="210" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1"/><text x="44" y="132" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="600" fill="#1F1E1A" text-anchor="start">原始对象</text><text x="44" y="158" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">{ "b": 2, "a": 1,</text><text x="44" y="176" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">  "event_type": "signup",</text><text x="44" y="194" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">  "event_ts": 1729794114937 }</text><text x="44" y="224" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">字段名重复、值稀疏</text><text x="44" y="242" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">整段 JSON 每次都要解析</text><rect x="300" y="110" width="250" height="210" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="314" y="132" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="600" fill="#1F1E1A" text-anchor="start">字段名字典</text><text x="314" y="158" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">头 / 字典大小</text><text x="314" y="178" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">偏移表</text><text x="314" y="198" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">字段名字节：a、b</text><text x="314" y="218" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">编号：a=0，b=1</text><text x="314" y="246" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">字段名只存一次</text><rect x="570" y="110" width="320" height="210" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1"/><text x="584" y="132" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="600" fill="#1F1E1A" text-anchor="start">值：先报类型再给内容</text><text x="584" y="158" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">对象，2 个字段</text><text x="584" y="178" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">字段数 = 2</text><text x="584" y="198" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">字段编号：a、b</text><text x="584" y="218" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">值的位置：0、2、4</text><text x="584" y="238" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">a 的值：整数 1</text><text x="584" y="258" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">b 的值：整数 2</text><rect x="30" y="340" width="860" height="150" rx="8" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1"/><text x="44" y="362" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="600" fill="#1F1E1A" text-anchor="start">拆分：热字段拆成 热字段列</text><rect x="44" y="376" width="200" height="40" rx="5" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1"/><text x="56" y="396" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9" font-weight="400" fill="#1F1E1A" text-anchor="start">event_type 兜底</text><text x="56" y="410" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">兜底</text><rect x="258" y="376" width="200" height="40" rx="5" fill="#EAF3DE" stroke="#639922" stroke-width="1"/><text x="270" y="396" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9" font-weight="400" fill="#1F1E1A" text-anchor="start">event_type 热字段列</text><text x="270" y="410" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">字符串</text><rect x="472" y="376" width="200" height="40" rx="5" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1"/><text x="484" y="396" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9" font-weight="400" fill="#1F1E1A" text-anchor="start">event_ts 兜底</text><text x="484" y="410" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">兜底</text><rect x="686" y="376" width="200" height="40" rx="5" fill="#EAF3DE" stroke="#639922" stroke-width="1"/><text x="698" y="396" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9" font-weight="400" fill="#1F1E1A" text-anchor="start">event_ts 热字段列</text><text x="698" y="410" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">整数</text><g class="hot"><text x="44" y="446" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#4C7A1A" text-anchor="start">热字段：列裁剪 + 统计 + 页索引</text><text x="44" y="464" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#6B695F" text-anchor="start">冷字段留在兜底；缺失 = 两边空，null = 兜底放标记</text></g><g class="tok" style="transform:translate(180px,250px)"><circle cx="0" cy="0" r="7" fill="#639922" stroke="#4C7A1A" stroke-width="1.4"/></g><text x="30" y="506" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="start">动图自动循环；系统开启“减少动态效果”时定格在末帧。</text></svg>