<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-label="编码先改形状，压缩再收体积"><title>编码先改形状，压缩再收体积</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="0" y="0" width="920" height="620" fill="#FFFFFF"/><text x="30" y="34" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1F1E1A" text-anchor="start">编码先改形状，压缩再收体积</text><text x="30" y="54" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#6B695F" text-anchor="start">同一列：字典消重复，重复压缩 消连续，差值 消相邻，小数浮点 消小数尾巴</text><rect x="30" y="88" width="158" height="56" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.1"/><text x="109" y="111" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#1F1E1A" text-anchor="middle">原始值</text><text x="109" y="129" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="middle">strings / ints / floats</text><line x1="190" y1="116" x2="206" y2="116" stroke="#C46A0A" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="208" y="88" width="158" height="56" rx="8" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/><text x="287" y="111" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#1F1E1A" text-anchor="middle">encoding</text><text x="287" y="129" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="middle">字典 / 重复压缩 / 差值 / 小数浮点</text><line x1="368" y1="116" x2="384" y2="116" stroke="#C46A0A" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="386" y="88" width="158" height="56" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="465" y="111" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#1F1E1A" text-anchor="middle">页体字节</text><text x="465" y="129" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="middle">层数 + 值</text><line x1="546" y1="116" x2="562" y2="116" stroke="#C46A0A" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="564" y="88" width="158" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/><text x="643" y="111" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#1F1E1A" text-anchor="middle">压缩</text><text x="643" y="129" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="middle">Snappy / ZSTD / GZIP</text><line x1="724" y1="116" x2="740" y2="116" stroke="#C46A0A" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="742" y="88" width="158" height="56" rx="8" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.1"/><text x="821" y="111" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#1F1E1A" text-anchor="middle">磁盘页</text><text x="821" y="129" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="middle">页标签 + 页内容</text><rect x="30" y="176" width="420" height="150" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.1"/><text x="44" y="198" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="600" fill="#1F1E1A" text-anchor="start">字典：重复值 → 小整数</text><text x="44" y="218" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">字典页：["signup","login","logout","purchase"]</text><text x="44" y="236" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">数据页：1,1,0,2,0,3 ...（bit width = 2）</text><rect x="44" y="252" width="88" height="26" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="88" y="269" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#1F1E1A" text-anchor="middle">signup</text><rect x="142" y="252" width="88" height="26" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="186" y="269" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#1F1E1A" text-anchor="middle">login</text><rect x="240" y="252" width="88" height="26" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="284" y="269" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#1F1E1A" text-anchor="middle">logout</text><rect x="338" y="252" width="88" height="26" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="382" y="269" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#1F1E1A" text-anchor="middle">purchase</text><text x="44" y="300" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">低基数很赚；字典太大回退 PLAIN；下标用 重复压缩 再压</text><rect x="470" y="176" width="420" height="150" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.1"/><text x="484" y="198" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="600" fill="#1F1E1A" text-anchor="start">重复压缩 / bit-packing：重复和变化都能压</text><text x="484" y="218" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">header 最低位 1 = bit-packed，0 = 重复压缩</text><rect x="484" y="230" width="190" height="24" rx="4" fill="#FFF6E8" stroke="#EF9F27" stroke-width="0.8"/><text x="494" y="246" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#C46A0A" text-anchor="start">bit-packed: (len/8)&lt;&lt;1 | 1</text><rect x="484" y="260" width="190" height="24" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/><text x="494" y="276" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#4C7A1A" text-anchor="start">重复压缩: run_len &lt;&lt; 1</text><text x="484" y="302" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">levels、字典下标、BOOLEAN 都用它；v1/v2 的长度前缀不同</text><rect x="30" y="342" width="420" height="150" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.1"/><text x="44" y="364" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="600" fill="#1F1E1A" text-anchor="start">差值：相邻值做差，再按块位打包</text><text x="44" y="384" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">1,2,3,4,5 → delta 1,1,1,1 → 相对 0,0,0,0</text><text x="44" y="402" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">7,5,3,1… 减去最小差值 -2 → 0,0,0,3,3,3,3</text><text x="44" y="420" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">大块至少 128 个值，小块至少 32 个值；每小段自己选位宽</text><text x="44" y="438" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">BYTE_STREAM_SPLIT：按字节拆流，不减小，但更好压</text><text x="44" y="456" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="400" fill="#6B695F" text-anchor="start">浮点高位字节相似 → Snappy/ZSTD 更容易找到模式</text><rect x="470" y="342" width="420" height="150" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.1"/><text x="484" y="364" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="600" fill="#1F1E1A" text-anchor="start">小数浮点：小数型浮点 → 整数 + 例外</text><text x="484" y="384" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="400" fill="#C46A0A" text-anchor="start">编码：把小数放大成整数</text><text x="484" y="402" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="400" fill="#4C7A1A" text-anchor="start">解码：再按同样比例缩小</text><text x="484" y="420" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">1500.0, NaN, 2500.0, 333.5  (e=4, f=3)</text><text x="484" y="438" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">→ [15000, 15000, 25000, 3335] + exception[NaN]</text><text x="484" y="456" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#8A2A2A" text-anchor="start">Preview：reader 不一定支持；高熵浮点不如 BYTE_STREAM_SPLIT</text><rect x="30" y="515" width="12" height="12" rx="3" fill="#EF9F27" stroke="#EF9F27" stroke-width="0"/><text x="47" y="525" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#6B695F" text-anchor="start">编码</text><rect x="73.0" y="515" width="12" height="12" rx="3" fill="#2563EB" stroke="#2563EB" stroke-width="0"/><text x="90.0" y="525" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#6B695F" text-anchor="start">压缩</text><rect x="116.0" y="515" width="12" height="12" rx="3" fill="#E24B4A" stroke="#E24B4A" stroke-width="0"/><text x="133.0" y="525" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#6B695F" text-anchor="start">例外</text><rect x="159.0" y="515" width="12" height="12" rx="3" fill="#D3D1C7" stroke="#D3D1C7" stroke-width="0"/><text x="176.0" y="525" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#6B695F" text-anchor="start">结构</text><rect x="30" y="568" width="860" height="34" rx="8" fill="#FFF6E8" stroke="#F2D9A7" stroke-width="1"/><text x="44" y="590" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#854F0B" text-anchor="start">口径：Encodings.md、AlpEncoding.md、Compression.md；小数浮点 自 2026-08-01 起为 Preview，示例取规范 worked example。</text></svg>