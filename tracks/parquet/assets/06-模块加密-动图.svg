<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="给每个抽屉单独上锁"><title>给每个抽屉单独上锁</title><desc>蓝色点沿模块下行封包；reader 只解被投影列的密文</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="0" y="0" width="920" height="520" fill="#FFFFFF"/><text x="30" y="34" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1F1E1A" text-anchor="start">给每个抽屉单独上锁</text><text x="30" y="54" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#6B695F" text-anchor="start">蓝色点沿模块下行封包；reader 只解被投影列的密文</text><style>.prog{transform-box:fill-box;transform-origin:left center;animation:prog 6.8s linear infinite}@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tok{animation:tok 6.8s ease-in-out infinite}
@keyframes tok{
0%,8%{transform:translate(330px,158px)}
16%,24%{transform:translate(330px,210px)}
32%,40%{transform:translate(330px,262px)}
48%,56%{transform:translate(330px,314px)}
64%,72%{transform:translate(330px,366px)}
82%,100%{transform:translate(650px,220px)}}
.lock{animation:lock 6.8s ease-in-out infinite}
@keyframes lock{0%,15%{opacity:.2}25%,55%{opacity:1}65%,100%{opacity:.7}}
.aad{animation:pulse 6.8s ease-in-out infinite}
@keyframes pulse{0%,45%{opacity:.35}55%,80%{opacity:1}90%,100%{opacity:.6}}
@media (prefers-reduced-motion: reduce){.tok,.lock,.aad{animation:none} .tok{transform:translate(650px,220px)} .lock,.aad{opacity:1}}
</style><line x1="30" y1="76" x2="890" y2="76" stroke="#D3D1C7" stroke-width="2"/><rect class="prog" x="30" y="74" width="860" height="4" rx="2" fill="#EF9F27"/><text x="30" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="start">0s</text><text x="890" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="end">6.8s</text><text x="460.0" y="94" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="middle">自动循环 · 减少动态效果时定格</text><rect x="30" y="110" width="300" height="380" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.1"/><text x="44" y="132" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.6" font-weight="600" fill="#1F1E1A" text-anchor="start">文件被拆成可独立加解密的模块</text><rect x="44" y="146" width="270" height="40" rx="5" fill="#FBFAF6" stroke="#1F1E1A" stroke-width="1"/><text x="56" y="163" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="600" fill="#1F1E1A" text-anchor="start">加密标记</text><text x="56" y="178" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">文件魔数</text><g class="lock"><circle cx="294" cy="166" r="7" fill="#EF9F27" stroke="#C46A0A" stroke-width="1"/></g><rect x="44" y="198" width="270" height="40" rx="5" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1"/><text x="56" y="215" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="600" fill="#1F1E1A" text-anchor="start">页 / 页标签</text><text x="56" y="230" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">列钥匙</text><g class="lock"><circle cx="294" cy="218" r="7" fill="#EF9F27" stroke="#C46A0A" stroke-width="1"/></g><rect x="44" y="250" width="270" height="40" rx="5" fill="#EAF3DE" stroke="#639922" stroke-width="1"/><text x="56" y="267" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="600" fill="#1F1E1A" text-anchor="start">索引 / 排除卡</text><text x="56" y="282" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">列钥匙</text><g class="lock"><circle cx="294" cy="270" r="7" fill="#EF9F27" stroke="#C46A0A" stroke-width="1"/></g><rect x="44" y="302" width="270" height="40" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="56" y="319" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="600" fill="#1F1E1A" text-anchor="start">加密说明</text><text x="56" y="334" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">算法 + 总目录钥匙</text><g class="lock"><circle cx="294" cy="322" r="7" fill="#EF9F27" stroke="#C46A0A" stroke-width="1"/></g><rect x="44" y="354" width="270" height="40" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="56" y="371" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="600" fill="#1F1E1A" text-anchor="start">加密后的总目录</text><text x="56" y="386" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">表结构 / 行组</text><g class="lock"><circle cx="294" cy="374" r="7" fill="#EF9F27" stroke="#C46A0A" stroke-width="1"/></g><rect x="370" y="110" width="520" height="180" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.1"/><text x="384" y="132" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="600" fill="#1F1E1A" text-anchor="start">两种密钥 + 封条</text><rect x="384" y="146" width="210" height="46" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="396" y="166" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="600" fill="#1F1E1A" text-anchor="start">总目录钥匙</text><text x="396" y="182" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">总目录 / 同钥列</text><rect x="610" y="146" width="250" height="46" rx="5" fill="#EAF3DE" stroke="#639922" stroke-width="1"/><text x="622" y="166" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="600" fill="#1F1E1A" text-anchor="start">列钥匙</text><text x="622" y="182" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">只解这一列</text><rect x="384" y="208" width="476" height="66" rx="6" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1"/><text x="396" y="228" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.6" font-weight="600" fill="#1F1E1A" text-anchor="start">封条 = 文件身份 + 模块身份</text><text x="396" y="246" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#6B695F" text-anchor="start">文件 ID + 模块类型 + 行组/列/页序号</text><text x="396" y="262" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.4" font-weight="400" fill="#8A2A2A" text-anchor="start">掉包任一模块 → 认证校验失败</text><g class="aad"><rect x="384" y="288" width="220" height="28" rx="4" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1"/><text x="396" y="306" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#C46A0A" text-anchor="start">封条 不加密，但参与认证</text></g><rect x="370" y="310" width="520" height="180" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1"/><text x="384" y="332" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="600" fill="#1F1E1A" text-anchor="start">读一列的路径</text><text x="396" y="356" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9" font-weight="400" fill="#6B695F" text-anchor="start">1. 读 加密标记 / 加密说明</text><text x="396" y="384" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9" font-weight="400" fill="#6B695F" text-anchor="start">2. 用 总目录钥匙 解 总目录</text><text x="396" y="412" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9" font-weight="400" fill="#6B695F" text-anchor="start">3. 按 列钥匙 解页/索引</text><text x="396" y="440" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9" font-weight="400" fill="#6B695F" text-anchor="start">4. 封条 对不上 → 拒绝</text><text x="396" y="480" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.6" font-weight="400" fill="#8A2A2A" text-anchor="start">只加密模式：页体只加密、不认证；全认证模式：所有模块都认证。</text><g class="tok" style="transform:translate(330px,158px)"><circle cx="0" cy="0" r="7" fill="#2563EB" stroke="#1E3A8A" stroke-width="1.4"/></g><text x="30" y="506" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.5" font-weight="400" fill="#6B695F" text-anchor="start">动图自动循环；系统开启“减少动态效果”时定格在末帧。</text></svg>