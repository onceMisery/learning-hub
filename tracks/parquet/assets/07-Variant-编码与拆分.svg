<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-label="字典 + 值 + 热字段列"><title>字典 + 值 + 热字段列</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="0" y="0" width="920" height="640" fill="#FFFFFF"/><text x="30" y="34" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1F1E1A" text-anchor="start">字典 + 值 + 热字段列</text><text x="30" y="54" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#6B695F" text-anchor="start">字段字典共享字段名，值自包含；热字段再拆成热字段列</text><rect x="30" y="82" width="260" height="200" rx="10" fill="#FBFAF6" stroke="#D3D1C7" stroke-width="1.1"/><text x="44" y="104" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="600" fill="#1F1E1A" text-anchor="start">原始对象</text><text x="44" y="126" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.2" font-weight="400" fill="#6B695F" text-anchor="start">{</text><text x="44" y="148" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.2" font-weight="400" fill="#6B695F" text-anchor="start">  "b": 2,</text><text x="44" y="170" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.2" font-weight="400" fill="#6B695F" text-anchor="start">  "a": 1</text><text x="44" y="192" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.2" font-weight="400" fill="#6B695F" text-anchor="start">}</text><text x="44" y="236" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">字段名重复、值稀疏；</text><text x="44" y="254" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">直接存 JSON 每次都要整段解析。</text><rect x="310" y="82" width="270" height="200" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/><text x="324" y="104" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="600" fill="#1E3A8A" text-anchor="start">字段名字典</text><text x="324" y="126" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">头：版本 1</text><text x="324" y="144" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">字典大小：2</text><text x="324" y="162" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">偏移表：0、1、2</text><text x="324" y="180" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">字段名字节：a、b</text><text x="324" y="202" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#1E3A8A" text-anchor="start">编号：a=0，b=1</text><text x="324" y="226" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">字段名只存一次；对象越宽越省</text><rect x="600" y="82" width="290" height="200" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="614" y="104" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="600" fill="#4C7A1A" text-anchor="start">值：自描述二进制</text><text x="614" y="126" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">对象，2 个字段</text><text x="614" y="144" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">字段数 = 2</text><text x="614" y="162" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">字段编号：a、b</text><text x="614" y="180" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">值的位置：0、2、4</text><text x="614" y="198" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">a 的值：整数 1</text><text x="614" y="216" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">b 的值：整数 2</text><text x="614" y="240" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">字段编号按字段名排序；值可乱序</text><line x1="290" y1="182" x2="306" y2="182" stroke="#C46A0A" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="580" y1="182" x2="596" y2="182" stroke="#C46A0A" stroke-width="1.4" marker-end="url(#arrow)"/><text x="30" y="316" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1F1E1A" text-anchor="start">拆分：把热字段拆成普通 Parquet 列</text><rect x="30" y="332" width="270" height="210" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.1"/><text x="44" y="354" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.6" font-weight="600" fill="#1F1E1A" text-anchor="start">拆之前：一个 Variant 小组</text><rect x="44" y="368" width="242" height="30" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.9"/><text x="54" y="388" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#1E3A8A" text-anchor="start">字段名字典</text><rect x="44" y="404" width="242" height="30" rx="4" fill="#FFF6E8" stroke="#EF9F27" stroke-width="0.9"/><text x="54" y="424" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#C46A0A" text-anchor="start">值（二进制）</text><text x="44" y="456" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#6B695F" text-anchor="start">查询某条路径要解整段值</text><rect x="320" y="332" width="570" height="210" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.1"/><text x="334" y="354" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.6" font-weight="600" fill="#1F1E1A" text-anchor="start">拆之后：兜底值 + 热字段列</text><rect x="334" y="368" width="260" height="28" rx="4" fill="#FFF6E8" stroke="#EF9F27" stroke-width="0.9"/><text x="344" y="386" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#1F1E1A" text-anchor="start">event_type 兜底</text><text x="530" y="386" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="start">兜底</text><rect x="334" y="404" width="260" height="28" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="0.9"/><text x="344" y="422" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#1F1E1A" text-anchor="start">event_type.热字段列</text><text x="530" y="422" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="start">字符串</text><rect x="334" y="440" width="260" height="28" rx="4" fill="#FFF6E8" stroke="#EF9F27" stroke-width="0.9"/><text x="344" y="458" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#1F1E1A" text-anchor="start">event_ts 兜底</text><text x="530" y="458" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="start">兜底</text><rect x="334" y="476" width="260" height="28" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="0.9"/><text x="344" y="494" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.2" font-weight="400" fill="#1F1E1A" text-anchor="start">event_ts.热字段列</text><text x="530" y="494" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="8.8" font-weight="400" fill="#6B695F" text-anchor="start">整数</text><text x="620" y="386" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">热字段走普通列：</text><text x="620" y="404" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#4C7A1A" text-anchor="start">列裁剪 + 统计 + 页索引</text><text x="620" y="430" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">冷字段留在兜底：</text><text x="620" y="448" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#C46A0A" text-anchor="start">保留半结构化灵活性</text><text x="620" y="474" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">缺失 = 两者都 null；</text><text x="620" y="492" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="9.4" font-weight="400" fill="#6B695F" text-anchor="start">null = 兜底里放标记</text><rect x="30" y="566" width="860" height="48" rx="8" fill="#FFF6E8" stroke="#F2D9A7" stroke-width="1"/><text x="44" y="586" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.2" font-weight="400" fill="#854F0B" text-anchor="start">重建规则：热字段列非空 → 按对象/数组/原始类型重建；兜底非空 → 直接解 Variant；两者都空 → 字段缺失。</text><text x="44" y="604" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.2" font-weight="400" fill="#854F0B" text-anchor="start">部分拆分的对象：热字段列装已拆字段，兜底装未拆字段，两边字段不能重名。</text></svg>