</style>
<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="500" y="28" font-size="18" fill="#1F1E1A" text-anchor="middle" font-weight="600">QueryPlan → Processor 图 → Chunk 流</text><text x="500" y="48" font-size="11.5" fill="#6B695F" text-anchor="middle">步骤树翻译成流水线；多线程不是「一个线程一个算子」，而是任务驱动</text><text x="976" y="24" font-size="10.5" fill="#C46A0A" text-anchor="end">橙色：计划/调度</text><text x="976" y="39" font-size="10.5" fill="#2F6FA8" text-anchor="end">蓝色：算子</text><text x="976" y="54" font-size="10.5" fill="#639922" text-anchor="end">绿色：输出</text><g class="stage" id="s1"><rect x="20.0" y="76" width="111.25" height="142" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.2"/><text x="28.0" y="98" class="tn" text-anchor="start" font-size="12">QueryPlan</text><text x="28.0" y="118" class="tb" text-anchor="start" font-size="10.2">LimitStep</text><text x="28.0" y="132" class="tb" text-anchor="start" font-size="10.2">SortingStep</text><text x="28.0" y="146" class="tb" text-anchor="start" font-size="10.2">AggregatingStep</text><text x="28.0" y="160" class="tb" text-anchor="start" font-size="10.2">ReadFromMergeTree</text><text x="28.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">步骤树</text></g><path d="M131.25 147.0 L139.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s2"><rect x="141.25" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="149.25" y="98" class="tn" text-anchor="start" font-size="12">buildPipeline</text><text x="149.25" y="118" class="tb" text-anchor="start" font-size="10.2">每个 step</text><text x="149.25" y="132" class="tb" text-anchor="start" font-size="10.2">updatePipeline</text><text x="149.25" y="146" class="tb" text-anchor="start" font-size="10.2">生成 Processor</text><text x="149.25" y="160" class="tb" text-anchor="start" font-size="10.2">接 Port</text><text x="149.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">建图</text></g><path d="M252.5 147.0 L260.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s3"><rect x="262.5" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="270.5" y="98" class="tn" text-anchor="start" font-size="12">Source</text><text x="270.5" y="118" class="tb" text-anchor="start" font-size="10.2">ReadFromMergeTree</text><text x="270.5" y="132" class="tb" text-anchor="start" font-size="10.2">多个读取流</text><text x="270.5" y="146" class="tb" text-anchor="start" font-size="10.2">按 mark 读</text><text x="270.5" y="160" class="tb" text-anchor="start" font-size="10.2">产出 Chunk</text><text x="270.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">数据源</text></g><path d="M373.75 147.0 L381.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s4"><rect x="383.75" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="391.75" y="98" class="tn" text-anchor="start" font-size="12">Transform</text><text x="391.75" y="118" class="tb" text-anchor="start" font-size="10.2">ExprTransform</text><text x="391.75" y="132" class="tb" text-anchor="start" font-size="10.2">Filter</text><text x="391.75" y="146" class="tb" text-anchor="start" font-size="10.2">计算 gmv</text><text x="391.75" y="160" class="tb" text-anchor="start" font-size="10.2">列向量</text><text x="391.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">逐块处理</text></g><path d="M495.0 147.0 L503.0 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s5"><rect x="505.0" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="513.0" y="98" class="tn" text-anchor="start" font-size="12">Aggregate</text><text x="513.0" y="118" class="tb" text-anchor="start" font-size="10.2">AggTransform</text><text x="513.0" y="132" class="tb" text-anchor="start" font-size="10.2">本地哈希表</text><text x="513.0" y="146" class="tb" text-anchor="start" font-size="10.2">部分聚合</text><text x="513.0" y="160" class="tb" text-anchor="start" font-size="10.2">输出状态</text><text x="513.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">两阶段</text></g><path d="M616.25 147.0 L624.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s6"><rect x="626.25" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="634.25" y="98" class="tn" text-anchor="start" font-size="12">Resize/Merge</text><text x="634.25" y="118" class="tb" text-anchor="start" font-size="10.2">ResizeProcessor</text><text x="634.25" y="132" class="tb" text-anchor="start" font-size="10.2">MergingAggregated</text><text x="634.25" y="146" class="tb" text-anchor="start" font-size="10.2">合并流</text><text x="634.25" y="160" class="tb" text-anchor="start" font-size="10.2">合并状态</text><text x="634.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">收束</text></g><path d="M737.5 147.0 L745.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s7"><rect x="747.5" y="76" width="111.25" height="142" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.2"/><text x="755.5" y="98" class="tn" text-anchor="start" font-size="12">Executor</text><text x="755.5" y="118" class="tb" text-anchor="start" font-size="10.2">任务驱动</text><text x="755.5" y="132" class="tb" text-anchor="start" font-size="10.2">多线程</text><text x="755.5" y="146" class="tb" text-anchor="start" font-size="10.2">prepare/work</text><text x="755.5" y="160" class="tb" text-anchor="start" font-size="10.2">背压</text><text x="755.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">调度</text></g><path d="M858.75 147.0 L866.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s8"><rect x="868.75" y="76" width="111.25" height="142" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/><text x="876.75" y="98" class="tn" text-anchor="start" font-size="12">Output</text><text x="876.75" y="118" class="tb" text-anchor="start" font-size="10.2">Sort/Limit</text><text x="876.75" y="132" class="tb" text-anchor="start" font-size="10.2">序列化</text><text x="876.75" y="146" class="tb" text-anchor="start" font-size="10.2">结果 Chunk</text><text x="876.75" y="160" class="tb" text-anchor="start" font-size="10.2">客户端</text><text x="876.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">终点</text></g><text x="20" y="244" font-size="12" fill="#C46A0A" font-weight="600">Processor 的状态机：prepare 看端口，work 算数据</text>
<rect x="20" y="256" width="220" height="58" rx="8" fill="#fff" stroke="#D3D1C7" stroke-width="1.1"/>
<text x="130" y="278" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">NeedData</text>
<text x="130" y="296" font-size="10" fill="#6B695F" text-anchor="middle">输入没数据</text>
<rect x="260" y="256" width="220" height="58" rx="8" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/>
<text x="370" y="278" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">Ready</text>
<text x="370" y="296" font-size="10" fill="#6B695F" text-anchor="middle">可以 work()</text>
<rect x="500" y="256" width="220" height="58" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.1"/>
<text x="610" y="278" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">PortFull</text>
<text x="610" y="296" font-size="10" fill="#6B695F" text-anchor="middle">下游没消费，背压</text>
<rect x="740" y="256" width="240" height="58" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/>
<text x="860" y="278" font-size="11.5" fill="#1F1E1A" text-anchor="middle" font-weight="600">Finished</text>
<text x="860" y="296" font-size="10" fill="#6B695F" text-anchor="middle">端口关闭，算子结束</text>
<rect x="20" y="326" width="960" height="64" rx="8" fill="#fff" stroke="#ECEAE2" stroke-width="1"/>
<text x="34" y="348" font-size="11" fill="#3B3A34">读法：8 个框是数据流的 8 个位置；橙色令牌每走一格，就有一个 Processor 被调度。下方状态机会在 NeedData / Ready / PortFull 之间切换。</text>
<text x="34" y="368" font-size="10.5" fill="#6B695F">口径：PipelineExecutor.cpp:231、:395；IProcessor.h:131、:150；Chunk.h:61；max_block_size=65409（Defines.h:33）。</text>
<line x1="20" y1="452" x2="980" y2="452" stroke="#ECEAE2" stroke-width="1.2" stroke-dasharray="5 4"/>
<g transform="translate(0,460)"><rect x="18" y="14" width="964" height="182" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.2"/><text x="34" y="38" font-size="13" fill="#1F1E1A" font-weight="600">同一相位下的流水线：8 个读取流汇入聚合，再收束到输出</text><rect x="34" y="54" width="150" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="109.0" y="76" class="tn" text-anchor="middle" font-size="11.5">Read 1-8</text><text x="109.0" y="94" class="tag" text-anchor="middle">8 个流</text><rect x="204" y="54" width="130" height="78" rx="6" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/><text x="269.0" y="76" class="tn" text-anchor="middle" font-size="11.5">Resize</text><text x="269.0" y="94" class="tag" text-anchor="middle">合并/拆分</text><rect x="354" y="54" width="160" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="434.0" y="76" class="tn" text-anchor="middle" font-size="11.5">Aggregating</text><text x="434.0" y="94" class="tag" text-anchor="middle">每流本地聚合</text><rect x="534" y="54" width="160" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="614.0" y="76" class="tn" text-anchor="middle" font-size="11.5">Merging</text><text x="614.0" y="94" class="tag" text-anchor="middle">合并状态</text><rect x="714" y="54" width="120" height="78" rx="6" fill="#fff" stroke="#D3D1C7" stroke-width="1.1"/><text x="774.0" y="76" class="tn" text-anchor="middle" font-size="11.5">Sort/Limit</text><text x="774.0" y="94" class="tag" text-anchor="middle">收束</text><rect x="854" y="54" width="114" height="78" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="911.0" y="76" class="tn" text-anchor="middle" font-size="11.5">Output</text><text x="911.0" y="94" class="tag" text-anchor="middle">序列化</text><path d="M184 86 L202 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M334 86 L352 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M514 86 L532 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M694 86 L712 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M834 86 L852 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><text x="34" y="154" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">读法：Source 多、中间 Resize、最后收束；Chunk 在每个 Port 里最多一块，输出口满就背压。</text><text x="34" y="172" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">线程不绑定算子：同一个 AggregatingTransform 可以被不同线程执行，任务队列决定调度。</text></g>
<text x="20" y="688" font-size="10" fill="#6B695F">口径：ClickHouse 26.11.1.1-testing 源码快照（2026-10-25）；图中行数、线程数、part 数为演示值。</text>
</svg>