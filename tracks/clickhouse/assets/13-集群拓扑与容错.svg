<text x="500" y="28" font-size="18" fill="#1F1E1A" text-anchor="middle" font-weight="600">三片两副本 + Keeper：四种故障与恢复</text><text x="500" y="48" font-size="11.5" fill="#6B695F" text-anchor="middle">副本挂切副本；分片挂默认失败；Keeper 少数派停写；网络分区不脑裂</text><text x="976" y="24" font-size="10.5" fill="#C46A0A" text-anchor="end">橙色：运维/验证</text><text x="976" y="39" font-size="10.5" fill="#2F6FA8" text-anchor="end">蓝色：一致性</text><text x="976" y="54" font-size="10.5" fill="#E24B4A" text-anchor="end">红色：故障</text><g class="stage" id="s1"><rect x="20.0" y="76" width="111.25" height="142" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/><text x="28.0" y="98" class="tn" text-anchor="start" font-size="12">拓扑</text><text x="28.0" y="118" class="tb" text-anchor="start" font-size="10.2">3 分片</text><text x="28.0" y="132" class="tb" text-anchor="start" font-size="10.2">每片 2 副本</text><text x="28.0" y="146" class="tb" text-anchor="start" font-size="10.2">Keeper×3</text><text x="28.0" y="160" class="tb" text-anchor="start" font-size="10.2">宏/路径</text><text x="28.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">起点</text></g><path d="M131.25 147.0 L139.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s2"><rect x="141.25" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="149.25" y="98" class="tn" text-anchor="start" font-size="12">副本挂</text><text x="149.25" y="118" class="tb" text-anchor="start" font-size="10.2">查询切副本</text><text x="149.25" y="132" class="tb" text-anchor="start" font-size="10.2">写入切副本</text><text x="149.25" y="146" class="tb" text-anchor="start" font-size="10.2">副本追日志</text><text x="149.25" y="160" class="tb" text-anchor="start" font-size="10.2">quorum 可能不足</text><text x="149.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">故障 1</text></g><path d="M252.5 147.0 L260.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="