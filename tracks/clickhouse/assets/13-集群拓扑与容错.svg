e="10.2">关副本</text><text x="876.75" y="132" class="tb" text-anchor="start" font-size="10.2">关分片</text><text x="876.75" y="146" class="tb" text-anchor="start" font-size="10.2">关 Keeper</text><text x="876.75" y="160" class="tb" text-anchor="start" font-size="10.2">看监控/恢复</text><text x="876.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">验证</text></g><text x="20" y="244" font-size="12" fill="#C46A0A" font-weight="600">故障矩阵：四种故障，四种结果</text>
