<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="ReplicatedMergeTree 与共识机制：副本之间怎么对齐">
<defs>
<marker id="aW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B695F" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<style>
text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
.th{font-size:15px;fill:#1F1E1A;font-weight:500}
.ts{font-size:12px;fill:#6B695F}
.tb{font-size:11.5px;fill:#3B3A34}
.tn{font-size:12.5px;fill:#1F1E1A;font-weight:500}
.tag{font-size:10px;fill:#6B695F}
</style>
<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="500" y="28" font-size="18" fill="#1F1E1A" text-anchor="middle" font-weight="600">写入 A → Keeper 日志 → B/C 拉取 → 最终一致</text><text x="500" y="48" font-size="11.5" fill="#6B695F" text-anchor="middle">多主复制：任一副本可写；Keeper 记日志，副本各自执行</text><text x="976" y="24" font-size="10.5" fill="#C46A0A" text-anchor="end">橙色：写入/quorum</text><text x="976" y="39" font-size="10.5" fill="#2F6FA8" text-anchor="end">蓝色：日志/追赶</text><text x="976" y="54" font-size="10.5" fill="#639922" text-anchor="end">绿色：副本</text><g class="stage" id="s1"><rect x="20.0" y="76" width="111.25" height="142" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.2"/><text x="28.0" y="98" class="tn" text-anchor="start" font-size="12">INSERT A</text><text x="28.0" y="118" class="tb" text-anchor="start" font-size="10.2">客户端连 A</text><text x="28.0" y="132" class="tb" text-anchor="start" font-size="10.2">写本地 part</text><text x="28.0" y="146" class="tb" text-anchor="start" font-size="10.2">生成块 ID</text><text x="28.0" y="160" class="tb" text-anchor="start" font-size="10.2">准备提交</text><text x="28.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">写入</text></g><path d="M131.25 147.0 L139.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s2"><rect x="141.25" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="149.25" y="98" class="tn" text-anchor="start" font-size="12">本地 part</text><text x="149.25" y="118" class="tb" text-anchor="start" font-size="10.2">排序/写列</text><text x="149.25" y="132" class="tb" text-anchor="start" font-size="10.2">临时目录</text><text x="149.25" y="146" class="tb" text-anchor="start" font-size="10.2">校验</text><text x="149.25" y="160" class="tb" text-anchor="start" font-size="10.2">原子改名</text><text x="149.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">A 磁盘</text></g><path d="M252.5 147.0 L260.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s3"><rect x="262.5" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="270.5" y="98" class="tn" text-anchor="start" font-size="12">Keeper /log</text><text x="270.5" y="118" class="tb" text-anchor="start" font-size="10.2">追加日志</text><text x="270.5" y="132" class="tb" text-anchor="start" font-size="10.2">GET_PART</text><text x="270.5" y="146" class="tb" text-anchor="start" font-size="10.2">块 ID</text><text x="270.5" y="160" class="tb" text-anchor="start" font-size="10.2">多数派 commit</text><text x="270.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">复制日志</text></g><path d="M373.75 147.0 L381.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s4"><rect x="383.75" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="391.75" y="98" class="tn" text-anchor="start" font-size="12">quorum</text><text x="391.75" y="118" class="tb" text-anchor="start" font-size="10.2">insert_quorum</text><text x="391.75" y="132" class="tb" text-anchor="start" font-size="10.2">默认 0</text><text x="391.75" y="146" class="tb" text-anchor="start" font-size="10.2">=2 等两个副本</text><text x="391.75" y="160" class="tb" text-anchor="start" font-size="10.2">超时清理</text><text x="391.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">可选</text></g><path d="M495.0 147.0 L503.0 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s5"><rect x="505.0" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="513.0" y="98" class="tn" text-anchor="start" font-size="12">B 拉日志</text><text x="513.0" y="118" class="tb" text-anchor="start" font-size="10.2">watch 通知</text><text x="513.0" y="132" class="tb" text-anchor="start" font-size="10.2">GET_PART</text><text x="513.0" y="146" class="tb" text-anchor="start" font-size="10.2">从 A 拉 part</text><text x="513.0" y="160" class="tb" text-anchor="start" font-size="10.2">校验 checksums</text><text x="513.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">追赶</text></g><path d="M616.25 147.0 L624.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s6"><rect x="626.25" y="76" width="111.25" height="142" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/><text x="634.25" y="98" class="tn" text-anchor="start" font-size="12">B active</text><text x="634.25" y="118" class="tb" text-anchor="start" font-size="10.2">挂载 part</text><text x="634.25" y="132" class="tb" text-anchor="start" font-size="10.2">更新 log_pointer</text><text x="634.25" y="146" class="tb" text-anchor="start" font-size="10.2">查询可见</text><text x="634.25" y="160" class="tb" text-anchor="start" font-size="10.2">继续追</text><text x="634.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">副本</text></g><path d="M737.5 147.0 L745.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s7"><rect x="747.5" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="755.5" y="98" class="tn" text-anchor="start" font-size="12">C 追赶</text><text x="755.5" y="118" class="tb" text-anchor="start" font-size="10.2">同样拉日志</text><text x="755.5" y="132" class="tb" text-anchor="start" font-size="10.2">同样拉 part</text><text x="755.5" y="146" class="tb" text-anchor="start" font-size="10.2">最终一致</text><text x="755.5" y="160" class="tb" text-anchor="start" font-size="10.2">不共享磁盘</text><text x="755.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">多主</text></g><path d="M858.75 147.0 L866.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s8"><rect x="868.75" y="76" width="111.25" height="142" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/><text x="876.75" y="98" class="tn" text-anchor="start" font-size="12">收敛</text><text x="876.75" y="118" class="tb" text-anchor="start" font-size="10.2">三副本同 part</text><text x="876.75" y="132" class="tb" text-anchor="start" font-size="10.2">合并各自执行</text><text x="876.75" y="146" class="tb" text-anchor="start" font-size="10.2">校验和发现差异</text><text x="876.75" y="160" class="tb" text-anchor="start" font-size="10.2">重拉修复</text><text x="876.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">最终</text></g><text x="20" y="244" font-size="12" fill="#C46A0A" font-weight="600">分支：副本 B 下线、quorum 不足、Keeper 会话过期</text>
<rect x="20" y="256" width="310" height="64" rx="8" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/>
<text x="34" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">B 下线</text>
<text x="34" y="296" font-size="10.5" fill="#6B695F">A/C 继续写；B 恢复后从 log_pointer 追</text>
<text x="34" y="312" font-size="10.5" fill="#C46A0A">状态看 absolute_delay / queue_size</text>
<rect x="345" y="256" width="310" height="64" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.1"/>
<text x="359" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">quorum 不足</text>
<text x="359" y="296" font-size="10.5" fill="#6B695F">insert_quorum=2 但只剩 1 个副本</text>
<text x="359" y="312" font-size="10.5" fill="#E24B4A">写入失败；已写块会被清理</text>
<rect x="670" y="256" width="310" height="64" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="684" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">Keeper 会话过期</text>
<text x="684" y="296" font-size="10.5" fill="#6B695F">is_active 消失，副本非活跃</text>
<text x="684" y="312" font-size="10.5" fill="#2F6FA8">副本只读；重连后继续追</text>
<rect x="20" y="332" width="960" height="58" rx="8" fill="#fff" stroke="#ECEAE2" stroke-width="1"/>
<text x="34" y="354" font-size="11" fill="#3B3A34">读法：写入只发生在 A 的本地 part 和 Keeper 日志；B/C 不共享磁盘，只按日志拉取不可变 part。</text>
<text x="34" y="374" font-size="10.5" fill="#6B695F">口径：StorageReplicatedMergeTree.cpp:452/1129；ReplicatedMergeTreeSink.cpp:303/1306；Settings.cpp:2766/2803/2838。</text>
<line x1="20" y1="452" x2="980" y2="452" stroke="#ECEAE2" stroke-width="1.2" stroke-dasharray="5 4"/>
<g transform="translate(0,460)"><rect x="18" y="14" width="964" height="182" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.2"/><text x="34" y="38" font-size="13" fill="#1F1E1A" font-weight="600">Keeper 里的表路径：共享日志 + 每个副本的私有指针</text><rect x="34" y="54" width="200" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="134.0" y="76" class="tn" text-anchor="middle" font-size="11.5">/log</text><text x="134.0" y="94" class="tag" text-anchor="middle">GET_PART / MERGE</text><text x="134.0" y="106" class="tag" text-anchor="middle">ALTER_METADATA</text><text x="134.0" y="118" class="tag" text-anchor="middle">追加式操作日志</text><rect x="254" y="54" width="180" height="78" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="344.0" y="76" class="tn" text-anchor="middle" font-size="11.5">/replicas/A</text><text x="344.0" y="94" class="tag" text-anchor="middle">log_pointer</text><text x="344.0" y="106" class="tag" text-anchor="middle">parts</text><text x="344.0" y="118" class="tag" text-anchor="middle">is_lost</text><rect x="454" y="54" width="180" height="78" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="544.0" y="76" class="tn" text-anchor="middle" font-size="11.5">/replicas/B</text><text x="544.0" y="94" class="tag" text-anchor="middle">log_pointer</text><text x="544.0" y="106" class="tag" text-anchor="middle">parts</text><text x="544.0" y="118" class="tag" text-anchor="middle">is_lost</text><rect x="654" y="54" width="180" height="78" rx="6" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/><text x="744.0" y="76" class="tn" text-anchor="middle" font-size="11.5">/quorum</text><text x="744.0" y="94" class="tag" text-anchor="middle">last_part</text><text x="744.0" y="106" class="tag" text-anchor="middle">failed_parts</text><rect x="854" y="54" width="114" height="78" rx="6" fill="#fff" stroke="#D3D1C7" stroke-width="1.1"/><text x="911.0" y="76" class="tn" text-anchor="middle" font-size="11.5">/metadata</text><text x="911.0" y="94" class="tag" text-anchor="middle">表结构</text><path d="M234 86 L252 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M434 86 L452 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M634 86 L652 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M834 86 L852 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><text x="34" y="154" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">读法：/log 是所有副本共享的「操作指令」；每个副本只维护自己的 log_pointer 和本地 part。</text><text x="34" y="172" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">Keeper 不存 part 数据；它只存「谁该做什么、做到哪了」这些元数据。</text></g>
<text x="20" y="688" font-size="10" fill="#6B695F">口径：ClickHouse 26.11.1.1-testing 源码快照（2026-10-25）；图中行数、线程数、part 数为演示值。</text>
</svg>