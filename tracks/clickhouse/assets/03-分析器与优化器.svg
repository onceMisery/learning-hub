<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="查询分析器与优化器：把树修成能执行的形状">
<defs>
<marker id="aW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B695F" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<style>
text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
.th{font-size:15px;fill:#1F1E1A;font-weight:500}
.ts{font-size:12px;fill:#6B695F}
.tb{font-size:11.5px;fill:#3B3A34}
.tn{font-size:12.5px;fill:#1F1E1A;font-weight:500}
.tag{font-size:10px;fill:#6B695F}
</style>
<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="500" y="28" font-size="18" fill="#1F1E1A" text-anchor="middle" font-weight="600">AST → QueryTree → QueryPlan → 更便宜的计划</text><text x="500" y="48" font-size="11.5" fill="#6B695F" text-anchor="middle">绑定语义之后，优化器用规则把计划改成「读得更少、算得更早」的形状</text><text x="976" y="24" font-size="10.5" fill="#C46A0A" text-anchor="end">橙色：改写</text><text x="976" y="39" font-size="10.5" fill="#2F6FA8" text-anchor="end">蓝色：计划</text><text x="976" y="54" font-size="10.5" fill="#639922" text-anchor="end">绿色：读取</text><g class="stage" id="s1"><rect x="20.0" y="76" width="111.25" height="142" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.2"/><text x="28.0" y="98" class="tn" text-anchor="start" font-size="12">AST</text><text x="28.0" y="118" class="tb" text-anchor="start" font-size="10.2">语法结构</text><text x="28.0" y="132" class="tb" text-anchor="start" font-size="10.2">别名/子查询</text><text x="28.0" y="146" class="tb" text-anchor="start" font-size="10.2">未绑定名字</text><text x="28.0" y="160" class="tb" text-anchor="start" font-size="10.2">未定类型</text><text x="28.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">Parser 产物</text></g><path d="M131.25 147.0 L139.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s2"><rect x="141.25" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="149.25" y="98" class="tn" text-anchor="start" font-size="12">QueryTreeBuilder</text><text x="149.25" y="118" class="tb" text-anchor="start" font-size="10.2">结构翻译</text><text x="149.25" y="132" class="tb" text-anchor="start" font-size="10.2">QueryNode</text><text x="149.25" y="146" class="tb" text-anchor="start" font-size="10.2">TableNode</text><text x="149.25" y="160" class="tb" text-anchor="start" font-size="10.2">FunctionNode</text><text x="149.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">建语义树</text></g><path d="M252.5 147.0 L260.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s3"><rect x="262.5" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="270.5" y="98" class="tn" text-anchor="start" font-size="12">QueryAnalyzer</text><text x="270.5" y="118" class="tb" text-anchor="start" font-size="10.2">绑定列/表</text><text x="270.5" y="132" class="tb" text-anchor="start" font-size="10.2">解析别名</text><text x="270.5" y="146" class="tb" text-anchor="start" font-size="10.2">推断类型</text><text x="270.5" y="160" class="tb" text-anchor="start" font-size="10.2">检查聚合</text><text x="270.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">语义</text></g><path d="M373.75 147.0 L381.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s4"><rect x="383.75" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="391.75" y="98" class="tn" text-anchor="start" font-size="12">Passes</text><text x="391.75" y="118" class="tb" text-anchor="start" font-size="10.2">常量折叠</text><text x="391.75" y="132" class="tb" text-anchor="start" font-size="10.2">函数改写</text><text x="391.75" y="146" class="tb" text-anchor="start" font-size="10.2">列裁剪</text><text x="391.75" y="160" class="tb" text-anchor="start" font-size="10.2">表达式规范化</text><text x="391.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">规则改写</text></g><path d="M495.0 147.0 L503.0 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s5"><rect x="505.0" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="513.0" y="98" class="tn" text-anchor="start" font-size="12">Planner</text><text x="513.0" y="118" class="tb" text-anchor="start" font-size="10.2">Read</text><text x="513.0" y="132" class="tb" text-anchor="start" font-size="10.2">Filter</text><text x="513.0" y="146" class="tb" text-anchor="start" font-size="10.2">Aggregate</text><text x="513.0" y="160" class="tb" text-anchor="start" font-size="10.2">Sort/Limit</text><text x="513.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">QueryPlan</text></g><path d="M616.25 147.0 L624.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s6"><rect x="626.25" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="634.25" y="98" class="tn" text-anchor="start" font-size="12">下推</text><text x="634.25" y="118" class="tb" text-anchor="start" font-size="10.2">过滤下推</text><text x="634.25" y="132" class="tb" text-anchor="start" font-size="10.2">分区裁剪</text><text x="634.25" y="146" class="tb" text-anchor="start" font-size="10.2">PREWHERE</text><text x="634.25" y="160" class="tb" text-anchor="start" font-size="10.2">主键范围</text><text x="634.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">少读</text></g><path d="M737.5 147.0 L745.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s7"><rect x="747.5" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="755.5" y="98" class="tn" text-anchor="start" font-size="12">裁剪</text><text x="755.5" y="118" class="tb" text-anchor="start" font-size="10.2">列裁剪</text><text x="755.5" y="132" class="tb" text-anchor="start" font-size="10.2">移除无用列</text><text x="755.5" y="146" class="tb" text-anchor="start" font-size="10.2">合并表达式</text><text x="755.5" y="160" class="tb" text-anchor="start" font-size="10.2">合并过滤</text><text x="755.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">少算</text></g><path d="M858.75 147.0 L866.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s8"><rect x="868.75" y="76" width="111.25" height="142" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/><text x="876.75" y="98" class="tn" text-anchor="start" font-size="12">Read</text><text x="876.75" y="118" class="tb" text-anchor="start" font-size="10.2">ReadFromMergeTree</text><text x="876.75" y="132" class="tb" text-anchor="start" font-size="10.2">只读需要的列</text><text x="876.75" y="146" class="tb" text-anchor="start" font-size="10.2">只读候选 granule</text><text x="876.75" y="160" class="tb" text-anchor="start" font-size="10.2">read-in-order</text><text x="876.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">执行</text></g><text x="20" y="244" font-size="12" fill="#C46A0A" font-weight="600">优化前后的计划形状：过滤从聚合上面挪到读取里面</text>
<rect x="20" y="256" width="450" height="66" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.1"/>
<text x="34" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">优化前</text>
<text x="34" y="296" font-size="10.5" fill="#6B695F">Sort → Aggregate → Filter → Read(所有列)</text>
<text x="34" y="312" font-size="10.5" fill="#E24B4A">过滤晚、列多、granule 全扫</text>
<rect x="500" y="256" width="480" height="66" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/>
<text x="514" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">优化后</text>
<text x="514" y="296" font-size="10.5" fill="#6B695F">Sort → Aggregate → Read(过滤下推 + 4 列 + 主键范围)</text>
<text x="514" y="312" font-size="10.5" fill="#639922">过滤早、列少、granule 120/977</text>
<rect x="20" y="334" width="960" height="56" rx="8" fill="#fff" stroke="#ECEAE2" stroke-width="1"/>
<text x="34" y="356" font-size="11" fill="#3B3A34">读法：优化器不是「换一个更快的算法」，多数时候是「把工作挪到更早、更少数据的地方」。</text>
<text x="34" y="376" font-size="10.5" fill="#6B695F">口径：QueryAnalyzer.h:118、Planner.cpp:2477、filterPushDown.cpp、removeUnusedColumns.cpp:103、optimizePrewhere.cpp:236。</text>
<line x1="20" y1="452" x2="980" y2="452" stroke="#ECEAE2" stroke-width="1.2" stroke-dasharray="5 4"/>
<g transform="translate(0,460)"><rect x="18" y="14" width="964" height="182" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.2"/><text x="34" y="38" font-size="13" fill="#1F1E1A" font-weight="600">QueryTree 上的 Pass 与 QueryPlan 的 Step</text><rect x="34" y="54" width="170" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="119.0" y="76" class="tn" text-anchor="middle" font-size="11.5">QueryTree</text><text x="119.0" y="94" class="tag" text-anchor="middle">绑定 + 类型</text><rect x="224" y="54" width="170" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="309.0" y="76" class="tn" text-anchor="middle" font-size="11.5">QueryTreePass</text><text x="309.0" y="94" class="tag" text-anchor="middle">常量/函数/列裁剪</text><rect x="414" y="54" width="170" height="78" rx="6" fill="#fff" stroke="#D3D1C7" stroke-width="1.1"/><text x="499.0" y="76" class="tn" text-anchor="middle" font-size="11.5">QueryPlan</text><text x="499.0" y="94" class="tag" text-anchor="middle">Read/Filter/Agg/Sort</text><rect x="604" y="54" width="170" height="78" rx="6" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/><text x="689.0" y="76" class="tn" text-anchor="middle" font-size="11.5">Optimizer</text><text x="689.0" y="94" class="tag" text-anchor="middle">下推/裁剪/合并</text><rect x="794" y="54" width="174" height="78" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="881.0" y="76" class="tn" text-anchor="middle" font-size="11.5">Pipeline</text><text x="881.0" y="94" class="tag" text-anchor="middle">Processor 图</text><path d="M204 86 L222 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M394 86 L412 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M584 86 L602 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M774 86 L792 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><text x="34" y="154" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">读法：前三步是「理解 SQL」，后两步是「改成便宜形状」；EXPLAIN SYNTAX 看改写后 SQL，EXPLAIN PLAN 看步骤树。</text><text x="34" y="172" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">别名/类型在 QueryTree 阶段解决；下推/裁剪在 QueryPlan 阶段解决，两个阶段不要混。</text></g>
<text x="20" y="688" font-size="10" fill="#6B695F">口径：ClickHouse 26.11.1.1-testing 源码快照（2026-10-25）；图中行数、线程数、part 数为演示值。</text>
</svg>