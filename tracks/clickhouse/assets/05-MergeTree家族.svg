<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="MergeTree 引擎家族：不可变 part 与后台合并">
<defs>
<marker id="aW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B695F" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<style>
text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
.th{font-size:15px;fill:#1F1E1A;font-weight:500}
.ts{font-size:12px;fill:#6B695F}
.tb{font-size:11.5px;fill:#3B3A34}
.tn{font-size:12.5px;fill:#1F1E1A;font-weight:500}
.tag{font-size:10px;fill:#6B695F}
</style>
<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="500" y="28" font-size="18" fill="#1F1E1A" text-anchor="middle" font-weight="600">一次 INSERT 生成一个不可变 part，后台合并收敛</text><text x="500" y="48" font-size="11.5" fill="#6B695F" text-anchor="middle">写入只追加；更新/删除都是新版本，FINAL/OPTIMIZE 是读时/手动兜底</text><text x="976" y="24" font-size="10.5" fill="#C46A0A" text-anchor="end">橙色：写入/运维</text><text x="976" y="39" font-size="10.5" fill="#2F6FA8" text-anchor="end">蓝色：合并</text><text x="976" y="54" font-size="10.5" fill="#639922" text-anchor="end">绿色：磁盘</text><g class="stage" id="s1"><rect x="20.0" y="76" width="111.25" height="142" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.2"/><text x="28.0" y="98" class="tn" text-anchor="start" font-size="12">INSERT</text><text x="28.0" y="118" class="tb" text-anchor="start" font-size="10.2">一批行</text><text x="28.0" y="132" class="tb" text-anchor="start" font-size="10.2">按排序键</text><text x="28.0" y="146" class="tb" text-anchor="start" font-size="10.2">排序</text><text x="28.0" y="160" class="tb" text-anchor="start" font-size="10.2">写入</text><text x="28.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">写入</text></g><path d="M131.25 147.0 L139.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s2"><rect x="141.25" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="149.25" y="98" class="tn" text-anchor="start" font-size="12">临时 part</text><text x="149.25" y="118" class="tb" text-anchor="start" font-size="10.2">先写 tmp</text><text x="149.25" y="132" class="tb" text-anchor="start" font-size="10.2">排序/写列</text><text x="149.25" y="146" class="tb" text-anchor="start" font-size="10.2">校验</text><text x="149.25" y="160" class="tb" text-anchor="start" font-size="10.2">原子改名</text><text x="149.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">不可变</text></g><path d="M252.5 147.0 L260.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s3"><rect x="262.5" y="76" width="111.25" height="142" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/><text x="270.5" y="98" class="tn" text-anchor="start" font-size="12">active part</text><text x="270.5" y="118" class="tb" text-anchor="start" font-size="10.2">挂到 part 列表</text><text x="270.5" y="132" class="tb" text-anchor="start" font-size="10.2">查询可见</text><text x="270.5" y="146" class="tb" text-anchor="start" font-size="10.2">不可修改</text><text x="270.5" y="160" class="tb" text-anchor="start" font-size="10.2">后台合并</text><text x="270.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">磁盘</text></g><path d="M373.75 147.0 L381.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s4"><rect x="383.75" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="391.75" y="98" class="tn" text-anchor="start" font-size="12">L0 多 part</text><text x="391.75" y="118" class="tb" text-anchor="start" font-size="10.2">每次 INSERT</text><text x="391.75" y="132" class="tb" text-anchor="start" font-size="10.2">一个新 part</text><text x="391.75" y="146" class="tb" text-anchor="start" font-size="10.2">键范围重叠</text><text x="391.75" y="160" class="tb" text-anchor="start" font-size="10.2">点查要逐个问</text><text x="391.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">碎片</text></g><path d="M495.0 147.0 L503.0 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s5"><rect x="505.0" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="513.0" y="98" class="tn" text-anchor="start" font-size="12">MergeTask</text><text x="513.0" y="118" class="tb" text-anchor="start" font-size="10.2">选 part</text><text x="513.0" y="132" class="tb" text-anchor="start" font-size="10.2">归并排序</text><text x="513.0" y="146" class="tb" text-anchor="start" font-size="10.2">写新 part</text><text x="513.0" y="160" class="tb" text-anchor="start" font-size="10.2">旧 part 下线</text><text x="513.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">合并</text></g><path d="M616.25 147.0 L624.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s6"><rect x="626.25" y="76" width="111.25" height="142" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/><text x="634.25" y="98" class="tn" text-anchor="start" font-size="12">收敛</text><text x="634.25" y="118" class="tb" text-anchor="start" font-size="10.2">大 part</text><text x="634.25" y="132" class="tb" text-anchor="start" font-size="10.2">去旧版本</text><text x="634.25" y="146" class="tb" text-anchor="start" font-size="10.2">消墓碑</text><text x="634.25" y="160" class="tb" text-anchor="start" font-size="10.2">空间回收</text><text x="634.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">最终</text></g><path d="M737.5 147.0 L745.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s7"><rect x="747.5" y="76" width="111.25" height="142" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.2"/><text x="755.5" y="98" class="tn" text-anchor="start" font-size="12">FINAL</text><text x="755.5" y="118" class="tb" text-anchor="start" font-size="10.2">查询时去重</text><text x="755.5" y="132" class="tb" text-anchor="start" font-size="10.2">同键多版本</text><text x="755.5" y="146" class="tb" text-anchor="start" font-size="10.2">代价较高</text><text x="755.5" y="160" class="tb" text-anchor="start" font-size="10.2">不保证实时</text><text x="755.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">读时</text></g><path d="M858.75 147.0 L866.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s8"><rect x="868.75" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="876.75" y="98" class="tn" text-anchor="start" font-size="12">OPTIMIZE</text><text x="876.75" y="118" class="tb" text-anchor="start" font-size="10.2">手动合并</text><text x="876.75" y="132" class="tb" text-anchor="start" font-size="10.2">重写分区</text><text x="876.75" y="146" class="tb" text-anchor="start" font-size="10.2">代价高</text><text x="876.75" y="160" class="tb" text-anchor="start" font-size="10.2">别在高峰跑</text><text x="876.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">运维</text></g><text x="20" y="244" font-size="12" fill="#C46A0A" font-weight="600">家族：不同引擎只在「合并时同键多行怎么处理」上不同</text>
<rect x="20" y="256" width="300" height="58" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="34" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">MergeTree</text>
<text x="34" y="296" font-size="10.5" fill="#6B695F">保留所有行，只归并排序</text>
<rect x="340" y="256" width="300" height="58" rx="8" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/>
<text x="354" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">ReplacingMergeTree(ver)</text>
<text x="354" y="296" font-size="10.5" fill="#6B695F">同键留 ver 最大；查询仍可能多行</text>
<rect x="660" y="256" width="320" height="58" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/>
<text x="674" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">Summing / Aggregating</text>
<text x="674" y="296" font-size="10.5" fill="#6B695F">合并时预聚合，查询要 SUM/-Merge</text>
<rect x="20" y="326" width="960" height="64" rx="8" fill="#fff" stroke="#ECEAE2" stroke-width="1"/>
<text x="34" y="348" font-size="11" fill="#3B3A34">读法：INSERT 只追加；part 越多查询越碎，后台合并把同键多行收敛；FINAL/OPTIMIZE 是读时/手动兜底。</text>
<text x="34" y="368" font-size="10.5" fill="#6B695F">口径：MergeTreeSettings.cpp:74/1207；MergeTreeDataWriter.cpp:782；MergeTask.cpp:2884；registerStorageMergeTree.cpp:3090。</text>
<line x1="20" y1="452" x2="980" y2="452" stroke="#ECEAE2" stroke-width="1.2" stroke-dasharray="5 4"/>
<g transform="translate(0,460)"><rect x="18" y="14" width="964" height="182" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.2"/><text x="34" y="38" font-size="13" fill="#1F1E1A" font-weight="600">一个 part 的目录，以及 ReplacingMergeTree 的最终一致</text><rect x="34" y="54" width="180" height="78" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="124.0" y="76" class="tn" text-anchor="middle" font-size="11.5">part 目录</text><text x="124.0" y="94" class="tag" text-anchor="middle">checksums / columns</text><text x="124.0" y="106" class="tag" text-anchor="middle">count / primary.idx</text><text x="124.0" y="118" class="tag" text-anchor="middle">region.bin / .mrk3</text><rect x="234" y="54" width="180" height="78" rx="6" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/><text x="324.0" y="76" class="tn" text-anchor="middle" font-size="11.5">INSERT ×3</text><text x="324.0" y="94" class="tag" text-anchor="middle">同一 order_id</text><text x="324.0" y="106" class="tag" text-anchor="middle">version 1/2/3</text><text x="324.0" y="118" class="tag" text-anchor="middle">三个 part</text><rect x="434" y="54" width="180" height="78" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.1"/><text x="524.0" y="76" class="tn" text-anchor="middle" font-size="11.5">合并前 SELECT</text><text x="524.0" y="94" class="tag" text-anchor="middle">可能 3 行</text><text x="524.0" y="106" class="tag" text-anchor="middle">不保证唯一</text><text x="524.0" y="118" class="tag" text-anchor="middle">别当主键</text><rect x="634" y="54" width="180" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="724.0" y="76" class="tn" text-anchor="middle" font-size="11.5">FINAL / argMax</text><text x="724.0" y="94" class="tag" text-anchor="middle">读时去重</text><text x="724.0" y="106" class="tag" text-anchor="middle">只留最新</text><text x="724.0" y="118" class="tag" text-anchor="middle">代价较高</text><rect x="834" y="54" width="134" height="78" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="901.0" y="76" class="tn" text-anchor="middle" font-size="11.5">OPTIMIZE</text><text x="901.0" y="94" class="tag" text-anchor="middle">重写 part</text><path d="M214 86 L232 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M414 86 L432 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M614 86 L632 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M814 86 L832 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><text x="34" y="154" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">读法：ReplacingMergeTree 的去重键是 ORDER BY 的全部列，不是 PRIMARY KEY；合并前查询仍可能多行。</text><text x="34" y="172" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">FINAL 是查询时归并；OPTIMIZE FINAL 是重写分区，代价更高，别在高峰跑。</text></g>
<text x="20" y="688" font-size="10" fill="#6B695F">口径：ClickHouse 26.11.1.1-testing 源码快照（2026-10-25）；图中行数、线程数、part 数为演示值。</text>
</svg>