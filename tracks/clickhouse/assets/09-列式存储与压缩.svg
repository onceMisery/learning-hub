<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="500" y="28" font-size="18" fill="#1F1E1A" text-anchor="middle" font-weight="600">part → 索引 → mark → 压缩块 → 列向量</text><text x="500" y="48" font-size="11.5" fill="#6B695F" text-anchor="middle">先看索引决定读不读，再看 mark 决定从哪读，最后只解压候选压缩块</text><text x="976" y="24" font-size="10.5" fill="#C46A0A" text-anchor="end">橙色：压缩</text><text x="976" y="39" font-size="10.5" fill="#2F6FA8" text-anchor="end">蓝色：索引/内存</text><text x="976" y="54" font-size="10.5" fill="#639922" text-anchor="end">绿色：磁盘/收益</text><g class="stage" id="s1"><rect x="20.0" y="76" width="111.25" height="142" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/><text x="28.0" y="98" class="tn" text-anchor="start" font-size="12">part</text><text x="28.0" y="118" class="tb" text-anchor="start" font-size="10.2">不可变目录</text><text x="28.0" y="132" class="tb" text-anchor="start" font-size="10.2">columns.txt</text><text x="28.0" y="146" class="tb" text-anchor="start" font-size="10.2">count.txt</text><text x="28.0" y="160" class="tb" text-anchor="start" font-size="10.2">checksums</text><text x="28.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">磁盘</text></g><path d="M131.25 147.0 L139.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s2"><rect x="141.25" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="149.25" y="98" class="tn" text-anchor="start" font-size="12">primary.idx</text><text x="149.25" y="118" class="tb" text-anchor="start" font-size="10.2">每 granule</text><text x="149.25" y="132" class="tb" text-anchor="start" font-size="10.2">一条键值</text><text x="149.25" y="146" class="tb" text-anchor="start" font-size="10.2">稀疏索引</text><text x="149.25" y="160" class="tb" text-anchor="start" font-size="10.2">决定读不读</text><text x="149.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">索引</text></g><path d="M252.5 147.0 L260.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s3"><rect x="262.5" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="270.5" y="98" class="tn" text-anchor="start" font-size="12">.mrk3</text><text x="270.5" y="118" class="tb" text-anchor="start" font-size="10.2">压缩偏移</text><text x="270.5" y="132" class="tb" text-anchor="start" font-size="10.2">解压内偏移</text><text x="270.5" y="146" class="tb" text-anchor="start" font-size="10.2">每列一份</text><text x="270.5" y="160" class="tb" text-anchor="start" font-size="10.2">决定从哪读</text><text x="270.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">mark</text></g><path d="M373.75 147.0 L381.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s4"><rect x="383.75" y="76" width="111.25" height="142" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.2"/><text x="391.75" y="98" class="tn" text-anchor="start" font-size="12">压缩块</text><text x="391.75" y="118" class="tb" text-anchor="start" font-size="10.2">64 KiB–1 MiB</text><text x="391.75" y="132" class="tb" text-anchor="start" font-size="10.2">按 mark 边界</text><text x="391.75" y="146" class="tb" text-anchor="start" font-size="10.2">列内重复</text><text x="391.75" y="160" class="tb" text-anchor="start" font-size="10.2">LZ4/ZSTD</text><text x="391.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">压缩</text></g><path d="M495.0 147.0 L503.0 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s5"><rect x="505.0" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="513.0" y="98" class="tn" text-anchor="start" font-size="12">解压</text><text x="513.0" y="118" class="tb" text-anchor="start" font-size="10.2">只解候选块</text><text x="513.0" y="132" class="tb" text-anchor="start" font-size="10.2">块内偏移</text><text x="513.0" y="146" class="tb" text-anchor="start" font-size="10.2">跳过不需要</text><text x="513.0" y="160" class="tb" text-anchor="start" font-size="10.2">不读其他列</text><text x="513.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">读取</text></g><path d="M616.25 147.0 L624.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s6"><rect x="626.25" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="634.25" y="98" class="tn" text-anchor="start" font-size="12">解码</text><text x="634.25" y="118" class="tb" text-anchor="start" font-size="10.2">列向量</text><text x="634.25" y="132" class="tb" text-anchor="start" font-size="10.2">类型解码</text><text x="634.25" y="146" class="tb" text-anchor="start" font-size="10.2">NULL/字典</text><text x="634.25" y="160" class="tb" text-anchor="start" font-size="10.2">Chunk</text><text x="634.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">内存</text></g><path d="M737.5 147.0 L745.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s7"><rect x="747.5" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="755.5" y="98" class="tn" text-anchor="start" font-size="12">过滤/聚合</text><text x="755.5" y="118" class="tb" text-anchor="start" font-size="10.2">向量化</text><text x="755.5" y="132" class="tb" text-anchor="start" font-size="10.2">SUM/COUNT</text><text x="755.5" y="146" class="tb" text-anchor="start" font-size="10.2">两阶段</text><text x="755.5" y="160" class="tb" text-anchor="start" font-size="10.2">结果</text><text x="755.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">计算</text></g><path d="M858.75 147.0 L866.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s8"><rect x="868.75" y="76" width="111.25" height="142" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/><text x="876.75" y="98" class="tn" text-anchor="start" font-size="12">收益</text><text x="876.75" y="118" class="tb" text-anchor="start" font-size="10.2">少读列</text><text x="876.75" y="132" class="tb" text-anchor="start" font-size="10.2">少读 granule</text><text x="876.75" y="146" class="tb" text-anchor="start" font-size="10.2">压缩后更小</text><text x="876.75" y="160" class="tb" text-anchor="start" font-size="10.2">三层叠加</text><text x="876.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">边界</text></g><text x="20" y="244" font-size="12" fill="#C46A0A" font-weight="600">编码先改形状，压缩再收体积；顺序反了效果会变差</text>
<rect x="20" y="256" width="300" height="58" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="34" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">时间戳</text>
<text x="34" y="296" font-size="10.5" fill="#6B695F">CODEC(DoubleDelta, ZSTD(3))</text>
<rect x="340" y="256" width="300" height="58" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="354" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">低基数字符串</text>
<text x="354" y="296" font-size="10.5" fill="#6B695F">LowCardinality(String)</text>
<rect x="660" y="256" width="320" height="58" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="674" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">浮点</text>
<text x="674" y="296" font-size="10.5" fill="#6B695F">CODEC(Gorilla, ZSTD(1))</text>
<rect x="20" y="326" width="960" height="64" rx="8" fill="#fff" stroke="#ECEAE2" stroke-width="1"/>
<text x="34" y="348" font-size="11" fill="#3B3A34">读法：先看 system.columns 哪列最占空间/压缩比最低，再选编码；不要一上来调 index_granularity。</text>
<text x="34" y="368" font-size="10.5" fill="#6B695F">口径：MergeTreeSettings.cpp:74/2177；MarkInCompressedFile.h:17；Settings.cpp:146/161；registerCompressionCodecs.h。</text>
<line x1="20" y1="452" x2="980" y2="452" stroke="#ECEAE2" stroke-width="1.2" stroke-dasharray="5 4"/>
<g transform="translate(0,460)"><rect x="18" y="14" width="964" height="182" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.2"/><text x="34" y="38" font-size="13" fill="#1F1E1A" font-weight="600">一个 part 的列文件、mark 与压缩块</text><rect x="34" y="54" width="180" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="124.0" y="76" class="tn" text-anchor="middle" font-size="11.5">primary.idx</text><text x="124.0" y="94" class="tag" text-anchor="middle">每 granule 键值</text><text x="124.0" y="106" class="tag" text-anchor="middle">决定读不读</text><rect x="234" y="54" width="180" height="78" rx="6" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/><text x="324.0" y="76" class="tn" text-anchor="middle" font-size="11.5">region.mrk3</text><text x="324.0" y="94" class="tag" text-anchor="middle">压缩偏移</text><text x="324.0" y="106" class="tag" text-anchor="middle">解压内偏移</text><rect x="434" y="54" width="180" height="78" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="524.0" y="76" class="tn" text-anchor="middle" font-size="11.5">region.bin</text><text x="524.0" y="94" class="tag" text-anchor="middle">压缩块 1</text><text x="524.0" y="106" class="tag" text-anchor="middle">压缩块 2</text><text x="524.0" y="118" class="tag" text-anchor="middle">...</text><rect x="634" y="54" width="180" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="724.0" y="76" class="tn" text-anchor="middle" font-size="11.5">解压/解码</text><text x="724.0" y="94" class="tag" text-anchor="middle">只解候选块</text><text x="724.0" y="106" class="tag" text-anchor="middle">列向量</text><rect x="834" y="54" width="134" height="78" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="901.0" y="76" class="tn" text-anchor="middle" font-size="11.5">Chunk</text><text x="901.0" y="94" class="tag" text-anchor="middle">交给算子</text><path d="M214 86 L232 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M414 86 L432 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M614 86 L632 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M814 86 L832 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><text x="34" y="154" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">读法：索引决定「读不读」，mark 决定「从哪读」，压缩块决定「解压多少」；三者不是一回事。</text><text x="34" y="172" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">压缩块在 mark 边界切，读一个 granule 通常只解压一个块，不会多读无关数据。</text></g>
<text x="20" y="688" font-size="10" fill="#6B695F">口径：ClickHouse 26.11.1.1-testing 源码快照（2026-10-25）；图中行数、线程数、part 数为演示值。</text>
</svg>