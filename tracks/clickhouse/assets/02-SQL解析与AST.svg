<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="SQL 解析器与 AST：先把句子拆成树">
<defs>
<marker id="aW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B695F" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<style>
text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
.th{font-size:15px;fill:#1F1E1A;font-weight:500}
.ts{font-size:12px;fill:#6B695F}
.tb{font-size:11.5px;fill:#3B3A34}
.tn{font-size:12.5px;fill:#1F1E1A;font-weight:500}
.tag{font-size:10px;fill:#6B695F}
</style>
<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="500" y="28" font-size="18" fill="#1F1E1A" text-anchor="middle" font-weight="600">SQL 文本 → Token → AST：解析器在做什么</text><text x="500" y="48" font-size="11.5" fill="#6B695F" text-anchor="middle">Lexer 切词，递归下降 Parser 按子句拼树；语法错误在这一站，语义错误留给下一站</text><text x="976" y="24" font-size="10.5" fill="#C46A0A" text-anchor="end">橙色：文本/请求</text><text x="976" y="39" font-size="10.5" fill="#2F6FA8" text-anchor="end">蓝色：结构</text><text x="976" y="54" font-size="10.5" fill="#E24B4A" text-anchor="end">红色：语法错误</text><g class="stage" id="s1"><rect x="20.0" y="76" width="111.25" height="142" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.2"/><text x="28.0" y="98" class="tn" text-anchor="start" font-size="12">SQL 文本</text><text x="28.0" y="118" class="tb" text-anchor="start" font-size="10.2">SELECT region,</text><text x="28.0" y="132" class="tb" text-anchor="start" font-size="10.2">COUNT(*) AS n</text><text x="28.0" y="146" class="tb" text-anchor="start" font-size="10.2">FROM shop.orders</text><text x="28.0" y="160" class="tb" text-anchor="start" font-size="10.2">WHERE status</text><text x="28.0" y="174" class="tb" text-anchor="start" font-size="10.2">= 'paid'</text><text x="28.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">字节流</text></g><path d="M131.25 147.0 L139.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s2"><rect x="141.25" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="149.25" y="98" class="tn" text-anchor="start" font-size="12">Lexer</text><text x="149.25" y="118" class="tb" text-anchor="start" font-size="10.2">切 token</text><text x="149.25" y="132" class="tb" text-anchor="start" font-size="10.2">关键字/标识符</text><text x="149.25" y="146" class="tb" text-anchor="start" font-size="10.2">数字/字符串</text><text x="149.25" y="160" class="tb" text-anchor="start" font-size="10.2">跳过空白/注释</text><text x="149.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">Token 流</text></g><path d="M252.5 147.0 L260.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s3"><rect x="262.5" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="270.5" y="98" class="tn" text-anchor="start" font-size="12">Parser</text><text x="270.5" y="118" class="tb" text-anchor="start" font-size="10.2">递归下降</text><text x="270.5" y="132" class="tb" text-anchor="start" font-size="10.2">按子句读</text><text x="270.5" y="146" class="tb" text-anchor="start" font-size="10.2">SELECT/FROM</text><text x="270.5" y="160" class="tb" text-anchor="start" font-size="10.2">WHERE/GROUP BY</text><text x="270.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">语法规则</text></g><path d="M373.75 147.0 L381.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s4"><rect x="383.75" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="391.75" y="98" class="tn" text-anchor="start" font-size="12">AST</text><text x="391.75" y="118" class="tb" text-anchor="start" font-size="10.2">ASTSelectQuery</text><text x="391.75" y="132" class="tb" text-anchor="start" font-size="10.2">select / from</text><text x="391.75" y="146" class="tb" text-anchor="start" font-size="10.2">where / group_by</text><text x="391.75" y="160" class="tb" text-anchor="start" font-size="10.2">order_by / limit</text><text x="391.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">语法树</text></g><path d="M495.0 147.0 L503.0 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s5"><rect x="505.0" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="513.0" y="98" class="tn" text-anchor="start" font-size="12">语义检查</text><text x="513.0" y="118" class="tb" text-anchor="start" font-size="10.2">绑定表/列</text><text x="513.0" y="132" class="tb" text-anchor="start" font-size="10.2">别名作用域</text><text x="513.0" y="146" class="tb" text-anchor="start" font-size="10.2">类型推断</text><text x="513.0" y="160" class="tb" text-anchor="start" font-size="10.2">聚合合法性</text><text x="513.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">Analyzer</text></g><path d="M616.25 147.0 L624.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s6"><rect x="626.25" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="634.25" y="98" class="tn" text-anchor="start" font-size="12">QueryTree</text><text x="634.25" y="118" class="tb" text-anchor="start" font-size="10.2">ColumnNode</text><text x="634.25" y="132" class="tb" text-anchor="start" font-size="10.2">FunctionNode</text><text x="634.25" y="146" class="tb" text-anchor="start" font-size="10.2">TableNode</text><text x="634.25" y="160" class="tb" text-anchor="start" font-size="10.2">JoinNode</text><text x="634.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">语义树</text></g><path d="M737.5 147.0 L745.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s7"><rect x="747.5" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="755.5" y="98" class="tn" text-anchor="start" font-size="12">EXPLAIN AST</text><text x="755.5" y="118" class="tb" text-anchor="start" font-size="10.2">打印语法树</text><text x="755.5" y="132" class="tb" text-anchor="start" font-size="10.2">看别名/结构</text><text x="755.5" y="146" class="tb" text-anchor="start" font-size="10.2">排查解析</text><text x="755.5" y="160" class="tb" text-anchor="start" font-size="10.2">不是执行计划</text><text x="755.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">诊断</text></g><path d="M858.75 147.0 L866.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s8"><rect x="868.75" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="876.75" y="98" class="tn" text-anchor="start" font-size="12">下一站</text><text x="876.75" y="118" class="tb" text-anchor="start" font-size="10.2">QueryAnalyzer</text><text x="876.75" y="132" class="tb" text-anchor="start" font-size="10.2">QueryTreePass</text><text x="876.75" y="146" class="tb" text-anchor="start" font-size="10.2">Planner</text><text x="876.75" y="160" class="tb" text-anchor="start" font-size="10.2">QueryPlan</text><text x="876.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">第 3 章</text></g><text x="20" y="244" font-size="12" fill="#C46A0A" font-weight="600">分支：语法错误停在 Parser，语义错误停在 Analyzer</text>
<rect x="20" y="256" width="450" height="64" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.1"/>
<text x="34" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">语法错误：括号/关键字/引号</text>
<text x="34" y="296" font-size="10.5" fill="#6B695F">Syntax error: failed at position 62</text>
<text x="34" y="312" font-size="10.5" fill="#E24B4A">连 AST 都没生成，检查文本结构</text>
<rect x="500" y="256" width="480" height="64" rx="8" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/>
<text x="514" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">语义错误：列不存在/类型不匹配</text>
<text x="514" y="296" font-size="10.5" fill="#6B695F">Unknown expression identifier 'stauts'</text>
<text x="514" y="312" font-size="10.5" fill="#C46A0A">AST 已生成，检查绑定与类型</text>
<rect x="20" y="332" width="960" height="58" rx="8" fill="#fff" stroke="#ECEAE2" stroke-width="1"/>
<text x="34" y="354" font-size="11" fill="#3B3A34">读法：橙色令牌从左往右经过 token、语法树、语义树；红色/黄色分支只在对应错误时点亮，正常查询走上面的主链。</text>
<text x="34" y="374" font-size="10.5" fill="#6B695F">口径：ParserSelectWithUnionQuery.cpp:11、ParserSelectQuery.cpp:326、IAST.h:35；AST 节点名以 EXPLAIN AST 输出为准。</text>
<line x1="20" y1="452" x2="980" y2="452" stroke="#ECEAE2" stroke-width="1.2" stroke-dasharray="5 4"/>
<g transform="translate(0,460)"><rect x="18" y="14" width="964" height="182" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.2"/><text x="34" y="38" font-size="13" fill="#1F1E1A" font-weight="600">ASTSelectQuery 的六个关键子节点</text><rect x="34" y="54" width="150" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="109.0" y="76" class="tn" text-anchor="middle" font-size="11.5">select</text><text x="109.0" y="94" class="tag" text-anchor="middle">表达式列表</text><rect x="204" y="54" width="150" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="279.0" y="76" class="tn" text-anchor="middle" font-size="11.5">from</text><text x="279.0" y="94" class="tag" text-anchor="middle">表/子查询</text><rect x="374" y="54" width="150" height="78" rx="6" fill="#fff" stroke="#D3D1C7" stroke-width="1.1"/><text x="449.0" y="76" class="tn" text-anchor="middle" font-size="11.5">where</text><text x="449.0" y="94" class="tag" text-anchor="middle">过滤条件</text><rect x="544" y="54" width="150" height="78" rx="6" fill="#fff" stroke="#D3D1C7" stroke-width="1.1"/><text x="619.0" y="76" class="tn" text-anchor="middle" font-size="11.5">group_by</text><text x="619.0" y="94" class="tag" text-anchor="middle">分组键</text><rect x="714" y="54" width="150" height="78" rx="6" fill="#fff" stroke="#D3D1C7" stroke-width="1.1"/><text x="789.0" y="76" class="tn" text-anchor="middle" font-size="11.5">order_by</text><text x="789.0" y="94" class="tag" text-anchor="middle">排序键</text><rect x="884" y="54" width="84" height="78" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="926.0" y="76" class="tn" text-anchor="middle" font-size="11.5">limit</text><text x="926.0" y="94" class="tag" text-anchor="middle">5</text><path d="M184 86 L202 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M354 86 L372 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M524 86 L542 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M694 86 L712 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M864 86 L882 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><text x="34" y="154" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">读法：每个子节点本身又是一棵子树；EXPLAIN AST 的缩进就是这棵树。</text><text x="34" y="172" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">别名只记在 ASTWithAlias 里，是否生效由 Analyzer 决定；EXPLAIN SYNTAX 看改写后的 SQL。</text></g>
<text x="20" y="688" font-size="10" fill="#6B695F">口径：ClickHouse 26.11.1.1-testing 源码快照（2026-10-25）；图中行数、线程数、part 数为演示值。</text>
</svg>