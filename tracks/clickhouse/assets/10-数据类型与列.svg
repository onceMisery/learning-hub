<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="500" y="28" font-size="18" fill="#1F1E1A" text-anchor="middle" font-weight="600">逻辑类型 → 物理列 → 算子：一列在内存里怎么放</text><text x="500" y="48" font-size="11.5" fill="#6B695F" text-anchor="middle">DataType 创建 Column；Column 用不同的内存结构表示 Vector/String/Nullable/LowCardinality</text><text x="976" y="24" font-size="10.5" fill="#C46A0A" text-anchor="end">橙色：类型/可空</text><text x="976" y="39" font-size="10.5" fill="#2F6FA8" text-anchor="end">蓝色：列结构</text><text x="976" y="54" font-size="10.5" fill="#639922" text-anchor="end">绿色：计算/低基数</text><g class="stage" id="s1"><rect x="20.0" y="76" width="111.25" height="142" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.2"/><text x="28.0" y="98" class="tn" text-anchor="start" font-size="12">类型</text><text x="28.0" y="118" class="tb" text-anchor="start" font-size="10.2">String</text><text x="28.0" y="132" class="tb" text-anchor="start" font-size="10.2">Nullable(String)</text><text x="28.0" y="146" class="tb" text-anchor="start" font-size="10.2">LowCardinality</text><text x="28.0" y="160" class="tb" text-anchor="start" font-size="10.2">Array/JSON</text><text x="28.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">逻辑</text></g><path d="M131.25 147.0 L139.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s2"><rect x="141.25" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="149.25" y="98" class="tn" text-anchor="start" font-size="12">DataType</text><text x="149.25" y="118" class="tb" text-anchor="start" font-size="10.2">IDataType</text><text x="149.25" y="132" class="tb" text-anchor="start" font-size="10.2">工厂注册</text><text x="149.25" y="146" class="tb" text-anchor="start" font-size="10.2">参数解析</text><text x="149.25" y="160" class="tb" text-anchor="start" font-size="10.2">createColumn</text><text x="149.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">类型对象</text></g><path d="M252.5 147.0 L260.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s3"><rect x="262.5" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="270.5" y="98" class="tn" text-anchor="start" font-size="12">ColumnVector</text><text x="270.5" y="118" class="tb" text-anchor="start" font-size="10.2">连续内存</text><text x="270.5" y="132" class="tb" text-anchor="start" font-size="10.2">PaddedArray</text><text x="270.5" y="146" class="tb" text-anchor="start" font-size="10.2">定长值</text><text x="270.5" y="160" class="tb" text-anchor="start" font-size="10.2">SIMD</text><text x="270.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">物理列</text></g><path d="M373.75 147.0 L381.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s4"><rect x="383.75" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="391.75" y="98" class="tn" text-anchor="start" font-size="12">ColumnString</text><text x="391.75" y="118" class="tb" text-anchor="start" font-size="10.2">offsets</text><text x="391.75" y="132" class="tb" text-anchor="start" font-size="10.2">chars</text><text x="391.75" y="146" class="tb" text-anchor="start" font-size="10.2">变长</text><text x="391.75" y="160" class="tb" text-anchor="start" font-size="10.2">任意字节</text><text x="391.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">字符串</text></g><path d="M495.0 147.0 L503.0 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s5"><rect x="505.0" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="513.0" y="98" class="tn" text-anchor="start" font-size="12">ColumnNullable</text><text x="513.0" y="118" class="tb" text-anchor="start" font-size="10.2">nested</text><text x="513.0" y="132" class="tb" text-anchor="start" font-size="10.2">null map</text><text x="513.0" y="146" class="tb" text-anchor="start" font-size="10.2">多 1 字节</text><text x="513.0" y="160" class="tb" text-anchor="start" font-size="10.2">NULL 判断</text><text x="513.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">可空</text></g><path d="M616.25 147.0 L624.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s6"><rect x="626.25" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="634.25" y="98" class="tn" text-anchor="start" font-size="12">LowCardinality</text><text x="634.25" y="118" class="tb" text-anchor="start" font-size="10.2">字典</text><text x="634.25" y="132" class="tb" text-anchor="start" font-size="10.2">下标</text><text x="634.25" y="146" class="tb" text-anchor="start" font-size="10.2">低基数</text><text x="634.25" y="160" class="tb" text-anchor="start" font-size="10.2">高基数反噬</text><text x="634.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">字典</text></g><path d="M737.5 147.0 L745.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s7"><rect x="747.5" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="755.5" y="98" class="tn" text-anchor="start" font-size="12">Array/JSON</text><text x="755.5" y="118" class="tb" text-anchor="start" font-size="10.2">offset + nested</text><text x="755.5" y="132" class="tb" text-anchor="start" font-size="10.2">动态路径</text><text x="755.5" y="146" class="tb" text-anchor="start" font-size="10.2">typed paths</text><text x="755.5" y="160" class="tb" text-anchor="start" font-size="10.2">max_dynamic</text><text x="755.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">嵌套</text></g><path d="M858.75 147.0 L866.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s8"><rect x="868.75" y="76" width="111.25" height="142" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/><text x="876.75" y="98" class="tn" text-anchor="start" font-size="12">算子</text><text x="876.75" y="118" class="tb" text-anchor="start" font-size="10.2">过滤/聚合</text><text x="876.75" y="132" class="tb" text-anchor="start" font-size="10.2">在列上循环</text><text x="876.75" y="146" class="tb" text-anchor="start" font-size="10.2">Chunk</text><text x="876.75" y="160" class="tb" text-anchor="start" font-size="10.2">结果</text><text x="876.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">计算</text></g><text x="20" y="244" font-size="12" fill="#C46A0A" font-weight="600">同一条 region 字段，三种内存布局</text>
<rect x="20" y="256" width="300" height="66" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="34" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">String</text>
<text x="34" y="296" font-size="10.5" fill="#6B695F">offsets + chars</text>
<text x="34" y="312" font-size="10.5" fill="#2F6FA8">12 亿行 ≈ 12 GB（含 offset）</text>
<rect x="340" y="256" width="300" height="66" rx="8" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/>
<text x="354" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">Nullable(String)</text>
<text x="354" y="296" font-size="10.5" fill="#6B695F">String + null map</text>
<text x="354" y="312" font-size="10.5" fill="#C46A0A">多 1 字节/行 ≈ 13.2 GB</text>
<rect x="660" y="256" width="320" height="66" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/>
<text x="674" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">LowCardinality(String)</text>
<text x="674" y="296" font-size="10.5" fill="#6B695F">字典 + UInt8 下标</text>
<text x="674" y="312" font-size="10.5" fill="#639922">12 亿行 ≈ 1.2 GB</text>
<rect x="20" y="334" width="960" height="56" rx="8" fill="#fff" stroke="#ECEAE2" stroke-width="1"/>
<text x="34" y="356" font-size="11" fill="#3B3A34">读法：类型不是「声明一下让 SQL 能跑」，它直接决定内存、磁盘、聚合速度。</text>
<text x="34" y="376" font-size="10.5" fill="#6B695F">口径：ColumnLowCardinality.h:19；ColumnNullable.h:19；ColumnVector.h:25；DataTypeObject.h:10；数值为演示算术。</text>
<line x1="20" y1="452" x2="980" y2="452" stroke="#ECEAE2" stroke-width="1.2" stroke-dasharray="5 4"/>
<g transform="translate(0,460)"><rect x="18" y="14" width="964" height="182" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.2"/><text x="34" y="38" font-size="13" fill="#1F1E1A" font-weight="600">四种列的内存布局：Vector、String、Nullable、LowCardinality</text><rect x="34" y="54" width="180" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="124.0" y="76" class="tn" text-anchor="middle" font-size="11.5">ColumnVector</text><text x="124.0" y="94" class="tag" text-anchor="middle">连续 T[]</text><text x="124.0" y="106" class="tag" text-anchor="middle">定长</text><text x="124.0" y="118" class="tag" text-anchor="middle">SIMD</text><rect x="234" y="54" width="180" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="324.0" y="76" class="tn" text-anchor="middle" font-size="11.5">ColumnString</text><text x="324.0" y="94" class="tag" text-anchor="middle">offsets[]</text><text x="324.0" y="106" class="tag" text-anchor="middle">chars[]</text><text x="324.0" y="118" class="tag" text-anchor="middle">变长</text><rect x="434" y="54" width="180" height="78" rx="6" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/><text x="524.0" y="76" class="tn" text-anchor="middle" font-size="11.5">ColumnNullable</text><text x="524.0" y="94" class="tag" text-anchor="middle">nested</text><text x="524.0" y="106" class="tag" text-anchor="middle">null map</text><text x="524.0" y="118" class="tag" text-anchor="middle">1 字节/行</text><rect x="634" y="54" width="180" height="78" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="724.0" y="76" class="tn" text-anchor="middle" font-size="11.5">LowCardinality</text><text x="724.0" y="94" class="tag" text-anchor="middle">dictionary</text><text x="724.0" y="106" class="tag" text-anchor="middle">indexes</text><text x="724.0" y="118" class="tag" text-anchor="middle">UInt8/16/32</text><rect x="834" y="54" width="134" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="901.0" y="76" class="tn" text-anchor="middle" font-size="11.5">Array</text><text x="901.0" y="94" class="tag" text-anchor="middle">offsets + nested</text><path d="M214 86 L232 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M414 86 L432 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M614 86 L632 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M814 86 L832 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><text x="34" y="154" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">读法：Vector 是连续值；String 是字符池 + 前缀和；Nullable 加 null map；LowCardinality 是字典 + 下标。</text><text x="34" y="172" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">Array 是 offset + 嵌套列；JSON 是动态路径 + typed paths；AggregateFunction 存的是聚合状态。</text></g>
<text x="20" y="688" font-size="10" fill="#6B695F">口径：ClickHouse 26.11.1.1-testing 源码快照（2026-10-25）；图中行数、线程数、part 数为演示值。</text>
</svg>