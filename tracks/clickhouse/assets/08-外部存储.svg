<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="500" y="28" font-size="18" fill="#1F1E1A" text-anchor="middle" font-weight="600">外部表：枚举 → 路径裁剪 → footer → row group → 解码</text><text x="500" y="48" font-size="11.5" fill="#6B695F" text-anchor="middle">先裁文件、再裁 row group、再裁列；外部表没有 MergeTree 的本地索引</text><text x="976" y="24" font-size="10.5" fill="#C46A0A" text-anchor="end">橙色：入口/成本</text><text x="976" y="39" font-size="10.5" fill="#2F6FA8" text-anchor="end">蓝色：元数据</text><text x="976" y="54" font-size="10.5" fill="#639922" text-anchor="end">绿色：读取</text><g class="stage" id="s1"><rect x="20.0" y="76" width="111.25" height="142" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.2"/><text x="28.0" y="98" class="tn" text-anchor="start" font-size="12">SQL</text><text x="28.0" y="118" class="tb" text-anchor="start" font-size="10.2">查外部表</text><text x="28.0" y="132" class="tb" text-anchor="start" font-size="10.2">s3/MySQL</text><text x="28.0" y="146" class="tb" text-anchor="start" font-size="10.2">Kafka/Iceberg</text><text x="28.0" y="160" class="tb" text-anchor="start" font-size="10.2">不搬数据</text><text x="28.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">入口</text></g><path d="M131.25 147.0 L139.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s2"><rect x="141.25" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="149.25" y="98" class="tn" text-anchor="start" font-size="12">外部表</text><text x="149.25" y="118" class="tb" text-anchor="start" font-size="10.2">表函数/引擎</text><text x="149.25" y="132" class="tb" text-anchor="start" font-size="10.2">schema</text><text x="149.25" y="146" class="tb" text-anchor="start" font-size="10.2">连接参数</text><text x="149.25" y="160" class="tb" text-anchor="start" font-size="10.2">权限</text><text x="149.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">挂载</text></g><path d="M252.5 147.0 L260.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s3"><rect x="262.5" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="270.5" y="98" class="tn" text-anchor="start" font-size="12">枚举文件</text><text x="270.5" y="118" class="tb" text-anchor="start" font-size="10.2">glob</text><text x="270.5" y="132" class="tb" text-anchor="start" font-size="10.2">Hive 分区</text><text x="270.5" y="146" class="tb" text-anchor="start" font-size="10.2">列文件</text><text x="270.5" y="160" class="tb" text-anchor="start" font-size="10.2">元数据</text><text x="270.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">list</text></g><path d="M373.75 147.0 L381.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s4"><rect x="383.75" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="391.75" y="98" class="tn" text-anchor="start" font-size="12">路径裁剪</text><text x="391.75" y="118" class="tb" text-anchor="start" font-size="10.2">event_date=...</text><text x="391.75" y="132" class="tb" text-anchor="start" font-size="10.2">region=...</text><text x="391.75" y="146" class="tb" text-anchor="start" font-size="10.2">只留候选文件</text><text x="391.75" y="160" class="tb" text-anchor="start" font-size="10.2">省网络</text><text x="391.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">prune</text></g><path d="M495.0 147.0 L503.0 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s5"><rect x="505.0" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="513.0" y="98" class="tn" text-anchor="start" font-size="12">footer</text><text x="513.0" y="118" class="tb" text-anchor="start" font-size="10.2">Parquet footer</text><text x="513.0" y="132" class="tb" text-anchor="start" font-size="10.2">schema</text><text x="513.0" y="146" class="tb" text-anchor="start" font-size="10.2">row group 统计</text><text x="513.0" y="160" class="tb" text-anchor="start" font-size="10.2">偏移</text><text x="513.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">元数据</text></g><path d="M616.25 147.0 L624.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s6"><rect x="626.25" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="634.25" y="98" class="tn" text-anchor="start" font-size="12">row group</text><text x="634.25" y="118" class="tb" text-anchor="start" font-size="10.2">min/max</text><text x="634.25" y="132" class="tb" text-anchor="start" font-size="10.2">null count</text><text x="634.25" y="146" class="tb" text-anchor="start" font-size="10.2">跳过不命中</text><text x="634.25" y="160" class="tb" text-anchor="start" font-size="10.2">只读列</text><text x="634.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">裁剪</text></g><path d="M737.5 147.0 L745.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s7"><rect x="747.5" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="755.5" y="98" class="tn" text-anchor="start" font-size="12">解码</text><text x="755.5" y="118" class="tb" text-anchor="start" font-size="10.2">解压</text><text x="755.5" y="132" class="tb" text-anchor="start" font-size="10.2">解码</text><text x="755.5" y="146" class="tb" text-anchor="start" font-size="10.2">过滤/聚合</text><text x="755.5" y="160" class="tb" text-anchor="start" font-size="10.2">列向量</text><text x="755.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">计算</text></g><path d="M858.75 147.0 L866.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s8"><rect x="868.75" y="76" width="111.25" height="142" rx="9" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.2"/><text x="876.75" y="98" class="tn" text-anchor="start" font-size="12">成本</text><text x="876.75" y="118" class="tb" text-anchor="start" font-size="10.2">网络</text><text x="876.75" y="132" class="tb" text-anchor="start" font-size="10.2">元数据</text><text x="876.75" y="146" class="tb" text-anchor="start" font-size="10.2">无主键索引</text><text x="876.75" y="160" class="tb" text-anchor="start" font-size="10.2">本地化才快</text><text x="876.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">边界</text></g><text x="20" y="244" font-size="12" fill="#C46A0A" font-weight="600">下推边界：哪些条件下推，哪些留在 ClickHouse</text>
<rect x="20" y="256" width="310" height="64" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/>
<text x="34" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">对象存储</text>
<text x="34" y="296" font-size="10.5" fill="#6B695F">路径分区 + Parquet row group 统计</text>
<text x="34" y="312" font-size="10.5" fill="#639922">count() 可用文件元数据</text>
<rect x="345" y="256" width="310" height="64" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="359" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">MySQL / PostgreSQL</text>
<text x="359" y="296" font-size="10.5" fill="#6B695F">列裁剪 + 简单 WHERE 下推</text>
<text x="359" y="312" font-size="10.5" fill="#2F6FA8">复杂表达式/聚合留在 ClickHouse</text>
<rect x="670" y="256" width="310" height="64" rx="8" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/>
<text x="684" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">Kafka</text>
<text x="684" y="296" font-size="10.5" fill="#6B695F">流，不是表；至少一次</text>
<text x="684" y="312" font-size="10.5" fill="#C46A0A">正确用法：Kafka → MV → MergeTree</text>
<rect x="20" y="332" width="960" height="58" rx="8" fill="#fff" stroke="#ECEAE2" stroke-width="1"/>
<text x="34" y="354" font-size="11" fill="#3B3A34">读法：外部表解决「能不能查」，不解决「查得快」；高频查询要本地化成 MergeTree。</text>
<text x="34" y="374" font-size="10.5" fill="#6B695F">口径：StorageObjectStorage.cpp:702；StorageMySQL.cpp:149；KafkaSettings.cpp:27-42；Settings.cpp:7719/8616。</text>
<line x1="20" y1="452" x2="980" y2="452" stroke="#ECEAE2" stroke-width="1.2" stroke-dasharray="5 4"/>
<g transform="translate(0,460)"><rect x="18" y="14" width="964" height="182" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.2"/><text x="34" y="38" font-size="13" fill="#1F1E1A" font-weight="600">S3 + Parquet 的读取路径：路径裁剪先于文件解析</text><rect x="34" y="54" width="180" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="124.0" y="76" class="tn" text-anchor="middle" font-size="11.5">list files</text><text x="124.0" y="94" class="tag" text-anchor="middle">glob / Hive</text><text x="124.0" y="106" class="tag" text-anchor="middle">路径分区</text><text x="124.0" y="118" class="tag" text-anchor="middle">只列候选</text><rect x="234" y="54" width="180" height="78" rx="6" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/><text x="324.0" y="76" class="tn" text-anchor="middle" font-size="11.5">path prune</text><text x="324.0" y="94" class="tag" text-anchor="middle">event_date=...</text><text x="324.0" y="106" class="tag" text-anchor="middle">region=...</text><text x="324.0" y="118" class="tag" text-anchor="middle">不打开文件</text><rect x="434" y="54" width="180" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="524.0" y="76" class="tn" text-anchor="middle" font-size="11.5">footer</text><text x="524.0" y="94" class="tag" text-anchor="middle">schema</text><text x="524.0" y="106" class="tag" text-anchor="middle">row group 统计</text><text x="524.0" y="118" class="tag" text-anchor="middle">列偏移</text><rect x="634" y="54" width="180" height="78" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="724.0" y="76" class="tn" text-anchor="middle" font-size="11.5">row group</text><text x="724.0" y="94" class="tag" text-anchor="middle">min/max</text><text x="724.0" y="106" class="tag" text-anchor="middle">跳过不命中</text><text x="724.0" y="118" class="tag" text-anchor="middle">只读需要的列</text><rect x="834" y="54" width="134" height="78" rx="6" fill="#fff" stroke="#D3D1C7" stroke-width="1.1"/><text x="901.0" y="76" class="tn" text-anchor="middle" font-size="11.5">decode</text><text x="901.0" y="94" class="tag" text-anchor="middle">列向量</text><path d="M214 86 L232 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M414 86 L432 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M614 86 L632 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M814 86 L832 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><text x="34" y="154" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">读法：先裁文件、再裁 row group、再裁列；三层裁剪都依赖元数据，没元数据就只能全扫。</text><text x="34" y="172" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">Parquet 的 row group 统计是文件内的；路径分区是文件间的；两者粒度不同。</text></g>
<text x="20" y="688" font-size="10" fill="#6B695F">口径：ClickHouse 26.11.1.1-testing 源码快照（2026-10-25）；图中行数、线程数、part 数为演示值。</text>
</svg>