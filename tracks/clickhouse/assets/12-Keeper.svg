<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="ClickHouse Keeper：集群的公共记事本">
<defs>
<marker id="aW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B695F" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<style>
text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
.th{font-size:15px;fill:#1F1E1A;font-weight:500}
.ts{font-size:12px;fill:#6B695F}
.tb{font-size:11.5px;fill:#3B3A34}
.tn{font-size:12.5px;fill:#1F1E1A;font-weight:500}
.tag{font-size:10px;fill:#6B695F}
</style>
<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="500" y="28" font-size="18" fill="#1F1E1A" text-anchor="middle" font-weight="600">客户端 → follower/leader → Raft log → 状态机 → watch</text><text x="500" y="48" font-size="11.5" fill="#6B695F" text-anchor="middle">写请求走 Raft 多数派；日志先落盘，状态机按序执行；读默认本地读</text><text x="976" y="24" font-size="10.5" fill="#C46A0A" text-anchor="end">橙色：请求/边界</text><text x="976" y="39" font-size="10.5" fill="#2F6FA8" text-anchor="end">蓝色：Raft</text><text x="976" y="54" font-size="10.5" fill="#639922" text-anchor="end">绿色：通知/副本</text><g class="stage" id="s1"><rect x="20.0" y="76" width="111.25" height="142" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.2"/><text x="28.0" y="98" class="tn" text-anchor="start" font-size="12">客户端</text><text x="28.0" y="118" class="tb" text-anchor="start" font-size="10.2">ClickHouse 副本</text><text x="28.0" y="132" class="tb" text-anchor="start" font-size="10.2">create/set</text><text x="28.0" y="146" class="tb" text-anchor="start" font-size="10.2">watch</text><text x="28.0" y="160" class="tb" text-anchor="start" font-size="10.2">session</text><text x="28.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">请求</text></g><path d="M131.25 147.0 L139.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s2"><rect x="141.25" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="149.25" y="98" class="tn" text-anchor="start" font-size="12">follower</text><text x="149.25" y="118" class="tb" text-anchor="start" font-size="10.2">连任意节点</text><text x="149.25" y="132" class="tb" text-anchor="start" font-size="10.2">auto_forwarding</text><text x="149.25" y="146" class="tb" text-anchor="start" font-size="10.2">转给 leader</text><text x="149.25" y="160" class="tb" text-anchor="start" font-size="10.2">等待结果</text><text x="149.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">转发</text></g><path d="M252.5 147.0 L260.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s3"><rect x="262.5" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="270.5" y="98" class="tn" text-anchor="start" font-size="12">leader</text><text x="270.5" y="118" class="tb" text-anchor="start" font-size="10.2">接收写</text><text x="270.5" y="132" class="tb" text-anchor="start" font-size="10.2">追加 Raft log</text><text x="270.5" y="146" class="tb" text-anchor="start" font-size="10.2">并行发 follower</text><text x="270.5" y="160" class="tb" text-anchor="start" font-size="10.2">多数派</text><text x="270.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">Raft</text></g><path d="M373.75 147.0 L381.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s4"><rect x="383.75" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="391.75" y="98" class="tn" text-anchor="start" font-size="12">append log</text><text x="391.75" y="118" class="tb" text-anchor="start" font-size="10.2">日志落盘</text><text x="391.75" y="132" class="tb" text-anchor="start" font-size="10.2">force_sync</text><text x="391.75" y="146" class="tb" text-anchor="start" font-size="10.2">条目不丢</text><text x="391.75" y="160" class="tb" text-anchor="start" font-size="10.2">快照/压缩</text><text x="391.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">持久化</text></g><path d="M495.0 147.0 L503.0 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s5"><rect x="505.0" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="513.0" y="98" class="tn" text-anchor="start" font-size="12">commit</text><text x="513.0" y="118" class="tb" text-anchor="start" font-size="10.2">多数派确认</text><text x="513.0" y="132" class="tb" text-anchor="start" font-size="10.2">提交索引</text><text x="513.0" y="146" class="tb" text-anchor="start" font-size="10.2">按序执行</text><text x="513.0" y="160" class="tb" text-anchor="start" font-size="10.2">状态机</text><text x="513.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">提交</text></g><path d="M616.25 147.0 L624.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s6"><rect x="626.25" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="634.25" y="98" class="tn" text-anchor="start" font-size="12">state machine</text><text x="634.25" y="118" class="tb" text-anchor="start" font-size="10.2">znode 树</text><text x="634.25" y="132" class="tb" text-anchor="start" font-size="10.2">版本/子节点</text><text x="634.25" y="146" class="tb" text-anchor="start" font-size="10.2">ephemeral</text><text x="634.25" y="160" class="tb" text-anchor="start" font-size="10.2">会话</text><text x="634.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">应用</text></g><path d="M737.5 147.0 L745.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s7"><rect x="747.5" y="76" width="111.25" height="142" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/><text x="755.5" y="98" class="tn" text-anchor="start" font-size="12">watch</text><text x="755.5" y="118" class="tb" text-anchor="start" font-size="10.2">一次性通知</text><text x="755.5" y="132" class="tb" text-anchor="start" font-size="10.2">副本拉日志</text><text x="755.5" y="146" class="tb" text-anchor="start" font-size="10.2">log_pointer</text><text x="755.5" y="160" class="tb" text-anchor="start" font-size="10.2">更新</text><text x="755.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">通知</text></g><path d="M858.75 147.0 L866.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s8"><rect x="868.75" y="76" width="111.25" height="142" rx="9" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.2"/><text x="876.75" y="98" class="tn" text-anchor="start" font-size="12">quorum</text><text x="876.75" y="118" class="tb" text-anchor="start" font-size="10.2">3 节点容 1</text><text x="876.75" y="132" class="tb" text-anchor="start" font-size="10.2">5 节点容 2</text><text x="876.75" y="146" class="tb" text-anchor="start" font-size="10.2">少数派停写</text><text x="876.75" y="160" class="tb" text-anchor="start" font-size="10.2">恢复继续</text><text x="876.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">边界</text></g><text x="20" y="244" font-size="12" fill="#C46A0A" font-weight="600">Keeper 里存的是「协调元数据」，不是业务数据</text>
<rect x="20" y="256" width="300" height="66" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/>
<text x="34" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">表级共享</text>
<text x="34" y="296" font-size="10.5" fill="#6B695F">/metadata /columns</text>
<text x="34" y="312" font-size="10.5" fill="#2F6FA8">/log /block_numbers /quorum</text>
<rect x="340" y="256" width="300" height="66" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/>
<text x="354" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">副本私有</text>
<text x="354" y="296" font-size="10.5" fill="#6B695F">/replicas/&lt;name&gt;</text>
<text x="354" y="312" font-size="10.5" fill="#639922">log_pointer / parts / is_lost</text>
<rect x="660" y="256" width="320" height="66" rx="8" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/>
<text x="674" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">DDL</text>
<text x="674" y="296" font-size="10.5" fill="#6B695F">Replicated 数据库 /log</text>
<text x="674" y="312" font-size="10.5" fill="#C46A0A">ON CLUSTER 按序执行</text>
<rect x="20" y="334" width="960" height="56" rx="8" fill="#fff" stroke="#ECEAE2" stroke-width="1"/>
<text x="34" y="356" font-size="11" fill="#3B3A34">读法：Keeper 是 CP 协调服务；多数派丢失就停写，已有数据仍可读。</text>
<text x="34" y="376" font-size="10.5" fill="#6B695F">口径：KeeperServer.h:30/98；KeeperStateMachine.h:43/89/91；CoordinationSettings.cpp:28-56；StorageReplicatedMergeTree.cpp:1129。</text>
<line x1="20" y1="452" x2="980" y2="452" stroke="#ECEAE2" stroke-width="1.2" stroke-dasharray="5 4"/>
<g transform="translate(0,460)"><rect x="18" y="14" width="964" height="182" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.2"/><text x="34" y="38" font-size="13" fill="#1F1E1A" font-weight="600">Keeper 的 znode 树：共享日志 + 副本指针 + quorum</text><rect x="34" y="54" width="180" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="124.0" y="76" class="tn" text-anchor="middle" font-size="11.5">/metadata</text><text x="124.0" y="94" class="tag" text-anchor="middle">表结构</text><rect x="234" y="54" width="180" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="324.0" y="76" class="tn" text-anchor="middle" font-size="11.5">/log</text><text x="324.0" y="94" class="tag" text-anchor="middle">GET_PART</text><text x="324.0" y="106" class="tag" text-anchor="middle">MERGE_PARTS</text><text x="324.0" y="118" class="tag" text-anchor="middle">ALTER</text><rect x="434" y="54" width="180" height="78" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="524.0" y="76" class="tn" text-anchor="middle" font-size="11.5">/replicas/A</text><text x="524.0" y="94" class="tag" text-anchor="middle">log_pointer</text><text x="524.0" y="106" class="tag" text-anchor="middle">parts</text><rect x="634" y="54" width="180" height="78" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="724.0" y="76" class="tn" text-anchor="middle" font-size="11.5">/replicas/B</text><text x="724.0" y="94" class="tag" text-anchor="middle">log_pointer</text><text x="724.0" y="106" class="tag" text-anchor="middle">parts</text><rect x="834" y="54" width="134" height="78" rx="6" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/><text x="901.0" y="76" class="tn" text-anchor="middle" font-size="11.5">/quorum</text><text x="901.0" y="94" class="tag" text-anchor="middle">last/failed</text><path d="M214 86 L232 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M414 86 L432 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M614 86 L632 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M814 86 L832 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><text x="34" y="154" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">读法：共享的是操作日志，不是 part；每个副本只维护自己的指针和本地 part。</text><text x="34" y="172" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">znode 有 persistent/ephemeral/sequential 三种；副本根节点 persistent，is_active 才 ephemeral，会话断开即消失。</text></g>
<text x="20" y="688" font-size="10" fill="#6B695F">口径：ClickHouse 26.11.1.1-testing 源码快照（2026-10-25）；图中行数、线程数、part 数为演示值。</text>
</svg>