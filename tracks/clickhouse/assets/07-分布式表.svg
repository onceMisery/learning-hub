<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="分布式表引擎：一条查询如何打到整个集群">
<defs>
<marker id="aW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C46A0A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="aM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B695F" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
<style>
text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
.th{font-size:15px;fill:#1F1E1A;font-weight:500}
.ts{font-size:12px;fill:#6B695F}
.tb{font-size:11.5px;fill:#3B3A34}
.tn{font-size:12.5px;fill:#1F1E1A;font-weight:500}
.tag{font-size:10px;fill:#6B695F}
</style>
<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="500" y="28" font-size="18" fill="#1F1E1A" text-anchor="middle" font-weight="600">客户端 → 发起节点 → 三个分片 → 两阶段聚合</text><text x="500" y="48" font-size="11.5" fill="#6B695F" text-anchor="middle">Distributed 只路由不存储；每个分片先本地聚合，发起节点再合并</text><text x="976" y="24" font-size="10.5" fill="#C46A0A" text-anchor="end">橙色：入口/配置</text><text x="976" y="39" font-size="10.5" fill="#2F6FA8" text-anchor="end">蓝色：分片</text><text x="976" y="54" font-size="10.5" fill="#639922" text-anchor="end">绿色：合并/结果</text><g class="stage" id="s1"><rect x="20.0" y="76" width="111.25" height="142" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.2"/><text x="28.0" y="98" class="tn" text-anchor="start" font-size="12">客户端</text><text x="28.0" y="118" class="tb" text-anchor="start" font-size="10.2">连任意节点</text><text x="28.0" y="132" class="tb" text-anchor="start" font-size="10.2">查 Distributed</text><text x="28.0" y="146" class="tb" text-anchor="start" font-size="10.2">一条 SQL</text><text x="28.0" y="160" class="tb" text-anchor="start" font-size="10.2">不知分片</text><text x="28.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">入口</text></g><path d="M131.25 147.0 L139.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s2"><rect x="141.25" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="149.25" y="98" class="tn" text-anchor="start" font-size="12">发起节点</text><text x="149.25" y="118" class="tb" text-anchor="start" font-size="10.2">解析/计划</text><text x="149.25" y="132" class="tb" text-anchor="start" font-size="10.2">识别 Distributed</text><text x="149.25" y="146" class="tb" text-anchor="start" font-size="10.2">按分片改写</text><text x="149.25" y="160" class="tb" text-anchor="start" font-size="10.2">准备下发</text><text x="149.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">initiator</text></g><path d="M252.5 147.0 L260.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s3"><rect x="262.5" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="270.5" y="98" class="tn" text-anchor="start" font-size="12">shard 1</text><text x="270.5" y="118" class="tb" text-anchor="start" font-size="10.2">本地表</text><text x="270.5" y="132" class="tb" text-anchor="start" font-size="10.2">两副本选一</text><text x="270.5" y="146" class="tb" text-anchor="start" font-size="10.2">部分聚合</text><text x="270.5" y="160" class="tb" text-anchor="start" font-size="10.2">返回状态</text><text x="270.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">分片</text></g><path d="M373.75 147.0 L381.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s4"><rect x="383.75" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="391.75" y="98" class="tn" text-anchor="start" font-size="12">shard 2</text><text x="391.75" y="118" class="tb" text-anchor="start" font-size="10.2">同上</text><text x="391.75" y="132" class="tb" text-anchor="start" font-size="10.2">按分片键</text><text x="391.75" y="146" class="tb" text-anchor="start" font-size="10.2">部分聚合</text><text x="391.75" y="160" class="tb" text-anchor="start" font-size="10.2">返回状态</text><text x="391.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">分片</text></g><path d="M495.0 147.0 L503.0 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s5"><rect x="505.0" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="513.0" y="98" class="tn" text-anchor="start" font-size="12">shard 3</text><text x="513.0" y="118" class="tb" text-anchor="start" font-size="10.2">同上</text><text x="513.0" y="132" class="tb" text-anchor="start" font-size="10.2">独立执行</text><text x="513.0" y="146" class="tb" text-anchor="start" font-size="10.2">部分聚合</text><text x="513.0" y="160" class="tb" text-anchor="start" font-size="10.2">返回状态</text><text x="513.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">分片</text></g><path d="M616.25 147.0 L624.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s6"><rect x="626.25" y="76" width="111.25" height="142" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/><text x="634.25" y="98" class="tn" text-anchor="start" font-size="12">合并</text><text x="634.25" y="118" class="tb" text-anchor="start" font-size="10.2">两阶段聚合</text><text x="634.25" y="132" class="tb" text-anchor="start" font-size="10.2">同组相加</text><text x="634.25" y="146" class="tb" text-anchor="start" font-size="10.2">去重/排序</text><text x="634.25" y="160" class="tb" text-anchor="start" font-size="10.2">LIMIT</text><text x="634.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">initiator</text></g><path d="M737.5 147.0 L745.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s7"><rect x="747.5" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="755.5" y="98" class="tn" text-anchor="start" font-size="12">GLOBAL</text><text x="755.5" y="118" class="tb" text-anchor="start" font-size="10.2">跨分片子查询</text><text x="755.5" y="132" class="tb" text-anchor="start" font-size="10.2">先收集</text><text x="755.5" y="146" class="tb" text-anchor="start" font-size="10.2">再分发</text><text x="755.5" y="160" class="tb" text-anchor="start" font-size="10.2">product_mode=deny</text><text x="755.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">可选</text></g><path d="M858.75 147.0 L866.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s8"><rect x="868.75" y="76" width="111.25" height="142" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/><text x="876.75" y="98" class="tn" text-anchor="start" font-size="12">结果</text><text x="876.75" y="118" class="tb" text-anchor="start" font-size="10.2">最终 5 行</text><text x="876.75" y="132" class="tb" text-anchor="start" font-size="10.2">结果完整</text><text x="876.75" y="146" class="tb" text-anchor="start" font-size="10.2">分片故障可跳过</text><text x="876.75" y="160" class="tb" text-anchor="start" font-size="10.2">需业务确认</text><text x="876.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">返回</text></g><text x="20" y="244" font-size="12" fill="#C46A0A" font-weight="600">分支：分片 2 挂掉、跨分片 JOIN、internal_replication</text>
<rect x="20" y="256" width="310" height="64" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.1"/>
<text x="34" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">分片 2 挂</text>
<text x="34" y="296" font-size="10.5" fill="#6B695F">默认查询失败（skip_unavailable_shards=false）</text>
<text x="34" y="312" font-size="10.5" fill="#E24B4A">开 =1 可返回部分结果，但要告知业务</text>
<rect x="345" y="256" width="310" height="64" rx="8" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/>
<text x="359" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">跨分片 JOIN</text>
<text x="359" y="296" font-size="10.5" fill="#6B695F">distributed_product_mode 默认 deny</text>
<text x="359" y="312" font-size="10.5" fill="#C46A0A">用 GLOBAL JOIN / 同键分片</text>
<rect x="670" y="256" width="310" height="64" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/>
<text x="684" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">internal_replication</text>
<text x="684" y="296" font-size="10.5" fill="#6B695F">true：只写一个副本，底层表复制</text>
<text x="684" y="312" font-size="10.5" fill="#639922">false：Distributed 自己写所有副本</text>
<rect x="20" y="332" width="960" height="58" rx="8" fill="#fff" stroke="#ECEAE2" stroke-width="1"/>
<text x="34" y="354" font-size="11" fill="#3B3A34">读法：发起节点把一条 SQL 改写成三份子查询；各分片本地聚合，发起节点合并。分片键决定「能不能只打一个分片」。</text>
<text x="34" y="374" font-size="10.5" fill="#6B695F">口径：StorageDistributed.cpp:1161/2888；ClusterProxy/executeQuery.cpp:538；Settings.cpp:1649/1811/2662/9759。</text>
<line x1="20" y1="452" x2="980" y2="452" stroke="#ECEAE2" stroke-width="1.2" stroke-dasharray="5 4"/>
<g transform="translate(0,460)"><rect x="18" y="14" width="964" height="182" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.2"/><text x="34" y="38" font-size="13" fill="#1F1E1A" font-weight="600">两阶段聚合：分片本地先算，发起节点再合并</text><rect x="34" y="54" width="180" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="124.0" y="76" class="tn" text-anchor="middle" font-size="11.5">shard 1</text><text x="124.0" y="94" class="tag" text-anchor="middle">east 1000</text><text x="124.0" y="106" class="tag" text-anchor="middle">west 600</text><rect x="234" y="54" width="180" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="324.0" y="76" class="tn" text-anchor="middle" font-size="11.5">shard 2</text><text x="324.0" y="94" class="tag" text-anchor="middle">east 800</text><text x="324.0" y="106" class="tag" text-anchor="middle">west 400</text><rect x="434" y="54" width="180" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="524.0" y="76" class="tn" text-anchor="middle" font-size="11.5">shard 3</text><text x="524.0" y="94" class="tag" text-anchor="middle">east 600</text><text x="524.0" y="106" class="tag" text-anchor="middle">north 200</text><rect x="634" y="54" width="180" height="78" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="724.0" y="76" class="tn" text-anchor="middle" font-size="11.5">initiator</text><text x="724.0" y="94" class="tag" text-anchor="middle">east 2400</text><text x="724.0" y="106" class="tag" text-anchor="middle">west 1000</text><text x="724.0" y="118" class="tag" text-anchor="middle">north 200</text><rect x="834" y="54" width="134" height="78" rx="6" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/><text x="901.0" y="76" class="tn" text-anchor="middle" font-size="11.5">LIMIT 5</text><text x="901.0" y="94" class="tag" text-anchor="middle">最终结果</text><path d="M214 86 L232 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M414 86 L432 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M614 86 L632 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M814 86 L832 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><text x="34" y="154" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">读法：每个分片只发部分聚合结果，不是明细；发起节点按分组键相加，再排序/截断。</text><text x="34" y="172" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">GLOBAL IN/JOIN 会先把子查询结果收到发起节点再分发；本地 IN 可能漏数据。</text></g>
<text x="20" y="688" font-size="10" fill="#6B695F">口径：ClickHouse 26.11.1.1-testing 源码快照（2026-10-25）；图中行数、线程数、part 数为演示值。</text>
</svg>