<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="500" y="28" font-size="18" fill="#1F1E1A" text-anchor="middle" font-weight="600">主键 → skip index → projection → EXPLAIN 验证</text><text x="500" y="48" font-size="11.5" fill="#6B695F" text-anchor="middle">先看主键能不能裁，再看 skip index 能不能跳，最后看 projection 能不能换一份数据</text><text x="976" y="24" font-size="10.5" fill="#C46A0A" text-anchor="end">橙色：预计算/改写</text><text x="976" y="39" font-size="10.5" fill="#2F6FA8" text-anchor="end">蓝色：索引/读取</text><text x="976" y="54" font-size="10.5" fill="#639922" text-anchor="end">绿色：设计/收益</text><g class="stage" id="s1"><rect x="20.0" y="76" width="111.25" height="142" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/><text x="28.0" y="98" class="tn" text-anchor="start" font-size="12">表</text><text x="28.0" y="118" class="tb" text-anchor="start" font-size="10.2">ORDER BY</text><text x="28.0" y="132" class="tb" text-anchor="start" font-size="10.2">排序键</text><text x="28.0" y="146" class="tb" text-anchor="start" font-size="10.2">前缀规则</text><text x="28.0" y="160" class="tb" text-anchor="start" font-size="10.2">分区键</text><text x="28.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">设计</text></g><path d="M131.25 147.0 L139.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s2"><rect x="141.25" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="149.25" y="98" class="tn" text-anchor="start" font-size="12">primary.idx</text><text x="149.25" y="118" class="tb" text-anchor="start" font-size="10.2">每 granule</text><text x="149.25" y="132" class="tb" text-anchor="start" font-size="10.2">一条键值</text><text x="149.25" y="146" class="tb" text-anchor="start" font-size="10.2">稀疏索引</text><text x="149.25" y="160" class="tb" text-anchor="start" font-size="10.2">只定位块</text><text x="149.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">主键</text></g><path d="M252.5 147.0 L260.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s3"><rect x="262.5" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="270.5" y="98" class="tn" text-anchor="start" font-size="12">skip index</text><text x="270.5" y="118" class="tb" text-anchor="start" font-size="10.2">minmax/set</text><text x="270.5" y="132" class="tb" text-anchor="start" font-size="10.2">bloom/ngram</text><text x="270.5" y="146" class="tb" text-anchor="start" font-size="10.2">GRANULARITY</text><text x="270.5" y="160" class="tb" text-anchor="start" font-size="10.2">只保证没有</text><text x="270.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">跳过</text></g><path d="M373.75 147.0 L381.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s4"><rect x="383.75" y="76" width="111.25" height="142" rx="9" fill="#FFF6E8" stroke="#C46A0A" stroke-width="1.2"/><text x="391.75" y="98" class="tn" text-anchor="start" font-size="12">projection</text><text x="391.75" y="118" class="tb" text-anchor="start" font-size="10.2">另一种排序</text><text x="391.75" y="132" class="tb" text-anchor="start" font-size="10.2">预聚合</text><text x="391.75" y="146" class="tb" text-anchor="start" font-size="10.2">额外存储</text><text x="391.75" y="160" class="tb" text-anchor="start" font-size="10.2">写入放大</text><text x="391.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">预计算</text></g><path d="M495.0 147.0 L503.0 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s5"><rect x="505.0" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="513.0" y="98" class="tn" text-anchor="start" font-size="12">EXPLAIN</text><text x="513.0" y="118" class="tb" text-anchor="start" font-size="10.2">indexes=1</text><text x="513.0" y="132" class="tb" text-anchor="start" font-size="10.2">Parts/Granules</text><text x="513.0" y="146" class="tb" text-anchor="start" font-size="10.2">看是否生效</text><text x="513.0" y="160" class="tb" text-anchor="start" font-size="10.2">force 索引</text><text x="513.0" y="209" class="tag" text-anchor="start" fill="#C46A0A">诊断</text></g><path d="M616.25 147.0 L624.25 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s6"><rect x="626.25" y="76" width="111.25" height="142" rx="9" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.2"/><text x="634.25" y="98" class="tn" text-anchor="start" font-size="12">读</text><text x="634.25" y="118" class="tb" text-anchor="start" font-size="10.2">只读候选</text><text x="634.25" y="132" class="tb" text-anchor="start" font-size="10.2">mark 区间</text><text x="634.25" y="146" class="tb" text-anchor="start" font-size="10.2">回表过滤</text><text x="634.25" y="160" class="tb" text-anchor="start" font-size="10.2">聚合</text><text x="634.25" y="209" class="tag" text-anchor="start" fill="#C46A0A">执行</text></g><path d="M737.5 147.0 L745.5 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s7"><rect x="747.5" y="76" width="111.25" height="142" rx="9" fill="#fff" stroke="#D3D1C7" stroke-width="1.2"/><text x="755.5" y="98" class="tn" text-anchor="start" font-size="12">维护</text><text x="755.5" y="118" class="tb" text-anchor="start" font-size="10.2">MATERIALIZE</text><text x="755.5" y="132" class="tb" text-anchor="start" font-size="10.2">重写历史</text><text x="755.5" y="146" class="tb" text-anchor="start" font-size="10.2">OPTIMIZE</text><text x="755.5" y="160" class="tb" text-anchor="start" font-size="10.2">别高峰跑</text><text x="755.5" y="209" class="tag" text-anchor="start" fill="#C46A0A">成本</text></g><path d="M858.75 147.0 L866.75 147.0" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><g class="stage" id="s8"><rect x="868.75" y="76" width="111.25" height="142" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/><text x="876.75" y="98" class="tn" text-anchor="start" font-size="12">收益</text><text x="876.75" y="118" class="tb" text-anchor="start" font-size="10.2">少读 granule</text><text x="876.75" y="132" class="tb" text-anchor="start" font-size="10.2">少排序</text><text x="876.75" y="146" class="tb" text-anchor="start" font-size="10.2">少重聚合</text><text x="876.75" y="160" class="tb" text-anchor="start" font-size="10.2">表设计优先</text><text x="876.75" y="209" class="tag" text-anchor="start" fill="#C46A0A">边界</text></g><text x="20" y="244" font-size="12" fill="#C46A0A" font-weight="600">EXPLAIN indexes=1 的读法：先看 Parts，再看 Granules</text>
<rect x="20" y="256" width="450" height="66" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/>
<text x="34" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">生效</text>
<text x="34" y="296" font-size="10.5" fill="#6B695F">PrimaryKey: Keys=region,status</text>
<text x="34" y="312" font-size="10.5" fill="#639922">Parts 1/12 · Granules 120/977</text>
<rect x="500" y="256" width="480" height="66" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.1"/>
<text x="514" y="278" font-size="11.5" fill="#1F1E1A" font-weight="600">没生效</text>
<text x="514" y="296" font-size="10.5" fill="#6B695F">Granules 977/977</text>
<text x="514" y="312" font-size="10.5" fill="#E24B4A">检查前缀/函数包裹/OR/FINAL</text>
<rect x="20" y="334" width="960" height="56" rx="8" fill="#fff" stroke="#ECEAE2" stroke-width="1"/>
<text x="34" y="356" font-size="11" fill="#3B3A34">读法：主键索引回答「读不读」，skip index 回答「这一块有没有可能」，projection 回答「能不能换一份数据读」。</text>
<text x="34" y="376" font-size="10.5" fill="#6B695F">口径：MergeTreeDataSelectExecutor.cpp:2247；MergeTreeIndices.cpp:590-637；Settings.cpp:2148/2205/2507/6815。</text>
<line x1="20" y1="452" x2="980" y2="452" stroke="#ECEAE2" stroke-width="1.2" stroke-dasharray="5 4"/>
<g transform="translate(0,460)"><rect x="18" y="14" width="964" height="182" rx="10" fill="#FBFAF6" stroke="#ECEAE2" stroke-width="1.2"/><text x="34" y="38" font-size="13" fill="#1F1E1A" font-weight="600">granule 裁剪：主键、skip index、projection 三层</text><rect x="34" y="54" width="180" height="78" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="124.0" y="76" class="tn" text-anchor="middle" font-size="11.5">12 个 part</text><text x="124.0" y="94" class="tag" text-anchor="middle">分区裁剪</text><text x="124.0" y="106" class="tag" text-anchor="middle">只留 1 个</text><rect x="234" y="54" width="180" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="324.0" y="76" class="tn" text-anchor="middle" font-size="11.5">977 granule</text><text x="324.0" y="94" class="tag" text-anchor="middle">主键前缀</text><text x="324.0" y="106" class="tag" text-anchor="middle">压到 120</text><rect x="434" y="54" width="180" height="78" rx="6" fill="#FFF6E8" stroke="#EF9F27" stroke-width="1.1"/><text x="524.0" y="76" class="tn" text-anchor="middle" font-size="11.5">skip index</text><text x="524.0" y="94" class="tag" text-anchor="middle">非前缀条件</text><text x="524.0" y="106" class="tag" text-anchor="middle">再跳一批</text><rect x="634" y="54" width="180" height="78" rx="6" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="1.1"/><text x="724.0" y="76" class="tn" text-anchor="middle" font-size="11.5">projection</text><text x="724.0" y="94" class="tag" text-anchor="middle">换排序/预聚合</text><text x="724.0" y="106" class="tag" text-anchor="middle">省排序/重算</text><rect x="834" y="54" width="134" height="78" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.1"/><text x="901.0" y="76" class="tn" text-anchor="middle" font-size="11.5">结果</text><text x="901.0" y="94" class="tag" text-anchor="middle">5 行</text><path d="M214 86 L232 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M414 86 L432 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M614 86 L632 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><path d="M814 86 L832 86" fill="none" stroke="#C46A0A" stroke-width="1.6" marker-end="url(#aW)"/><text x="34" y="154" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">读法：三层是叠加的：分区裁 part，主键裁 granule，skip index 裁 granule，projection 换一份数据。</text><text x="34" y="172" class="tb" text-anchor="start" fill="#3B3A34" font-size="10.8">skip index 只保证「一定没有」；命中后仍要回表过滤。projection 要物化，历史数据不自动生效。</text></g>
<text x="20" y="688" font-size="10" fill="#6B695F">口径：ClickHouse 26.11.1.1-testing 源码快照（2026-10-25）；图中行数、线程数、part 数为演示值。</text>
</svg>