<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0a0c10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="From Java to X — 面向 Java 工程师的第二语言学习轨道：Rust、前端、Go、Python，每条轨道都包含系统教程、可运行实战项目与 Java 对照。"
    />
    <title>learning-hub · From Java to X</title>
    <script>
      // 在首屏绘制前同步应用主题，避免出现亮色闪白（FOUC）。
      // 读取顺序：用户显式选择 > 系统偏好 > 默认深色。
      (function () {
        try {
          var stored = localStorage.getItem('lh-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
